  /* ---------------------------------------------------------------- 正则 */
  regexList(type) {
    const s = Game.state.settings || (Game.state.settings = {});
    const isChar = String(type || "") === "character";
    if (isChar) {
      const c = Game.activeCard() || {};
      if (Array.isArray(c.regexes) && c.regexes.length) return c.regexes;
      const ext = (c.data && c.data.extensions && c.data.extensions.regex_scripts)
        || (c.extensions && c.extensions.regex_scripts) || null;
      if (Array.isArray(ext)) return ext;
      if (!Array.isArray(c.regexes)) c.regexes = [];
      return c.regexes;
    }
    if (!Array.isArray(s.regexes)) s.regexes = [];
    return s.regexes;
  },
  toRegexObj(r) {
    r = r || {};
    const placement = Array.isArray(r.placement) ? r.placement.map(x => String(x).toUpperCase()) : [];
    // ST 角色卡扩展里的正则是 { scriptName, findRegex, replaceString, placement, markdownOnly, promptOnly, disabled, minDepth, maxDepth }
    const src = othIsObj(r.source) ? othClone(r.source) : {
      user: placement.length ? placement.includes("USER_INPUT") : true,
      ai: placement.length ? placement.includes("AI_OUTPUT") : true
    };
    const dst = othIsObj(r.destination) ? othClone(r.destination) : {
      display: !r.promptOnly,
      prompt: !r.markdownOnly
    };
    return {
      id: String(r.id || ""),
      script_name: String(r.script_name || r.scriptName || r.name || ""),
      enabled: r.enabled !== false && r.disabled !== true,
      find_regex: String(r.find_regex || r.findRegex || ""),
      replace_string: String(r.replace_string !== undefined ? r.replace_string : (r.replaceString !== undefined ? r.replaceString : "")),
      trim_strings: Array.isArray(r.trim_strings) ? r.trim_strings.slice() : (Array.isArray(r.trimStrings) ? r.trimStrings.slice() : []),
      source: src,
      destination: dst,
      min_depth: Number.isFinite(+(r.min_depth !== undefined ? r.min_depth : r.minDepth)) ? +(r.min_depth !== undefined ? r.min_depth : r.minDepth) : null,
      max_depth: Number.isFinite(+(r.max_depth !== undefined ? r.max_depth : r.maxDepth)) ? +(r.max_depth !== undefined ? r.max_depth : r.maxDepth) : null
    };
  },
  getTavernRegexes(sid, option) {
    const type = othIsObj(option) ? option.type : "character";
    return this.regexList(type).map(r => this.toRegexObj(r));
  },
  async replaceTavernRegexes(sid, list, option) {
    const type = othIsObj(option) ? option.type : "character";
    const arr = (Array.isArray(list) ? list : []).map(r => this.toRegexObj(r));
    const store = this.regexList(type);
    store.length = 0;
    store.push(...arr);
    try { Game.save(); } catch (e) { }
    return arr.map(r => othClone(r));
  },
  async updateTavernRegexesWith(sid, fn, option) {
    const type = othIsObj(option) ? option.type : "character";
    const cur = this.getTavernRegexes(sid, { type });
    const next = typeof fn === "function" ? fn(cur) : cur;
    const apply = async (r) => { await this.replaceTavernRegexes(sid, Array.isArray(r) ? r : cur, { type }); return this.getTavernRegexes(sid, { type }); };
    if (next && typeof next.then === "function") return next.then(apply);
    return apply(next);
  },
  isCharacterTavernRegexesEnabled(sid) { return !!(Game.state.settings && Game.state.settings.regexesEnabled !== false); },
  /** 与 ST 的 formatAsTavernRegexedString 对齐：按 source/destination/楼层深度过滤后依次替换 */
  formatAsTavernRegexedString(sid, text, source, destination, opt) {
    const o = othIsObj(opt) ? opt : {};
    let out = String(text == null ? "" : text);
    const src = String(source || "ai_output");
    const dst = String(destination || "display");
    const srcKey = src === "user_input" ? "user" : (src === "ai_output" ? "ai" : src);
    const dstKey = dst === "display" ? "display" : (dst === "prompt" ? "prompt" : dst);
    const depth = Number.isFinite(+o.depth) ? +o.depth : 0;
    for (const r of this.getTavernRegexes(sid, { type: "character" })) {
      if (!r.enabled) continue;
      if (r.source[srcKey] === false) continue;
      if (r.destination[dstKey] === false) continue;
      if (r.min_depth !== null && depth < r.min_depth) continue;
      if (r.max_depth !== null && depth > r.max_depth) continue;
      if (!r.find_regex) continue;
      try {
        const re = new RegExp(r.find_regex, "g");
        out = out.replace(re, r.replace_string);
        for (const t of r.trim_strings) if (t) out = out.split(String(t)).join("");
      } catch (e) { }
    }
    return out;
  },
  /** 常驻世界书文本（generateRaw 的 world_info 内置提示词） */
  worldbookText() {
    const list = (Game.state.worldbook || []).filter(e => e && e.enabled !== false);
    return list.filter(e => e.always || !(e.keys && e.keys.length)).map(e => String(e.content || "")).filter(Boolean).join("\n");
  },
  async generateRaw(sid, cfg) {
    const c = typeof cfg === "string" ? { user_input: cfg } : (cfg || {});
    const over = othIsObj(c.overrides) ? c.overrides : {};
    const cf = this.cardFields();
    // overrides 的键与 ST 一致：char_description / char_personality / scenario / world_info / user_input
    const pick = (k, alt) => String(
      over[k] !== undefined ? over[k] :
        (alt && over[alt] !== undefined ? over[alt] : (cf[k] || ""))
    );
    const messages = [];
    const sys = String(c.system_prompt || c.system || "");
    if (sys) messages.push({ role: "system", content: sys });

    const maxHist = Number.isFinite(+c.max_chat_history) ? Math.max(0, +c.max_chat_history) : 20;
    const history = maxHist > 0 ? this.messages().slice(-maxHist) : [];
    const ordered = Array.isArray(c.ordered_prompts) ? c.ordered_prompts : null;
    if (ordered) {
      for (const it of ordered) {
        let role = "system", text = "";
        if (typeof it === "string") {
          switch (it) {
            case "chat_history":
            case "dialogue_history":
              for (const m of history) messages.push({ role: m.role === "user" ? "user" : "assistant", content: String(m.content || "") });
              continue;
            case "user_input": role = "user"; text = String(over.user_input !== undefined ? over.user_input : (c.user_input || "")); break;
            case "char_name": text = pick("name"); break;
            case "char_description": text = pick("description", "char_description"); break;
            case "char_personality": text = pick("personality", "char_personality"); break;
            case "scenario": text = pick("scenario"); break;
            case "mes_example": text = pick("mes_example"); break;
            case "char_persona":
            case "persona_description": text = this.getPersonaName(); break;
            case "world_info":
            case "world_info_before":
            case "world_info_after": text = String(over.world_info !== undefined ? over.world_info : this.worldbookText()); break;
            case "main_prompt": text = pick("system_prompt"); break;
            case "jailbreak":
            case "post_history_instructions": text = pick("post_history_instructions"); break;
            default: text = "";
          }
        } else if (it && typeof it === "object") {
          role = ["system", "user", "assistant"].includes(String(it.role)) ? String(it.role) : "system";
          text = String(it.content == null ? "" : it.content);
        }
        if (!text.trim()) continue;
        messages.push({ role, content: text });
      }
    } else {
      if (Array.isArray(c.messages)) for (const m of c.messages) messages.push({ role: m.role || "user", content: String(m.content || "") });
      const ui = String(over.user_input !== undefined ? over.user_input : (c.user_input || c.prompt || c.message || ""));
      if (ui) messages.push({ role: "user", content: ui });
    }
    if (!messages.length) throw new Error("generateRaw：没有提供任何提示词");
    if (!API.roleReady("main")) throw new Error("未配置主模型 API，无法生成");
    this.emit("generation_started", "raw", c, false);
    let text = "";
    try {
      text = await API.chat({
        role: "main", messages,
        temperature: Number.isFinite(+c.temperature) ? +c.temperature : (Game.state.settings.temperature || 0.9),
        maxTokens: c.max_tokens || 1200,
        stream: !!c.should_stream
      });
    } finally {
      this.emit("generation_ended", this.messages().length - 1);
    }
    if (c.should_return_reasoning) return { text: String(text || ""), reasoning: API.lastReasoning || "" };
    return String(text || "");
  },
  async generate(sid, type, cfg) {
    if (othIsObj(type)) { cfg = type; type = "normal"; }
    const c = typeof cfg === "string" ? { user_input: cfg } : (cfg || {});
    const text = await this.generateRaw(sid, c);
    if (c.to_story) { try { await this.generateStory(sid, c.user_input || ""); } catch (e) { } }
    return text;
  },
  async generateStory(sid, text) {
    if (Game.generating) throw new Error("正在生成中，请稍后再试");
    const input = String(text || "").trim();
    const r = await Game.sendStory(input || "（请继续剧情）", { reason: "脚本生成" });
    if (!r.ok) throw new Error(r.error || "生成失败");
    try { UI.renderStory(); } catch (e) { }
    const last = this.messages()[this.messages().length - 1];
    return last ? last.content : "";
  },
  stopGeneration() { try { Game.stopGenerate(); } catch (e) { } },
  getModelList() { return Promise.resolve(((Game.state.settings.apis.main || {}).models || []).slice()); },
  refreshOneMessage(sid, id, opts) { try { UI.renderStory(); } catch (e) { } },
  formatAsDisplayedMessage(sid, id) {
    const m = this.messages()[this.resolveMsgId(id)];
    if (!m) return "";
    return this.macro(String(m.html || m.content || ""));
  },
  updateScriptButtonsWith(sid, fn) {
    const s = OWGScript.get(sid);
    if (!s) return;
    const cur = othClone(s.buttons || []);
    const next = typeof fn === "function" ? fn(cur) : cur;
    const apply = (r) => { this.replaceScriptButtons(sid, Array.isArray(r) ? r : cur); };
    if (next && typeof next.then === "function") return next.then(apply);
    return apply(next);
  },
  getTavernHelperExtensionId() { return "JS-Slash-Runner"; },

  /* ------------------------------------------------------------ 宏/工具 */
  substitudeMacros(sid, text) { return this.macro(text); },
  macroHooks: [],
  registerMacroLike(sid, regex, replace) {
    if (!(regex instanceof RegExp) || typeof replace !== "function") return;
    this.macroHooks.push({ sid, regex, replace });
  },
  unregisterMacroLike(sid, regex) {
    this.macroHooks = this.macroHooks.filter(h => !(h.sid === sid && (regex === undefined || h.regex === regex)));
  },
  async triggerSlash(sid, cmd) {
    if (typeof UI.handleSlash !== "function") throw new Error("当前版本不支持斜杠指令");
    try { await UI.handleSlash(String(cmd || "")); } catch (e) { }
    return "";
  },
  async triggerSlashWithResult(sid, cmd) { return { result: await this.triggerSlash(sid, cmd) }; },
  getTavernVersion() { return this.TA_VER; },
  getTavernHelperVersion() { return this.VERSION; },
  getIframeName(sid) { return "th-script-" + sid; },
  toast(sid, msg, type) {
    try { toast(String(msg == null ? "" : msg), type === "error" ? "err" : "ok"); } catch (e) { }
  },
  errorCatched(sid, fn) {
    if (typeof fn !== "function") return fn;
    return function (...args) {
      try { return fn.apply(this, args); }
      catch (e) { OWGScript.log("error", sid, "脚本出错：" + ((e && e.message) || e)); }
    };
  },

  /* -------------------------------------------------------------- 世界书 */
  wbNames() {
    const names = ["全局"];
    const card = Game.activeCard();
    if (card && card.name) names.push(card.name);
    return names;
  },
  wbSource(name) {
    const card = Game.activeCard();
    return (card && card.name === name) ? "card" : "user";
  },
  getWorldbookNames() { return this.wbNames(); },
  getLorebooks() { return this.wbNames(); },
  getGlobalWorldbookNames() { return ["全局"]; },
  getCharWorldbookNames() { const c = Game.activeCard(); return c && c.name ? [c.name] : []; },
  wbRaw(name) {
    const src = this.wbSource(name);
    return (Game.state.worldbook || []).filter(e => {
      const es = (e && e.source === "card") ? "card" : "user";
      if (es !== src) return false;
      // 全局桶按书名隔离：脚本自己的世界书不能和「全局」互相看见
      if (src === "user") return (e.book || "全局") === name;
      return true;
    });
  },
  toWB(e, i) {
    return {
      uid: i, id: e.id, keys: (e.keys || []).slice(), key: (e.keys || []).slice(),
      content: String(e.content || ""), comment: String(e.comment || ""),
      constant: !!e.always, disable: e.enabled === false, enabled: e.enabled !== false,
      source: e.source || "user", order: i, probability: 100, position: 1, depth: 4
    };
  },
  fromWB(x, source) {
    return {
      id: x.id || uid(),
      keys: Array.isArray(x.key) ? x.key.slice() : Array.isArray(x.keys) ? x.keys.slice() : [],
      content: String(x.content || ""),
      comment: String(x.comment || ""),
      always: !!(x.constant || x.always),
      enabled: x.disable !== undefined ? !x.disable : (x.enabled !== false),
      source
    };
  },
  wbWrite(name, entries) {
    const src = this.wbSource(name);
    const list = Game.normalizeWorldbookEntries(Game.state.worldbook || []);
    const srcOf = e => (e && e.source === "card") ? "card" : "user";
    const tagOf = e => String(e.book || "全局");
    const incoming = (entries || []).map(x => this.fromWB(x, src));
    if (src === "card") {
      // 卡世界书整体替换，但绝不动全局桶
      const keep = list.filter(e => srcOf(e) !== "card");
      const next = incoming.map(e => Object.assign(e, { cardId: Game.state.cardId || null, book: name, origin: "script" }));
      Game.saveWorldbook(keep.concat(next));
      return;
    }
    // 全局桶：只替换「同名世界书」里脚本写入的条目；手工条目（origin=ui）不参与整书替换
    const mine = e => srcOf(e) === "user" && tagOf(e) === name;
    const keep = list.filter(e => !mine(e) || e.origin === "ui");
    const keepIds = new Set(keep.map(e => e && e.id).filter(Boolean));
    const next = incoming.filter(e => !keepIds.has(e.id))
      .map(e => Object.assign(e, { book: name, origin: "script" }));
    Game.saveWorldbook(keep.concat(next));
  },
  getWorldbook(sid, name) { return this.wbRaw(name).map((e, i) => this.toWB(e, i)); },
  getLorebookEntries(sid, name) { return this.getWorldbook(sid, name); },
  replaceWorldbook(sid, name, entries) {
    if (!Array.isArray(entries)) return;
    this.wbWrite(name, entries);
    return this.getWorldbook(sid, name);
  },
  replaceLorebookEntries(sid, name, entries) { return this.replaceWorldbook(sid, name, entries); },
  createLorebookEntries(sid, name, entries) {
    if (!Array.isArray(entries)) return;
    const cur = this.wbRaw(name).map((e, i) => this.toWB(e, i));
    const add = entries.map(x => Object.assign({}, x, { uid: cur.length + 1 }));
    this.wbWrite(name, cur.concat(add));
    return this.getWorldbook(sid, name);
  },
  deleteLorebookEntries(sid, name, ids) {
    const cur = this.wbRaw(name).map((e, i) => this.toWB(e, i));
    const del = (ids || []).map(Number);
    this.wbWrite(name, cur.filter(e => !del.includes(Number(e.uid)) && !del.includes(Number(e.id))));
    return this.getWorldbook(sid, name);
  },
  updateLorebookEntriesWith(sid, name, fn) {
    if (typeof fn !== "function") return this.getWorldbook(sid, name);
    const cur = this.wbRaw(name).map((e, i) => this.toWB(e, i));
    const ret = fn(cur);
    const apply = (r) => { this.wbWrite(name, Array.isArray(r) ? r : cur); return this.getWorldbook(sid, name); };
    if (ret && typeof ret.then === "function") return ret.then(apply);
    return apply(ret);
  },

  /* ---------------------------------------------------------- 页面级注入 */
  installPageGlobals() {
    if (window.__OWG_TH_INSTALLED__) return;
    window.__OWG_TH_INSTALLED__ = true;
    const self = this;
    const TH = {};
    for (const n of OWG_TH_METHODS) {
      TH[n] = function (...args) { return self[n](OWGScript.currentSid || "", ...args); };
    }
    TH.tavern_events = OWG_TH_EVENTS;
    TH.iframe_events = OWG_IFRAME_EVENTS;
    TH.builtin_prompt_default_order = ["main_prompt", "world_info_before", "char_description", "char_personality", "char_persona", "scenario", "world_info_after", "chat_history", "user_input", "jailbreak"];
    TH.builtin = {
      getVariables: TH.getVariables, replaceVariables: TH.replaceVariables,
      getVariable: TH.getVariable, setVariable: TH.setVariable,
      getChatMessages: TH.getChatMessages, setChatMessages: TH.setChatMessages,
      getGameState: TH.getGameState, generate: TH.generate, generateRaw: TH.generateRaw,
      generateStory: TH.generateStory, eventOn: TH.eventOn, eventEmit: TH.eventEmit,
      renderStoryHTML: TH.renderStoryHTML, setChatMessageHTML: TH.setChatMessageHTML
    };
    window.TavernHelper = TH;
    window.tavern_events = OWG_TH_EVENTS;
    window.iframe_events = OWG_IFRAME_EVENTS;
    window.builtin_prompt_default_order = TH.builtin_prompt_default_order;
    // 兼容酒馆写法：API 同时挂到全局（跳过与游戏自身重名的函数，如 toast）
    const DENY = ["toast"];
    for (const n of OWG_TH_METHODS) {
      if (DENY.indexOf(n) >= 0) continue;
      try { window[n] = TH[n]; } catch (e) { }
    }
    window.toastr = {
      success: m => TH.toast(m, "ok"), info: m => TH.toast(m, "ok"), warning: m => TH.toast(m, "ok"),
      error: m => TH.toast(m, "error"), message: m => TH.toast(m, "ok"),
      clear: () => { }, remove: () => { }, options: {}
    };
    window.SillyTavern = {
      getContext() {
        const ctx = { chat: [], characters: [], name1: "你", name2: "角色", chatMetadata: {}, extensionSettings: {}, powered_by: "owg-inline" };
        try { ctx.chat = TH.getChatMessages("0--1"); } catch (e) { }
        try { ctx.name1 = TH.getPersonaName(); } catch (e) { }
        try { ctx.name2 = TH.getCurrentCharacterName(); } catch (e) { }
        try { ctx.characters = TH.getCharacterNames(); } catch (e) { }
        try { ctx.chatMetadata = { variables: TH.getVariables({ type: "chat" }) }; } catch (e) { }
        ctx.getCharacterCardFields = function () { try { return self.cardFields(); } catch (e) { return {}; } };
        ctx.substituteParams = function (t) { try { return TH.substitudeMacros(t); } catch (e) { return String(t); } };
        ctx.eventSource = {
          on: (n, f) => TH.eventOn(n, f),
          once: (n, f) => TH.eventOnce(n, f),
          emit: (n, ...a) => TH.eventEmit(n, ...a),
          removeListener: (n, f) => TH.eventRemoveListener(n, f)
        };
        return ctx;
      },
      substituteParams(t) { try { return TH.substitudeMacros(t); } catch (e) { return String(t); } }
    };
    // Mvu（变量更新框架）最小兼容：脚本常 waitGlobalInitialized('Mvu') 后再读写 chat 变量
    try {
      if (!window.Mvu) self.initializeGlobal("", "Mvu", self.mvuShim());
    } catch (e) { }
    // 旧版脚本悬浮层已移除：清理遗留节点
    try { document.querySelectorAll("#th-float-layer").forEach(el => el.remove()); } catch (e) { }
  }
};

/* ---------------------------------------------------------------- 脚本管理 */
const OWGScript = {
  KEY: "th_scripts",
  MAX_LOG: 200,
  logs: [],
  panels: {},
  currentSid: "",
  lastSid: "",
  panelTab: "list",
  editing: null,
  _inited: false,

  init() {
    if (this._inited) return;
    this._inited = true;
    try { OWGTH.installPageGlobals(); } catch (e) { }
    this.hookConsole();
    this.hookErrors();
    const orig = UI.renderStory;
    UI.renderStory = function () {
      const r = orig.apply(this, arguments);
      try { OWGScript.applyPanels(); } catch (e) { }
      try { OWGScript.mountButtons(); } catch (e) { }
      return r;
    };
    setTimeout(() => { this.autoRun(); }, 900);
  },

  /* 把任意 console 参数变成可读文本（Error 不能 JSON.stringify，否则日志里只剩 {}） */
  ser(a) {
    if (a instanceof Error) {
      const head = (a.name || "Error") + ": " + (a.message || "");
      const st = String(a.stack || "").split(/\r?\n/).slice(0, 4).join("\n");
      return st ? head + "\n" + st : head;
    }
    if (typeof Node !== "undefined" && a instanceof Node) {
      return "<" + String(a.nodeName || "node").toLowerCase() +
        (a.id ? "#" + a.id : "") +
        (typeof a.className === "string" && a.className ? "." + a.className.trim().split(/\s+/).join(".") : "") + ">";
    }
    if (typeof a === "function") return "[Function " + (a.name || "anonymous") + "]";
    if (typeof a === "string") return a;
    try { const j = JSON.stringify(a); return j === undefined ? String(a) : j; }
    catch (e) { return String(a); }
  },
  /* new Function 的源码行号比脚本内容多 2 行；blob 模块则一一对应 */
  scriptLine(id, lineNo, isBlob) {
    const rec = this.get(id);
    if (!rec || !lineNo) return { line: 0, code: "" };
    const lines = String(rec.content || "").split(/\r?\n/);
    const n = isBlob ? lineNo : Math.max(1, lineNo - 2);
    return { line: n, code: (n >= 1 && n <= lines.length) ? String(lines[n - 1] || "").trim() : "" };
  },

  /* console 输出转发到脚本日志（仅在脚本执行期间归属到对应脚本） */
  hookConsole() {
    if (this._consoleHooked) return;
    this._consoleHooked = true;
    ["log", "info", "warn", "error"].forEach(level => {
      const orig = console[level];
      const lv = level === "warn" ? "warn" : (level === "error" ? "error" : "info");
      console[level] = function (...args) {
        try {
          const sid = OWGScript.currentSid || OWGScript.lastSid;
          if (!OWGScript._silent && sid) {
            OWGScript._silent = true;
            const rec = OWGScript.get(sid);
            const name = rec ? rec.name : (sid || "未知脚本");
            OWGScript.log(lv, sid, "[" + name + "] " + args.map(a => OWGScript.ser(a)).join(" "));
            OWGScript._silent = false;
          }
        } catch (e) { }
        try { orig.apply(console, args); } catch (e) { }
      };
    });
  },
  /* 捕获脚本抛出的异步错误：只写日志，不影响游戏 */
  hookErrors() {
    if (this._errHooked) return;
    this._errHooked = true;
    window.addEventListener("error", ev => {
      // 异步回调（setTimeout / DOM ready / 事件）里抛错时 currentSid 已复位，
      // 退回最近一次执行的脚本，保证日志能指出是哪个脚本，而不是静默丢弃。
      const sid = OWGScript.currentSid || OWGScript.lastSid || "";
      const msg = (ev && (ev.message || (ev.error && ev.error.message))) || "未知错误";
      const file = String((ev && ev.filename) || "");
      const isBlob = file.indexOf("blob:") >= 0 || file.indexOf("owg-script-") >= 0;
      const ln = (ev && ev.lineno) ? ev.lineno : 0;
      let where = "";
      let code = "";
      if (ln) {
        const r = sid ? OWGScript.scriptLine(sid, ln, isBlob) : { line: ln, code: "" };
        where = "（第 " + r.line + " 行）";
        code = r.code;
      }
      const rec = sid ? OWGScript.get(sid) : null;
      const name = rec ? rec.name : (sid || "未知脚本");
      try {
        OWGScript.log("error", sid, "[" + name + "] 未捕获错误：" + msg + where + (code ? " ｜ " + code.slice(0, 90) : ""));
      } catch (e) { }
    }, true);
    window.addEventListener("unhandledrejection", ev => {
      const sid = OWGScript.currentSid || OWGScript.lastSid || "";
      const r = ev && ev.reason;
      const rec = sid ? OWGScript.get(sid) : null;
      const name = rec ? rec.name : (sid || "未知脚本");
      try { OWGScript.log("error", sid, "[" + name + "] 未处理的 Promise 拒绝：" + OWGScript.ser(r)); } catch (e) { }
    });
  },

  /* 脚本代码字段：随卡/预设共用，存全局（owg_th_scripts）
   * 运行状态字段（enabled/data/runCount/lastRunAt）按档隔离，存 Game.state.scriptState */
  CODE_FIELDS: ["id", "name", "content", "info", "buttons", "source", "hash", "originId", "enabled"],
  /** 当前档的脚本运行状态容器 */
  slotMap() {
    const st = (typeof Game !== "undefined" && Game.state) ? Game.state : null;
    if (!st) return {};
    if (!st.scriptState || typeof st.scriptState !== "object" || Array.isArray(st.scriptState)) st.scriptState = {};
    return st.scriptState;
  },
  /** 取某个脚本在本档的运行状态；首次使用时用脚本记录里的默认值初始化 */
  slotOf(id, rec) {
    const map = this.slotMap();
    let e = map[id];
    if (!e || typeof e !== "object") {
      e = {
        enabled: !!(rec && rec.enabled),
        data: othIsObj(rec && rec.data) ? othClone(rec.data) : {},
        runCount: Number((rec && rec.runCount) || 0),
        lastRunAt: (rec && rec.lastRunAt) || 0
      };
      map[id] = e;
    }
    if (!othIsObj(e.data)) e.data = {};
    if (typeof e.enabled !== "boolean") e.enabled = !!(rec && rec.enabled);
    return e;
  },
  patchSlot(id, patch) {
    const map = this.slotMap();
    const cur = this.slotOf(id, this.rawList().find(x => x.id === id));
    Object.assign(cur, patch || {});
    map[id] = cur;
    try { Game.save(); } catch (e) { }
    return cur;
  },
  rawList() {
    const raw = store.get(this.KEY, []);
    return (Array.isArray(raw) ? raw : []).filter(s => s && s.id);
  },
  /** 只把代码字段写回全局列表，绝不把本档运行状态写进去（否则会串到其它档） */
  writeCode(list) {
    const out = (list || []).filter(s => s && s.id).map(s => {
      const o = {};
      for (const k of this.CODE_FIELDS) if (s[k] !== undefined) o[k] = s[k];
      return o;
    });
    store.set(this.KEY, out);
    return out;
  },
  list() {
    const map = this.slotMap();
    return this.rawList().map(s => {
      const e = this.slotOf(s.id, s);
      return {
        id: s.id,
        name: String(s.name || "未命名脚本"),
        enabled: !!e.enabled,
        content: String(s.content || ""),
        info: String(s.info || ""),
        buttons: Array.isArray(s.buttons) ? s.buttons : [],
        data: othClone(e.data || {}),
        runCount: Number(e.runCount || 0),
        lastRunAt: e.lastRunAt || 0,
        source: othIsObj(s.source) ? s.source : null,
        hash: String(s.hash || ""),
        originId: String(s.originId || "")
      };
    }).filter(s => s);
  },
  persist() {
    // 只把代码字段写回全局；enabled 是每档状态，不能被某个档覆盖成全局默认值
    const raws = this.rawList();
    const merged = this.list();
    for (const m of merged) {
      const r = raws.find(x => x.id === m.id);
      if (!r) continue;
      r.name = m.name; r.content = m.content; r.info = m.info; r.buttons = m.buttons;
    }
    this.writeCode(raws);
  },
  get(id) { return this.list().find(s => s.id === id) || null; },
  newId() { return "th-" + uid(); },

  /* 脚本内容稳定哈希（djb2），用于全局去重 */
  hashContent(content) {
    let h = 5381;
    const s = String(content == null ? "" : content).trim();
    for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i)) >>> 0;
    return "h" + h.toString(36) + "-" + s.length;
  },
  /* 从 extensions 容器里提取脚本项（scripts / tavern_helper.scripts） */
  extractScripts(ext) {
    const list = [];
    const bag = ext || {};
    const push = arr => { if (Array.isArray(arr)) for (const it of arr) if (it && typeof it === "object") list.push(it); };
    push(bag.scripts);
    push(bag.tavern_helper && bag.tavern_helper.scripts);
    push(bag.tavernHelper && bag.tavernHelper.scripts);
    return list;
  },
  /* 酒馆脚本项 → 本页脚本记录 */
  normalizeItem(it, source) {
    const content = String(it.content == null ? "" : it.content);
    const btn = (it.button && typeof it.button === "object") ? it.button : null;
    const buttons = (btn && btn.enabled !== false && Array.isArray(btn.buttons))
      ? btn.buttons.map(b => ({ name: String((b && (b.name || b.id)) || ""), visible: !(b && b.visible === false) })).filter(b => b.name)
      : [];
    return {
      id: this.newId(),
      name: String(it.name || it.scriptName || "未命名脚本"),
      enabled: it.enabled !== false,
      content,
      info: String(it.info == null ? "" : it.info),
      buttons,
      data: {},
      runCount: 0, lastRunAt: 0,
      hash: this.hashContent(content),
      originId: String(it.id || ""),
      source: Object.assign({ defaultEnabled: it.enabled !== false }, source || {})
    };
  },
  /* 导入脚本项（按 hash / 原 id 全局去重，重复只更新 source 与默认启用） */
  importScripts(items, source) {
    const res = { added: [], skipped: [] };
    if (!Array.isArray(items) || !items.length) return res;
    const raws = this.rawList();
    const smap = this.slotMap();
    for (const it of items) {
      if (!it || typeof it !== "object") continue;
      const content = String(it.content == null ? "" : it.content);
      if (!content.trim()) continue;
      const hash = this.hashContent(content);
      const originId = String(it.id || "");
      const sameOrigin = (a, b) => {
        if (!a || !b || a.kind !== b.kind) return false;
        return a.kind === "card" ? (a.cardId === b.cardId) : (a.presetName === b.presetName);
      };
      const exist = raws.find(s => (s.hash && s.hash === hash) || (originId && s.originId === originId && sameOrigin(s.source, source)));
      if (exist) {
        // 同 id 但内容有改动：更新代码（同内容重复导入则只更新来源）
        if (exist.hash !== hash && originId && exist.originId === originId) {
          exist.hash = hash;
          exist.content = content;
          exist.name = String(it.name || exist.name || "未命名脚本");
          exist.info = String(it.info == null ? (exist.info || "") : it.info);
          const nb = this.normalizeItem(it, source).buttons;
          if (nb.length) exist.buttons = nb;
        }
        exist.hash = exist.hash || hash;
        exist.originId = exist.originId || originId;
        exist.source = Object.assign({}, exist.source || {}, source || {}, { defaultEnabled: it.enabled !== false });
        // 默认启用状态只作为「新开一档」的初始值；当前档已有运行记录则保持本档状态
        exist.enabled = it.enabled !== false;
        if (!smap[exist.id]) smap[exist.id] = { enabled: exist.enabled, data: {}, runCount: 0, lastRunAt: 0 };
        if (!exist.info && it.info) exist.info = String(it.info);
        res.skipped.push(exist);
        continue;
      }
      const rec = this.normalizeItem(it, source);
      raws.push(rec);
      smap[rec.id] = { enabled: rec.enabled !== false, data: {}, runCount: 0, lastRunAt: 0 };
      res.added.push(rec);
    }
    if (res.added.length || res.skipped.length) this.writeCode(raws);
    this.lastImport = res;
    return res;
  },
  /* 导入角色卡自带脚本 */
  importFromCard(cardEntry) {
    if (!cardEntry || !cardEntry.id) return { added: [], skipped: [] };
    const ext = cardEntry.extensions || {};
    const items = Array.isArray(cardEntry.scripts) && cardEntry.scripts.length
      ? cardEntry.scripts
      : this.extractScripts(ext);
    const res = this.importScripts(items, { kind: "card", cardId: String(cardEntry.id), cardName: String(cardEntry.name || "") });
    if (res.added.length || res.skipped.length) this.notifyImport(res, "角色卡脚本");
    return res;
  },
  /* 导入结果清单（数量 + 每条名称/来源/默认启用） */
  notifyImport(res, title) {
    if (!res || (!res.added.length && !res.skipped.length)) return "";
    const line = s => {
      const src = s.source || {};
      const from = src.kind === "card" ? ("卡:" + (src.cardName || src.cardId || "")) : (src.kind === "preset" ? ("预设:" + (src.presetName || "")) : "手动");
      return s.name + "［" + from + "］" + (s.enabled ? "启用" : "停用");
    };
    const all = res.added.concat(res.skipped);
    const msg = (title || "脚本导入") + "：新增 " + res.added.length + " / 跳过 " + res.skipped.length
      + (all.length ? "｜" + all.map(line).join("、") : "");
    try { toast(msg.slice(0, 300), "ok"); } catch (e) { }
    try { this.log("info", "", msg); } catch (e) { }
    return msg;
  },
  /* 同步角色卡脚本：卸载其它卡的脚本，运行本卡脚本 */
  syncCardScripts(cardId) {
    const id = cardId ? String(cardId) : "";
    const raws = this.rawList();
    const runIds = [];
    // 先卸载其它卡的脚本：本档里记住它们上次的启用状态（按档保存，不写进全局代码记录）
    for (const s of raws) {
      const src = s.source || null;
      if (!src || src.kind !== "card") continue;
      if (id && src.cardId === id) continue;
      const e = this.slotOf(s.id, s);
      e.prevEnabled = !!e.enabled;
      e.enabled = false;
      try { this.teardown(s.id); } catch (e2) { }
    }
    // 启用本卡脚本：恢复本档上次状态，否则用卡/预设默认值
    for (const s of raws) {
      const src = s.source || null;
      if (!src || src.kind !== "card" || src.cardId !== id) continue;
      const e = this.slotOf(s.id, s);
      const want = e.prevEnabled !== undefined ? !!e.prevEnabled : (src.defaultEnabled !== false);
      e.enabled = want;
      delete e.prevEnabled;
      if (want) runIds.push(s.id);
    }
    try { Game.save(); } catch (e) { }
    for (const rid of runIds) { try { this.run(rid, { auto: true }); } catch (e) { } }
    try { this.mountButtons(); } catch (e) { }
    return { enabled: runIds.length };
  },
  /* 删卡：移除该卡来源的脚本代码与本档运行状态（含事件退订） */
  removeCardScripts(cardId) {
    const id = String(cardId || "");
    const keep = [];
    let removed = 0;
    const smap = this.slotMap();
    for (const s of this.rawList()) {
      const src = s.source || null;
      if (src && src.kind === "card" && src.cardId === id) {
        try { this.teardown(s.id); } catch (e) { }
        delete smap[s.id];
        removed++;
        continue;
      }
      keep.push(s);
    }
    if (removed) { this.writeCode(keep); try { Game.save(); } catch (e) { } }
    return removed;
  },

  create(name) {
    const rec = { id: this.newId(), name: name || "新脚本", enabled: false, content: "", info: "", buttons: [] };
    const raws = this.rawList();
    raws.push(rec);
    this.writeCode(raws);
    this.slotMap()[rec.id] = { enabled: false, data: {}, runCount: 0, lastRunAt: 0 };
    try { Game.save(); } catch (e) { }
    return this.get(rec.id) || rec;
  },
  saveScript(obj) {
    if (!obj || !obj.id) return obj;
    const raws = this.rawList();
    const i = raws.findIndex(s => s.id === obj.id);
    const rec = i >= 0 ? raws[i] : { id: obj.id };
    for (const k of ["name", "content", "info", "buttons"]) if (obj[k] !== undefined) rec[k] = obj[k];
    if (i < 0) raws.push(rec);
    this.writeCode(raws);
    // 运行状态只写进当前档
    const rt = {};
    if (obj.enabled !== undefined) rt.enabled = !!obj.enabled;
    if (obj.data !== undefined) rt.data = othIsObj(obj.data) ? othClone(obj.data) : {};
    if (obj.runCount !== undefined) rt.runCount = Number(obj.runCount || 0);
    if (obj.lastRunAt !== undefined) rt.lastRunAt = obj.lastRunAt || 0;
    this.patchSlot(obj.id, rt);
    return obj;
  },
  remove(id) {
    this.teardown(id);
    this.writeCode(this.rawList().filter(s => s.id !== id));
    try { delete this.slotMap()[id]; Game.save(); } catch (e) { }
    if (this.editing && this.editing.id === id) this.editing = null;
  },

  /* --------------------------- 页面内执行 --------------------------- */
  /* 停用/删除：退订事件、移除剧情面板与按钮 */
  teardown(id) {
    try { OWGTH.eventClearAll(id); } catch (e) { }
    if (this.panels[id]) delete this.panels[id];
    try { this.applyPanels(); } catch (e) { }
    if (this.currentSid === id) this.currentSid = "";
    try { this.mountButtons(); } catch (e) { }
  },
  /** 清空所有脚本的运行时痕迹（事件订阅 / 剧情面板 / 当前执行指针），用于换档、换卡 */
  clearAllRuntime() {
    try { OWGTH.clearAllEvents(); } catch (e) { }
    this.panels = {};
    this.currentSid = "";
    try { this.applyPanels(); } catch (e) { }
  },
  /** 读档后：按恢复后的本档状态重跑启用的脚本（别的卡的脚本不跑） */
  reloadForSlot() {
    this.clearAllRuntime();
    const cid = String((Game.state && Game.state.cardId) || "");
    const runIds = [];
    for (const s of this.list()) {
      const src = s.source || {};
      if (src.kind === "card" && String(src.cardId || "") !== cid) {
        if (s.enabled) this.patchSlot(s.id, { enabled: false });
        continue;
      }
      if (s.enabled) runIds.push(s.id);
    }
    for (const id of runIds) { try { this.run(id, { auto: true }); } catch (e) { } }
    try { this.mountButtons(); } catch (e) { }
  },
  /** 新开一档：只清运行时痕迹；脚本启用状态回到默认由 list() 的 slotOf 回退决定 */
  onNewSlot() {
    this.clearAllRuntime();
    try { this.mountButtons(); } catch (e) { }
  },
  /** 跑「非角色卡」来源（预设/手动）的脚本：换卡/新开档后让它们重新挂到新状态上 */
  runNonCard() {
    const cid = String((Game.state && Game.state.cardId) || "");
    for (const s of this.list()) {
      const src = s.source || {};
      if (src.kind === "card") continue;
      if (!s.enabled) continue;
      if (s.lastRunAt && Date.now() - s.lastRunAt < 3000) continue;
      try { this.run(s.id, { auto: true }); } catch (e) { }
    }
  },
  /** 源码里是否含 ES Module 语法（这类脚本不能走 new Function） */
  isModuleSource(src) {
    return /(^|\n)\s*(?:import\s+(?:["']|[\w*{])|export\s+(?:default|const|let|var|function|class|\{))/.test(String(src || ""));
  },
  /** 错误摘要：脚本名由日志前缀给出，这里补「第几行/第几列 + 错误信息 + 该行源码」 */
  errDetail(e, src, isModule) {
    const msg = e ? String(e.message || e.reason || e) : "未知错误";
    let line = 0, col = 0;
    const stack = String((e && e.stack) || "");
    if (isModule) {
      const m = stack.match(/owg-script-[^\s:)]*:(\d+):(\d+)/);
      if (m) { line = +m[1]; col = +m[2]; }
    } else {
      let m = stack.match(/<anonymous>:(\d+):(\d+)/);
      // new Function 的源码头占 2 行（function anonymous(...) 换行 + ) {），行号要减去
      if (m) { line = Math.max(1, (+m[1]) - 2); col = +m[2]; }
      else if (e && typeof e.lineNumber === "number" && e.lineNumber > 2) line = e.lineNumber - 2;
    }
    let out = line ? ("第 " + line + " 行" + (col ? " 第 " + col + " 列" : "") + "：" + msg) : msg;
    const codeLine = line ? String(src || "").split(/\r?\n/)[line - 1] : "";
    if (codeLine && codeLine.trim()) out += " ｜ " + codeLine.trim().slice(0, 70);
    return out;
  },
  run(id, opts) {
    const s = this.get(id);
    if (!s) return false;
    const src = String(s.content || "");
    if (!src.trim()) { this.log("warn", id, "脚本内容为空，未运行"); return false; }
    try { OWGTH.installPageGlobals(); } catch (e) { }
    // 重跑前清掉旧的事件订阅与渲染面板，避免重复叠加
    try { OWGTH.eventClearAll(id); } catch (e) { }
    delete this.panels[id];
    const prev = this.currentSid;
    this.currentSid = id;
    this.lastSid = id;
    const finish = (ok) => {
      this.currentSid = prev;
      try { this.applyPanels(); } catch (e) { }
      try { this.mountButtons(); } catch (e) { }
      if (this.panelTab === "log" && document.querySelector("#th-log-live")) this.renderPanel();
      return ok;
    };
    // ES Module 脚本：用 blob + 动态 import 执行，避免 “Cannot use import statement outside a module”
    if (this.isModuleSource(src)) {
      const url = URL.createObjectURL(new Blob([src + "\n//# sourceURL=owg-script-" + id + ".js"], { type: "text/javascript" }));
      return import(url).then(() => {
        this.patchSlot(id, { runCount: (s.runCount || 0) + 1, lastRunAt: Date.now() });
        this.log("info", id, "▶ 已运行（ESM）" + ((opts && opts.auto) ? "（自动）" : ""));
        return finish(true);
      }).catch(e => {
        const det = this.errDetail(e, src, true);
        try { OWGLog.add("脚本", "脚本运行失败（ESM）：" + (s.name || id), det); } catch (e0) { }
        this.log("error", id, "运行失败：" + det);
        return finish(false);
      }).finally(() => { try { URL.revokeObjectURL(url); } catch (e) { } });
    }
    let ok = true;
    try {
      const fn = new Function("TavernHelper", "tavern_events", src);
      fn.call(window, window.TavernHelper, window.tavern_events);
      this.patchSlot(id, { runCount: (s.runCount || 0) + 1, lastRunAt: Date.now() });
      this.log("info", id, "▶ 已运行" + ((opts && opts.auto) ? "（自动）" : ""));
    } catch (e) {
      ok = false;
      const det = this.errDetail(e, src, false);
      try { OWGLog.add("脚本", "脚本运行失败：" + (s.name || id), det); } catch (e0) { }
      this.log("error", id, "运行失败：" + det);
    }
    return finish(ok);
  },
  /* 剧情区脚本面板已移除：只清理历史遗留节点，不再向剧情容器插入任何东西 */
  applyPanels() {
    try { document.querySelectorAll("[data-th-panel]").forEach(el => el.remove()); } catch (e) { }
    this.panels = {};
  },
  async autoRun() {
    // 启动后 900ms 的自动运行：跳过刚刚已经跑过的脚本，避免同一个脚本被重复求值
    // （重复实例会互相 dispose：后一个实例卸载前一个实例注入的按钮/面板，表现为“点了没反应”）
    const now = Date.now();
    const cid = String((Game.state && Game.state.cardId) || "");
    for (const s of this.list()) {
      if (!s.enabled) continue;
      const src = s.source || {};
      // 只跑本卡与预设/手动脚本：别的卡遗留的启用状态不应在本档启动时求值
      if (src.kind === "card" && String(src.cardId || "") !== cid) continue;
      if (s.lastRunAt && now - s.lastRunAt < 5000) continue;
      try { await this.run(s.id, { auto: true }); } catch (e) { }
    }
  },

  /* ----------------------------- 日志 ----------------------------- */
  log(level, sid, text) {
    const s = this.get(sid);
    const item = { ts: Date.now(), level: level || "info", sid, name: s ? s.name : "?", text: String(text == null ? "" : text).slice(0, 500) };
    this.logs.push(item);
    if (this.logs.length > this.MAX_LOG) this.logs.splice(0, this.logs.length - this.MAX_LOG);
    if (this.panelTab === "log" && document.querySelector("#th-log-live")) this.renderPanel();
    if (item.level === "error") {
      if (Date.now() - (this._lastErrToast || 0) > 1500) {
        this._lastErrToast = Date.now();
        try { toast("酒馆脚本报错：" + item.text.slice(0, 70), "err"); } catch (e) { }
      }
    }
  },

  /* ----------------------------- 脚本按钮 ----------------------------- */
  buttonsOfAll() {
    const out = [];
    for (const s of this.list()) {
      if (!s.enabled) continue;
      for (const b of (s.buttons || [])) if (b.visible !== false && b.name) out.push({ sid: s.id, name: String(b.name) });
    }
    return out;
  },
  /** 脚本按钮 + 来源标注（预设 / 角色卡 / 手动），用于「功能合集」列表 */
  sourceLabel(s) {
    const src = (s && s.source) || {};
    if (src.kind === "preset") return "预设" + (src.presetName ? "·" + src.presetName : "");
    if (src.kind === "card") return "角色卡" + (src.cardName ? "·" + src.cardName : "");
    return "手动导入";
  },
  buttonEntries() {
    const out = [];
    for (const s of this.list()) {
      if (!s.enabled) continue;
      for (const b of (s.buttons || [])) {
        if (b.visible === false || !b.name) continue;
        out.push({ sid: s.id, name: String(b.name), source: this.sourceLabel(s) });
      }
    }
    return out;
  },
  /** 触发脚本注册的按钮：事件名必须与 eventOnButton / getButtonEvent 一致 */
  triggerButton(sid, name) {
    OWGTH.emit("__button__:" + String(sid).replace(/[^a-zA-Z0-9\-]/g, "") + ":" + name);
    OWGTH.emit(OWGTH.getButtonEvent(name));
  },
  /** 脚本入口统一下沉到「功能合集」弹窗；剧情页不再往「切磋」旁插按钮 */
  mountButtons() {
    const old = document.querySelector("#page-story .th-btn-row");
    if (old) old.remove();
    const host = document.querySelector("#fn-script-list");
    if (!host) return;
    const btns = this.buttonEntries();
    host.innerHTML = btns.length
      ? btns.map(b => `<button class="fn-item" data-th-btn="${escapeHtml(b.sid)}" data-th-name="${escapeHtml(b.name)}" title="${escapeHtml(b.source)}">${escapeHtml(b.name)}<br><span style="font-size:10.5px;color:var(--txt2)">${escapeHtml(b.source)}</span></button>`).join("")
      : '<span class="hint" style="font-size:11.5px">暂无启用的脚本入口</span>';
    host.querySelectorAll("[data-th-btn]").forEach(el => {
      el.onclick = () => this.triggerButton(el.dataset.thBtn, el.dataset.thName);
    });
  },

  /* ----------------------------- 面板 UI ----------------------------- */
  showPanel(tab) {
    this.panelTab = tab || this.panelTab || "list";
    openModal(`<h3>🧩 酒馆助手 <span class="hint" style="font-weight:400;font-size:11px">JS-Slash-Runner 兼容层</span></h3>
      <div class="subtabs" id="th-tabs">
        <button class="subtab" data-th="list">脚本<span class="cnt">${this.list().length}</span></button>
        <button class="subtab" data-th="edit">编辑</button>
        <button class="subtab" data-th="log">日志</button>
        <button class="subtab" data-th="help">能力说明</button>
      </div>
      <div id="th-body"></div>`);
    const tabs = document.querySelectorAll("#th-tabs [data-th]");
    tabs.forEach(b => b.onclick = () => { this.panelTab = b.dataset.th; if (this.panelTab === "edit" && !this.editing) this.editing = { id: null, name: "", content: "" }; this.renderPanel(); });
    this.renderPanel();
  },
  renderPanel() {
    const tabs = document.querySelectorAll("#th-tabs [data-th]");
    if (!tabs.length) return;
    tabs.forEach(b => b.classList.toggle("active", b.dataset.th === this.panelTab));
    const body = document.querySelector("#th-body");
    if (!body) return;
    if (this.panelTab === "list") this.renderList(body);
    else if (this.panelTab === "edit") this.renderEditor(body);
    else if (this.panelTab === "log") this.renderLog(body);
    else this.renderHelp(body);
  },
  renderList(body) {
    const list = this.list();
    const rows = list.length ? list.map(s => `
      <div class="card" style="padding:10px 12px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.name)}</div>
            <div class="hint" style="font-size:11px">${s.enabled ? "已启用 · 随页面自动运行" : "未启用"}${s.buttons.length ? " · 按钮 " + s.buttons.length : ""}${s.runCount ? " · 已运行 " + s.runCount + " 次" : ""}</div>
          </div>
          <label class="switch"><input type="checkbox" data-th-en="${escapeHtml(s.id)}" ${s.enabled ? "checked" : ""}><i></i></label>
        </div>
        <div class="row" style="margin-top:8px;gap:6px">
          <button class="btn sm" data-th-run="${escapeHtml(s.id)}">▶ 运行</button>
          <button class="btn sm" data-th-edit="${escapeHtml(s.id)}">✎ 编辑</button>
          <button class="btn sm ghost" data-th-exp="${escapeHtml(s.id)}">导出</button>
          <button class="btn sm danger" data-th-del="${escapeHtml(s.id)}">删除</button>
        </div>
      </div>`).join("") : '<div class="empty" style="padding:18px"><span class="ee">🧩</span>还没有脚本<br>点「新建脚本」或「插入示例」</div>';
    body.innerHTML = `<p class="hint" style="margin-bottom:8px">脚本直接在当前页面运行，可读写游戏数据、并直接把 HTML 渲染进剧情区。出错只会记录到日志，不会中断游戏。</p>
      ${rows}
      <div class="row" style="gap:6px;margin-top:10px">
        <button class="btn primary" id="th-new" style="flex:1">＋ 新建</button>
        <button class="btn" id="th-imp" style="flex:1">导入<br><span style="font-size:10px;opacity:.75">JSON</span></button>
        <button class="btn ghost" id="th-samples" style="flex:1">插入示例</button>
      </div>`;
    body.querySelectorAll("[data-th-en]").forEach(el => el.onchange = () => {
      const s = this.get(el.dataset.thEn);
      if (!s) return;
      s.enabled = el.checked; this.saveScript(s);
      if (el.checked) this.run(s.id); else this.teardown(s.id);
      this.renderPanel();
      try { UI.renderStory(); } catch (e) { }
    });
    body.querySelectorAll("[data-th-run]").forEach(el => el.onclick = () => this.run(el.dataset.thRun));
    body.querySelectorAll("[data-th-edit]").forEach(el => el.onclick = () => {
      const s = this.get(el.dataset.thEdit);
      if (!s) return;
      this.editing = { id: s.id, name: s.name, content: s.content };
      this.panelTab = "edit"; this.renderPanel();
    });
    body.querySelectorAll("[data-th-exp]").forEach(el => el.onclick = () => {
      const s = this.get(el.dataset.thExp);
      if (!s) return;
      downloadFile((s.name || "script") + ".json", JSON.stringify({ name: s.name, content: s.content, info: s.info, buttons: s.buttons }, null, 2));
      toast("已导出脚本", "ok");
    });
    body.querySelectorAll("[data-th-del]").forEach(el => el.onclick = () => {
      const s = this.get(el.dataset.thDel);
      if (!s) return;
      openModal(`<h3>删除脚本</h3><p style="font-size:14px">确定删除「${escapeHtml(s.name)}」？</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="th-del-ok">删除</button></div>`);
      $("#th-del-ok").onclick = () => { this.remove(s.id); closeModal(); this.showPanel("list"); toast("已删除", "ok"); };
    });
    const nb = body.querySelector("#th-new");
    if (nb) nb.onclick = () => {
      const s = this.create("新脚本");
      this.editing = { id: s.id, name: s.name, content: "" };
      this.panelTab = "edit"; this.renderPanel();
    };
    const ib = body.querySelector("#th-imp");
    if (ib) ib.onclick = () => UI.pickFile(".json", async f => {
      try {
        const txt = await f.text();
        const j = JSON.parse(txt);
        const s = this.create(String(j.name || f.name.replace(/\.json$/i, "") || "导入脚本"));
        s.content = String(j.content || "");
        s.info = String(j.info || "");
        s.buttons = Array.isArray(j.buttons) ? j.buttons : [];
        this.saveScript(s);
        this.showPanel("list"); toast("已导入：" + s.name, "ok");
      } catch (e) { toast("导入失败：" + e.message, "err"); }
    });
    const sb = body.querySelector("#th-samples");
    if (sb) sb.onclick = () => {
      for (const smp of this.SAMPLES) {
        const exist = this.list().some(x => x.name === smp.name);
        if (exist) continue;
        const s = this.create(smp.name);
        s.content = smp.content; s.enabled = false; s.info = smp.info || "";
        this.saveScript(s);
      }
      this.showPanel("list"); toast("已插入示例脚本（默认不启用）", "ok");
    };
  },
  renderEditor(body) {
    const ed = this.editing || { id: null, name: "", content: "" };
    body.innerHTML = `
      <label class="field"><span>脚本名</span><input type="text" id="th-name" value="${escapeHtml(ed.name || "")}"></label>
      <label class="field"><span>代码（JS，可直接调用 TavernHelper / 全局同名函数）</span>
        <textarea id="th-code" rows="14" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.55">${escapeHtml(ed.content || "")}</textarea>
      </label>
      <div class="row" style="gap:6px">
        <button class="btn primary" id="th-save" style="flex:1">保存</button>
        <button class="btn" id="th-save-run" style="flex:1">保存并运行</button>
      </div>
      <div class="row" style="gap:6px;margin-top:6px">
        <button class="btn ghost" id="th-back" style="flex:1">返回列表</button>
        <button class="btn ghost" id="th-samples2" style="flex:1">插入示例</button>
      </div>
      <p class="hint" style="margin-top:8px">常用：getVariables / replaceVariables / getChatMessages / createChatMessages / eventOn / generateStory / getGameState / getWorldbook。完整清单见「能力说明」。</p>`;
    const grab = () => {
      const name = ($("#th-name").value || "").trim() || "未命名脚本";
      const content = $("#th-code").value || "";
      return { name, content };
    };
    const save = () => {
      const g = grab();
      let id = ed.id;
      if (!id) { const s = this.create(g.name); id = s.id; }
      const s = this.get(id) || { id };
      s.name = g.name; s.content = g.content;
      this.saveScript(s);
      this.editing = { id: s.id, name: s.name, content: s.content };
      toast("已保存", "ok");
      return s.id;
    };
    body.querySelector("#th-save").onclick = () => { save(); this.panelTab = "list"; this.renderPanel(); };
    body.querySelector("#th-save-run").onclick = () => { const id = save(); this.run(id); this.panelTab = "log"; this.renderPanel(); };
    body.querySelector("#th-back").onclick = () => { this.panelTab = "list"; this.renderPanel(); };
    body.querySelector("#th-samples2").onclick = () => {
      const s = this.SAMPLES[0];
      $("#th-name").value = s.name;
      $("#th-code").value = s.content;
    };
  },
  renderLog(body) {
    const lines = this.logs.slice(-80);
    body.innerHTML = `
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn sm" id="th-log-clear" style="flex:1">清空日志</button>
        <button class="btn sm ghost" id="th-log-refresh" style="flex:1">刷新</button>
      </div>
      <div id="th-log-live" style="max-height:46vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.65">
        ${lines.length ? lines.map(l => `<div style="color:${l.level === "error" ? "#f098a1" : l.level === "warn" ? "#e8c574" : "#9aa3c7"};white-space:pre-wrap;word-break:break-word"><span style="opacity:.6">${fmtTime(l.ts)}</span> [${escapeHtml(l.name)}] ${escapeHtml(l.text)}</div>`).join("") : '<span class="hint">暂无日志。运行脚本后这里会显示 console 输出与报错。</span>'}
      </div>`;
    const c = body.querySelector("#th-log-clear");
    if (c) c.onclick = () => { this.logs.length = 0; this.renderPanel(); };
    const r = body.querySelector("#th-log-refresh");
    if (r) r.onclick = () => this.renderPanel();
  },
  renderHelp(body) {
    body.innerHTML = `<div style="font-size:12.5px;line-height:1.75">
      <div class="card" style="padding:10px 12px"><div class="card-title" style="margin-bottom:6px">✅ 已支持（真实读写游戏数据）</div>
        <div class="hint">变量 global/chat/character/preset/message/script；剧情消息读取/修改/插入/删除；角色读取与修改；事件订阅（消息、生成、角色、卡启用、战斗、升级）；generate/generateStory 走主模型；世界书读写；宏替换；斜杠指令；脚本按钮；toast。</div>
      </div>
      <div class="card" style="padding:10px 12px"><div class="card-title" style="margin-bottom:6px">⚠️ 降级 / 不支持</div>
        <div class="hint">角色卡 PNG 解析、酒馆预设与正则设置、扩展安装、音频/文件上传、消息 swipes 多候选、群聊、酒馆原生 UI 注入、POST 请求类接口。</div>
      </div>
      <div class="card" style="padding:10px 12px"><div class="card-title" style="margin-bottom:6px">🚫 剧情区渲染能力已移除</div>
        <div class="hint"><b>renderStoryHTML</b> / <b>setChatMessageHTML</b> / <b>getStoryContainer</b> 以及脚本写入的 HTML 面板、卡自带 CSS 与显示型正则都不再生效；调用时返回安全值并在日志里提示「该渲染能力已移除」。<br>
          脚本仍可正常读写变量、消息、角色、世界书与事件，仍可用 <b>setChatMessages([{message_id, message}])</b> 写入纯文本剧情。</div>
      </div>
      <div class="card" style="padding:10px 12px"><div class="card-title" style="margin-bottom:6px">🛡 出错保护</div>
        <div class="hint">同步报错、异步报错（window error / unhandledrejection）与 console 输出都会写进「日志」，单个脚本出错不会中断游戏，也不会影响其他脚本；可在列表里停用该脚本，停用会同时退订事件并清掉它渲染的内容。<br>由于脚本能直接访问页面，只运行你信任的代码。</div>
      </div>
      <div class="card" style="padding:10px 12px"><div class="card-title" style="margin-bottom:6px">📖 事件名</div>
        <div class="hint" style="font-family:ui-monospace,Consolas,monospace;font-size:11.5px">message_sent / message_received / message_edited / message_deleted / message_updated<br>generation_started / generation_ended / generation_stopped<br>chat_changed / character_edited<br>owg_battle_started / owg_battle_ended / owg_level_up / owg_card_activated<br>eventOnButton('按钮名', fn) 或事件 "button"</div>
      </div>
    </div>`;
  },

  SAMPLES: [
    {
      name: "示例·好感度与剧情联动",
      info: "监听剧情回复，累计好感度写入聊天变量",
      content: [
        "// 每次剧情回复后：累计好感度、写回聊天变量、打印当前场景",
        "eventOn('message_received', function (id) {",
        "  var v = getVariables({ type: 'chat' });",
        "  v.affection = (v.affection || 0) + 1;",
        "  replaceVariables(v, { type: 'chat' });",
        "  var st = getGameState();",
        "  console.log('新剧情 #' + id + '｜场景：' + (st.scene || '未知') + '｜好感度=' + v.affection);",
        "  toast('好感度 +1（当前 ' + v.affection + '）');",
        "});",
        "// 启用后去剧情页发一条消息，效果会出现在「日志」里"
      ].join("\n")
    },
    {
      name: "示例·战斗结算统计",
      info: "监听战斗开始/结束，统计胜负",
      content: [
        "eventOn('owg_battle_started', function (d) {",
        "  console.log('战斗开始：' + (d.kind === 'spar' ? '切磋' : '普通战斗'));",
        "});",
        "eventOn('owg_battle_ended', function (d) {",
        "  var v = getVariables({ type: 'chat' });",
        "  v.battles = (v.battles || 0) + 1;",
        "  if (d.won) v.wins = (v.wins || 0) + 1;",
        "  replaceVariables(v, { type: 'chat' });",
        "  toast(d.won ? ('胜利！累计 ' + v.wins + ' 胜 / ' + v.battles + ' 战') : ('落败，累计 ' + v.wins + ' 胜 / ' + v.battles + ' 战'));",
        "});"
      ].join("\n")
    },
    {
      name: "示例·写入剧情消息（手动运行）",
      info: "读取游戏状态并写入一条剧情便笺",
      content: [
        "var st = getGameState();",
        "var v = getVariables({ type: 'chat' });",
        "var text = '【脚本便笺】场景：' + (st.scene || '未知')",
        "  + '｜' + (st.player ? st.player.name + ' Lv.' + st.player.level : '无角色')",
        "  + '｜好感度 ' + (v.affection || 0) + '｜战绩 ' + (v.wins || 0) + '/' + (v.battles || 0);",
        "createChatMessages([{ role: 'system', message: text }], { insert_at: 'end' });",
        "toast('已写入一条剧情便笺，去剧情页查看');"
      ].join("\n")
    }
  ]
};

document.addEventListener("DOMContentLoaded", () => {
  try { OWGTH.init(); } catch (e) { console.warn("酒馆助手适配层初始化失败", e); }
  try { OWGScript.init(); } catch (e) { console.warn("酒馆脚本运行器初始化失败", e); }
  // 旧版 localStorage 图库 → IndexedDB 一次性迁移（全部成功才删旧键）
  try {
    OWGGallery.migrate().then(n => {
      if (n) { try { toast(`图库已迁移 ${n} 张旧图片到大容量存储`, "ok"); } catch (e) { } }
    }).catch(e => console.warn("图库迁移失败，旧数据保留", e));
  } catch (e) { console.warn("图库迁移初始化失败", e); }
});
window.OWGTH = OWGTH;
window.OWGScript = OWGScript;
// 宿主 API 必须在任何用户脚本之前就绪：脚本块一结束就装好，而不是等 DOMContentLoaded
try { OWGTH.init(); } catch (e) { }
try { OWGTH.installPageGlobals(); } catch (e) { }
</script>
</body>
</html>
