  /** AI 生成可学习技能（3个候选，含金币消耗），过滤已学 */
  async generateLearnableSkills() {
    const st = this.state, p = st.player;
    if (!p) throw new Error("请先创建角色");
    if (!API.roleReady("gameplay")) throw new Error("请先配置 API（或玩法分析模型）");
    const card = this.activeCard();
    const msgs = [
      { role: "system", content: "你是RPG技能导师。根据世界观与玩家情况设计可学习的新技能，只输出一个 JSON 对象。" },
      { role: "user", content: `【世界】${st.world.name}：${card?.analysis?.worldview || ""}\n【玩家】${p.name} ${this.levelText(p.level)} ${p.cls}，${Game.termName("gold")}${p.gold}\n【已学${Game.termName("skill")}】${p.skills.map(s => s.name).join("、") || "无"}\n\n设计 3 个该玩家尚未掌握、贴合世界观与职业的技能（强度匹配等级，可略高），必须给出耗魔与威力数值。输出：\n{"skills":[{"name":"技能名2-6字","desc":"效果描述30字内","cost":学习花费金币数字(50到500，按强度),"mpCost":每次消耗魔力数字(5到30),"power":威力倍率数字(1.2到2.2),"magic":true或false}]}` },
    ];
    const content = await API.chat({ role: "gameplay", messages: msgs, temperature: 0.9, maxTokens: 700, stream: false });
    const j = extractJSON(content);
    const known = new Set(p.skills.map(s => s.name));
    const list = ((j && Array.isArray(j.skills)) ? j.skills : []).filter(s => s && s.name && !known.has(String(s.name).slice(0, 14))).slice(0, 3)
      .map(s => ({
        name: String(s.name).slice(0, 14), desc: String(s.desc || "").slice(0, 80),
        cost: clamp(Math.round(+s.cost) || 50, 0, 9999),
        mpCost: clamp(Math.round(+s.mpCost) || 8, 0, 200),
        power: Math.round(clamp(+s.power || 1.4, 1.1, 2.4) * 10) / 10,
        magic: s.magic === true,
      }));
    if (!list.length) throw new Error("没有生成可学的新技能，请重试");
    return list;
  },

  learnSkill(sk) {
    const p = this.state.player;
    if (p.skills.find(s => s.name === sk.name)) return false;
    const chk = this.checkFunds(sk.cost);
    if (!chk.ok) return false;
    p.gold = chk.have - chk.need;
    p.skills.push({ name: sk.name, desc: sk.desc, mpCost: sk.mpCost, power: sk.power, magic: sk.magic });
    this.save();
    return true;
  },

  /* ---------- 存档 ---------- */
  slots() { return store.get("saves", []); },
  saveSlots(list) { store.set("saves", list); },

  snapshotName() {
    const p = this.state.player;
    return `${this.levelText(p?.level ?? 1)} ${this.locNameText()} · ${this.activeCard()?.name || this.state.world.name}`;
  },

  createSave(name, auto = false) {
    const list = this.slots();
    const cardKey = this.state.cardId || "default";
    const slot = {
      id: auto ? ("auto@" + cardKey) : uid(),
      cardId: this.state.cardId || null,
      name: name || this.snapshotName(),
      ts: Date.now(), auto,
      data: JSON.parse(JSON.stringify({
        ver: 1, player: this.state.player, cardId: this.state.cardId,
        world: this.state.world, worldSource: this.state.worldSource,
        worldbook: this.worldbookEntries(),
        currentMapId: this.state.currentMapId, currentLocId: this.state.currentLocId,
        // 快照只留插图引用（imageRef）：base64 原图留在图库，避免每份存档各存一份把空间吃满
        messages: this.state.messages.slice(-200).map(m => {
          if (!m || typeof m.image !== "string" || !/^data:/i.test(m.image) || m.image.length <= 4096) return m;
          const c = Object.assign({}, m);
          delete c.image;
          return c;
        }), scene: this.state.scene,
        memory: this.state.memory, memoryUpto: this.state.memoryUpto,
        characters: this.state.characters, quests: this.state.quests,
        party: this.state.party,
        battle: this.state.battle, shop: this.state.shop, env: this.state.env,
        // 变量与脚本运行状态跟这一档走：读档时完整恢复，换档互不污染
        vars: JSON.parse(JSON.stringify((typeof STAssist !== "undefined") ? STAssist.allVars() : (this.state.vars || {}))),
        scriptState: JSON.parse(JSON.stringify(this.state.scriptState || {})),
        // 上一轮生图的人物/服装段：连续未换装时沿用

        jobRefreshCount: this.state.jobRefreshCount || 0,
        createdAt: this.state.createdAt,
      })),
    };
    if (auto) {
      // 自动档按角色卡各存一个（id = auto@<card>），覆盖旧的而不是不断堆积
      const i = list.findIndex(s => s.id === slot.id);
      if (i >= 0) list[i] = slot; else list.unshift(slot);
    } else list.unshift(slot);
    // 手动档最多保留 12 个，自动档永远保留
    const autos = list.filter(s => s.auto);
    const mans = list.filter(s => !s.auto).slice(0, 12);
    this.saveSlots([...autos, ...mans].sort((a, b) => (b.ts || 0) - (a.ts || 0)));
    this.state.activeSaveId = slot.id;
    return slot;
  },

  loadSave(slotId) {
    const list = this.slots();
    if (typeof OWGSaves !== "undefined" && OWGSaves.migrate(list)) this.saveSlots(list);
    const slot = list.find(s => s.id === slotId);
    if (!slot) { toast("找不到这个存档", "err"); return false; }
    if (typeof OWGSaves !== "undefined" && (slot.cardId || "default") !== OWGSaves.cardKey()) {
      toast("这个存档属于别的角色卡，不能在当前卡下载入", "err");
      return false;
    }
    if (!slot.data) { toast("这个存档没有内容，无法读取", "err"); return false; }
    const st = this.state;
    const data = JSON.parse(JSON.stringify(slot.data));
    // 世界书·全局层是用户级配置（手工添加 / 导入 / 脚本写入），不属于某一档剧情：
    // 读档前先取内存里这一份，快照覆盖完再并回去，避免「旧快照把新加的全局条目回滚掉」
    const liveGlobal = this.worldbookEntries().filter(e => e && e.source !== "card");
    // 逐字段覆盖，保证读档后与存档那一刻完全一致
    for (const k of Object.keys(data)) st[k] = data[k];
    st.settings = this.state.settings;            // 设置不属于剧情进度，保持当前设置
    // 已结束的对战不随读档恢复成“进行中”，否则面板会被反复拉起
    if (st.battle && (!st.battle.status || (st.battle.status !== "fighting" && st.battle.status !== "preparing"))) st.battle = null;
    // 旧存档兼容：卡片来源世界书补齐 cardId（按当前卡过滤）；前情记忆补齐归属卡，避免换卡串味
    if (Array.isArray(st.worldbook)) {
      st.worldbook = st.worldbook.map(e => (e && e.source === "card" && !e.cardId)
        ? Object.assign({}, e, { cardId: st.cardId || null }) : e);
    }
    // 世界书分层合并：全局条目以内存当前这份为准（读旧档不回滚）；卡专属只留当前卡自己的（不串卡）；
    // 旧存档里没有 source 标记的条目按全局处理，绝不当作无效数据丢弃
    (() => {
      const snapAll = Array.isArray(st.worldbook) ? st.worldbook : [];
      const snapCard = snapAll.filter(e => e && e.source === "card" && (!e.cardId || e.cardId === st.cardId));
      const snapLegacy = snapAll.filter(e => e && !e.source)
        .map(e => Object.assign({}, e, { source: "user", book: e.book || "全局", origin: e.origin || "ui" }));
      const seen = Object.create(null), merged = [];
      [...liveGlobal, ...snapLegacy, ...snapCard].forEach(e => {
        if (!e || typeof e !== "object") return;
        const key = e.id ? "id:" + e.id : "sig:" + JSON.stringify([e.keys, e.content]);
        if (seen[key]) return;
        seen[key] = 1; merged.push(e);
      });
      st.worldbook = merged;
    })();
    st.memoryCardId = st.memoryCardId || (st.memory ? (st.cardId || null) : null);
    // 职业刷新次数跟档：旧存档没有该字段时从 100 档重新开始
    st.jobRefreshCount = Number.isFinite(data.jobRefreshCount) && data.jobRefreshCount >= 0 ? Math.floor(data.jobRefreshCount) : 0;
    // 上一轮人物/服装段跟档；旧存档没有则从空开始

    // 旧存档可能带生图 seed 相关字段：读档时清掉，避免继续留在内存/下一份快照里
    delete st.imageSeeds;
    delete st.seedSalt;
    // 已删除功能（生图自检/女性外貌描写/女性角色库）的旧档残留字段：读档即丢弃
    delete st.imageLastParts;
    delete st.femLib;
    if (st.settings && st.settings.prompt) delete st.settings.prompt;
    // 变量 / 脚本状态：按该档快照恢复；旧存档没有这些字段时从空容器开始，绝不沿用上一档的值
    if (!st.vars || typeof st.vars !== "object" || Array.isArray(st.vars)) {
      st.vars = (typeof STAssist !== "undefined") ? STAssist.freshVars() : { global: {}, chat: {}, character: { byCard: {} }, preset: {}, message: {}, initial: {} };
    }
    if (!st.scriptState || typeof st.scriptState !== "object" || Array.isArray(st.scriptState)) st.scriptState = {};
    if (st.player) {
      this.ensurePlayerShape(st.player);          // 旧存档缺 skills/statuses 等字段时补齐
      this.recalcPlayer(!st.player.d);            // 旧存档没有衍生属性 p.d 时按主属性重算（回满）
    }
    this.save();
    st.activeSaveId = slot.id;
    // 读档后把插图引用解析成可显示 URL（图片本体在图库，不在存档快照里）
    try { this.hydrateImages().then(n => { if (n) { try { if (UI.tab === "story") UI.refresh(); } catch (e) { } } }).catch(() => { }); } catch (e) { }
    // 读档后按本档快照重跑脚本：启用状态/脚本数据已恢复，重跑才能让脚本面板与状态对齐
    try { if (typeof OWGScript !== "undefined") OWGScript.reloadForSlot(); } catch (e) { }
    return true;
  },

  /** 新开一档：变量与脚本运行状态回到初始值（脚本代码列表不动，按卡/预设共用） */
  resetSlotRuntime() {
    const st = this.state;
    st.vars = (typeof STAssist !== "undefined") ? STAssist.freshVars() : { global: {}, chat: {}, character: { byCard: {} }, preset: {}, message: {}, initial: {} };
    st.scriptState = {};

    st.activeSaveId = null;
    st.jobRefreshCount = 0;          // 新开一档：职业刷新价格回到 100
    try { if (typeof OWGScript !== "undefined") OWGScript.onNewSlot(); } catch (e) { }
  },

  /** 删除单个存档：按 id 精确删除，返回 {ok, wasActive}；其它存档不受影响 */
  deleteSave(slotId) {
    const list = this.slots();
    const i = list.findIndex(s => s.id === slotId);
    if (i < 0) return { ok: false, wasActive: false };
    const slot = list[i];
    const isAuto = !!slot.auto && (slot.cardId || "default") === (typeof OWGSaves !== "undefined" ? OWGSaves.cardKey() : (this.state.cardId || "default"));
    const wasActive = this.state.activeSaveId === slotId || isAuto;
    list.splice(i, 1);
    this.saveSlots(list);
    if (wasActive) { this.state.activeSaveId = null; this.save(); }
    return { ok: true, wasActive };
  },

  /** 删除某个角色卡的所有存档（含自动档） */
  deleteCardSaves(cardId) {
    const key = cardId || "default";
    const before = this.slots().length;
    this.saveSlots(this.slots().filter(s => (s.cardId || "default") !== key));
    return before - this.slots().length;
  },

  /** 职业基础主属性：建角与换职业共用同一套换算 */
  classBaseAttrs(cls) {
    const a = (cls && cls.attrs) || {};
    return {
      con: clamp(Math.round((a.hp || 100) / 22), 3, 14),
      spi: clamp(Math.round((a.int || (a.mp || 40) / 4) / 11), 3, 14),
      str: clamp(Math.round((a.atk || 10) / 2.2), 3, 14),
      agi: clamp(Math.round((a.luk || 6) / 1.6), 3, 14),
    };
  },
  /** 切换职业：重置主属性与初始技能，成长系数随新职业变化
   *  keepProgress=true 用于「刷新职业」转职：保留等级/经验/加点与已分配点数，不从头开始 */
  setPlayerClass(clsName, keepProgress = false) {
    const p = this.state.player;
    if (!p) return false;
    const map = this.classes();
    if (!map[clsName]) return false;
    this.ensurePlayerShape(p);
    const oldCls = map[p.cls];
    const oldBase = oldCls ? this.classBaseAttrs(oldCls) : null;
    const newBase = this.classBaseAttrs(map[clsName]);
    p.cls = clsName;
    // 保留玩家已投入的属性点：新职业基础 + 原职业之上额外加的点数
    const attrs = {};
    for (const k of ["con", "spi", "str", "agi"]) {
      const spent = (keepProgress && oldBase && Number.isFinite(p.attrs[k])) ? Math.max(0, p.attrs[k] - oldBase[k]) : 0;
      attrs[k] = clamp(newBase[k] + spent, 1, 60);
    }
    p.attrs = attrs;
    const starter = (map[clsName].skills || []).slice(0, 3).map(s => ({
      name: s.name, desc: s.desc || "",
      mpCost: clamp(Math.round(+s.mpCost) || 10, 0, 200),
      power: Math.round(clamp(+s.power || 1.4, 1.1, 2.4) * 10) / 10,
      magic: s.magic === true,
    }));
    if (keepProgress) {
      // 转职不清空已学技能：只补入新职业的初始技能
      const known = new Set((p.skills || []).map(s => s.name));
      for (const sk of starter) if (!known.has(sk.name)) p.skills.push(sk);
    } else {
      p.skills = starter;
      p.level = 1; p.exp = 0; p.attrPoints = 0;
    }
    this.recalcPlayer(true);
    this.save();
    return true;
  },

  /* ---------- 职业刷新重选（手动触发，按档计费） ---------- */
  /** 当前刷新价格：100 → 200 → 400 …（本档每刷新一次翻倍） */
  jobRefreshCost() {
    const n = Math.max(0, Math.floor(Number(this.state.jobRefreshCount) || 0));
    return 100 * Math.pow(2, Math.min(n, 20));
  },
  /** 世界观上下文：角色卡设定 + 世界名/当前区域/现有职业 + 最近剧情（用于生成与核对） */
  worldContextText(storyLimit = 500) {
    const st = this.state, card = this.activeCard();
    const parts = [];
    if (card) {
      const c = [card.description, card.personality, card.scenario].filter(Boolean).join("；");
      if (c) parts.push("角色卡设定：" + c);
    }
    if (st.world && st.world.name) parts.push("世界：" + st.world.name);
    const curMap = (st.world?.maps || []).find(m => m.id === st.currentMapId);
    if (curMap) parts.push("当前区域：" + curMap.name + (curMap.desc ? "（" + curMap.desc + "）" : ""));
    const cls = this.classes();
    if (Object.keys(cls).length) parts.push("现有职业：" + Object.entries(cls).map(([n, c]) => n + (c.desc ? "（" + c.desc + "）" : "")).join("、"));
    const recent = (st.messages || []).filter(m => m && typeof m.content === "string" && m.content.trim())
      .slice(-2).map(m => String(m.content).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim()).join(" / ");
    if (recent) parts.push("最近剧情：" + recent.slice(-storyLimit));
    return parts.join("\n");
  },
  /**
   * 刷新职业选项（手动）：重新读取当前世界观与最近剧情，生成若干可转职职业。
   * 生成成功后才扣费并计次；失败不扣费、不计次。返回 {cost,count,nextCost,list,gold,keywords}
   */
  async refreshCareerOptions() {
    const st = this.state, p = st.player, card = this.activeCard();
    if (!p) throw new Error("请先创建角色");
    if (!API.roleReady("gameplay")) throw new Error("请先配置 API（主模型或玩法分析模型）");
    const cost = this.jobRefreshCost();
    if ((p.gold || 0) < cost) throw new Error("金币不足：本次刷新需要 " + cost + " " + this.termName("gold") + "，当前只有 " + (p.gold || 0));
    const ctx = this.worldContextText();
    const msgs = [
      { role: "system", content: "你是RPG职业设计师。只输出一个 JSON 对象，不要任何解释或多余文本。" },
      { role: "user", content: `【世界观与剧情】
${ctx}

【玩家】${p.name} ${this.levelText(p.level)} 当前职业：${this.playerClassName(p)}

请据此生成 4 个新的可转职职业。硬性要求：
1) 名称与简介必须贴合上述世界观的关键词与设定，不能是通用西幻模板；
2) 每个职业给出属性倾向：hp(体质/生命)、mp(魔力上限)、int(精神/法伤)、atk(力量/物攻)、def(防御)、luk(敏捷/暴击)、spd(速度) 的基础数值；
3) growth 字段写一句成长加成（如"生命+9/体质，攻击+4/力量"）；
4) tier 标明"基础"或"进阶"，adv_from 写清与当前职业或现有职业的进阶关系（每 30 级可转职，进阶职业属性加成更高）；
5) 可附一个初始技能 skill。

只输出：{"classes":[{"name":"2-8字","icon":"一个emoji","desc":"30字内简介","tier":"基础或进阶","adv_from":"由XX进阶/可与XX衔接","growth":"成长加成说明","attrs":{"hp":120,"mp":50,"atk":12,"def":10,"luk":6,"int":40,"spd":8},"skill":{"name":"技能名","desc":"20字内","mpCost":8,"power":1.3,"magic":false}}]}` },
    ];
    const content = await API.chat({
      role: "gameplay", messages: msgs, temperature: 0.9, maxTokens: 1000, stream: false,
      reqType: "手动:职业刷新", reason: "职业刷新",
    });
    const j = extractJSON(content);
    const raw = (j && (Array.isArray(j.classes) ? j.classes : (Array.isArray(j.jobs) ? j.jobs : null))) || [];
    const seen = new Set();
    const pick = (a, k, d) => clamp(Math.round(Number(a[k]) || d), 1, 400);
    const list = raw.filter(x => x && x.name).map(x => {
      const a = (x.attrs && typeof x.attrs === "object") ? x.attrs : {};
      const attrs = {
        hp: pick(a, "hp", 100), mp: pick(a, "mp", 50), int: pick(a, "int", 40),
        atk: pick(a, "atk", 12), def: pick(a, "def", 10), luk: pick(a, "luk", 6), spd: pick(a, "spd", 8),
      };
      const sk = (x.skill && x.skill.name) ? {
        name: String(x.skill.name).slice(0, 14), desc: String(x.skill.desc || "职业初始技能").slice(0, 80),
        mpCost: clamp(Math.round(+x.skill.mpCost) || 8, 0, 200),
        power: Math.round(clamp(+x.skill.power || (x.skill.magic ? 1.6 : 1.3), 1.1, 2.4) * 10) / 10,
        magic: x.skill.magic === true,
      } : null;
      return {
        name: String(x.name).slice(0, 8),
        icon: String(x.icon || "⚔️").slice(0, 4),
        desc: String(x.desc || "").slice(0, 40),
        tier: String(x.tier || "").slice(0, 6),
        advFrom: String(x.adv_from || x.advFrom || "").slice(0, 60),
        growth: String(x.growth || "").slice(0, 80),
        attrs,
        skills: sk ? [sk] : [],
      };
    }).filter(x => {
      // 去重：同一次结果里不重复；已存在的职业可再次作为选项（当前职业除外）
      if (seen.has(x.name) || x.name === p.cls) return false;
      seen.add(x.name);
      return true;
    }).slice(0, 6);
    if (!list.length) throw new Error("没有生成可用的职业选项，请重试（本次未扣费）");
    // 追加进本世界观职业表，选中后可直接切换
    const base = (Array.isArray(st.world.classes) && st.world.classes.length >= 3)
      ? st.world.classes.slice()
      : Object.entries(this.classes()).map(([n, c]) => Object.assign(JSON.parse(JSON.stringify(c)), { name: n }));
    for (const job of list) if (!base.some(c => c.name === job.name)) base.push(job);
    st.world.classes = base;
    st.jobRefreshCount = (Number(st.jobRefreshCount) || 0) + 1;
    p.gold = (p.gold || 0) - cost;
    this.save();
    const keywords = [
      st.world && st.world.name,
      card && card.name,
      ((st.world?.maps || []).find(m => m.id === st.currentMapId) || {}).name,
    ].filter(Boolean);
    return { cost, count: st.jobRefreshCount, nextCost: this.jobRefreshCost(), list, gold: p.gold, keywords };
  },
  /** 应用一份「自己写的世界观」分析结果（结构与角色卡世界观一致） */
  applyCustomWorld(an) {
    const st = this.state;
    if (!an) return false;
    st.world = {
      name: an.world_name || "我的世界",
      maps: Array.isArray(an.maps) && an.maps.length ? an.maps : st.world.maps,
      classes: Array.isArray(an.classes) && an.classes.length >= 3 ? an.classes : null,
      attrNames: an.attr_names && typeof an.attr_names === "object" ? an.attr_names : null,
      termNames: an.term_names && typeof an.term_names === "object" ? an.term_names : null,
      initial_gold: an.initial_gold, initial_gold_reason: an.initial_gold_reason,
      price_level: an.price_level, initial_items: an.initial_items,
    };
    st.worldSource = "custom";
    this.normalizeWorldGrid(st.world);
    this.syncClassToWorld();
    const userWb = this.worldbookEntries().filter(e => e.source !== "card");
    const newWb = (an.worldbook || []).map(e => ({ id: uid(), keys: e.keys || [], content: e.content, always: false, constant: false, selective: false, selectiveLogic: 0, order: 100, position: 1, depth: 4, enabled: true, probability: 100, group: "", source: "card", cardId: st.cardId || null, origin: "script", book: (this.activeCard() || {}).name || "角色卡" }));
    st.worldbook = [...userWb, ...newWb];
    this.save();
    return true;
  },
  /** 当前剧情角色名（剧情区显示用，不显示角色卡名） */
  currentCharName() {
    const st = this.state;
    const list = st.characters?.list || [];
    if (list.length) {
      const cur = list.find(c => c.id && c.id === st.characters?.current);
      if (cur) return cur.name;
      const first = list[0];
      if (first && first.name) return first.name;
    }
    // 第 12 条：剧情区显示剧情角色名；没有剧情角色时用通用称呼，不回退到角色卡名
    return "游戏主持人";
  },

  /** 全量导出 / 导入（含设置、卡库、存档） */
  exportAll() {
    return JSON.stringify({
      app: "openworld-rpg", ver: 1, exportedAt: Date.now(),
      state: this.state, cards: this.cards(), saves: this.slots(),
    }, null, 2);
  },
  importAll(jsonText) {
    const j = JSON.parse(jsonText);
    if (j.app !== "openworld-rpg") throw new Error("不是本应用的导出文件");
    if (j.state) store.set("state", j.state);
    if (j.cards) store.set("cards", j.cards);
    if (j.saves) store.set("saves", j.saves);
    this.load();
  },
};

</script>
<script>
/* ========== UI 渲染与交互 ========== */
"use strict";

/* ========== 调色盘 / 主题 ==========
 * 只覆盖 :root 上的 CSS 变量（写在 documentElement 的内联样式里），
 * 不写 !important，也不改任何组件选择器。
 * 因此角色卡/预设注入的卡片样式（作用域在 #page-story 内、选择器更具体）
 * 仍然优先于主题变量，主题与卡片美化互不冲突。
 */
const OWGTheme = {
  DEFAULTS: {
    bg: "#0f1220", bg2: "#161b2d", panel: "#1a2036", panel2: "#212842",
    line: "#2b3354", txt: "#e8eaf6", txt2: "#9aa3c7",
    acc: "#8b7cf6", acc2: "#a99cf9", gold: "#e8c574",
    radius: 14, shadow: 0, fontSize: 14.5, lineHeight: 1.75,
    bgImage: "", bgGrad: "", bgImageAlpha: 0.35,
  },
  VAR_MAP: {
    bg: "--bg", bg2: "--bg2", panel: "--panel", panel2: "--panel2",
    line: "--line", txt: "--txt", txt2: "--txt2",
    acc: "--acc", acc2: "--acc2", gold: "--gold",
  },
  defaults() { return Object.assign({}, this.DEFAULTS); },
  state() {
    const st = Game.state;
    if (!st.settings.theme || typeof st.settings.theme !== "object") st.settings.theme = { current: "默认", preset: {}, saved: [] };
    const t = st.settings.theme;
    if (!t.preset || typeof t.preset !== "object") t.preset = {};
    if (!Array.isArray(t.saved)) t.saved = [];
    return t;
  },
  /** 当前生效配置 = 默认值 + 已保存的 preset（缺字段自动回落默认） */
  preset() { return Object.assign(this.defaults(), this.state().preset || {}); },
  apply(cfg) {
    const base = cfg ? { ...cfg } : this.preset();
    const t = Object.assign(this.defaults(), base);
    const root = document.documentElement.style;
    Object.keys(this.VAR_MAP).forEach(k => {
      const v = String(t[k] == null ? "" : t[k]).trim();
      if (v) root.setProperty(this.VAR_MAP[k], v); else root.removeProperty(this.VAR_MAP[k]);
    });
    const n = (v, d) => { const x = Number(v); return isFinite(x) ? x : d; };
    root.setProperty("--radius", n(t.radius, 14) + "px");
    root.setProperty("--shadow-a", String(Math.max(0, Math.min(1, n(t.shadow, 0)))));
    root.setProperty("--t-fs", n(t.fontSize, 14.5) + "px");
    root.setProperty("--t-lh", String(Math.max(1, n(t.lineHeight, 1.75))));
    // 背景图 / 渐变：只作用于 #app 的 background-image，不覆盖任何卡片
    const img = String(t.bgImage || "").trim();
    const grad = String(t.bgGrad || "").trim();
    let bg = "none";
    if (img) {
      const a = Math.max(0, Math.min(1, n(t.bgImageAlpha, 0.35)));
      bg = 'linear-gradient(rgba(0,0,0,' + a + '),rgba(0,0,0,' + a + ')), url("' + img.replace(/"/g, "%22") + '")';
    } else if (grad) {
      bg = grad;
    }
    root.setProperty("--bg-image", bg);
  },
  /** 保存当前预设（每次改动即写设置，刷新/换卡都保留）；也会随 Game.save 一起落库 */
  savePreset(cfg) {
    const t = this.state();
    t.preset = Object.assign({}, cfg || {});
    Game.save();
    this.apply(t.preset);
  },
  restore() {
    const t = this.state();
    t.current = "默认";
    t.preset = {};
    Game.save();
    this.apply({});
  },
  savedList() { return this.state().saved.filter(x => x && x.name && x.cfg); },
  saveNamed(name) {
    const nm = String(name || "").trim();
    if (!nm) return false;
    const t = this.state();
    const cfg = Object.assign({}, this.preset());
    const i = t.saved.findIndex(x => x && x.name === nm);
    if (i >= 0) t.saved[i] = { name: nm, cfg }; else t.saved.push({ name: nm, cfg });
    t.current = nm;
    Game.save();
    return true;
  },
  useNamed(name) {
    const item = this.savedList().find(x => x.name === name);
    if (!item) return false;
    const t = this.state();
    t.current = name;
    t.preset = Object.assign({}, item.cfg);
    Game.save();
    this.apply(t.preset);
    return true;
  },
  deleteNamed(name) {
    const t = this.state();
    t.saved = t.saved.filter(x => x && x.name !== name);
    Game.save();
  },
  exportJSON() { return JSON.stringify({ preset: this.preset(), saved: this.savedList(), current: this.state().current }, null, 2); },
  importJSON(text) {
    let j;
    try { j = JSON.parse(String(text || "")); } catch (e) { throw new Error("JSON 解析失败：" + e.message); }
    const cfg = j && j.preset && typeof j.preset === "object" ? j.preset : (j && typeof j === "object" ? j : null);
    if (!cfg) throw new Error("未找到主题配置");
    const t = this.state();
    t.preset = Object.assign({}, cfg);
    t.current = String(j.current || "自定义");
    if (Array.isArray(j.saved)) t.saved = j.saved.filter(x => x && x.name && x.cfg).map(x => ({ name: String(x.name), cfg: Object.assign({}, x.cfg) }));
    Game.save();
    this.apply(t.preset);
  },
};

const UI = {
  tab: "world",
  statusTab: "panel",     // 状态页子页：panel | bag | chars | shop
  savesTab: "saves",      // 存档页子页：saves | cards
  mineTab: "model",       // 我的页子页：model | book | misc
  worldView: null,      // null=大地图列表, 否则为地图id
  _fileHandler: null,
  RANDOM_ACTS: ["观察四周的环境", "向附近的人打听消息", "寻找可以接取的委托或支线", "主动挑战危险", "仔细搜刮周围有用的东西", "帮助遇到麻烦的NPC", "探索一处未知的角落", "原地休息恢复状态", "检查自己的装备与行囊", "寻找隐藏的通道或秘密"],

  /* ---------- 子页签 ---------- */
  subtabsHTML(active, items) {
    return `<div class="subtabs">${items.map(([k, label]) => `<button class="subtab ${k === active ? "active" : ""}" data-sub="${k}">${label}</button>`).join("")}</div>`;
  },
  bindSubtabs(box, setter) {
    box.querySelectorAll(".subtab[data-sub]").forEach(b => b.onclick = () => setter(b.dataset.sub));
  },

  /** 物品图标 */
  itemIcon(it) {
    return { weapon: "⚔️", armor: "🛡️", accessory: "💍", consumable: "🧪", material: "📦" }[it?.type] || "🎒";
  },
  /** 效果摘要文本 */
  effText(eff, type) {
    if (!eff || !Object.keys(eff).length) return "";
    const parts = [];
    for (const [k, v] of Object.entries(eff)) {
      const nm = ["hp", "mp", "atk", "matk", "def", "spd", "crit"].includes(k) ? Game.attrName(k) : Game.termName(k) || k;
      parts.push(`${nm}${v > 0 ? "+" : ""}${v}${k === "crit" ? "%" : ""}`);
    }
    return parts.join(" ");
  },

  init() {
    Game.load();
    // 旧数据自愈：消息里残留的 base64 插图搬进图库（IndexedDB），否则会把 localStorage 顶满导致无法保存
    try {
      if (Game.slimImages) Game.slimImages().then(n => { if (n) { try { Game.hydrateImages(); } catch (e) { } } }).catch(() => { });
      if (Game.hydrateImages) Game.hydrateImages().catch(() => { });
      // 旧存档快照里内嵌的 base64 插图一并清出（图片本体在图库，仍可查看），避免存档列表继续撑爆空间
      if (Game.slimSaves) { const f = Game.slimSaves(); if (f) { try { OWGLog.add("存档", `旧存档中的 ${f} 张内嵌插图已移出快照（原图仍在图库）`, "", { lv: "提示", key: "slim:saves" }); } catch (e) { } } }
    } catch (e) { }
    // 调色盘：应用上次保存的主题（随设置持久化，刷新/换卡都保留）
    try { OWGTheme.apply(); } catch (e) { console.warn("主题应用失败", e); }
    // 全局未捕获错误由 OWGLog 统一记录（window error / unhandledrejection 已在模块加载时挂上），
    // 只在第一次出现时给一条不打扰的 toast，不再往页面顶部插红条。
    // tab 切换
    $$("#tabbar .tab").forEach(b => b.onclick = () => this.switchTab(b.dataset.tab));
    // 文件选择
    $("#file-input").onchange = (e) => {
      const f = e.target.files[0];
      e.target.value = "";
      if (f && this._fileHandler) this._fileHandler(f);
    };
    this.renderTopbar();
    this.initFnPop();
    this.switchTab("world");
    // 首次引导
    if (!store.get("seen", false)) {
      store.set("seen", true);
      this.showWelcome();
    } else if (!Game.state.player) {
      this.showOnboard();
    }
  },

  switchTab(t) {
    // 离开剧情页前记住阅读位置：页面隐藏后 scrollTop 会丢，回来时按记忆恢复
    if (this.tab === "story" && t !== "story") this._rememberStoryScroll();
    this.tab = t;
    this.worldView = t === "world" ? this.worldView : null;
    $$("#tabbar .tab").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
    $$(".page").forEach(p => p.classList.remove("active", "fade"));
    const pg = $("#page-" + t);
    pg.classList.add("active", "fade");
    if (t === "world") this._renderPage("世界页", () => this.renderWorld());
    else if (t === "status") this._renderPage("状态页", () => this.renderStatus());
    else if (t === "story") { this._restoringStory = true; this._renderPage("剧情页", () => this.renderStory()); this._restoringStory = false; }
    else if (t === "saves") this._renderPage("存档页", () => this.renderSaves());
    else if (t === "mine") this._renderPage("我的页", () => this.renderMine());
  },

  /** 页面渲染包一层：渲染异常只记日志，不影响其它页面/主流程 */
  _renderPage(label, fn) {
    try { fn(); }
    catch (e) { try { OWGLog.add("面板", label + "渲染异常", String((e && e.stack) || (e && e.message) || e)); } catch (e2) { } }
  },

  refresh() {
    this._renderPage("顶栏", () => this.renderTopbar());
    if (this.tab === "world") this._renderPage("世界页", () => this.renderWorld());
    else if (this.tab === "status") this._renderPage("状态页", () => this.renderStatus());
    else if (this.tab === "saves") this._renderPage("存档页", () => this.renderSaves());
    else if (this.tab === "mine") this._renderPage("我的页", () => this.renderMine());
  },

  apiReady() { return API.roleReady("main"); },

  renderTopbar() {
    const st = Game.state, card = Game.activeCard();
    $("#tb-world").textContent = st.world?.name || "开放世界";
    $("#tb-card").textContent = card ? `🎭 ${card.name}` : "";
    $("#tb-loc").textContent = "📍 " + Game.locNameText();
    $("#tb-lv").textContent = st.player ? Game.levelText(st.player.level) : "未创角";
  },

  /** 读档：列出本卡存档，读入后以存档剧情为准继续 */
  openLoadFlow() {
    if (!Game.state.player) { toast("请先创建角色", "err"); return; }
    const list = OWGSaves.current();
    openModal(`<h3>读档</h3>
      <p class="hint" style="margin-bottom:10px">读档会<b>作废当前剧情</b>，直接回到存档那一刻的状态继续（当前进度不会自动存档）。</p>
      ${list.length ? list.map(s => `
        <div class="save-slot ${s.auto ? "auto" : ""}" style="margin-bottom:8px">
          <div style="font-size:20px">${s.auto ? "🔄" : "💾"}</div>
          <div class="s-info">
            <div class="s-name">${escapeHtml(s.name)}${s.auto ? '<span class="tag-auto">自动</span>' : ""}</div>
            <div class="s-meta">${fmtTime(s.ts)} · ${OWGSaves.summary(s)}</div>
          </div>
          <button class="btn sm primary" data-ld="${s.id}">读入</button>
        </div>`).join("") : '<div class="empty" style="padding:16px"><span class="ee">📂</span>这张卡还没有存档，先用顶部「存档」创建</div>'}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button><button class="btn" id="ld-goto">去存档页</button></div>`);
    $("#ld-goto").onclick = () => { closeModal(); this.savesTab = "saves"; this.switchTab("saves"); this.renderSaves(); };
    $$("#modal-root [data-ld]").forEach(b => b.onclick = () => {
      const slot = Game.slots().find(s => s.id === b.dataset.ld);
      if (!slot) { toast("存档不存在", "err"); return; }
      openModal(`<h3>确认读档</h3>
        <p style="font-size:14px">将回到「${escapeHtml(slot.name)}」的剧情，<b>当前未存档的剧情会作废</b>。是否继续？</p>
        <div class="modal-actions"><button class="btn" id="ld-cancel">取消</button><button class="btn primary" id="ld-ok">读档</button></div>`);
      $("#ld-cancel").onclick = () => this.openLoadFlow();
      $("#ld-ok").onclick = () => {
        if (!Game.loadSave(slot.id)) { toast("读档失败：存档可能已损坏", "err"); return; }
        closeModal(); this.refresh(); this.switchTab("story"); this.scrollStory(true);
        toast("已读档：" + slot.name, "ok");
      };
    });
  },

  /* ================= 世界页（3×3 滑动窗口 + 时间天气传闻 + 方向移动） ================= */
  renderWorld() {
    const st = Game.state, box = $("#page-world");
    const env = st.env || { weather: "晴", weatherIcon: "☀️", rumor: "" };
    const rumors = Array.isArray(env.rumors) ? env.rumors : [];
    const rumText = rumors.length ? rumors.slice(-4).map(r => r.text).join("；") : (env.rumor || "暂无传闻");
    const curMap = Game.currentMap(), curLoc = Game.currentLoc();
    const envHtml = `
      <div class="env-bar">
        <span>🕐 ${Game.timeText()}</span>
        <span>${env.weatherIcon || "🌤️"} ${escapeHtml(env.weather || "")}</span>
        <span>🗺️ ${escapeHtml(curMap ? curMap.name : "未启程")}${curLoc ? " · " + escapeHtml(curLoc.name) : ""}</span>
      </div>
      <div class="env-rumor">📢 ${escapeHtml(rumText)}</div>
      ${env.lastChange && env.lastChange.reason ? `<div class="env-rumor">🔄 最近变化：${escapeHtml(env.lastChange.reason)}</div>` : ""}`;
    if (!this.worldView) {
      const cur = Game.currentMap();
      const cx = cur?.ax ?? 0, cy = cur?.ay ?? 0;
      const cells = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const m = Game.mapAtGrid(cx + dx, cy + dy);
        const isCenter = dx === 0 && dy === 0;
        cells.push(m ? `
          <div class="g16-cell map-cell ${isCenter ? "current" : ""}" data-id="${m.id}">
            ${isCenter ? '<span class="badge-now">所在区域</span>' : ""}
            <div class="gc-emoji">${m.emoji || "🗺️"}</div>
            <div class="gc-name">${escapeHtml(m.name)}</div>
            <div class="gc-meta">📍${m.locations.length}地点 · 点击进入</div>
          </div>` : `<div class="g16-cell empty-cell" title="点击刷新生成">🌫️<div class="gc-name">未探明·点此生成</div></div>`);
      }
      box.innerHTML = `
        ${envHtml}
        <div class="page-head"><h2>🗺️ ${escapeHtml(st.world.name)}</h2><button class="btn sm primary" id="w-refresh">⟳ 刷新</button></div>
        <p class="hint" style="margin-bottom:10px">以你所在区域为中心的 3×3 视野 · 点地图块进入其中的 16 个地点 · 跨出边界后点「⟳ 刷新」平移视野并生成新区域</p>
        <div class="grid9">${cells.join("")}</div>`;
      // 事件委托绑定（比逐个 onclick 更稳，任何环境下都不会失效）
      const grid9 = box.querySelector(".grid9");
      grid9.addEventListener("click", (e) => {
        const cell = e.target.closest(".map-cell");
        if (cell && cell.dataset.id) { this.worldView = cell.dataset.id; this.renderWorld(); return; }
        const empty = e.target.closest(".empty-cell");
        if (empty) this.refreshWorldFlow();
      });
      $("#w-refresh").onclick = () => this.refreshWorldFlow();
    } else {
      const m = Game.mapById(this.worldView);
      if (!m) { this.worldView = null; return this.renderWorld(); }
      const cur = st.currentMapId === m.id;
      const cells = [];
      for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++) {
        const l = Game.locAtGrid(m, gx, gy);
        const here = cur && st.currentLocId === l?.id;
        cells.push(l ? `
          <div class="g16-cell loc-cell ${here ? "current" : ""}" data-m="${m.id}" data-l="${l.id}">
            ${here ? '<span class="badge-now">所在</span>' : ""}
            <div class="gc-emoji">${l.emoji || "📍"}</div>
            <div class="gc-name">${escapeHtml(l.name)}</div>
            <div class="gc-desc">${escapeHtml((l.desc || "").slice(0, 8))}</div>
          </div>` : `<div class="g16-cell empty-cell">·</div>`);
      }
      box.innerHTML = `
        ${envHtml}
        <div class="page-head">
          <button class="btn sm" id="w-back">← 返回</button>
          <h2>${m.emoji} ${escapeHtml(m.name)}</h2>
        </div>
        <p class="hint" style="margin-bottom:10px">${escapeHtml(m.desc || "")}</p>
        <div class="grid16">${cells.join("")}</div>
        <div class="dpad-wrap">
          <div class="dpad">
            <span></span><button data-dir="up">↑</button><span></span>
            <button data-dir="left">←</button><span class="dpad-c">${cur ? "🧍" : "·"}</span><button data-dir="right">→</button>
            <span></span><button data-dir="down">↓</button><span></span>
          </div>
          <p class="hint" style="text-align:center">${cur ? "移动消耗时间：同图 20 分钟 / 跨区域 2 小时20分" : "先点一个地点作为当前位置，即可用方向键移动"}</p>
        </div>`;
      $("#w-back").onclick = () => { this.worldView = null; this.renderWorld(); };
      box.querySelectorAll(".loc-cell").forEach(el => el.onclick = () => this.travel(el.dataset.m, el.dataset.l));
      box.querySelectorAll(".dpad [data-dir]").forEach(b => b.onclick = () => this.moveDirFlow(b.dataset.dir));
    }
  },

  async refreshWorldFlow() {
    const btn = $("#w-refresh");
    if (btn) { btn.disabled = true; btn.textContent = "刷新中…"; }
    try {
      const r = await Game.refreshWorld();
      toast(`已刷新：${r.env.weatherIcon}${r.env.weather} · 📢${r.env.rumor.slice(0, 12)}…` + (r.added ? ` · 生成 ${r.added} 张新地图` : ""), "ok");
    } catch (e) { toast("失败：" + e.message, "err"); }
    this.renderWorld();
  },

  moveDirFlow(dir) {
    if (!Game.state.player) { this.showOnboard(); return; }
    const r = Game.moveDir(dir);
    if (!r.ok) { toast(r.msg, r.needRefresh ? "err" : ""); return; }
    Game.state.env.lastChange = {
      day: Game.state.env.day, minute: Game.state.env.minute, at: r.timeText,
      weather: Game.state.env.weather, region: r.map.name, place: r.loc.name,
      rumor: (Game.state.env.rumors || []).length ? Game.state.env.rumors[Game.state.env.rumors.length - 1].text : (Game.state.env.rumor || ""),
      reason: `手动移动：时间 +${r.costText}；地点→${r.loc.name}${r.crossed ? "；区域→" + r.map.name : ""}`,
    };
    Game.save();
    this.renderTopbar();
    this.renderWorld();
    toast(`耗时 ${r.costText} → ${r.timeText}${r.dayChanged ? "（新的一天）" : ""}`);
    if (this.apiReady()) {
      this.switchTab("story");
      const dirName = { up: "上", down: "下", left: "左", right: "右" }[dir] || "";
      const dest = r.crossed
        ? `穿过了区域边界，来到了「${r.map.name}」的「${r.loc.name}」`
        : `来到了「${r.loc.name}」${r.loc.desc ? "——" + r.loc.desc : ""}`;
      this.doSend(`（我向${dirName}移动（耗时${r.costText}，现在${r.timeText}），${dest}。请结合当前时间与天气简短描写途中所见与到达场景。）`);
    }
  },

  travel(mapId, locId) {
    const st = Game.state;
    if (!st.player) { this.showOnboard(); return; }
    const m = Game.mapById(mapId), l = m.locations.find(x => x.id === locId);
    const cost = Game.travelCost(Game.currentMap(), Game.currentLoc(), m, l);
    const t = Game.advanceTime(cost);
    Game.setLocation(mapId, locId);
    st.env.lastChange = {
      day: st.env.day, minute: st.env.minute, at: Game.timeText(),
      weather: st.env.weather, region: m.name, place: l.name,
      rumor: (st.env.rumors || []).length ? st.env.rumors[st.env.rumors.length - 1].text : (st.env.rumor || ""),
      reason: `手动前往：时间 +${cost}分；区域→${m.name}·${l.name}`,
    };
    Game.save();
    this.renderTopbar();
    this.renderWorld();
    toast(`前往 ${m.name}·${l.name}（耗时${Game.costText(cost)} → ${t.text}）`);
    if (this.apiReady()) {
      this.switchTab("story");
      this.doSend(`（我前往了「${m.name}·${l.name}」，路途耗时${Game.costText(cost)}，现在时间是${t.text}。请结合当前时间与天气描写到达时的场景与环境，并自然衔接当前剧情。）`);
    }
  },

  /* ================= 状态页（面板/背包/角色/商店 子页） ================= */
  renderStatus() {
    const st = Game.state, box = $("#page-status");

      return;

    const tabs = [["panel", "🧙 面板"], ["bag", "🎒 背包"], ["chars", "👥 角色"], ["shop", "🏪 商店"]];

        ${p.attrPoints ? `<p class="points-tip" style="margin-top:8px">体质→生命/防御 · 精神→魔力/法伤 · 力量→攻击 · 敏捷→速度/暴击（成长系数随职业变化，当前职业倾向：${Game.classInfo(p.cls).desc || "均衡"}）</p>` : ""}

      <div class="card">
        <div class="card-title">🧬 战斗属性（含装备加成）</div>
        <div class="attr-grid">
          ${Object.entries(DERIVED_META).map(([k, meta]) => {
            const bonus = Game.eqBonus(k);
            const val = (k === "hp") ? `${d.hp}<small>/${d.maxHp}</small>` : (k === "mp") ? `${d.mp}<small>/${d.maxMp}</small>` : (k === "crit") ? `${Game.effAttr(k)}%` : `${Game.effAttr(k)}${bonus ? `<small>+${bonus}</small>` : ""}`;
            return `<div class="attr-row">
              <span class="an">${meta.icon} ${Game.attrName(k)}</span>
              <span class="av">${val}</span>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="panel-duo">
        <div class="card">
          <div class="card-title">🔰 转职</div>
          <p style="font-size:13px;margin:0 0 4px"><b>${escapeHtml(Game.playerClassName(p))}</b>${p.promotions ? `<span class="hint"> · 已转职 ${p.promotions} 阶</span>` : ""}</p>
          <p class="hint" style="margin:0 0 8px">每 30 级可转职一次；进阶职业属性加成更高（当前职业加成 +${Math.round((p.promotions || 0) * 35)}%）</p>
          <button class="btn sm ${Game.canPromote(p) ? "primary" : ""}" id="promo-btn" ${Game.canPromote(p) ? "" : "disabled"}>
            ${Game.canPromote(p) ? `转职为「${Game.promoTitle((p.promotions || 0) + 1)}${escapeHtml(p.cls)}」` : (p.level < 30 ? `30 级解锁（还差 ${30 - p.level} 级）` : (p.promotions >= Game.promoCap(p) ? `本级已转职，${30 * ((p.promotions || 0) + 1)} 级再进阶` : "暂不可转职"))}
          </button>
        </div>
        <div class="card">
          <div class="card-title">👥 组队 <span class="hint">${partyMembers.length + 1}/4</span></div>
          <div class="party-slot" style="border-style:solid;border-color:var(--acc)">
            <span>🧍</span><b>${escapeHtml(p.name)}</b><span class="hint" style="margin-left:auto">队长</span>
          </div>
          ${partyMembers.map(c => `<div class="party-slot">
            <span>👤</span><b>${escapeHtml(c.name)}</b><span class="hint">${Game.levelText(c.level || 1)}</span>
            <button class="btn sm p-rm" data-party-rm="${escapeHtml(c.name)}">移出</button>
          </div>`).join("")}
          ${!(partyMembers.length >= 3) ? `<button class="btn sm" id="party-add" style="width:100%">＋ 邀请队友（最多 4 人）</button>` : `<p class="hint" style="margin:0">队伍已满（4 人），进入战斗时全员参战</p>`}
        </div>
      </div>

      <div class="card">
        <div class="card-title">🗡️ 装备 <span class="hint">点击槽位从背包更换</span></div>
        <div class="eq-grid">
          ${EQ_SLOTS.map(slot => {
            const it = eq[slot];
            if (it) OWGEquip.ensure(it, Game.state.player.level);
            const sp = it ? OWGEquip.specialText(it) : "";
            const rar = it ? OWGEquip.rarityOf(it) : null;
            return `<div class="eq-slot ${it ? "filled" : ""}" data-slot="${slot}" style="cursor:pointer" title="${escapeHtml(sp)}">
              <div class="eq-ico">${it ? SLOT_META[slot].icon : "➕"}</div>
              ${it ? `<div class="eq-name">${escapeHtml(it.name)}</div><div class="eq-bonus">${this.effText(it.effect, slot) || "无加成"}</div>
                <div class="eq-bonus" style="color:${rar.color};font-size:10.5px">${rar.name} · Lv.${it.ilvl || 1}${it.special?.length ? ` · 特效×${it.special.length}` : ""}</div>`
                   : `<div class="eq-name" style="color:var(--txt2)">空·${SLOT_META[slot].name}</div><div class="eq-bonus"></div><div class="eq-empty">点击选择装备</div>`}
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-title">✨ ${escapeHtml(Game.termName("skill"))}（${p.skills.length}） <button class="btn sm primary" id="sk-learn">＋ 学习</button></div>
        ${p.skills.length ? p.skills.map((s, i) => {
          const si = Game.skillInfo(s);
          const tag = si.passive
            ? `被动 · 常驻${si.uses != null ? ` · 每场限 ${si.uses} 次` : ""}`
            : `${si.cat} · 耗魔 ${si.cost} · 冷却 ${si.cd} 回合`;
          return `<div class="skill-item" data-skill="${i}" style="cursor:pointer">
            <div class="skill-name">◆ ${escapeHtml(s.name)} <span class="hint" style="font-weight:400">${tag}</span></div>
            <div class="skill-desc">${escapeHtml(si.fxText || s.desc || "")}</div>
            <div class="skill-desc" style="opacity:.8">目标：${si.passive ? "常驻" : OWGSkillLib.targetText(si.tgt)} · 威力 ×${si.power}${si.magic ? " · 法术" : " · 物理"}</div>
          </div>`;
        }).join("") : `<p class="hint">暂无${escapeHtml(Game.termName("skill"))}，点击「学习」获取</p>`}
      </div>

      <div class="card">
        <div class="card-title">🎭 当前状态</div>
        <div>${p.statuses.map(s => `<span class="status-chip ${/伤|毒|诅咒|衰|盲|恐|麻|冰|虚|burn/i.test(s) ? "bad" : ""}">${escapeHtml(s)}</span>`).join("")}</div>
      </div>`;
    body.querySelectorAll(".attr-plus").forEach(b => b.onclick = () => {
      if (Game.addAttr(b.dataset.k)) { this.renderStatus(); this.renderTopbar(); }
    });
    body.querySelectorAll("[data-uneq]").forEach(b => b.onclick = () => {
      if (Game.unequipSlot(b.dataset.uneq)) { this.renderStatus(); toast("已卸下"); }
    });
    // 点击装备槽 → 从背包更换
    body.querySelectorAll(".eq-slot[data-slot]").forEach(el => el.onclick = () => this.showEquipPicker(el.dataset.slot));
    // 技能点击查看 / 学习
    body.querySelectorAll("[data-skill]").forEach(el => el.onclick = () => {
      const s = p.skills[+el.dataset.skill];
      if (s) {
        const si = Game.skillInfo(s);
        openModal(`<h3>✨ ${escapeHtml(s.name)}</h3>
          <div class="ana-block"><p>${escapeHtml(si.fxText || s.desc || "")}</p></div>
          <div class="attr-grid" style="grid-template-columns:1fr 1fr">
            <div class="attr-row"><span class="an">类型</span><span class="av">${si.passive ? "被动" : si.cat}</span></div>
            <div class="attr-row"><span class="an">耗魔</span><span class="av">${si.passive ? "0（常驻）" : si.cost}</span></div>
            <div class="attr-row"><span class="an">威力</span><span class="av">×${si.power}</span></div>
            <div class="attr-row"><span class="an">伤害类型</span><span class="av">${si.magic ? "法术" : "物理"}</span></div>
            <div class="attr-row"><span class="an">目标</span><span class="av">${si.passive ? "自身常驻" : OWGSkillLib.targetText(si.tgt)}</span></div>
            <div class="attr-row"><span class="an">冷却</span><span class="av">${si.passive ? "无" : (si.cd ? si.cd + " 回合" : "无")}</span></div>
            <div class="attr-row"><span class="an">每场限次</span><span class="av">${si.uses != null ? si.uses + " 次" : "不限"}</span></div>
            <div class="attr-row"><span class="an">效果</span><span class="av" style="font-size:12px">${escapeHtml(si.desc || "")}</span></div>
          </div>
          <p class="hint" style="margin-top:8px">主动技能使用后进入冷却，按回合递减；冷却中不可再次使用。被动技能常驻生效，标有限次的被动每场战斗只触发指定次数。</p>
          <div class="modal-actions"><button class="btn primary" onclick="closeModal()">关闭</button></div>`);
      }
    });
    const learnBtn = $("#sk-learn");
    if (learnBtn) learnBtn.onclick = () => this.showLearnSkills();
    const promoBtn = $("#promo-btn");
    if (promoBtn) promoBtn.onclick = () => {
      const p2 = Game.state.player;
      const next = Game.promoTitle((p2.promotions || 0) + 1) + p2.cls;
      openModal(`<h3>🔰 转职</h3>
        <p style="font-size:14px">转职为 <b>${escapeHtml(next)}</b>：职业属性加成提升 35%（可叠加），并获得 6 点属性点。</p>
        <p class="hint">生命/魔力会回满。</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">再看看</button><button class="btn primary" id="promo-ok">确认转职</button></div>`);
      $("#promo-ok").onclick = () => {
        if (Game.promote()) {
          closeModal(); this.renderStatus(); this.renderTopbar();
          toast(`转职成功：${Game.playerClassName()}`, "ok");
        } else { toast("当前不可转职", "err"); closeModal(); }
      };
    };
    const partyAdd = $("#party-add");
    if (partyAdd) partyAdd.onclick = () => this.showPartyPicker();
    const jobBtn = $("#job-refresh");
    if (jobBtn) jobBtn.onclick = () => this.showJobRefreshConfirm();
    body.querySelectorAll("[data-party-rm]").forEach(b => b.onclick = () => {
      Game.removeParty(b.dataset.partyRm); this.renderStatus(); toast("已移出队伍");
    });
    const stRename = $("#st-rename");
    if (stRename) stRename.onclick = () => this.renameFlow();
    const stRef = $("#st-refresh");
    if (stRef) stRef.onclick = async () => {
      stRef.disabled = true; stRef.textContent = "…";
      try {
        const r = await Game.refreshStatus();
        toast(`状态已刷新：${r.statuses.join("、")}${r.note ? "（" + r.note + "）" : ""}`, "ok");
      } catch (e) { toast("失败：" + e.message, "err"); }
      this.renderStatus();
    };
  },

  /* ---------- 刷新职业：确认 → 生成 → 选择 ---------- */
  showJobRefreshConfirm() {
    const p = Game.state.player;
    const cost = Game.jobRefreshCost();
    if ((p.gold || 0) < cost) {
      toast(`金币不足：本次刷新需要 ${cost} ${Game.termName("gold")}，当前只有 ${p.gold}`, "err");
      return;
    }
    openModal(`<h3>🔄 刷新职业</h3>
      <p style="font-size:14px">本次刷新消耗 <b style="color:var(--gold)">${cost} ${escapeHtml(Game.termName("gold"))}</b>，将重新读取当前世界观、角色卡设定与最近剧情，生成若干可转职职业。</p>
      <p class="hint">本档已刷新 ${Game.state.jobRefreshCount || 0} 次；每次刷新后价格翻倍（100 → 200 → 400 …）。</p>
      <p class="hint">扣费规则：点击「开始刷新」即扣费；生成后选择新职业立即生效；放弃选择则保留原职业，费用不退还。</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn gold" id="jr-go">开始刷新（${cost}）</button></div>`);
    $("#jr-go").onclick = async () => {
      openModal(`<h3>🔄 刷新职业</h3><div class="loading-dots">正在读取世界观与最近剧情，生成职业选项…</div>`, { closable: false });
      let r;
      try { r = await Game.refreshCareerOptions(); }
      catch (e) {
        const msg = String((e && e.message) || e);
        openModal(`<h3>🔄 刷新职业</h3><p style="font-size:14px;color:var(--red)">刷新失败：${escapeHtml(msg)}</p>
          <p class="hint">本次未扣费，可稍后重试。</p>
          <div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>`);
        toast("刷新失败：" + msg, "err");
        return;
      }
      this.renderStatus(); this.renderTopbar();
      this.showJobOptions(r);
    };
  },
  showJobOptions(r) {
    openModal(`<h3>🔄 刷新职业 · 选择新职业</h3>
      <p class="hint" style="margin-bottom:10px">已扣 ${r.cost} ${escapeHtml(Game.termName("gold"))}，剩余 ${r.gold}；本档已刷新 ${r.count} 次，下次需要 ${r.nextCost}。生成依据：${escapeHtml((r.keywords || []).join(" / ") || "当前世界观")}</p>
      ${r.list.map(j => `
        <div class="bag-item" style="align-items:flex-start">
          <div class="bag-ico">${escapeHtml(j.icon)}</div>
          <div class="bag-info">
            <div class="bag-name">${escapeHtml(j.name)}${j.tier ? `<span class="hint" style="font-weight:400"> · ${escapeHtml(j.tier)}</span>` : ""}</div>
            <div class="bag-desc">${escapeHtml(j.desc || "")}</div>
            <div class="bag-desc">属性倾向：体质 ${j.attrs.hp}（生命/防御）· 精神 ${j.attrs.int}（魔力/法伤）· 力量 ${j.attrs.atk}（物攻）· 敏捷 ${j.attrs.luk}（速度/暴击）</div>
            ${j.growth ? `<div class="bag-desc" style="color:var(--gold)">成长加成：${escapeHtml(j.growth)}</div>` : ""}
            ${j.advFrom ? `<div class="bag-desc">进阶关系：${escapeHtml(j.advFrom)}</div>` : ""}
          </div>
          <button class="btn sm primary" data-job="${escapeHtml(j.name)}">选择</button>
        </div>`).join("")}
      <div class="modal-actions"><button class="btn" id="jr-skip">放弃（保留原职业）</button></div>`);
    const skip = $("#jr-skip");
    if (skip) skip.onclick = () => { closeModal(); toast(`已保留原职业「${Game.playerClassName()}」，本次刷新费用不退`, ""); };
    $$("#modal-root [data-job]").forEach(b => b.onclick = () => {
      const name = b.dataset.job;
      if (Game.setPlayerClass(name, true)) {
        closeModal(); this.renderStatus(); this.renderTopbar();
        toast(`已转职为「${name}」：属性、成长与面板已同步`, "ok");
      } else toast("切换失败：职业不存在", "err");
    });
  },

  /** 装备槽换装：从背包里该类型物品中选择 */
  showEquipPicker(slot) {
    const p = Game.state.player;
    const cur = p.equipment[slot];
    const bagItems = p.items.filter(i => i.type === slot && i.count > 0);
    openModal(`
      <h3>${SLOT_META[slot].icon} 更换${SLOT_META[slot].name}</h3>
      ${cur ? (() => { OWGEquip.ensure(cur, p.level); const r = OWGEquip.rarityOf(cur); return `<div class="ana-block"><h4>当前穿戴 · <span style="color:${r.color}">${r.name} Lv.${cur.ilvl || 1}</span></h4><p>${escapeHtml(cur.name)}${this.effText(cur.effect, slot) ? " · " + this.effText(cur.effect, slot) : ""}</p>
        ${cur.special?.length ? `<p style="margin-top:6px;color:var(--gold);font-size:12px">特效：${escapeHtml(OWGEquip.specialText(cur))}</p>` : `<p class="hint" style="margin-top:4px">无特殊效果（普通品质）</p>`}</div>`; })() : ""}
      ${cur ? `<div class="modal-actions" style="margin:0 0 10px"><button class="btn sm" id="ep-uneq">卸下（放回背包）</button></div>` : ""}
      ${bagItems.length ? bagItems.map((it, i) => { OWGEquip.ensure(it, p.level); const r = OWGEquip.rarityOf(it); const sp = OWGEquip.specialText(it); return `
        <div class="bag-item" style="margin-bottom:8px">
          <div class="bag-ico">${this.itemIcon(it)}</div>
          <div class="bag-info">
            <div class="bag-name">${escapeHtml(it.name)}<span class="cnt">×${it.count}</span> <span class="hint" style="color:${r.color};font-size:10.5px">${r.name} Lv.${it.ilvl}</span></div>
            <div class="bag-desc">${this.effText(it.effect, slot) || it.desc || ""}</div>
            ${sp ? `<div class="bag-desc" style="color:var(--gold);font-size:11px">特效：${escapeHtml(sp)}</div>` : ""}
          </div>
          <button class="btn sm primary" data-ep="${escapeHtml(it.name)}">装备</button>
        </div>`; }).join("") : `<div class="empty" style="padding:16px"><span class="ee">🎒</span>背包里没有可用的${SLOT_META[slot].name}，去商店买或冒险获取</div>`}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>`);
    const un = $("#ep-uneq");
    if (un) un.onclick = () => { Game.unequipSlot(slot); closeModal(); this.renderStatus(); toast("已卸下"); };
    $$("#modal-root [data-ep]").forEach(b => b.onclick = () => {
      const name = b.dataset.ep;
      if (Game.equipItem(name)) {
        closeModal(); this.renderStatus(); this.renderTopbar();
        toast(`已装备「${name}」${cur ? "，原装备放回背包" : ""}`, "ok");
      }
    });
  },

  /** 学习新技能：AI 生成候选（消耗金币） */
  async showLearnSkills() {
    const p = Game.state.player;
    const md = openModal(`<h3>✨ 学习${escapeHtml(Game.termName("skill"))}</h3><div class="loading-dots">AI 正在根据世界观设计可学技能…</div>`, { closable: false });
    let list;
    try { list = await Game.generateLearnableSkills(); }
    catch (e) { closeModal(); toast("失败：" + e.message, "err"); return; }
    openModal(`
      <h3>✨ 学习${escapeHtml(Game.termName("skill"))}</h3>
      <p class="hint" style="margin-bottom:10px">由 AI 根据当前世界观、你的职业与等级设计 · 当前${escapeHtml(Game.termName("gold"))} ${p.gold}</p>
      ${list.map((s, i) => `
        <div class="bag-item">
          <div class="bag-ico">✨</div>
          <div class="bag-info">
            <div class="bag-name">${escapeHtml(s.name)}</div>
            <div class="bag-desc">${escapeHtml(s.desc)}</div>
            <div class="bag-desc">耗魔 ${s.mpCost} · 威力 ×${s.power} · ${s.magic ? "法术" : "物理"}</div>
          </div>
          <button class="btn sm ${p.gold >= s.cost ? "gold" : ""}" data-ls="${i}">${s.cost}${escapeHtml(Game.termName("gold"))}</button>
        </div>`).join("")}
      <div class="modal-actions"><button class="btn" id="ls-reroll">🔄 换一批</button><button class="btn primary" onclick="closeModal()">关闭</button></div>`);
    $("#ls-reroll").onclick = () => this.showLearnSkills();
    $$("#modal-root [data-ls]").forEach(b => b.onclick = () => {
      const s = list[+b.dataset.ls];
      if (Game.learnSkill(s)) {
        closeModal(); this.renderStatus(); this.renderTopbar();
        toast(`已学会「${s.name}」（花费 ${s.cost}${Game.termName("gold")}）`, "ok");
      } else {
        const chk = Game.checkFunds(s.cost);
        toast(`金币不足（需要 ${chk.need}，现有 ${chk.have}）`, "err");
      }
    });
  },

  /* ---------- 状态·背包 ---------- */
  renderStatusBag(body) {
    const p = Game.state.player;
    body.innerHTML = `
      <div class="card">
        <div class="card-title">🎒 行囊 <span class="gold-line" style="font-weight:700">${Game.termName("gold")} ${p.gold}</span></div>
        <p class="hint" style="margin-bottom:10px">消耗品可使用；装备类可穿上（加成实时生效）；任何物品都可卖出（半价）。</p>
        ${p.items.length ? p.items.map((it, i) => `
          <div class="bag-item">
            <div class="bag-ico">${this.itemIcon(it)}</div>
            <div class="bag-info">
              <div class="bag-name">${escapeHtml(it.name)}<span class="cnt">×${it.count}</span>${it.type ? `<span class="shop-type">${ITEM_TYPE_NAMES[it.type] || ""}</span>` : ""}</div>
              <div class="bag-desc">${(() => { const info = Game.itemEffectInfo(it.name); const eff = info && info.effect ? this.effText(info.effect, it.type) : ""; const note = info && info.guessed ? "（按名称推断）" : ""; return eff ? eff + note : (it.desc || (it.price ? `价值 ${it.price}` : "冒险中获得")); })()}</div>
            </div>
            <div class="bag-acts">
              ${EQ_SLOTS.includes(it.type) ? `<button class="btn sm primary" data-eq="${i}">装备</button>` : ""}
              ${(!it.type || it.type === "consumable") ? `<button class="btn sm" data-use="${i}">使用</button>` : ""}
              <button class="btn sm" data-sell="${i}">卖出</button>
            </div>
          </div>`).join("") : '<div class="empty" style="padding:16px"><span class="ee">🎒</span>行囊空空</div>'}
      </div>`;
    body.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => {
      const it = p.items[+b.dataset.eq];
      if (it && Game.equipItem(it.name)) { this.renderStatus(); this.renderTopbar(); toast(`已装备「${it.name}」`, "ok"); }
    });
    body.querySelectorAll("[data-use]").forEach(b => b.onclick = () => {
      const it = p.items[+b.dataset.use];
      if (it) this.useItemFlow(it.name);
    });
    body.querySelectorAll("[data-sell]").forEach(b => b.onclick = () => {
      const it = p.items[+b.dataset.sell];
      if (!it) return;
      const got = Game.sellItem(it.name);
      if (got != null) { this.renderStatus(); this.renderTopbar(); toast(`卖出「${it.name}」 +${got} ${Game.termName("gold")}`, "ok"); }
    });
  },

  useItemFlow(name) {
    const r = Game.useItem(name);
    if (r.applied) {
      toast(`使用「${name}」：${r.log.join("，")}`, "ok");
      if (r.levelUp) this.showLevelUp(r.levelUp);
      this.renderStatus(); this.renderTopbar();
    } else if (r.toStory) {

  /* ================= 剧情页 ================= */
  renderStory(opts = {}) {
    const st = Game.state, box = $("#page-story");
    // 重绘会重建 #story-scroll（scrollTop 归零），先记录用户当前阅读位置
    const prevSc = $("#story-scroll");
    const prev = (this._restoringStory
      ? (this._loadStoryScroll() || { top: 0, atBottom: true })
      : (prevSc && prevSc.clientHeight > 0)
        ? { top: prevSc.scrollTop, atBottom: this._nearBottom(prevSc) }
        : (this._loadStoryScroll() || { top: 0, atBottom: true }));
    if (!st.player) {
      box.innerHTML = `<div class="story-scroll" id="story-scroll"><div id="chat" class="chat" data-owg-chat="1"><div class="empty" style="padding-top:80px"><span class="ee">📖</span>创建角色后开启你的冒险<br><br><button class="btn primary" id="sy-create">创建角色</button></div></div></div>`;
      $("#sy-create").onclick = () => this.showOnboard();
      return;
    }
    const card = Game.activeCard();
    const banners = [];
    if (!this.apiReady()) banners.push(`<div class="story-banner">⚠️ 尚未配置 API 或模型，无法推进剧情。<a id="sy-goapi">去「我的」页配置 →</a></div>`);
    if (st.battle && Game.isBattleActive()) {
      const bt = st.battle;
      const btLabel = bt.status === "fighting" ? `⚔️ 对战进行中 · 第 ${bt.round || 1} 回合`
        : "⚔️ 战斗准备中（敌人还没安排好，可进面板重试）";
      banners.push(`<div class="story-banner">${btLabel}<button class="btn sm primary" id="sy-battle" style="margin-left:8px">进入对战面板</button></div>`);
    }
    box.innerHTML = `
      ${banners.join("")}
      <div class="story-scroll" id="story-scroll"><div id="chat" class="chat" data-owg-chat="1">${st.messages.length ? st.messages.map((m, i) => this.msgHTML(m, i)).join("") : '<div class="empty"><span class="ee">📜</span>冒险尚未开始<br>输入行动，或前往「世界」选择地点启程</div>'}</div></div>
      <div class="story-input">
        <div class="fn-pop" id="fn-pop" hidden>
          <div class="fn-pop-head"><span>🧰 功能合集</span><button class="fn-pop-close" id="fn-pop-close" title="关闭">✕</button></div>
          <div class="fn-pop-body" id="fn-pop-body"></div>
        </div>
        <div class="si-tools" id="si-tools">
          <button class="si-tool" id="si-funcset" title="功能合集"><span class="ico">🧰</span>功能</button>
          <button class="si-tool" data-act="continue" title="继续推进剧情"><span class="ico">➡️</span>继续</button>
          <button class="si-tool" data-act="reroll" title="重写上一条"><span class="ico">🔁</span>重写</button>
          <button class="si-tool" data-act="random" title="随机一个行动"><span class="ico">🎲</span>随机</button>
          <button class="si-tool" data-act="memory" title="查看/整理前情记忆"><span class="ico">🧠</span>记忆${st.memory ? "✓" : ""}</button>
          <button class="si-tool" data-act="len" title="设置剧情长度"><span class="ico">✏️</span>${st.settings.storyLength}字</button>
          <button class="si-tool" data-act="battle" title="进入对战"><span class="ico">⚔️</span>对战</button>
          <button class="si-tool" data-act="spar" title="与角色切磋"><span class="ico">🤝</span>切磋</button>
        </div>
        <div class="si-row">
          <textarea id="story-text" rows="1" placeholder="输入你的行动…"></textarea>
          <button class="btn primary" id="story-send">发送</button>
        </div>
      </div>`;

    const ta = $("#story-text");
    ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(110, ta.scrollHeight) + "px"; };
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 720) { e.preventDefault(); send(); } };
    const syGo = $("#sy-goapi"); if (syGo) syGo.onclick = () => this.switchTab("mine");
    const syBattle = $("#sy-battle"); if (syBattle) syBattle.onclick = () => this.openBattle([]);
    box.querySelectorAll("[data-zoom]").forEach(el => el.onclick = () => OWGImage.open(el.getAttribute("src")));
    box.querySelectorAll("[data-st-retry-img]").forEach(b => b.onclick = (e) => { e.stopPropagation(); Game.retryMessageImage(b.dataset.stRetryImg, b.dataset.imgIdx != null ? +b.dataset.imgIdx : null); });
    // 消息内联脚本：只有开启「允许脚本」时才执行（默认关闭，不执行任意脚本）
    try { OWGRich.runScripts($("#story-scroll") || box); } catch (e) { console.warn("消息脚本执行失败", e); }
    // 剧情里渲染出的 AI 卡片：禁止真实提交/跳转，按钮改为走正常发送流程
    if (!box.__stFormGuard) {
      box.__stFormGuard = true;
      box.addEventListener("submit", (e) => e.preventDefault(), true);
      box.addEventListener("click", (e) => {
        const b = e.target && e.target.closest ? e.target.closest(".st-rich button") : null;
        if (!b) return;
        e.preventDefault();
        e.stopPropagation();
        this.cardAction(b);
      }, true);
    }

    box.querySelectorAll("[data-st-menu]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.openMsgMenu(+b.dataset.stMenu); });
    box.querySelectorAll("[data-st-edit]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.editMsg(+b.dataset.stEdit); });
    box.querySelectorAll("[data-st-rollback]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.rollbackTo(+b.dataset.stRollback); });
    box.querySelectorAll("[data-st-del]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.deleteMsg(+b.dataset.stDel); });
    const send = () => {
      const t = ta.value.trim();
      if (!t) return;
      ta.value = ""; ta.style.height = "auto";
      this.doSend(t);
    };
    $("#story-send").onclick = () => { Game.generating ? Game.stopGenerate() : send(); };
    const fset = $("#si-funcset"); if (fset) fset.onclick = () => this.showFuncSet();
    this.initFnPop();
    box.querySelectorAll(".si-tools .si-tool[data-act]").forEach(b => b.onclick = () => {
      const act = b.dataset.act;
      if (act === "continue") this.doSend("（请继续推进剧情）");
      else if (act === "reroll") this.doReroll();
      else if (act === "random") this.doSend("我" + this.RANDOM_ACTS[Math.floor(Math.random() * this.RANDOM_ACTS.length)] + "。");
      else if (act === "memory") this.showMemoryModal();
      else if (act === "len") this.showLenPicker();
      else if (act === "battle") this.openBattle([]);
      else if (act === "spar") this.openSparFlow();
    });

    // 重绘后恢复阅读位置：显式 follow 优先；否则原本在底部附近才跟随，上翻过就保持原位
    const sc = $("#story-scroll");
    if (sc) {
      const follow = opts.follow === true ? true : opts.follow === false ? false : prev.atBottom;
      sc.scrollTop = follow ? sc.scrollHeight : Math.min(prev.top, sc.scrollHeight);
      sc.onscroll = () => this._rememberStoryScroll();
      this._rememberStoryScroll();
    }
  },

  /** 剧情消息（图二式排版）：头像+标题小行 / 右上编号与操作 / 扁平正文段落 / 居中插图块 */
  msgHTML(m, idx) {
    const card = Game.activeCard();
    if (m.role === "sys") return `<div class="msg sys"><div class="m-text">${escapeHtml(m.content)}</div></div>`;
    const isUser = m.role === "user";
    const no = Number.isInteger(idx) ? idx : 0;
    const name = isUser ? (Game.state.player?.name || "你") : Game.currentCharName();
    const avatar = isUser ? "" : (card?.avatar ? `style="background-image:url(${card.avatar})"` : "");
    const avatarTxt = isUser ? "🧍" : (card?.avatar ? "" : "🎴");
    const shown = m.content;
    const time = m.ts ? this.storyTimeText(m.ts) : "";
    // 插图：多图按锚点插进正文对应段落后；旧消息仍走单图末尾
    const slots = Array.isArray(m.imageList) ? m.imageList : null;
    // 单条正文渲染：卡自带正则/代码总开关/单条「显示源码」统一在这里决定
    const rcfg = OWGRender.settings();
    const showRaw = !!m.raw || rcfg.code === false;
    const scriptsOn = rcfg.scripts === true;
    let body;
    if (m.html) {
      let htmlSrc = m.html;
      if (showRaw) {
        body = `<pre class="story-code">${escapeHtml(htmlSrc)}</pre>`;
      } else {
        body = OWGRich.scopeStyleTags(scriptsOn ? htmlSrc : OWGRich.stripScripts(htmlSrc));
      }
    } else if (showRaw) {
      body = OWGRender.plainHTML(shown);
    } else {
      let extraScripts = "";
      let textSrc = shown;
      if (scriptsOn) {
        textSrc = String(shown).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, (s0) => { extraScripts += s0; return ""; });
      }
      body = OWGRender.toHTML(textSrc) + extraScripts;
    }
    body = this.injectFigures(body, m, slots);
    return `<div class="msg st-msg mes ${isUser ? "user" : ""}" mesid="${no}" is_user="${isUser ? "true" : "false"}" data-mid="${no}" data-midid="${escapeHtml(m.id || "")}">
      <div class="st-card mes_block">
        <div class="st-meta">
          <div class="st-ava" ${avatar || ""}>${avatarTxt}</div>
          <div class="st-name">${escapeHtml(name)}</div>
          <div class="st-idx2">#${no}</div>
          ${time ? `<div class="st-time2">· ${time}</div>` : ""}
          <div class="st-tools">
            <button class="st-tool" data-st-rollback="${no}" title="回退到此条（之后的剧情作废）">回退</button>
            <button class="st-tool danger" data-st-del="${no}" title="删除这条">删除</button>
            <button class="st-tool" data-st-menu="${no}" title="更多">⋯</button>
            <button class="st-tool" data-st-edit="${no}" title="编辑这条">✎</button>
          </div>
        </div>
        <div class="m-text st-body mes_text">${body}</div>
        ${m.reasoning ? `<details class="st-think"${OWGRender.settings().showReasoning ? " open" : ""}><summary>🧠 思考过程 · 后台记录（不进入正文）</summary><pre class="st-think-body">${escapeHtml(m.reasoning)}</pre></details>` : ""}
        ${m.wordCount ? `<div class="m-words">正文 ${m.wordCount} 字${m.shortHint ? " · " + escapeHtml(m.shortHint) : ""}</div>` : ""}
        ${m.delta && m.delta.length ? `<div class="delta-chips">${m.delta.map(d => `<span class="d-chip ${d.neg ? "neg" : d.t === "gold" ? "gold" : ""}">${escapeHtml(d.txt)}</span>`).join("")}</div>` : ""}
      </div>
    </div>`;
  },

  /** 单张插图 HTML：已完成 / 生成中 / 失败（失败可单张重试） */
  figHTML(m, slot, i, total) {
    const src = slot
      ? (slot.ref ? (Game.imgCache.get(String(slot.ref)) || "") : (slot.data || ""))
      : ((typeof Game.imgSrc === "function") ? Game.imgSrc(m) : (m.image || ""));
    const label = total > 1 ? `第 ${i + 1}/${total} 幅` : "";
    if (src) {
      return `<figure class="st-figure"><div class="st-fig-box"><img class="st-fig-img" src="${src}" alt="剧情插图" data-zoom="1"></div><figcaption class="st-fig-cap">${label ? label + " · " : ""}点击放大查看</figcaption></figure>`;
    }
    if (slot) {
      if (slot.state === "error") {
        return `<figure class="st-figure"><div class="st-fig-ph err"><div class="ph-t">🎨 ${label || "插图"}生成失败</div><div class="ph-hint">${escapeHtml(slot.error || "")}</div><button class="btn sm" data-st-retry-img="${escapeHtml(m.id || "")}" data-img-idx="${i}">重试这一张</button></div></figure>`;
      }
      if (slot.state === "pending") {
        return `<figure class="st-figure"><div class="st-fig-ph"><div class="ph-spin"></div><div class="ph-t">🎨 正在生成${label ? " " + label : ""}…</div><div class="ph-hint">可以继续发消息，完成后自动落到这一段后面</div></div></figure>`;
      }
      return "";
    }
    if (m.imageState === "error") {
      return `<figure class="st-figure"><div class="st-fig-ph err"><div class="ph-t">🎨 插图生成失败</div><div class="ph-hint">${escapeHtml(m.imageError || "")}</div><button class="btn sm" data-st-retry-img="${escapeHtml(m.id || "")}">重试生图</button></div></figure>`;
    }
    if (m.imageState === "pending") {
      return `<figure class="st-figure"><div class="st-fig-ph"><div class="ph-spin"></div><div class="ph-t">🎨 正在生成插图…</div><div class="ph-hint">可以继续发消息，完成后自动落到这条</div></div></figure>`;
    }
    return "";
  },

  /** 把插图按锚点插到对应段落后；锚点匹配失败按均匀分布落位，最后才退化为末尾 */
  injectFigures(bodyHTML, m, slots) {
    if (!slots || !slots.length) return String(bodyHTML || "") + this.figHTML(m, null, 0, 1);
    const tpl = document.createElement("template");
    tpl.innerHTML = String(bodyHTML || "");
    const root = tpl.content;
    const blocks = Array.from(root.children).filter(el => /^(P|DIV|BLOCKQUOTE|LI|H[1-6]|PRE)$/.test(el.tagName));
    const strip = s => String(s || "").replace(/[\s，。！？、；：""''《》（）…—·,.!?;:"'()\[\]]/g, "");
    const used = new Set();
    const loose = [];
    slots.forEach((slot, i) => {
      const fig = this.figHTML(m, slot, i, slots.length);
      if (!fig) return;
      let target = -1;
      const a = strip(String(slot.anchor || "").slice(0, 20));
      if (a) {
        for (let k = 0; k < blocks.length; k++) {
          if (!used.has(k) && strip(blocks[k].textContent).indexOf(a) >= 0) { target = k; break; }
        }
      }
      if (target < 0 && blocks.length) {
        const want = Math.min(blocks.length - 1, Math.round((i + 0.5) * blocks.length / slots.length) - 1);
        for (let d = 0; d <= blocks.length && target < 0; d++) {
          for (const k of [want - d, want + d]) {
            if (k >= 0 && k < blocks.length && !used.has(k)) { target = k; break; }
          }
        }
      }
      if (target >= 0) { used.add(target); blocks[target].insertAdjacentHTML("afterend", fig); }
      else loose.push(fig);
    });
    return tpl.innerHTML + loose.join("");
  },

  /** 后台生图完成后，只替换对应那条消息的节点（按稳定 id 定位，不错位、不动滚动） */
  patchMessageImage(msgId) {
    const st = Game.state;
    const idx = st.messages.findIndex(m => m && m.id === msgId);
    if (idx < 0) return;
    const old = document.querySelector('#story-scroll .st-msg[data-midid="' + String(msgId) + '"]');
    if (!old) return;
    const wrap = document.createElement("div");
    wrap.innerHTML = this.msgHTML(st.messages[idx], idx);
    const neu = wrap.firstElementChild;
    if (!neu) return;
    old.parentNode.replaceChild(neu, old);
    neu.querySelectorAll("[data-zoom]").forEach(el => el.onclick = () => OWGImage.open(el.getAttribute("src")));
    neu.querySelectorAll("[data-st-retry-img]").forEach(b => b.onclick = (e) => { e.stopPropagation(); Game.retryMessageImage(b.dataset.stRetryImg, b.dataset.imgIdx != null ? +b.dataset.imgIdx : null); });
    neu.querySelectorAll("[data-st-menu]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.openMsgMenu(+b.dataset.stMenu); });
    neu.querySelectorAll("[data-st-edit]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.editMsg(+b.dataset.stEdit); });
    neu.querySelectorAll("[data-st-rollback]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.rollbackTo(+b.dataset.stRollback); });
    neu.querySelectorAll("[data-st-del]").forEach(b => b.onclick = (e) => { e.stopPropagation(); this.deleteMsg(+b.dataset.stDel); });
    try { OWGRich.runScripts(neu); } catch (e) { }
  },

  /** 时间戳：2026年11月6日 1:49 */
  storyTimeText(ts) {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${p(d.getMinutes())}`;
  },

  /** 回退：保留到该条为止，之后的剧情作废（先自动存档，可反悔读回） */
  rollbackTo(idx) {
    const st = Game.state;
    if (!st.messages[idx]) return;
    const after = st.messages.length - idx - 1;
    if (!after) { toast("这已经是最新一条剧情", "ok"); return; }
    openModal(`<h3>回退到第 ${idx} 条</h3>
      <p style="font-size:14px">这之后的 <b>${after}</b> 条剧情会作废，剧情进度回到这一条。当前进度会先写入自动存档，读档即可恢复。</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="rb-ok">回退</button></div>`);
    $("#rb-ok").onclick = () => {
      Game.createSave(null, true);
      st.messages = st.messages.slice(0, idx + 1);
      if ((st.memoryUpto || 0) > st.messages.length) { st.memory = ""; st.memoryUpto = 0; st.memoryCardId = st.cardId || null; }
      st.memoryUpto = Math.min(st.memoryUpto || 0, st.messages.length);
      Game.syncSceneFromHistory();
      Game.save(); closeModal(); this.renderStory();
      toast(`已回退，之后 ${after} 条剧情作废`, "ok");
    };
  },

  deleteMsg(idx) {
    const st = Game.state;
    const m = st.messages[idx];
    if (!m) return;
    openModal(`<h3>删除这条</h3>

      st.memoryUpto = Math.min(st.memoryUpto || 0, st.messages.length);

  /** ✎ 编辑单条消息正文 */
  editMsg(idx) {

    if (!m) return;
    openModal(`<h3>编辑第 ${idx} 条</h3>
      <p class="hint">直接改正文。改完点保存即可，剧情上下文不会重跑。</p>

  /** 右缘浮动按钮：重绘上一条插图（后台排队，不阻塞输入） */
  fabRedrawImage() {
    const st = Game.state;
    if (!st.settings.image || !st.settings.image.enabled) { toast("还没开剧情插图：我的 → ⚙️ 设置 → 剧情插图", "err"); return; }
    let idx = -1;
    for (let i = st.messages.length - 1; i >= 0; i--) if (st.messages[i].role === "assistant") { idx = i; break; }
    if (idx < 0) { toast("还没有剧情内容可以配图", "err"); return; }
    const m = st.messages[idx];
    if (!m.id) m.id = Game.newMsgId();
    m.imageState = "pending";
    delete m.imageError;
    m.imageList = [];
    Game.save();
    this.patchMessageImage(m.id);
    Game.enqueueStoryImage(m.id, m.content || "", m.scene || st.scene, st.cardId, clamp(st.settings.image.count || 1, 1, 6));
    toast("已加入生图队列，可继续操作", "ok");
  },

  showFuncSet() { this.openFnPop(); },

  /** 在按钮行原位展开功能列表 */
  openFnPop() {
    const pop = $("#fn-pop"), body = $("#fn-pop-body");
    if (!pop || !body) return;
    body.innerHTML = this.fnSetHTML();
    this.bindFnSet();
    pop.hidden = false;
    const btn = $("#si-funcset");
    if (btn) btn.classList.add("active");
  },

  /** 关闭即收起：列表隐藏，不保留任何悬浮层 */
  closeFnPop() {
    const pop = $("#fn-pop");
    if (pop) pop.hidden = true;
    const btn = $("#si-funcset");
    if (btn) btn.classList.remove("active");
  },

  /** 绑定关闭按钮与点外收起（每次剧情页重渲染后调用，文档级监听只装一次） */
  initFnPop() {
    const close = $("#fn-pop-close");
    if (close) close.onclick = () => this.closeFnPop();
    if (this._fnPopOutsideBound) return;
    this._fnPopOutsideBound = true;
    document.addEventListener("pointerdown", (e) => {
      const pop = $("#fn-pop");
      if (!pop || pop.hidden) return;
      if (pop.contains(e.target)) return;
      if (e.target.closest && e.target.closest("#si-funcset")) return;
      this.closeFnPop();
    }, true);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") this.closeFnPop(); });
  },

  bindFnSet() {
    $$("#fn-pop-body [data-th-btn]").forEach(b => b.onclick = () => {
      const sid = b.dataset.thBtn, name = b.dataset.thName;
      this.closeFnPop();
      try { OWGScript.triggerButton(sid, name); }
      catch (e) {
        const msg = String((e && e.message) || e);
        try { OWGLog.add("脚本", "脚本入口触发失败：" + name, msg); } catch (e0) { }
        toast("脚本入口触发失败：" + msg, "err");
      }
    });
    $$("#fn-pop-body .fn-item[data-fn]").forEach(b => b.onclick = () => {
      const k = b.dataset.fn;
      this.closeFnPop();
      if (k === "preset") { this.mineTab = "preset"; this.switchTab("mine"); this.renderMine(); }
      else if (k === "book") { this.mineTab = "book"; this.switchTab("mine"); this.renderMine(); }
      else if (k === "cards") { this.savesTab = "cards"; this.switchTab("saves"); this.renderSaves(); }
      else if (k === "saves") { this.savesTab = "saves"; this.switchTab("saves"); this.renderSaves(); }
      else if (k === "vars") STAssist.showVars();
      else if (k === "preview") STAssist.showPreview();
      else if (k === "repro") this.reprocessVars();
      else if (k === "reinit") this.reloadInitialVars();
      else if (k === "regen") this.fabRedrawImage();
      else if (k === "gallery") this.showGallery();
      else if (k === "theme") this.showThemeEditor();
      else if (k === "thscripts") OWGScript.showPanel("list");
      else if (k === "errlog") this.showErrLog();
    });
  },

  /** 调色盘：实时预览 + 多套主题保存/切换 + 恢复默认（写进设置，随 Game.save 持久化） */
  showThemeEditor() {
    const cur = OWGTheme.preset();
    const colorRows = [
      ["bg", "主背景"], ["panel", "卡片背景"], ["bg2", "次级/输入背景"], ["panel2", "按钮背景"],
      ["txt", "主文字"], ["txt2", "次要文字"], ["acc", "强调色/主色"], ["acc2", "强调色（浅）"],
      ["gold", "金色点缀"], ["line", "边框"],
    ];
    const rangeRows = [
      ["radius", "圆角", 0, 28, 1, "px"], ["shadow", "阴影强度", 0, 1, 0.02, ""],
      ["fontSize", "正文字号", 12, 20, 0.5, "px"], ["lineHeight", "行高", 1.3, 2.2, 0.05, ""],
      ["bgImageAlpha", "背景图遮罩", 0, 1, 0.05, ""],
    ];
    const fieldsOf = (rows) => rows.map(([k, label, ...rest]) => {
      if (rest.length) {
        const [min, max, step, unit] = rest;
        return `<div class="thm-row"><span>${label}</span>
          <input type="range" data-t="${k}" min="${min}" max="${max}" step="${step}" value="${cur[k]}">
          <b class="thm-val" data-tv="${k}">${cur[k]}${unit}</b></div>`;
      }
      return `<div class="thm-row"><span>${label}</span>
        <input type="color" data-t="${k}" value="${cur[k]}">
        <input type="text" data-tx="${k}" value="${escapeHtml(cur[k])}" placeholder="#rrggbb"></div>`;
    }).join("");
    const saved = OWGTheme.savedList();
    const chips = saved.length
      ? saved.map(x => `<span class="thm-chip ${x.name === OWGTheme.state().current ? "cur" : ""}" data-use-thm="${escapeHtml(x.name)}">${escapeHtml(x.name)}<button data-del-thm="${escapeHtml(x.name)}" title="删除">✕</button></span>`).join("")
      : '<span class="hint" style="font-size:11.5px">还没有保存的主题。调好后在下面填名字保存。</span>';
    openModal(`<h3>🎨 调色盘 <span class="hint" style="font-weight:400;font-size:11px">改动实时预览</span></h3>
      <div class="thm-sec">已保存主题</div>
      <div class="thm-saved" id="thm-chips">${chips}</div>
      <div class="thm-sec">颜色</div>
      ${fieldsOf(colorRows)}
      <div class="thm-sec">尺寸与效果</div>
      ${fieldsOf(rangeRows)}
      <div class="thm-sec">背景图 / 渐变</div>
      <label class="field"><span>背景图 URL（留空则用渐变/纯色）</span><input type="text" id="thm-img" value="${escapeHtml(cur.bgImage)}" placeholder="https://… 或 data:image/…"></label>
      <label class="field"><span>渐变（如 linear-gradient(160deg,#101a33,#2b1a3a)）</span><input type="text" id="thm-grad" value="${escapeHtml(cur.bgGrad)}" placeholder="linear-gradient(...)"></label>
      <div class="row" style="margin:10px 0 6px">
        <input type="text" id="thm-name" placeholder="主题名，如 雪夜蓝">
        <button class="btn sm primary" id="thm-save">保存为预设</button>
      </div>
      <div class="modal-actions">
        <button class="btn sm" id="thm-restore">恢复默认</button>
        <button class="btn sm" id="thm-json">导入 / 导出 JSON</button>
        <button class="btn primary" onclick="closeModal()">关闭</button>
      </div>`);
    const read = () => {
      const cfg = Object.assign({}, OWGTheme.preset());
      $$("#modal-root input[data-t]").forEach(el => {
        const k = el.dataset.t;
        cfg[k] = el.type === "range" ? Number(el.value) : el.value;
      });
      $$("#modal-root input[data-tx]").forEach(el => { cfg[el.dataset.tx] = el.value.trim(); });
      const gi = $("#thm-img"), gg = $("#thm-grad");
      if (gi) cfg.bgImage = gi.value.trim();
      if (gg) cfg.bgGrad = gg.value.trim();
      return cfg;
    };
    const sync = () => {
      const cfg = read();
      OWGTheme.savePreset(cfg);           // 每次改动即落盘：刷新/换卡保留
      $$("#modal-root input[data-tx]").forEach(el => {
