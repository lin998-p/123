  /** 图库：查看历史图片；支持多选批量删除（分批渲染 + 分批删除，上百张不卡） */
  async showGallery() {
    const list = await Game.galleryList();
    if (!this.galSel) this.galSel = new Set();
    const ids = new Set(list.map(g => g.id));
    for (const id of Array.from(this.galSel)) if (!ids.has(id)) this.galSel.delete(id);
    this.galTotal = list.length;
    const sel = !!this.galSelMode;
    const nSel = this.galSel.size;
    const legacyTip = OWGGallery.isLegacy() ? '<div class="hint" style="margin-bottom:8px;color:var(--gold)">当前浏览器不支持 IndexedDB，图库暂用兼容存储；图片仍会全部保留，不会丢旧图。</div>' : "";
    openModal(`<h3>🖼️ 图库 <span class="hint" id="gal-cnt">${list.length} 张${sel ? " · 已选 " + nSel + " 张" : ""}</span></h3>
      ${legacyTip}
      <p class="hint" style="margin-bottom:10px">剧情插图会自动存入图库，数量不设上限。${sel ? "点图片勾选，可全选/反选后一次删除。" : "点图片放大，点右上「删」移除该张。"}</p>
      ${list.length ? `<div class="gal-bar">
          <button class="btn sm" id="gal-sel-tgl">${sel ? "退出多选" : "多选"}</button>
          ${sel ? `<button class="btn sm" id="gal-all">全选</button><button class="btn sm" id="gal-inv">反选</button><button class="btn sm danger" id="gal-del-sel" ${nSel ? "" : "disabled"}>删除所选${nSel ? "（" + nSel + "）" : ""}</button>` : ""}
        </div>
        <div class="gal-grid" id="gal-grid"></div>
        <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" id="gal-more" style="display:none">加载更多</button></div>` : '<div class="empty" style="padding:20px"><span class="ee">🖼️</span>还没有生成的图片<br>开启剧情插图或点「重新生图」后会自动收集</div>'}
      <div class="modal-actions">
        ${list.length ? '<button class="btn danger" id="gal-clear">清空图库</button>' : ""}
        <button class="btn primary" onclick="closeModal()">关闭</button>
      </div>`);
    const grid = $("#gal-grid");
    const more = $("#gal-more");
    const CHUNK = 24;
    let shown = 0;
    const addChunk = () => {
      if (!grid || shown >= list.length) { if (more) more.style.display = "none"; return; }
      const end = Math.min(list.length, shown + CHUNK);
      const frag = document.createDocumentFragment();
      for (; shown < end; shown++) {
        const g = list[shown];
        const cell = document.createElement("div");
        cell.className = "gal-item" + (sel && this.galSel.has(g.id) ? " on" : "");
        cell.dataset.gid = String(g.id);
        const img = document.createElement("img");
        img.alt = "历史插图";
        img.loading = "lazy";
        const u = OWGGallery.urlOf(g);
        if (u) img.src = u;                       // Blob → object URL，按需创建
        img.onclick = (e) => {
          e.stopPropagation();
          if (this.galSelMode) this.galToggle(g.id, cell);
          else if (img.src) OWGImage.open(img.src);
        };
        img.onerror = () => { img.alt = "图片无法显示"; };
        cell.appendChild(img);
        if (sel) {
          const ck = document.createElement("input");
          ck.type = "checkbox";
          ck.className = "gal-ck";
          ck.checked = this.galSel.has(g.id);
          ck.onclick = (e) => { e.stopPropagation(); this.galToggle(g.id, cell, ck.checked); };
          cell.appendChild(ck);
        } else {
          const del = document.createElement("button");
          del.className = "gal-del";
          del.textContent = "删";
          del.onclick = (e) => {
            e.stopPropagation();
            Game.galleryDelete(g.id).then(() => { toast("已删除这张图片", "ok"); this.showGallery(); });
          };
          cell.appendChild(del);
        }
        const meta = document.createElement("div");
        meta.className = "gal-meta";
        meta.textContent = fmtTime(g.ts);
        cell.appendChild(meta);
        frag.appendChild(cell);
      }
      grid.appendChild(frag);
      if (more) more.style.display = shown < list.length ? "" : "none";
    };
    addChunk();
    if (more) more.onclick = addChunk;
    const md = $("#modal-root .modal");
    if (md) md.addEventListener("scroll", () => {
      if (md.scrollTop + md.clientHeight >= md.scrollHeight - 80) addChunk();
    }, { passive: true });
    const tgl = $("#gal-sel-tgl");
    if (tgl) tgl.onclick = () => { this.galSelMode = !this.galSelMode; if (!this.galSelMode) this.galSel.clear(); this.showGallery(); };
    const all = $("#gal-all");
    if (all) all.onclick = () => { this.galSel = new Set(list.map(g => g.id)); this.showGallery(); };
    const inv = $("#gal-inv");
    if (inv) inv.onclick = () => {
      const next = new Set();
      list.forEach(g => { if (!this.galSel.has(g.id)) next.add(g.id); });
      this.galSel = next; this.showGallery();
    };
    const ds = $("#gal-del-sel");
    if (ds) ds.onclick = () => {
      const k = this.galSel.size;
      if (!k) return;
      openModal(`<h3>删除所选图片</h3><p style="font-size:14px">将删除 <b>${k}</b> 张图片，删除后不可恢复。</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="gds-ok">删除 ${k} 张</button></div>`);
      $("#gds-ok").onclick = async () => {
        const b = $("#gds-ok");
        b.disabled = true; b.textContent = `删除中… 0/${k}`;
        await this.deleteGallerySelection();
        closeModal(); this.showGallery(); toast("已删除 " + k + " 张图片", "ok");
      };
    };
    const gc = $("#gal-clear");
    if (gc) gc.onclick = () => {
      openModal(`<h3>清空图库</h3><p style="font-size:14px">图库里的全部图片都会被删除（剧情里的插图不受影响）。</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="gc-ok">清空</button></div>`);
      $("#gc-ok").onclick = async () => { await Game.galleryClear(); this.galSel.clear(); closeModal(); this.showGallery(); toast("图库已清空", "ok"); };
    };
  },

  /** 勾选/取消一张：只改当前格子与计数，不整页重绘 */
  galToggle(id, cell, force) {
    if (!this.galSel) this.galSel = new Set();
    const on = force == null ? !this.galSel.has(id) : !!force;
    if (on) this.galSel.add(id); else this.galSel.delete(id);
    if (cell) {
      cell.classList.toggle("on", on);
      const ck = cell.querySelector(".gal-ck");
      if (ck) ck.checked = on;
    }
    const cnt = $("#gal-cnt");
    if (cnt) cnt.textContent = (this.galTotal || 0) + " 张 · 已选 " + this.galSel.size + " 张";
    const btn = $("#gal-del-sel");
    if (btn) {
      btn.disabled = !this.galSel.size;
      btn.textContent = "删除所选" + (this.galSel.size ? "（" + this.galSel.size + "）" : "");
    }
  },

  /** 批量删除：每批 10 张并发，批间让出主线程，上百张也不会卡住界面 */
  async deleteGallerySelection() {
    const ids = Array.from(this.galSel || []);
    if (!ids.length) return 0;
    let done = 0;
    for (let i = 0; i < ids.length; i += 10) {
      const batch = ids.slice(i, i + 10);
      await Promise.all(batch.map(id => Game.galleryDelete(id).catch(() => null)));
      done += batch.length;
      const b = $("#gds-ok");
      if (b) b.textContent = `删除中… ${done}/${ids.length}`;
      await new Promise(r => setTimeout(r, 0));
    }
    this.galSel.clear();
    return ids.length;
  },

  /** 报错日志：全局一份（不随存档），可按级别/类型筛选、清空、复制全部 */
  showErrLog(filter, lvFilter) {
    const list = OWGLog.all();
    const types = OWGLog.types();
    const levels = OWGLog.levels();
    const cur = (filter && (filter === "全部" || types.indexOf(filter) >= 0)) ? filter : "全部";
    const curLv = (lvFilter && (lvFilter === "全部" || levels.indexOf(lvFilter) >= 0)) ? lvFilter : "全部";
    const lvOf = x => OWGLog.levelOf(x);
    const items = list.filter(x => (cur === "全部" || x.type === cur) && (curLv === "全部" || lvOf(x) === curLv));
    const cnt = t => t === "全部" ? list.length : list.filter(x => x.type === t).length;
    const cntLv = l => l === "全部" ? list.length : list.filter(x => lvOf(x) === l).length;
    const chips = ["全部"].concat(types).map(t => {
      const n = cnt(t);
      return `<button class="btn sm${t === cur ? " on" : ""}" data-el-f="${t}"${n ? "" : ' style="opacity:.45"'}>${t} ${n}</button>`;
    }).join("");
    const lvChips = ["全部"].concat(levels).map(l => {
      const n = cntLv(l);
      return `<button class="btn sm${l === curLv ? " on" : ""}" data-el-lv="${l}"${n ? "" : ' style="opacity:.45"'}>${l} ${n}</button>`;
    }).join("");
    const rows = items.length
      ? items.slice().reverse().map(x => {
        const lv = lvOf(x);
        return `
        <div class="el-item">
          <div class="el-head"><span class="el-lv" data-lv="${escapeHtml(lv)}">${escapeHtml(lv)}</span><span class="el-type" data-t="${escapeHtml(x.type)}">${escapeHtml(x.type)}</span><span class="el-time">${fmtTime(x.ts)}</span>${x.n > 1 ? `<span class="el-n">同类 ×${x.n}</span>` : ""}</div>
          <div class="el-msg">${escapeHtml(x.msg)}</div>
          ${x.detail ? `<pre class="el-detail">${escapeHtml(x.detail)}</pre>` : ""}
        </div>`;
      }).join("")
      : '<div class="empty" style="padding:18px"><span class="ee">🐞</span>这一类还没有记录</div>';
    openModal(`<h3>🐞 报错日志 <span class="hint">${items.length}/${list.length} 条</span></h3>
      <p class="hint" style="margin-bottom:2px">全局日志：所有存档共用一份，不写进存档快照；刷新后仍可查看。上限 ${OWGLog.MAX} 条，超出丢弃最旧的。</p>
      <p class="hint" style="margin-bottom:2px">错误＝功能坏了要处理；警告＝环境/容量问题，游戏已降级但仍可玩；提示＝已自动处理好的情况。</p>
      <div class="el-filter" id="el-lv-filter">${lvChips}</div>
      <div class="el-filter" id="el-filter">${chips}</div>
      <div class="el-list" id="el-list">${rows}</div>
      <div class="modal-actions">
        <button class="btn" id="el-copy">复制全部</button>
        <button class="btn danger" id="el-clear">清空</button>
        <button class="btn primary" onclick="closeModal()">关闭</button>
      </div>`);
    $$("#el-filter [data-el-f]").forEach(b => b.onclick = () => this.showErrLog(b.dataset.elF, curLv));
    $$("#el-lv-filter [data-el-lv]").forEach(b => b.onclick = () => this.showErrLog(cur, b.dataset.elLv));
    const cc = $("#el-copy");
    if (cc) cc.onclick = () => {
      const ok = copyText(OWGLog.text() || "（暂无日志）");
      toast(ok ? "已复制全部日志" : "复制失败，请手动选择文本", ok ? "ok" : "err");
    };
    const cl = $("#el-clear");
    if (cl) cl.onclick = () => { OWGLog.clear(); this.showErrLog(cur); toast("报错日志已清空", "ok"); };
  },


  /** 重新处理变量：对已生成的剧情重跑一遍渲染管线并刷新显示（不调用模型） */
  reprocessVars() {

    this.renderStory();

  },

  /** 重新读取初始变量：从本地存储重读 initial 作用域并刷新显示 */
  reloadInitialVars() {
    let n = 0;
    try { n = Object.keys(STAssist.scopeData("initial") || {}).length; } catch (e) { n = 0; }
    this.renderStory();
    toast(n ? `已重新读取初始变量（${n} 项）` : "初始变量为空：可在「我的 → ⚙️ 设置 → ⚡ 酒馆助手」查看", "ok");
  },

  /* ---------- 剧情滚动位置：仅在底部附近才跟随，其余保持阅读位置 ---------- */
  _storyScroll: null,
  _nearBottom(sc) { return !!sc && (sc.scrollHeight - sc.scrollTop - sc.clientHeight) <= 80; },
  _storyScrollKey() { return "owg_story_scroll::" + ((Game.state && Game.state.cardId) || "default"); },
  _loadStoryScroll() {
    if (this._storyScroll) return this._storyScroll;
    try {
      const raw = sessionStorage.getItem(this._storyScrollKey());
      if (raw) {
        const o = JSON.parse(raw);
        if (o && typeof o.top === "number") this._storyScroll = o;
      }
    } catch (e) { /* 隐私模式/配额异常忽略 */ }
    return this._storyScroll;
  },
  _rememberStoryScroll() {
    const sc = $("#story-scroll");
    if (!sc || sc.clientHeight <= 0) return; // 页面隐藏时不要覆盖记忆
    this._storyScroll = { top: sc.scrollTop, atBottom: this._nearBottom(sc) };
    if (this._storyScrollTimer) clearTimeout(this._storyScrollTimer);
    this._storyScrollTimer = setTimeout(() => {
      try { sessionStorage.setItem(this._storyScrollKey(), JSON.stringify(this._storyScroll)); } catch (e) { }
    }, 200);
  },
  scrollStory(force) {
    const sc = $("#story-scroll");
    if (!sc) return;
    if (force === true) sc.scrollTop = sc.scrollHeight;
    else if (this._nearBottom(sc)) sc.scrollTop = sc.scrollHeight;
    this._rememberStoryScroll();
  },

  /** 流式渲染：临时气泡（只有原本就在底部附近才跟随，用户上翻后不再拉回） */
  _streamEl: null,
  _streamOn(full) {
    const sc = $("#story-scroll");
    if (!sc) return;
    const near = this._nearBottom(sc);
    if (!this._streamEl) {
      sc.insertAdjacentHTML("beforeend", `<div class="msg"><div class="m-avatar">🎴</div><div class="m-body"><div class="m-name">生成中…</div><div class="m-text cursor-blink"></div></div></div>`);
      this._streamEl = sc.lastElementChild;
    }
    this._streamEl.querySelector(".m-text").textContent = OWGReason.visible(full);
    if (near) sc.scrollTop = sc.scrollHeight;
    this._rememberStoryScroll();
  },
  _streamOff() { if (this._streamEl) { this._streamEl.remove(); this._streamEl = null; } },

  _setGenerating(v) {
    const b = $("#story-send");
    if (b) { b.classList.toggle("stop", v); b.textContent = v ? "停止" : "发送"; }
    $$(".si-tools .si-tool").forEach(b2 => b2.disabled = v);
    if (!v) this._streamOff();
  },

  /** 酒馆式斜杠命令：/help /clear /ask /ai /sys /me /impersonate */
  handleSlash(text) {
    const c = OWGCommands.parse(text);
    if (!c.handled) return false;
    const st = Game.state;
    if (c.cmd === "help") {
      openModal(`<h3>⌘ 斜杠命令</h3><p class="hint" style="margin-bottom:10px">输入框里以 / 开头即触发</p>
        ${OWGCommands.list.map(x => `<div style="font-size:13px;margin:4px 0"><b>${x.cmd}</b> —— ${x.desc}</div>`).join("")}
        <div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>`);
      return true;
    }
    if (c.cmd === "clear") {
      st.messages = []; st.memory = ""; st.memoryUpto = 0; Game.save();
      this.renderStory(); toast("剧情已清空", "ok");
      try { window.OWGTH && OWGTH.emit(OWG_TH_EVENTS.CHAT_CHANGED, { reason: "clear" }); } catch (e) { }
      return true;
    }
    if (c.cmd === "sys") {
      if (!c.text) { toast("/sys 需要内容", "err"); return true; }
      st.messages.push({ role: "user", content: "（系统提示：" + c.text + "）", ts: Date.now() });
      Game.save(); this.renderStory(); toast("已插入系统提示", "ok");
      return true;
    }
    if (c.cmd === "me") {
      if (!c.text) { toast("/me 需要内容", "err"); return true; }
      st.messages.push({ role: "user", content: "（我" + c.text + "）", ts: Date.now() });
      Game.save(); this.renderStory(); toast("已插入动作描写", "ok");
      return true;
    }
    if (c.cmd === "impersonate") {
      const ta = $("#story-text");
      if (ta) { ta.value = (c.text || Game.currentCharName() + "：") + (c.text ? "" : ""); ta.focus(); }
      toast("已切换为角色身份输入", "ok");
      return true;
    }
    if (c.cmd === "ask" || c.cmd === "ai") {
      if (!c.text) { toast("/ask 需要内容", "err"); return true; }
      this.doSend(c.text);
      return true;
    }
    toast("未知命令：" + c.cmd + "（输入 /help 查看可用命令）", "err");
    return true;
  },
  /** 读取剧情卡片里已填写/已选择的控件值，拼成一句玩家输入 */
  cardValues(rich) {
    if (!rich) return "";
    const vals = [];
    const labelOf = (el) => {
      const lb = el.closest("label");
      if (lb) return String(lb.textContent || "").replace(/\s+/g, " ").trim();
      const box = el.closest("div");
      const l2 = box && box.querySelector("label");
      return String((l2 && l2.textContent) || "").replace(/\s+/g, " ").trim();
    };
    rich.querySelectorAll("input").forEach(inp => {
      const type = String(inp.type || "text").toLowerCase();
      if (type === "radio" || type === "checkbox") {
        if (!inp.checked) return;
        const lab = labelOf(inp) || inp.value || "";
        if (lab) vals.push(lab);
      } else if (["text", "search", "number", "email", "url", "tel"].includes(type)) {
        const v = String(inp.value || "").trim();
        if (!v) return;
        const lab = labelOf(inp).replace(/[（(].*?[)）]/g, "").trim();
        vals.push(lab && lab.length <= 24 ? lab + "：" + v : v);
      }
    });
    rich.querySelectorAll("select").forEach(sel => {
      const o = sel.options[sel.selectedIndex];
      const v = o ? String(o.textContent || "").trim() : "";
      if (!v) return;
      const lab = labelOf(sel).replace(/[（(].*?[)）]/g, "").trim();
      vals.push(lab && lab.length <= 24 ? lab + "：" + v : v);
    });
    return vals.length ? "【我的选择】" + vals.join("；") : "";
  },
  /** 剧情卡片按钮：选项按钮直接发送；提交类按钮汇总卡片内容后发送（走正常发送流程） */
  cardAction(btn) {
    if (!btn) return;
    const rich = btn.closest(".st-rich");
    const own = String(btn.textContent || "").replace(/\s+/g, " ").trim();
    const explicit = btn.getAttribute("data-send") || btn.getAttribute("data-value") || "";
    const submit = /提交|确认|确定|完成|开始|进入|选完|创建|建立|保存|应用|发送|submit|confirm/i.test(own);
    let text = explicit;
    if (!text) {
      if (submit) {
        const hasCtrl = !!rich && !!rich.querySelector("input, select, textarea");
        text = this.cardValues(rich);
        if (!text) {
          if (hasCtrl) { toast("请先在卡片里选择或填写内容"); return; }
          text = own; // 纯展示卡上的按钮：发送按钮文字
        }
      } else {
        text = own; // 选项按钮：按钮文字本身就是玩家选择
      }
    }
    if (!text) return;
    if (Game.generating) { toast("生成中，请稍候或点击停止"); return; }
    this.doSend(text);
  },
  async doSend(text) {
    if (Game.generating) { toast("生成中，请稍候或点击停止"); return; }
    if (typeof OWGCommands !== "undefined" && this.handleSlash(text)) return;
    if (!Game.state.player) { this.showOnboard(); return; }
    if (!this.apiReady()) { toast("请先到「我的」页配置 API 与模型", "err"); return; }
    // 立即显示用户消息
    Game.state.messages.push({ role: "user", content: text, ts: Date.now() });
    this.renderStory(); this.scrollStory();
    this._setGenerating(true);
    const res = await Game.sendStory(null, {
      reason: "用户发送",
      onDelta: (f) => this._streamOn(f),
      onComplete: (r) => this._storyComplete(r),
    });
    this._setGenerating(false);
    if (res.ok && res.shortHint) {
      toastOnce("story-length:" + (res.truncated ? "len" : "short"), res.shortHint, res.truncated ? "err" : "");
    }
    if (!res.ok) {
      if (!res.aborted) {
        const raw = String(res.error || "生成失败");
        const head = raw.split("\n")[0];
        toastOnce("send-fail:" + head.slice(0, 60), (head.length > 100 ? head.slice(0, 100) + "…" : head) + "（详情见 功能合集 → 报错日志）", "err");
      }
      this.renderStory(); this.scrollStory();
      return;
    }
    this.renderStory(); this.renderTopbar(); this.scrollStory();
    Game.createSave(null, true); // 自动存档
  },

  /** 剧情回合完成后的统一处理（升级/倒下/触发对战） */
  _storyComplete(r) {
    if (r.levelUp) this.showLevelUp(r.levelUp);
    if (r.dead) setTimeout(() => this.showDeath(), 400);
    const st = Game.state;
    const last = st.messages[st.messages.length - 1];
    // 刚刚结束的这场战斗：结束态 battle / 战果消息都视为“同一场已结束”，不得再次进入
    const bState = st.battle;
    const justEndedBattle = !!(bState && !Game.isBattleActive()) || !!(last && last.battleResult);
    if (bState && !Game.isBattleActive()) { st.battle = null; Game.save(); }
    // 模型显式给出的敌人（且剧情确有冲突证据），或剧情正文出现明确的冲突升级
    let hints = (r.battleStart || []).map(x => String(x || "").trim()).filter(Boolean);
    const lastTxt = stripForStory(String(last?.content || ""));
    if (hints.length && (!Game.battleEvidence(lastTxt) || justEndedBattle)) hints = [];
    const autoByStory = !hints.length && !Game.isBattleActive() && !justEndedBattle && last && !last.battleResult && Game.battleEvidence(lastTxt);
    if (hints.length || autoByStory) {
      // 只落待定状态，不自动请求玩法模型：是否开打由用户点「对战」决定
      Game.prepareBattle(hints);
      if (Game.state.battle) {
        Game.state.battle.error = "剧情出现冲突：点「对战」面板里的「重新生成敌人」由你决定是否请求玩法模型";
      }
      Game.save();
      this.renderStory();
      toastOnce("battle-hint", "剧情进入战斗，点「对战」由你决定是否开打", "");
    }
  },

  async doReroll() {
    if (Game.generating) { toast("生成中，请稍候"); return; }
    if (!this.apiReady()) { toast("请先到「我的」页配置 API 与模型", "err"); return; }
    // 移除最后的 assistant 消息再重生成
    while (Game.state.messages.length && Game.state.messages[Game.state.messages.length - 1].role === "assistant") Game.state.messages.pop();
    this.renderStory();
    this._setGenerating(true);
    const res = await Game.regenerate({
      onDelta: (f) => this._streamOn(f),
      onComplete: (r) => this._storyComplete(r),
    });
    this._setGenerating(false);
    this.renderStory(); this.renderTopbar(); this.scrollStory();
    if (!res.ok && !res.aborted) {
      const head = String(res.error || "生成失败").split("\n")[0];
      toast((head.length > 100 ? head.slice(0, 100) + "…" : head) + "（详情见 功能合集 → 报错日志）", "err");
    }
  },

  /* ================= 对战模式（回合制 4v4） ================= */
  _battleSel: null,

  async openBattle(hintEnemies = []) {
    if (!Game.state.player) { toast("请先创建角色"); return; }
    const cur = Game.state.battle;
    if (cur && cur.status === "fighting") { this.showBattleModal(); return; }
    // 没有 API 也能进面板（面板里能看到原因并重试）
    if (!this.apiReady()) {
      Game.prepareBattle(hintEnemies);
      if (Game.state.battle) { Game.state.battle.error = "尚未配置 API（或玩法分析模型），无法安排敌人"; Game.save(); }
      this.showBattleModal();
      this.renderStory();
      return;
    }
    // 先落待定状态 → 面板立刻可进，敌人在后台生成
    Game.prepareBattle(hintEnemies);
    this.showBattleModal();
    this.renderStory();
    this._fillBattle(hintEnemies);

      const stTxt = OWGCombat.statusText(u);
      const pUses = (u.skills || []).map(s => {

        if (!i.passive || i.uses == null) return null;
        const left = i.id === "p_laststand" ? (u.lastStand || 0) : (u.uses && u.uses[i.name] != null ? u.uses[i.name] : i.uses);

      }).filter(Boolean).join(" · ");

        <div class="bt-stat">攻${u.atk}${u.matk ? "·法" + u.matk : ""} 防${u.def} · 速${u.spd} · 暴${u.crit}%</div>

      <h3>${b.kind === "spar" ? "🤝 切磋" : "⚔️ 对战"} · 第 ${b.round} 回合 ${statusTxt}</h3>

      <div class="bt-self">🧍 ${escapeHtml(me.name)} · ❤️ ${Math.max(0, me.hp)}/${me.maxHp} · 💧 魔力 ${Math.max(0, me.mp)}/${me.maxMp} · ⚡ 速度 ${me.spd} · 👥 队伍 ${b.allies.length} 人（按速度行动）</div>
      <div class="bt-label">👾 敌方（点击选择目标）</div>
      <div class="bt-row">${b.enemies.length ? b.enemies.map(e => unitCard(e, "enemy " + (this._battleSel === e.name && !OWGCombat.isDown(b, e) ? "sel" : ""), `data-en="${escapeHtml(e.name)}"`)).join("") : '<div class="hint">（还没有敌人）</div>'}</div>
      <div class="bt-label" style="margin-top:10px">🛡️ 我方</div>
      <div class="bt-row">${b.allies.map(a => unitCard(a)).join("")}</div>
      <div class="bt-log" id="bt-log">${b.log.map(l => `<div>· ${escapeHtml(l)}</div>`).join("")}</div>
      ${b.status === "fighting" ? `
        <div class="row" style="margin-top:10px">
          <select id="bt-skill"><option value="">普攻</option>${(me.skills || p.skills || []).map(s => {
            const st = OWGCombat.skillState(me, s);
            const si = st.info;
            if (si.passive) return `<option value="${escapeHtml(s.name)}" disabled>${escapeHtml(s.name)}（被动 · 常驻）</option>`;
            const extra = `耗魔 ${si.cost}${st.cd ? ` · 冷却剩 ${st.cd} 回合` : ""}${st.uses != null ? ` · 剩 ${st.uses} 次` : ""}`;
            return `<option value="${escapeHtml(s.name)}" ${st.blocked ? "disabled" : ""}>${escapeHtml(s.name)}（${extra}）${st.blocked ? " · " + st.blocked : ""}</option>`;

          <select id="bt-item"><option value="">道具…</option>${p.items.filter(i => !i.type || i.type === "consumable").map(i => `<option value="${escapeHtml(i.name)}">${escapeHtml(i.name)}×${i.count}</option>`).join("")}</select>

        <div class="modal-actions"><button class="btn primary" id="bt-close">返回剧情</button></div>`}

    const logEl = $("#bt-log"); if (logEl) logEl.scrollTop = logEl.scrollHeight;
    // 选择目标
    $$("#modal-root [data-en]").forEach(el => el.onclick = () => {
      const name = el.dataset.en;
      const e = b.enemies.find(x => x.name === name);

      const name = $("#bt-item").value;
      if (!name) { toast("先选择道具"); return; }
      this.resolveBattle({ type: "item", item: name });
    };
    const flee = $("#bt-flee"); if (flee) flee.onclick = () => this.resolveBattle({ type: "flee" });
    const wait = $("#bt-wait"); if (wait) wait.onclick = () => this.resolveBattle({ type: "wait" });
    const close = $("#bt-close"); if (close) close.onclick = () => { Game.endBattle(); closeModal(); this.refresh(); this.renderStory(); };

    const abort = $("#bt-abort"); if (abort) abort.onclick = () => { Game.endBattle(); closeModal(); this.refresh(); this.renderStory(); };
  },

  async resolveBattle(action) {
    const b = Game.state.battle;
    if (!b) return;
    // 目标兜底：选中的或第一个存活敌人
    if ((action.type === "attack" || action.type === "skill")) {
      const alive = b.enemies.filter(e => !OWGCombat.isDown(b, e));
      if (!alive.some(e => e.name === action.target)) action.target = alive[0]?.name;
      if (!action.target) { toast("没有可选目标"); return; }
    }
    openModal(`<h3>${b.kind === "spar" ? "🤝" : "⚔️"} 结算中</h3><div class="loading-dots">第 ${b.round} 回合结算中…</div>`, { closable: false });
    try {
      const res = await Game.battleRound(action);
      this._battleSel = null;
      if (res.dead) {
        this.showBattleModal();
        this.renderStory();
        setTimeout(() => { closeModal(); this.showDeath(); }, 900);
        return;
      }
      if (res.rewards && res.rewards.levelUp) toast("🎉 等级提升！", "ok");
      this.showBattleModal();
      this.renderTopbar();
      this.renderStory();
    } catch (e) {
      toast("结算失败：" + e.message, "err");
      this.showBattleModal();
    }
  },

  bindModelPickers(root) {
    const box = root || document;
    const closeAll = (except) => {
      box.querySelectorAll(".model-pick.open").forEach(b => {
        if (b === except) return;
        b.classList.remove("open");
        const m = b.querySelector(".mp-menu");
        if (m) m.hidden = true;
      });
    };
    box.querySelectorAll(".model-pick").forEach(pick => {
      const inp = pick.querySelector("input"), btn = pick.querySelector(".mp-btn"), menu = pick.querySelector(".mp-menu");
      if (!inp || !menu) return;
      const filter = () => {
        const q = String(inp.value || "").trim().toLowerCase();
        let n = 0;
        menu.querySelectorAll(".mp-item").forEach(it => {
          const hit = !q || String(it.dataset.model || "").toLowerCase().includes(q);
          it.hidden = !hit;
          if (hit) n++;
        });
        return n;
      };
      // 展开时显示全部候选（只有手动输入时才过滤），否则已选过的输入框会把列表过滤成 1 项
      const open = () => {
        closeAll(pick); menu.hidden = false; pick.classList.add("open");
        menu.querySelectorAll(".mp-item").forEach(it => {
          it.hidden = false;
          it.classList.toggle("active", String(it.dataset.model || "") === String(inp.value || ""));
        });
      };
      const close = () => { menu.hidden = true; pick.classList.remove("open"); };
      const choose = (v) => {
        inp.value = v;
        inp.dispatchEvent(new Event("input", { bubbles: true }));
        inp.dispatchEvent(new Event("change", { bubbles: true }));
        close();
      };
      inp.addEventListener("focus", open);
      inp.addEventListener("click", open);
      inp.addEventListener("input", () => { open(); filter(); });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { close(); return; }
        if (e.key === "Enter" && !menu.hidden) {
          const first = Array.from(menu.querySelectorAll(".mp-item")).find(x => !x.hidden);
          if (first) { e.preventDefault(); choose(first.dataset.model); }
        }
      });
      btn.addEventListener("click", (e) => { e.preventDefault(); menu.hidden ? open() : close(); });
      menu.addEventListener("mousedown", (e) => {
        const it = e.target.closest(".mp-item");
        if (it) { e.preventDefault(); choose(it.dataset.model); }
      });
    });
    if (!this.__mpDocBound) {
      this.__mpDocBound = true;
      document.addEventListener("click", (e) => {
        if (!e.target.closest || !e.target.closest(".model-pick")) closeAll(null);
      }, true);
    }
  },

  importCharPrompts(text) {
    try {
      const j = JSON.parse(text);
      const arr = Array.isArray(j) ? j : (Array.isArray(j.characters) ? j.characters : null);
      if (!arr) throw new Error('需要 {"characters":[...]} 或直接是数组');
      const img = Game.state.settings.image;
      let n = 0;
      arr.forEach(x => {
        if (!x || !(x.name || x.prompt) || !x.prompt) return;
        const rec = {
          id: "cp" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          name: String(x.name || "未命名").slice(0, 40),
          aliases: Array.isArray(x.aliases) ? x.aliases.map(String).filter(Boolean) : String(x.aliases || "").split(/[,，、]/).filter(Boolean),
          prompt: String(x.prompt || ""), negative: String(x.negative || ""),
        };
        img.characters = (img.characters || []).filter(y => y.name !== rec.name);
        img.characters.push(rec); n++;
      });
      Game.save(); this.renderMine(); toast("已导入 " + n + " 个角色提示词", "ok");
    } catch (e) { toast("导入失败：" + e.message, "err"); }
  },
  importImagePreset(text, nameHint) {
    const r = Game.parseImagePresets(text, nameHint);
    if (!r.ok) { toast("导入失败：" + r.error, "err"); return false; }
    const img = Game.state.settings.image;
    const list = img.presets || [];
    let added = 0, replaced = 0;
    r.presets.forEach(p => {
      const i = list.findIndex(x => x.name === p.name);
      if (i >= 0) { list[i] = p; replaced++; } else { list.push(p); added++; }
    });
    img.presets = list;
    Game.save(); this.renderMine();
    const names = r.presets.map(p => p.name).join("、");
    const miss = r.presets.reduce((n, p) => n + ((p.missing && p.missing.length) || 0), 0);
    toast("已导入 " + r.presets.length + " 份预设（新增 " + added + (replaced ? "，同名覆盖 " + replaced : "") + "）：" + names + (miss ? "；有 " + miss + " 项缺省，已按兼容规则处理" : ""), "ok");
    return true;
  },

  renderMineBook(body) {

    const diag = Game.worldbookRun(inputNow, { sandbox: true, deterministic: true });
    this._wbDiag = diag;
    const nHit = diag.report.filter(r => r.status === "hit").length;

        $("#set-len").onclick = () => this.showLenPicker();

  /* ================= 世界书管理 ================= */
  /** 上次判定结果（列表徽标 / 排查面板共用） */
  wbDiagMap() {
    const map = {};
    const d = this._wbDiag;
    if (d && Array.isArray(d.report)) d.report.forEach(r => { map[r.id] = r; });
    return map;
  },
  wbStatusText(r) {
    if (!r) return { cls: "idle", txt: "未判定" };
    if (r.status === "hit") return { cls: "ok", txt: "✓ 生效" };
    const short = {
      off: "已停用", other: "其他角色卡", depth: "扫描深度不足",
      nokey: "关键词未命中", prob: "概率未通过", budget: "预算不足被裁",
    }[r.status] || "未生效";
    return { cls: "no", txt: "✕ " + short };
  },
  worldbookListHTML(listIn) {
    const list = Array.isArray(listIn) ? listIn : Game.worldbookEntries();
    if (!list.length) return '<div class="empty" style="padding:14px"><span class="ee">📚</span>还没有条目，点击右上角添加</div>';
    const dm = this.wbDiagMap();
    return list.map(e => {
      const d = dm[e.id], s = this.wbStatusText(d);
      return `
      <div class="card-lib-item" data-id="${e.id}" style="align-items:flex-start" title="${escapeHtml(d ? d.reason : "")}">
        <div class="mi-ico" style="font-size:16px;padding-top:2px">${e.source === "card" ? "🎭" : "📝"}</div>
        <div class="cli-info">
          <div class="cli-name" style="font-size:12.5px;color:var(--acc2)">${e.keys?.length ? escapeHtml(e.keys.join(" / ")) : "（无关键词）"}${e.always ? ' <span class="tag-auto">常驻</span>' : ""}${e.enabled === false ? ' <span style="color:var(--red);font-size:10px">已停用</span>' : ""}<span class="wb-badge ${s.cls}">${s.txt}</span></div>
          <div class="cli-sub" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(e.content)}</div>
          ${d && d.status !== "hit" ? `<div class="hint" style="font-size:10.5px;color:var(--txt2);margin-top:2px">原因：${escapeHtml(d.reason)}</div>` : ""}
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          <button class="btn sm" data-wb-edit="${e.id}">编辑</button>
          <button class="btn sm ${e.enabled === false ? "" : "ghost"}" data-wb-tgl="${e.id}" style="padding:5px 8px">${e.enabled === false ? "启" : "停"}</button>
          <button class="btn sm danger" data-wb-del="${e.id}">删</button>
        </div>
      </div>`;
    }).join("");
  },

  bindWorldbookList() {
    $$("[data-wb-edit]").forEach(b => b.onclick = () => OWGWorldbook.edit(b.dataset.wbEdit));
    $$("[data-wb-tgl]").forEach(b => b.onclick = () => OWGWorldbook.toggle(b.dataset.wbTgl));
    $$("[data-wb-del]").forEach(b => b.onclick = () => OWGWorldbook.remove(b.dataset.wbDel));
  },

  showWbEditor(entry) {
    const isNew = !entry;
    openModal(`
      <h3>${isNew ? "＋ 添加世界书条目" : "✏️ 编辑世界书条目"}</h3>
      <label class="field"><span>触发关键词（逗号分隔，剧情或输入中出现即注入）</span>
        <input type="text" id="wb-keys" placeholder="例如：虚空教团, 坠星之夜" value="${escapeHtml(entry?.keys?.join(", ") || "")}"></label>
      <label class="field"><span>设定内容</span>
        <textarea id="wb-content" rows="5" placeholder="该关键词触发时注入的世界观补充设定…">${escapeHtml(entry?.content || "")}</textarea></label>
      <div class="mine-item" style="padding-left:0;padding-right:0">
        <div class="mi-ico">📌</div>
        <div class="mi-main"><div class="mi-title">常驻生效</div><div class="mi-sub">不等待关键词，始终注入每次剧情</div></div>
        <label class="switch"><input type="checkbox" id="wb-always" ${entry?.always ? "checked" : ""}><i></i></label>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" id="wb-save">保存</button>
      </div>`);
    $("#wb-save").onclick = () => {
      const keys = $("#wb-keys").value.split(/[,，、]+/).map(s => s.trim()).filter(Boolean).slice(0, 8);
      const content = $("#wb-content").value.trim();
      if (!content) { toast("内容不能为空", "err"); return; }
      const list = Game.worldbookEntries();
      if (isNew) {
        list.push({ id: uid(), keys, content, always: $("#wb-always").checked, enabled: true, source: "user" });
      } else {
        const e = list.find(x => x.id === entry.id);
        if (e) { e.keys = keys; e.content = content.slice(0, 500); e.always = $("#wb-always").checked; }
      }
      Game.saveWorldbook(list);
      closeModal(); this.renderMine(); toast("已保存", "ok");
    };
  },

      <label class="field"><span>开场白</span><textarea id="ce-first" rows="4">${escapeHtml(s.first_mes)}</textarea></label>
      <div class="card-title" style="margin:2px 0 6px;font-size:13px">🎬 备选开场白（${s.alts.length} 个） <button class="btn sm primary" id="ce-alt-add">＋ 添加</button></div>
      <p class="hint" style="margin-bottom:6px">多个开场会在启用角色卡时让玩家选择其一。</p>
      ${s.alts.map((g, i) => `<div style="margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span class="hint">备选开场白 ${i + 1}</span><button class="btn sm danger" style="margin-left:auto" data-cealt-del="${i}">删除</button></div>
        <textarea id="ce-alt-${i}" rows="3" style="width:100%">${escapeHtml(g)}</textarea>
      </div>`).join("")}
      <div class="divider"></div>
      <div class="card-title" style="margin-bottom:6px">📚 该卡专属世界书（${wb.length} 条） <button class="btn sm primary" id="ce-wb-add">＋ 条目</button></div>
      <p class="hint" style="margin-bottom:8px">与这张角色卡绑定：启用该卡时随卡载入剧情；「我的」页的世界书是全局世界书，对所有剧情生效。</p>
      <div style="max-height:200px;overflow-y:auto">
        ${wb.length ? wb.map((e, i) => `
        <div class="card-lib-item" style="padding:8px 10px">
          <div class="cli-info">
            <div class="cli-name" style="font-size:12px;color:var(--acc2)">${escapeHtml((e.keys || []).join(" / ") || "（无关键词）")}</div>
            <div class="cli-sub" style="white-space:normal">${escapeHtml((e.content || "").slice(0, 60))}</div>
          </div>
          <div style="display:flex;gap:5px">
            <button class="btn sm" data-cewb-edit="${i}">改</button>
            <button class="btn sm danger" data-cewb-del="${i}">删</button>
          </div>
        </div>`).join("") : '<p class="hint">暂无条目</p>'}
      </div>
      <div class="modal-actions">
        <button class="btn" id="ce-cancel">取消</button>
        <button class="btn primary" id="ce-save">保存全部</button>
      </div>`);
    $("#ce-wb-add").onclick = () => this.showCardWbEditor(-1);
    $("#ce-alt-add").onclick = () => {
      this._harvestCardEditor();
      this._cardEditSnap.alts.push("");
      this.renderCardEditor();
    };
    $$("#modal-root [data-cealt-del]").forEach(b => b.onclick = () => {
      this._harvestCardEditor();
      this._cardEditSnap.alts.splice(+b.dataset.cealtDel, 1);
      this.renderCardEditor();
    });
    $$("#modal-root [data-cewb-edit]").forEach(b => b.onclick = () => this.showCardWbEditor(+b.dataset.cewbEdit));
    $$("#modal-root [data-cewb-del]").forEach(b => b.onclick = () => {
      this._cardEditSnap.worldbook.splice(+b.dataset.cewbDel, 1);
      this.renderCardEditor();
    });
    $("#ce-cancel").onclick = () => { this._cardEditSnap = null; closeModal(); };
    $("#ce-save").onclick = () => {
      const s2 = this._cardEditSnap;
      s2.name = $("#ce-name").value.trim() || s2.name;
      s2.description = $("#ce-desc").value;
      s2.personality = $("#ce-pers").value;
      s2.scenario = $("#ce-scen").value;
      s2.first_mes = $("#ce-first").value;
      s2.alts = s2.alts.map((_, i) => { const el = $("#ce-alt-" + i); return el ? el.value : ""; }).filter(x => x.trim());
      Game.updateCardEntry(s2.id, {
        name: s2.name, description: s2.description, personality: s2.personality,
        scenario: s2.scenario, first_mes: s2.first_mes, alternate_greetings: s2.alts, worldbook: s2.worldbook,
      });
      if (Game.state.cardId === s2.id) Game.syncActiveCardWorldbook();
      this._cardEditSnap = null;
      closeModal();
      this.refresh();
      toast("角色卡已保存" + (Game.state.cardId === s2.id ? "，世界书已同步到当前剧情" : ""), "ok");
    };
  },

  /** 收割主编辑器文本框内容进快照（切换弹窗前调用） */
  _harvestCardEditor() {
    const s = this._cardEditSnap;
    if (!s || !$("#ce-name")) return;
    s.name = $("#ce-name").value.trim() || s.name;
    s.description = $("#ce-desc").value;
    s.personality = $("#ce-pers").value;
    s.scenario = $("#ce-scen").value;
    s.first_mes = $("#ce-first").value;
    s.alts = (s.alts || []).map((_, i) => { const el = $("#ce-alt-" + i); return el ? el.value : ""; });
  },

  /** 卡世界书条目编辑（idx=-1 新增） */
  showCardWbEditor(idx) {
    const s = this._cardEditSnap;
    if (!s) return;
    this._harvestCardEditor();
    const e = idx >= 0 ? s.worldbook[idx] : { keys: [], content: "" };
    openModal(`
      <h3>${idx >= 0 ? "✏️ 编辑卡世界书条目" : "＋ 新增卡世界书条目"}</h3>
      <label class="field"><span>触发关键词（逗号分隔）</span><input type="text" id="cwb-keys" value="${escapeHtml((e.keys || []).join(", "))}"></label>
      <label class="field"><span>设定内容</span><textarea id="cwb-content" rows="4">${escapeHtml(e.content || "")}</textarea></label>
      <div class="modal-actions">
        <button class="btn" id="cwb-cancel">取消</button>
        <button class="btn primary" id="cwb-ok">保存条目</button>
      </div>`);
    $("#cwb-cancel").onclick = () => this.renderCardEditor();
    $("#cwb-ok").onclick = () => {
      const keys = $("#cwb-keys").value.split(/[,，、]+/).map(x => x.trim()).filter(Boolean).slice(0, 8);
      const content = $("#cwb-content").value.trim().slice(0, 500);
      if (!content) { toast("内容不能为空", "err"); return; }
      const entry = { keys, content };
      if (idx >= 0) s.worldbook[idx] = entry;
      else s.worldbook.push(entry);
      this.renderCardEditor();
    };
  },

  cardListHTML() {
    const list = Game.cards();
    if (!list.length) return '<div class="empty" style="padding:16px"><span class="ee">🎭</span>还没有角色卡</div>';
    return list.map(c => `
      <div class="card-lib-item" data-id="${c.id}">
        <div class="avatar" style="${c.avatar ? `background-image:url(${c.avatar})` : ""}">${c.avatar ? "" : "🎭"}</div>
        <div class="cli-info">
          <div class="cli-name">${escapeHtml(c.name)} ${Game.state.cardId === c.id ? '<span class="tag-on">● 启用中</span>' : ""}</div>
          <div class="cli-sub">${c.analysis?.analyzedAt ? "已分析 · " + c.analysis.world_name : "未分析"} ${c.tags?.length ? " · " + escapeHtml(c.tags.slice(0, 3).join("/")) : ""}</div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0">
          ${Game.state.cardId === c.id ? "" : `<button class="btn sm primary" data-use="${c.id}">启用</button>`}
          <button class="btn sm" data-view="${c.id}">查看</button>
          <button class="btn sm danger" data-delc="${c.id}">删</button>
        </div>
      </div>`).join("");
  },

  bindCardList() {
    $$("#card-list [data-use]").forEach(b => b.onclick = () => {
      const entry = Game.cards().find(c => c.id === b.dataset.use);
      this.confirmActivate(entry);
    });
    $$("#card-list [data-view]").forEach(b => b.onclick = () => this.showCardDetail(b.dataset.view));
    $$("#card-list [data-delc]").forEach(b => b.onclick = () => {
      const cardName = (Game.cards().find(c => c.id === b.dataset.delc) || {}).name || "该角色卡";
      const saveCount = Game.slots().filter(s => (s.cardId || "default") === (b.dataset.delc || "default")).length;
      openModal(`<h3>删除角色卡</h3><p style="font-size:14px">确定删除「${escapeHtml(cardName)}」及其分析数据？<br>
        该角色卡的 <b>${saveCount}</b> 个存档（含自动存档）会一并删除，其它角色卡的存档不受影响。</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="dc-ok">删除</button></div>`);
      $("#dc-ok").onclick = () => {
        Game.saveCards(Game.cards().filter(c => c.id !== b.dataset.delc));
        const removed = Game.deleteCardSaves(b.dataset.delc);
        // 删卡：卸载并移除该卡来源的脚本
        try { if (typeof OWGScript !== "undefined") OWGScript.removeCardScripts(b.dataset.delc); } catch (e) { }
        if (Game.state.cardId === b.dataset.delc) { Game.state.cardId = null; Game.save(); }
        closeModal(); this.refresh(); this.renderSaves();
        toast("已删除角色卡" + (removed ? "，同时删除 " + removed + " 个存档" : ""), "ok");
      };
    });
  },

  pickFile(accept, handler) {
    const fi = $("#file-input");
    fi.accept = accept;
    this._fileHandler = handler;
    fi.click();
  },

  async fetchModelsFlow(role = "main") {
    const s = Game.state.settings;
    if (role === "main") {
      s.apis.main.url = $("#api-url").value.trim(); s.apis.main.key = $("#api-key").value.trim();
    } else {
      const box = $("#page-mine");
      s.apis[role].url = box.querySelector(`[data-role-url="${role}"]`).value.trim();
      s.apis[role].key = box.querySelector(`[data-role-key="${role}"]`).value.trim();
    }
    Game.save();
    const btn = role === "main" ? $("#api-fetch") : $(`#page-mine [data-role-fetch="${role}"]`);
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "拉取中…";
    try {
      const models = await API.listModels(role);
      s.apis[role].models = models;
      // 只在该角色还没填模型名时自动选第一个；手填的模型名不覆盖（拉取失败也能直接用）
      if (!s.apis[role].model) s.apis[role].model = models[0] || "";
      Game.save();
      this.renderMine();
      toast(`连接成功，共 ${models.length} 个模型`, "ok");
    } catch (e) {
      btn.disabled = false; btn.textContent = old;
      const msg = String(e.message || e);
      toast("失败：" + msg + (msg.includes("跨域") ? "（如需跨域代理，请自行在「我的→模型→代理前缀」填写你的代理地址）" : ""), "err");
    }
  },

  /* ---------- 角色卡导入流程 ---------- */
  async importCardFlow(file) {
    let card;
    try {
      openModal(`<h3>正在解析角色卡…</h3><div class="loading-dots">读取文件与内嵌数据<span class="dots">...</span></div>`, { closable: false });
      card = await Card.importFile(file);
    } catch (e) {
      closeModal(); toast("导入失败：" + e.message, "err"); return;
    }
    const list = Game.cards();
    // 同名卡覆盖旧的
    const same = list.findIndex(c => c.name === card.name);
    if (same >= 0) { card.id = list[same].id; list.splice(same, 1); }
    list.unshift(card);
    Game.saveCards(list);
    toast(`已导入角色卡「${card.name}」`, "ok");
    // 卡自带酒馆脚本：导入到脚本管理器（按 hash 去重）
    try { if (typeof OWGScript !== "undefined") OWGScript.importFromCard(card); } catch (e) { }

    if (this.apiReady()) {
      closeModal();
      openModal(`
        <h3>✅ 已导入「${escapeHtml(card.name)}」</h3>
        <p class="hint" style="text-align:center;margin-bottom:6px">接下来想怎么做？</p>
        <div class="ana-block"><h4>🧠 智能分析</h4><p>由模型读取卡片，生成专属世界地图、职业、术语与世界书（约1-3分钟）</p></div>
        <div class="ana-block"><h4>⏭️ 暂不分析，直接导入</h4><p>跳过分析：启用该卡时用卡片自带的世界观与 Lorebook 直接开始剧情；以后可随时在「查看 → 开始分析」补做</p></div>
        <div class="modal-actions" style="flex-wrap:wrap">
          <button class="btn" id="imp-skip">⏭️ 暂不分析</button>
          <button class="btn primary" id="imp-ana">🧠 立即分析</button>
        </div>`);
      $("#imp-ana").onclick = () => { closeModal(); this.showAnalysisModelPicker(card.id); };
      $("#imp-skip").onclick = () => {
        closeModal();
        this.refresh();
        toast("已直接导入（未分析）。启用时将使用卡片自带设定开局", "ok");
        this.showCardDetail(card.id, { tip: "已直接导入（未分析）。点「启用并开始新剧情」即可用卡片自带世界观开局；想生成专属世界可点「开始分析」。" });
      };
    } else {
      card.analysis = Card.localAnalyze(card);
      Game.updateCardEntry(card.id, { analysis: card.analysis, worldbook: card.worldbook && card.worldbook.length ? card.worldbook : card.analysis.worldbook });
      closeModal();
      this.refresh();
      this.showCardDetail(card.id, { tip: "未配置 API，已使用本地降级分析（世界由卡自带世界书构建）。配置后点击「分析」可获得完整定制。" });
    }
  },

  /** 可用于分析的模型池：主模型列表 + 各分工已选模型 */
  analysisModelPool() {
    const apis = Game.state.settings.apis;
    const pool = [];
    const add = (m, from) => { if (m && !pool.find(x => x.id === m)) pool.push({ id: m, from }); };
    if (apis.main.model) add(apis.main.model, "主模型");
    for (const k of ["worldview", "gameplay", "memory"]) {
      const r = apis[k];
      if (r.enabled && r.model) add(r.model, { worldview: "世界观", gameplay: "玩法", memory: "记忆" }[k] + "模型");
    }
    return pool;
  },

  /** 分析前选择参与模型（可多选） */
  showAnalysisModelPicker(cardId) {
    const pool = this.analysisModelPool();
    if (!pool.length) { toast("请先配置并选择至少一个模型", "err"); return; }
    const apis = Game.state.settings.apis;
    const defChecked = new Set([apis.main.model, apis.worldview.enabled && apis.worldview.model, apis.gameplay.enabled && apis.gameplay.model].filter(Boolean));
    openModal(`
      <h3>🧠 选择参与分析的模型</h3>
      <p class="hint" style="margin-bottom:10px">可多选：多个模型将<b>依次</b>分析角色卡的世界观并自动合并结果（以第一个模型为基准，其余补齐地图/职业/世界书）；玩法分析单独进行。选越多越慢。</p>
      ${pool.map(m => `
      <label class="mine-item" style="padding-left:0;padding-right:0;cursor:pointer">
        <input type="checkbox" class="ana-model" value="${escapeHtml(m.id)}" ${defChecked.has(m.id) ? "checked" : ""} style="width:18px;height:18px;flex-shrink:0">
        <div class="mi-main"><div class="mi-title">${escapeHtml(m.id)}</div><div class="mi-sub">${m.from}</div></div>
      </label>`).join("")}
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" id="ana-go">开始分析</button>
      </div>`);
    $("#ana-go").onclick = () => {
      const models = $$("#modal-root .ana-model:checked").map(el => el.value);
      if (!models.length) { toast("至少选择一个模型", "err"); return; }
      closeModal();
      this.analyzeFlow(cardId, models);
    };
  },

  async analyzeFlow(cardId, models = []) {
    const entry = Game.cards().find(c => c.id === cardId);
    if (!entry) return;
    const n = models.length || 1;
    const md = openModal(`
      <h3>🧠 智能分析角色卡</h3>
      <p class="hint" style="text-align:center">正在分析「${escapeHtml(entry.name)}」<br>世界观 / 人设 / 玩法 / 专属世界与职业</p>
      <div class="loading-dots"><span class="typing"><i></i><i></i><i></i></span></div>
      <p class="progress-note" id="ana-stage">阶段 1/${n + 1}：世界观 · 模型 ${escapeHtml(models[0] || "默认")}</p>
      <p class="progress-note" id="ana-prog">已生成 0 字</p>`, { closable: false });
    try {
      const analysis = await Card.analyze(entry, {
        models,
        onDelta: (f) => { const p = $("#ana-prog"); if (p) p.textContent = "已生成 " + f.length + " 字"; },
        onStage: (stage, i, total, model) => {
          const p = $("#ana-stage");
          if (p) p.textContent = stage === "worldview"
            ? `阶段 ${i}/${n + 1}：世界观 · 模型 ${model || "默认"}`
            : `阶段 ${n + 1}/${n + 1}：玩法（人设/玩法/开场）`;
        },
      });
      Game.updateCardEntry(cardId, { analysis, worldbook: analysis.worldbook });
      // 若该卡正处于启用状态，立即同步卡世界书
      if (Game.state.cardId === cardId) Game.syncActiveCardWorldbook();
      closeModal();
      this.refresh();
      this.showCardDetail(cardId, { fresh: true });
    } catch (e) {
      closeModal();
      toast("分析失败：" + e.message + "，可稍后在角色卡列表重试", "err");
      if (!entry.analysis) {
        Game.updateCardEntry(cardId, { analysis: Card.localAnalyze(entry) });
      }
      this.refresh();
    }
  },

  /** 角色卡详情 / 分析结果弹窗 */
  showCardDetail(cardId, { fresh = false, tip = "" } = {}) {
    const c = Game.cards().find(x => x.id === cardId);
    if (!c) return;
    const an = c.analysis;
    const mapsInfo = an?.maps?.length
      ? `🗺️ ${escapeHtml(an.world_name)}：${an.maps.map(m => `${escapeHtml(m.name)}(${m.locations.length})`).join(" · ")}`
      : "使用默认世界地图";
    const clsInfo = an?.classes?.length
      ? `⚔️ 专属职业（创建新角色可选）：${an.classes.map(c => `${escapeHtml(c.icon)}${escapeHtml(c.name)}`).join("、")}`
      : "";
    const attrInfo = an?.attr_names
      ? `🧬 属性名：${Object.values(an.attr_names).map(escapeHtml).join(" / ")}`
      : "";
    const termInfo = an?.term_names
      ? `📖 术语：${Game.termName("level")}·${Game.termName("exp")}·${Game.termName("gold")}·${Game.termName("skill")}·${Game.termName("class")}（由本卡世界观生成）`
      : "";
    const wbInfo = an?.worldbook?.length
      ? `📚 世界书：${an.worldbook.length} 条设定（启用后可在「我的」页管理）`
      : "";
    const load = an ? Card.loadoutOf(an) : null;
    const loadInfo = load
      ? `💰 初始${escapeHtml(Game.termName("gold"))}：<b>${load.initial_gold}</b> · 依据：${escapeHtml(load.reason)}` +
        (load.priceLevel ? `<br>🏷️ 物价档：${escapeHtml(load.priceLevel)}` : "") +
        `<br>🎒 初始物品：${load.initial_items.map(x => `${escapeHtml(x.name)}×${x.count}（价值 ${x.price}）`).join("、")}`
      : "";
    const ownInfo = `该卡自带：脚本 ${(Array.isArray(c.scripts) ? c.scripts.length : 0)}`;
    const md = openModal(`
      <h3>${c.avatar ? `<img src="${c.avatar}" style="width:40px;height:40px;border-radius:10px;vertical-align:-12px;margin-right:6px">` : "🎭"} ${escapeHtml(c.name)}</h3>
      ${tip ? `<div class="story-banner">${escapeHtml(tip)}</div>` : ""}
      <div class="hint" style="text-align:center">${escapeHtml(ownInfo)}</div>
      ${an ? `
        <div class="ana-block"><h4>🌍 世界观</h4><p>${escapeHtml(an.worldview)}</p></div>
        <div class="ana-block"><h4>🧍 人设</h4><p>${escapeHtml(an.persona || "—")}</p></div>
        <div class="ana-block"><h4>🎮 玩法</h4><p>${escapeHtml(an.gameplay || "—")}</p></div>
        <div class="ana-block"><h4>👤 玩家扮演</h4><p>${escapeHtml(an.player_role || "—")}</p></div>
        <div class="ana-block"><h4>💰 初始货币与行囊</h4><p>${loadInfo}</p></div>
        <div class="ana-block"><h4>🗺️ 开放世界</h4><p>${mapsInfo}</p></div>
        ${clsInfo ? `<div class="ana-block"><h4>⚔️ 世界专属职业</h4><p>${clsInfo}</p></div>` : ""}
        ${attrInfo ? `<div class="ana-block"><h4>🧬 属性命名</h4><p>${attrInfo}</p></div>` : ""}
        ${termInfo ? `<div class="ana-block"><h4>📖 世界术语</h4><p>${termInfo}</p></div>` : ""}
        ${wbInfo ? `<div class="ana-block"><h4>📚 世界书</h4><p>${wbInfo}</p></div>` : ""}
      ` : `<div class="empty" style="padding:16px"><span class="ee">🧠</span>尚未分析</div>`}
      ${!an?.analyzedAt || !an?.maps ? `<div class="story-banner">该卡尚未完成智能分析（需要配置 API）</div>` : ""}
      <div class="modal-actions" style="flex-wrap:wrap">
        <button class="btn" id="cd-analyze">🧠 ${an?.analyzedAt ? "重新分析" : "开始分析"}</button>
        <button class="btn" id="cd-edit">✏️ 编辑卡与世界书</button>
        ${Game.state.cardId === c.id ? '<button class="btn" disabled>已启用</button>' : '<button class="btn gold" id="cd-use">启用并开始新剧情</button>'}
      </div>`);
    $("#cd-analyze").onclick = () => {
      if (!this.apiReady()) { toast("请先配置 API 与模型", "err"); return; }
      closeModal(); this.showAnalysisModelPicker(cardId);
    };
    $("#cd-edit").onclick = () => { closeModal(); this.showCardEditor(cardId); };
    const use = $("#cd-use"); if (use) use.onclick = () => { closeModal(); this.confirmActivate(c); };
    if (fresh) toast("分析完成！", "ok");
  },

  /** 启用角色卡：该卡有存档时先选择「继续某存档」或「新开一局」 */
  confirmActivate(entry, opts = {}) {
    if (!entry) return;
    if (!opts.skipSaves && typeof OWGSaves !== "undefined") {
      const saves = OWGSaves.forCard(entry.id);
      if (saves.length) { this.showActivateSaves(entry, saves); return; }
    }
    const greetings = [];
    const ai = String(entry.analysis?.opening || "").trim();
    if (ai) greetings.push({ label: "AI 分析生成的开场", text: ai });
    // 优先用卡内原始开场（保留 <style>/HTML 美化），清洗后的文本仅作兜底
    const rawFirst = String((entry.display && entry.display.first_mes) || "").trim();
    if (rawFirst) greetings.push({ label: "原开场白", text: rawFirst });
    else if (String(entry.first_mes || "").trim()) greetings.push({ label: "原开场白", text: String(entry.first_mes).trim() });
    const rawAlts = (entry.display && Array.isArray(entry.display.alternate_greetings))
      ? entry.display.alternate_greetings
      : (entry.display && Array.isArray(entry.display.alts) ? entry.display.alts
        : (entry.alternate_greetings || entry.alt_greetings || []));
    (rawAlts || []).forEach((g, i) => {
      if (String(g || "").trim()) greetings.push({ label: `备选开场白 ${i + 1}`, text: String(g).trim() });
    });
    if (greetings.length > 1) {
      openModal(`<h3>选择开场白</h3>
        <p style="font-size:14px">「${escapeHtml(entry.name)}」有 <b>${greetings.length}</b> 个开场，选择一个作为新剧情的起点。启用后角色重置为初始状态，当前进度会先存入自动存档。</p>
        <div style="max-height:320px;overflow-y:auto;margin-top:10px">
        ${greetings.map((g, i) => `<div class="greet-item" data-greet="${i}" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer">
          <div style="font-size:12.5px;font-weight:700;color:var(--acc2);margin-bottom:4px">${escapeHtml(g.label)}</div>
          <div style="font-size:12.5px;color:var(--txt2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(g.text.replace(/\s+/g, " "))}</div>
        </div>`).join("")}
        </div>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button></div>`);
      $$("#modal-root [data-greet]").forEach(el => el.onclick = () => this._startActivate(entry, greetings[+el.dataset.greet].text));
      return;
    }
    this._startActivate(entry, greetings[0]?.text);
  },

  /** 启用前的存档选择：只列出该角色卡名下存档；读档复用 Game.loadSave */
  showActivateSaves(entry, saves) {
    openModal(`<h3>启用「${escapeHtml(entry.name)}」</h3>
      <p style="font-size:14px">这张角色卡名下已有 <b>${saves.length}</b> 个存档。选择一个继续该剧情，或直接新开一局。${saves.every(s => (s.cardId || "default") === entry.id) ? "" : ""}</p>
      <div style="max-height:300px;overflow-y:auto;margin-top:10px">
        ${saves.map(s => `
          <div class="save-slot ${s.auto ? "auto" : ""}" style="margin-bottom:8px">
            <div style="font-size:20px">${s.auto ? "🔄" : "💾"}</div>
            <div class="s-info">
              <div class="s-name">${escapeHtml(s.name)}${s.auto ? '<span class="tag-auto">自动</span>' : ""}</div>
              <div class="s-meta">${fmtTime(s.ts)} · ${OWGSaves.summary(s)}</div>
            </div>
            <button class="btn sm primary" data-as-load="${s.id}">读档进入</button>
          </div>`).join("")}
      </div>
      <p class="hint" style="margin-top:6px">读档会以该存档那一刻的剧情与角色状态继续；当前未存档的剧情会作废。</p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn gold" id="as-new">＋ 新开一局</button>
      </div>`);
    $("#as-new").onclick = () => { closeModal(); this.confirmActivate(entry, { skipSaves: true }); };
    $$("#modal-root [data-as-load]").forEach(b => b.onclick = () => {
      const slot = saves.find(s => s.id === b.dataset.asLoad);
      if (!slot) { toast("存档不存在", "err"); return; }
      openModal(`<h3>读档进入</h3>
        <p style="font-size:14px">将载入「${escapeHtml(slot.name)}」并启用「${escapeHtml(entry.name)}」，<b>当前未存档的剧情会作废</b>。是否继续？</p>
        <div class="modal-actions"><button class="btn" id="as-cancel">返回</button><button class="btn primary" id="as-ok">读档</button></div>`);
      $("#as-cancel").onclick = () => this.showActivateSaves(entry, saves);
      $("#as-ok").onclick = () => {
        const prevCardId = Game.state.cardId;
        // 复用现有读档逻辑：临时对齐卡归属，让 loadSave 的校验通过
        Game.state.cardId = entry.id;
        if (!Game.loadSave(slot.id)) {
          Game.state.cardId = prevCardId;
          toast("读档失败：存档可能已损坏", "err");
          return;
        }
        closeModal();
        this.refresh();
        this.switchTab("story");
        this.scrollStory(true);
        toast("已读档并启用：" + slot.name, "ok");
      };
    });
  },

  _startActivate(entry, opening) {
    openModal(`<h3>启用角色卡</h3>
      <p style="font-size:14px">启用「${escapeHtml(entry.name)}」将载入其专属世界并<b>开启全新剧情：角色将重置为初始状态（1级、初始属性、初始物品与金币，保留姓名）</b>。当前进度会先存入自动存档。</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn gold" id="ac-ok">启用</button></div>`);
    $("#ac-ok").onclick = async () => {
      closeModal();
      Game.createSave(null, true);
      Game.activateCard(entry, { resetStory: true, opening });
      if (!Game.state.player) {
        // 未创角则先创角再启用（保留剧情开场）
        const msgs = Game.state.messages.slice();
        Game.save();
        this.showOnboard(() => { Game.state.messages = msgs; Game.save(); this.refresh(); });
        return;
      }
      this.refresh();
      if (Game.state.needClassPick) {
        Game.state.needClassPick = false; Game.save();
        this.showClassPick(() => {
          this.switchTab("story");
          if (!Game.state.messages.length && this.apiReady()) {
            this.doSend("（请以当前角色卡与世界为背景，生成开场剧情。）");
          } else { this.scrollStory(true); toast("已启用「" + entry.name + "」", "ok"); }
        });
        return;
      }
      this.switchTab("story");
      if (!Game.state.messages.length && this.apiReady()) {
        this.doSend("（请以当前角色卡与世界为背景，生成开场剧情。）");
      } else {
        this.scrollStory(true);
        toast(`已启用「${entry.name}」`, "ok");
      }
    };
  },

  /* ---------- 玩家改名 ---------- */
  renameFlow() {
    openModal(`<h3>修改名字</h3>
      <label class="field"><span>新名字</span><input type="text" id="rn-name" maxlength="12" value="${escapeHtml(Game.state.player.name)}"></label>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="rn-ok">确定</button></div>`);
    $("#rn-ok").onclick = () => {
      const v = $("#rn-name").value.trim();
      if (v) { Game.state.player.name = v; Game.save(); this.refresh(); toast("已改名", "ok"); }
      closeModal();
    };
  },

  /* ================= 引导弹窗 ================= */
  showWelcome() {
    openModal(`
      <h3>⚔️ 欢迎来到开放世界</h3>
      <p style="font-size:14px;line-height:1.8">这是一款<b>文字角色扮演开放世界游戏</b>：<br>
      · 接入任意 OpenAI 兼容 API 驱动剧情<br>
      · 8 大地图 · 60+ 地点自由探索<br>
      · 等级 / 属性 / 技能 / 物品成长系统<br>

      <div class="modal-actions">
        <button class="btn" id="wl-char">先创建角色</button>

    $("#wl-api").onclick = () => { closeModal(); this.switchTab("mine"); setTimeout(() => $("#api-url")?.focus(), 100); };
    $("#wl-char").onclick = () => { closeModal(); this.showOnboard(); };

  showOnboard(after) {

    openModal(`
      <h3>🧙 创建你的角色</h3>

      <label class="field"><span>姓名</span><input type="text" id="ob-name" maxlength="12" placeholder="旅行者"></label>

      <div class="cls-grid">${names.map((n, i) => {
        const c = CLS_MAP[n];
        return `<div class="cls-opt ${i === 0 ? "sel" : ""}" data-cls="${escapeHtml(n)}">
          <div class="ce">${c.icon}</div><div class="cn">${escapeHtml(n)}</div><div class="cd">${escapeHtml(c.desc || "")}</div>
        </div>`;
      }).join("")}</div>
      <p class="hint" id="ob-hint" style="text-align:center;margin-bottom:4px">${this.clsHint(CLS_MAP[sel])}</p>
      <div class="modal-actions"><button class="btn primary" id="ob-ok">开始冒险 ⚔️</button></div>`, { closable: true });
    let chosen = sel;
    $$(".cls-opt").forEach(el => el.onclick = () => {
      $$(".cls-opt").forEach(x => x.classList.remove("sel"));

    $("#ob-ok").onclick = () => {

      this.switchTab("story");
      if (this.apiReady() && !Game.state.messages.length) {
        this.doSend("（我刚踏上冒险之路，来到了当前地点。请以当前世界为背景生成开场剧情：交代时代背景、我为何在此，并描写周围环境，结尾留出行动空间。）");
      }
    };
  },

  /** 只选职业（不重开角色）：新一局时用 */
  showClassPick(after) {
    const CLS_MAP = Game.classes();
    const names = Object.keys(CLS_MAP);
    if (!names.length) { if (after) after(); return; }
    const cur = Game.state.player?.cls;
    let chosen = names.includes(cur) ? cur : names[0];
    openModal(`
      <h3>🧙 选择职业</h3>
      <p class="hint" style="text-align:center">${Game.state.worldSource === "card" ? "本世界职业由角色卡世界观生成" : "默认世界职业"} · 选定后本局沿用</p>
      <div class="cls-grid">${names.map((n) => {
        const c = CLS_MAP[n];
        return `<div class="cls-opt ${n === chosen ? "sel" : ""}" data-cls="${escapeHtml(n)}">
          <div class="ce">${c.icon}</div><div class="cn">${escapeHtml(n)}</div><div class="cd">${escapeHtml(c.desc || "")}</div>
        </div>`;
      }).join("")}</div>
      <p class="hint" id="cp-hint" style="text-align:center;margin-bottom:4px">${this.clsHint(CLS_MAP[chosen])}</p>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="cp-ok">确定</button></div>`);
    $$(".cls-opt").forEach(el => el.onclick = () => {
      $$(".cls-opt").forEach(x => x.classList.remove("sel"));
      el.classList.add("sel");
      chosen = el.dataset.cls;
      $("#cp-hint").textContent = this.clsHint(CLS_MAP[chosen]);
    });
    $("#cp-ok").onclick = () => {
      Game.setPlayerClass(chosen);
      closeModal();
      toast("职业已切换为「" + chosen + "」", "ok");
      this.refresh();
      if (after) after();
    };
  },
  clsHint(c) {
    const a = c.attrs;
    return `${Game.attrName("hp")}${a.hp} / ${Game.attrName("mp")}${a.mp} / ${Game.attrName("atk")}${a.atk} / ${Game.attrName("def")}${a.def}`;
  },

  /* ---------- 升级 / 死亡 ---------- */
  showLevelUp(n) {
    const p = Game.state.player;
    openModal(`
      <h3>✨ 升级！</h3>
      <p style="font-size:15px;text-align:center"> Lv.${p.level - n} → <b style="color:var(--gold);font-size:22px">Lv.${p.level}</b><br>
      <span style="font-size:13px;color:var(--txt2)">获得 ${5 * n} 属性点 · 生命与魔力全满</span></p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">继续冒险</button>
        <button class="btn gold" id="lu-go">去加点</button>
      </div>`);
    $("#lu-go").onclick = () => { closeModal(); this.switchTab("status"); };
  },

  showDeath() {
    const p = Game.state.player;
    openModal(`
      <h3>💀 你倒下了…</h3>
      <p style="font-size:14px;text-align:center">视野渐暗，冒险在此中断。<br><span class="hint">可消耗部分金币被神秘力量复活，或读取自动存档。</span></p>
      <div class="modal-actions">
        <button class="btn" id="de-load">读取自动存档</button>
        <button class="btn gold" id="de-rev">复活（-20%金币）</button>
      </div>`, { closable: false });
    $("#de-rev").onclick = () => {
      p.d.hp = Math.floor(p.d.maxHp * 0.5);
      p.d.mp = Math.floor(p.d.maxMp * 0.5);
      p.gold = Math.floor(p.gold * 0.8);
      p.statuses = ["虚弱"];
      Game.save(); closeModal(); this.refresh();
      toast("你在神殿中醒来，身体仍有些虚弱", "ok");
    };
    $("#de-load").onclick = () => {
      if (Game.slots().some(s => s.id === "auto")) {
        Game.loadSave("auto"); closeModal(); this.refresh(); this.switchTab("story"); toast("已回到自动存档", "ok");
      } else {
        closeModal(); toast("没有自动存档，请复活", "err");
      }
    };
  },
};

window.closeModal = closeModal;
document.addEventListener("DOMContentLoaded", () => UI.init());

/* ---------- 剧情脚本兼容层（给卡/预设里的 TavernHelper 式脚本用） ----------
 * 只补真实会被调用的最小集合，不模拟整个酒馆：
 *  - 剧情区渲染能力（getStoryContainer / renderStoryHTML / setChatMessageHTML）已移除，
 *    调用时给出明确提示并返回安全值，脚本不会因为空引用崩页
 *  - TavernHelper 上挂同名空实现 + 事件桥，脚本报错会进控制台，不静默
 */
window.getStoryContainer = function () { owgRenderRemoved("getStoryContainer"); return document.createElement("div"); };
window.renderStoryHTML = function () { owgRenderRemoved("renderStoryHTML"); return null; };
window.setChatMessageHTML = function () { owgRenderRemoved("setChatMessageHTML"); return false; };
window.TavernHelper = Object.assign(window.TavernHelper || {}, {
  getStoryContainer: window.getStoryContainer,
  renderStoryHTML: window.renderStoryHTML,
  setChatMessageHTML: window.setChatMessageHTML,
  eventOn: function (name, fn) { return OWGTH.eventOn(name, fn); },
  eventOnce: function (name, fn) { return OWGTH.eventOnce ? OWGTH.eventOnce(name, fn) : OWGTH.eventOn(name, fn); },
  eventEmit: function (name, data) { return OWGTH.emit(name, data); },
  eventRemoveListener: function (name, fn) { return OWGTH.eventRemoveListener ? OWGTH.eventRemoveListener(name, fn) : false; },
  getVariables: function () { return Game.state.vars || {}; },
  updateVariables: function (obj) { if (obj && typeof obj === "object") Object.assign(Game.state.vars || (Game.state.vars = {}), obj); Game.save(); return true; },
  toast: function (msg) { toast(String(msg || ""), ""); },
});

<script>
/* ========== 酒馆互通（SillyTavern Bridge）============ */
"use strict";

/* 酒馆世界书条目位置枚举，对齐 SillyTavern 的 world_info_position */
const ST_POS = { BEFORE_CHAR: 0, AFTER_CHAR: 1, BEFORE_AN: 2, AFTER_AN: 3, AT_DEPTH: 4, EM_TOP: 5, EM_BOTTOM: 6, OUTLET: 7 };
const ST_POS_LABEL = {
  0: "角色定义前 before_char",
  1: "角色定义后 after_char",
  2: "作者注前 before_an",
  3: "作者注后 after_an",
  4: "指定深度 at_depth",
  5: "示例消息前 EMTop",
  6: "示例消息后 EMBottom",
  7: "外部 outlet（不注入）",
};

const STBridge = {
  /* ---------------- 基础工具 ---------------- */
  utf8ToB64(str) {
    const bytes = new TextEncoder().encode(String(str));
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  },
  b64ToUtf8(b64) {
    const bin = atob(String(b64).replace(/\s+/g, ""));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  },
  safeName(s, fallback) {
    const t = String(s == null ? "" : s).replace(/[\\/:*?"<>|\r\n\t]/g, "_").trim();
    return t || (fallback || "untitled");
  },
  downloadBlob(filename, blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  downloadText(filename, text, mime) {
    this.downloadBlob(filename, new Blob([text], { type: (mime || "application/json") + ";charset=utf-8" }));
  },
  nowISO(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.toISOString();
  },

  /* ---------------- 宏（对齐酒馆宏语法）---------------- */
  macroContext() {
    const st = Game.state;
    const card = Game.activeCard();
    const last = st.messages.filter(m => m.role === "assistant").slice(-1)[0];
    return {
      user: (st.player && st.player.name) || "旅行者",
      char: (card && card.name) || "",
      persona: (st.settings && st.settings.persona) || "",
      description: (card && card.description) || "",
      personality: (card && card.personality) || "",
      scenario: (card && card.scenario) || "",
      creatorNotes: (card && card.creator_notes) || "",
      systemPrompt: (card && card.system_prompt) || "",
      mesExamples: (card && card.mes_example) || "",
      charVersion: (card && card.character_version) || "",
      firstMes: (card && card.first_mes) || "",
      lastMessage: (last && last.content) || "",
      original: "",
    };
  },
  macro(text, ctx) {
    if (!text) return "";
    const c = ctx || this.macroContext();
    const rawText = String(text);
    const now = new Date();
    const p2 = n => String(n).padStart(2, "0");
    const pickOne = s => {
      const list = String(s == null ? "" : s).split(",").map(x => x.trim()).filter(Boolean);
      return list.length ? list[Math.floor(Math.random() * list.length)] : "";
    };
    const rollOne = s => {
      const m = /^\s*(\d+)\s*d\s*(\d+)\s*$/i.exec(String(s || ""));
      if (m) {
        const n = Math.max(1, parseInt(m[1], 10) || 1);
        const faces = Math.max(1, parseInt(m[2], 10) || 6);
        let total = 0;
        for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * faces);
        return String(total);
      }
      const faces = Math.max(1, parseInt(String(s).trim(), 10) || 20);
      return String(1 + Math.floor(Math.random() * faces));
    };
    return String(text).replace(/\{\{([^{}]*)\}\}/g, (m, raw) => {
      const body = String(raw).trim();
      if (!body) return m;
      if (body.startsWith("//")) return "";
      let name = body, arg = null;
      const idx = body.search(/[:\s]/);
      if (idx > 0) {
        name = body.slice(0, idx);
        arg = body.slice(idx).replace(/^:{1,2}\s*/, "");
      }
      const k = name.toLowerCase();
      if (k === "getvar" || k === "getglobalvar") {
        const key = String(arg || "").trim();
        // 读取顺序：message → chat → character → preset → global（getglobalvar 只取 global）
        let val;
        if (typeof STAssist !== "undefined") {
          val = STAssist.getVar(key, { scope: k === "getglobalvar" ? "global" : "cache" });
        }
        // 兼容旧数据：仍可读取预设在 Game.state.settings.preset.vars 里的值
        if (val === undefined) {
          const legacy = (Game.state.settings.preset && Game.state.settings.preset.vars) || {};
          if (Object.prototype.hasOwnProperty.call(legacy, key)) val = legacy[key];
        }
        return val == null ? "" : String(val);
      }
      if (k === "setvar" || k === "setglobalvar") {
        const parts = String(arg || "").split("::");
        const vk = String(parts[0] || "").trim();
        const vv = parts.slice(1).join("::");
        if (vk) {
          const scope = k === "setglobalvar" ? "global" : "chat";
          if (typeof STAssist !== "undefined") STAssist.setVar(vk, vv, { scope });
          // 兼容旧逻辑：同时写回预设 vars，保证旧存档/旧界面读得到
          if (!Game.state.settings.preset) Game.state.settings.preset = {};
          if (!Game.state.settings.preset.vars) Game.state.settings.preset.vars = {};
          Game.state.settings.preset.vars[vk] = vv;
        }
        return "";
      }
      switch (k) {
        case "user": return c.user;
        case "char": return c.char;
        case "persona": return c.persona;
        case "description": return c.description;
        case "personality": return c.personality;
        case "scenario": return c.scenario;
        case "creatornotes": return c.creatorNotes;
        case "charprompt": return c.systemPrompt;
        case "mesexamples": return c.mesExamples;
        case "charversion": return c.charVersion;
        case "charfirstmessage": return c.firstMes;
        case "lastmessage": return c.lastMessage;
        case "original": return c.original || rawText;
        case "newline": return "\n";
        case "time": return p2(now.getHours()) + ":" + p2(now.getMinutes());
        case "date": return now.getFullYear() + "-" + p2(now.getMonth() + 1) + "-" + p2(now.getDate());
        case "isotime": return now.toISOString();
        case "weekday": return "星期" + "日一二三四五六"[now.getDay()];
        case "roll": return rollOne(arg);
        case "random": return pickOne(arg);
        case "pick": return pickOne(arg);
        default: return m; /* 未知宏保持原样，与酒馆一致 */
      }
    });
  },

  /* ---------------- 世界书条目 <-> 本页条目 ---------------- */
  normalizePosition(p) {
    if (typeof p === "number" && p >= 0 && p <= 7) return p;
    const s = String(p == null ? "" : p).toLowerCase().trim();
    const map = {
      before_char: 0, beforechar: 0, before: 0,
      after_char: 1, afterchar: 1, after: 1,
      before_an: 2, beforean: 2,
      after_an: 3, afteran: 3,
      at_depth: 4, atdepth: 4,
      emtop: 5, em_top: 5, before_examples: 5,
      embottom: 6, em_bottom: 6, after_examples: 6,
      outlet: 7,
    };
    return s in map ? map[s] : 1;
  },
  positionOf(entry) {
    if (!entry) return 1;
    if (entry.position !== undefined && entry.position !== null) return this.normalizePosition(entry.position);
    if (entry.extensions && entry.extensions.position !== undefined) return this.normalizePosition(entry.extensions.position);
    return entry.constant || entry.always ? 0 : 1;
  },
  /** 酒馆条目 / 角色卡内嵌条目 → 本页世界书条目 */
  toAppEntry(e, source, idx) {
    if (!e || typeof e !== "object") return null;
    const keys = Array.isArray(e.keys) ? e.keys.map(String)
      : Array.isArray(e.key) ? e.key.map(String)
        : e.key ? [String(e.key)] : [];
    const sec = Array.isArray(e.secondary_keys) ? e.secondary_keys.map(String)
      : Array.isArray(e.keysecondary) ? e.keysecondary.map(String) : [];
    const constant = e.constant !== undefined ? !!e.constant : !!e.always;
    const enabled = e.enabled !== undefined ? e.enabled !== false : e.disable !== true;
    return {
      id: e.id || uid(),
      keys: keys.slice(0, 16),
      secondary_keys: sec.slice(0, 16),
      content: String(e.content != null ? e.content : (e.text != null ? e.text : "")),
      comment: String(e.comment || ""),
      always: constant,
      constant: constant,
      selective: !!e.selective,
      selectiveLogic: e.selectiveLogic != null ? e.selectiveLogic : 0,
      order: e.order != null ? e.order : (e.insertion_order != null ? e.insertion_order : 100),
      position: this.normalizePosition(e.position !== undefined ? e.position : (e.extensions && e.extensions.position)),
      depth: e.depth != null ? e.depth : (e.extensions && e.extensions.depth != null ? e.extensions.depth : 4),
      probability: e.probability != null ? Number(e.probability) : 100,
      group: String(e.group != null ? e.group : (e.extensions && e.extensions.group != null ? e.extensions.group : "")),
      caseSensitive: e.caseSensitive === true,
      matchWholeWords: e.matchWholeWords === true,
      scanDepth: e.scanDepth != null ? Number(e.scanDepth) : 6,
      enabled: enabled,
      source: source || "user",
    };
  },
  toAppEntries(list, source) {
    const out = [];
    (Array.isArray(list) ? list : []).forEach((e, i) => {
      const it = this.toAppEntry(e, source, i);
      if (it && it.content) out.push(it);
    });
    return out;
  },

  /* ---------------- 角色卡（Character Card V2）---------------- */
  /** 本页角色卡 → 酒馆 V2 角色卡 JSON */
  buildCardV2(card) {
    const c = card || {};
    const book = this.buildCharacterBook(c);
    return {
      spec: "chara_card_v2",
      spec_version: "2.0",
      data: {
        name: c.name || "",
