  /** 被动技能 → 被动效果 id */
  guessPassive(text) {
    const t = String(text || "");
    const has = re => re.test(t);
    if (has(/不屈|免死|致命|保命/)) return "p_laststand";
    if (has(/荆棘|反伤|反弹/)) return "p_thorns";
    if (has(/嗜血|吸血|汲取/)) return "p_lifesteal";
    if (has(/再生|回春|恢复|回复/)) return "p_regen";
    if (has(/先手|抢先|疾行/)) return "p_firststrike";
    if (has(/灵流|回魔|魔力回复/)) return "p_manaflow";
    if (has(/锐眼|暴击|洞察/)) return "p_crit";
    if (has(/迅捷|速度|疾风/)) return "p_spd";
    if (has(/守护|防御|铁壁/)) return "p_def";
    return "p_atk";
  },
  /** 统一解析：任何技能（玩家/队友/敌人/装备附带）→ 运行参数 */
  resolve(sk) {
    const s = sk || {};
    const name = String(s.name || "技能").slice(0, 18);
    const desc = String(s.desc || "").slice(0, 120);
    const passive = s.passive === true || /被动|常驻|光环|天赋/.test(name + desc);
    const magic = s.magic === true || /法|术|咒|雷|火|冰|风|光|暗|召唤|治疗|治愈/.test(name + desc);
    const id = (s.fx && this.byId(s.fx)) ? s.fx : (passive ? this.guessPassive(name + " " + desc) : this.guess(name + " " + desc, magic));
    const c = this.byId(id) || this.byId("s_heavy");
    const cost = passive ? 0 : (s.mpCost != null ? clamp(Math.round(+s.mpCost), 0, 200) : (s.cost != null ? clamp(Math.round(+s.cost), 0, 200) : (c.mp || 10)));
    const power = (s.fx && s.power != null) ? clamp(+s.power || 1, 0.3, 4) : (c.power || 1);
    const cd = passive ? 0 : (s.cd != null ? Math.max(0, Math.round(+s.cd)) : (c.cd || 0));
    const uses = s.uses != null ? Math.max(0, Math.round(+s.uses)) : (c.uses != null ? c.uses : null);
    return Object.assign({}, c, {
      id, name, desc, passive, magic, cost, cd, uses,
      power: Math.round(power * 100) / 100,
      cdText: cd ? cd + " 回合" : "无冷却",
    });
  },
  targetText(tgt) {
    return { allEnemies: "敌方全体", oneEnemy: "单个敌方", self: "自身", oneAlly: "单个队友", allAllies: "我方全体" }[tgt] || "单个敌方";
  },
};

/** 状态效果：DOT / 控制 / 增减益 / 护盾 / 嘲讽 / 闪避 / 免疫 / 反伤 */
const OWGStatus = {
  NAME: {
    burn: "灼烧", poison: "中毒", bleed: "流血", freeze: "冰冻", stun: "眩晕", sleep: "睡眠",
    paralyze: "麻痹", silence: "沉默", atkUp: "攻击↑", defUp: "防御↑", spdUp: "速度↑", critUp: "暴击↑",
    atkDown: "攻击↓", defDown: "防御↓", spdDown: "速度↓", vuln: "易伤", shield: "护盾",
    taunt: "嘲讽", evade: "闪避", immune: "免疫", reflect: "反伤", counter: "反击", regen: "回春",
  },
  ICON: {
    burn: "🔥", poison: "☠️", bleed: "🩸", freeze: "❄️", stun: "💫", sleep: "💤", paralyze: "⚡", silence: "🔇",
    atkUp: "⚔️", defUp: "🛡️", spdUp: "💨", critUp: "✨", atkDown: "🔻", defDown: "🔻", spdDown: "🔻",
    vuln: "💔", shield: "🛡", taunt: "🎯", evade: "👻", immune: "🔮", reflect: "🌵", counter: "↩️", regen: "💚",
  },
  BAD: ["burn", "poison", "bleed", "freeze", "stun", "sleep", "paralyze", "silence", "atkDown", "defDown", "spdDown", "vuln"],
  CONTROL: ["freeze", "stun", "sleep", "paralyze"],
  has(u, k) { return !!(u && u.st && u.st.some(s => s.k === k)); },
  get(u, k) { return u && u.st ? u.st.filter(s => s.k === k) : []; },
  /** 加状态（同种取较强/刷新，护盾叠加） */
  add(u, k, opts = {}) {
    if (!u) return false;
    if (!u.st) u.st = [];
    if (k === "shield") {
      const val = Math.max(0, Math.round(opts.val || 0));
      if (!val) return false;
      u.st.push({ k, name: this.NAME[k] || k, val, turns: opts.dur != null ? opts.dur : 3, fresh: true });
      return true;
    }
    if (this.has(u, "immune") && this.BAD.includes(k)) return false;
    const ex = u.st.find(s => s.k === k);
    const turns = opts.dur != null ? opts.dur : 2;
    if (ex) {
      ex.turns = Math.max(ex.turns, turns);
      ex.val = Math.max(ex.val || 0, opts.val || 0);
      ex.dmg = Math.max(ex.dmg || 0, opts.dmg || 0);
      ex.fresh = true;
      return true;
    }
    u.st.push({ k, name: this.NAME[k] || k, val: opts.val || 0, turns, dmg: opts.dmg || 0, pct: opts.pct || 0, flat: opts.flat || 0, fresh: true });
    return true;
  },
  remove(u, k) { if (u && u.st) u.st = u.st.filter(s => s.k !== k); },
  /** 清除负面（净化） */
  cleanse(u) { if (u && u.st) u.st = u.st.filter(s => !this.BAD.includes(s.k)); },
  /** 驱散增益 */
  dispel(u) {
    if (!u || !u.st) return 0;
    const before = u.st.length;
    u.st = u.st.filter(s => this.BAD.includes(s.k) || s.k === "shield");
    return before - u.st.length;
  },
  /** 生效属性：叠加百分比增减益 */
  stats(u, key, b) {
    let v = Number(u && u[key]) || 0;
    if (key === "crit") {
      for (const s of (u.st || [])) if (s.k === "critUp") v += (s.val || 0);
      return Math.round(v * 10) / 10;
    }
    if (key === "spd" && b && b.round === 1 && u.firstStrike) v *= u.firstStrike;
    for (const s of (u.st || [])) {
      if (s.k === key + "Up") v *= 1 + (s.val || 0);
      if (s.k === key + "Down") v *= 1 - Math.min(0.9, s.val || 0);
    }
    return Math.max(1, Math.round(v));
  },
  /** 状态摘要（战斗面板） */
  summary(u) {
    if (!u || !u.st || !u.st.length) return "";
    return u.st.filter(s => s.turns > 0 || s.k === "shield").map(s => {
      if (s.k === "shield") return `🛡${Math.max(0, Math.round(s.val))}`;
      const nm = this.NAME[s.k] || s.k;
      return (this.ICON[s.k] || "") + nm + (s.turns ? s.turns : "");
    }).join(" · ");
  },
};

/* ---------------------------------------------------------------
 * 2.6) 装备品质与特殊效果（随品质/等级提升，战斗中真实生效）
 * ------------------------------------------------------------- */
const OWGEquip = {
  RARITY: [
    { k: "common", name: "普通", mult: 1.0, color: "#9aa3c7", order: 0 },
    { k: "fine", name: "精良", mult: 1.25, color: "#7ecb8f", order: 1 },
    { k: "rare", name: "稀有", mult: 1.6, color: "#6fb3e0", order: 2 },
    { k: "epic", name: "史诗", mult: 2.0, color: "#c79bf0", order: 3 },
    { k: "legendary", name: "传说", mult: 2.5, color: "#e8c574", order: 4 },
  ],
  SPECIALS: [
    { k: "lifesteal", name: "吸血", base: 0.06, perLv: 0.002, cap: 0.35, fmt: v => `攻击吸取 ${Math.round(v * 100)}% 伤害为生命` },
    { k: "thorns", name: "反伤", base: 0.08, perLv: 0.003, cap: 0.45, fmt: v => `受近战伤害时反弹 ${Math.round(v * 100)}%` },
    { k: "shieldStart", name: "开战护盾", base: 10, perLv: 1.4, cap: 220, fmt: v => `战斗开始获得 ${Math.round(v)} 点护盾` },
    { k: "crit", name: "暴击强化", base: 2.5, perLv: 0.12, cap: 22, fmt: v => `暴击率 +${Math.round(v * 10) / 10}%` },
    { k: "controlResist", name: "控制抗性", base: 0.10, perLv: 0.004, cap: 0.65, fmt: v => `免疫控制的概率 +${Math.round(v * 100)}%` },
    { k: "magicReduce", name: "法术减伤", base: 0.04, perLv: 0.003, cap: 0.35, fmt: v => `受到法术伤害 -${Math.round(v * 100)}%` },
    { k: "burnOnHit", name: "灼烧附魔", base: 0.12, perLv: 0.002, cap: 0.45, fmt: v => `攻击有 ${Math.round(v * 100)}% 概率点燃目标 2 回合` },
    { k: "regen", name: "每回合回复", base: 0.02, perLv: 0.001, cap: 0.10, fmt: v => `每回合回复 ${Math.round(v * 100)}% 最大生命` },
    { k: "firstStrike", name: "先手", base: 0.08, perLv: 0.003, cap: 0.30, fmt: v => `首回合速度 +${Math.round(v * 100)}%` },
    { k: "execute", name: "斩杀强化", base: 0.10, perLv: 0.004, cap: 0.40, fmt: v => `对生命低于 30% 的敌人伤害 +${Math.round(v * 100)}%` },
    { k: "manaRegen", name: "魔力回流", base: 1, perLv: 0.08, cap: 12, fmt: v => `每回合回复 ${Math.round(v)} 点魔力` },
    { k: "counter", name: "反击", base: 0.08, perLv: 0.003, cap: 0.35, fmt: v => `受近战伤害有 ${Math.round(v * 100)}% 概率反击` },
    { k: "evade", name: "闪避", base: 0.03, perLv: 0.002, cap: 0.18, fmt: v => `闪避率 +${Math.round(v * 100)}%` },
    { k: "grantSkill", name: "附带技能", base: 0, perLv: 0, cap: 0, fmt: v => "附带一个可在战斗中释放的技能" },
  ],
  _idx: null,
  spById(k) {
    if (!this._idx) { this._idx = {}; for (const e of this.SPECIALS) this._idx[e.k] = e; }
    return this._idx[k] || null;
  },
  hash(s) {
    let h = 2166136261;
    const t = String(s || "");
    for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h);
  },
  rarityOf(item) {
    if (!item) return this.RARITY[0];
    const ex = this.RARITY.find(r => r.k === item.rarity);
    if (ex) return ex;
    const name = String(item.name || "");
    if (/传说|神话|神器|龙|圣|不朽|天启/.test(name)) return this.RARITY[4];
    if (/史诗|王者|秘银|魔钢|星辰|深渊/.test(name)) return this.RARITY[3];
    if (/稀有|精工|秘法|符文|寒铁|银/.test(name)) return this.RARITY[2];
    if (/精良|锻造|钢|纹饰/.test(name)) return this.RARITY[1];
    const price = Math.max(0, +item.price || 0);
    if (price >= 500) return this.RARITY[4];
    if (price >= 240) return this.RARITY[3];
    if (price >= 110) return this.RARITY[2];
    if (price >= 45) return this.RARITY[1];
    return this.RARITY[0];
  },
  /** 补全装备品质/等级/特效（同名的生成结果稳定，不会每次刷新乱变） */
  ensure(item, playerLevel) {
    if (!item || !EQ_SLOTS.includes(item.type)) return item;
    const rar = this.rarityOf(item);
    item.rarity = rar.k;
    if (!item.ilvl) {
      const lv = Math.max(1, Math.round(+playerLevel || 1));
      item.ilvl = clamp(lv + rar.order * 3, 1, 99);
    }
    const ilvl = clamp(Math.round(+item.ilvl || 1), 1, 99);
    if (!Array.isArray(item.special)) item.special = this.rollSpecials(item, rar, ilvl);
    return item;
  },
  rollSpecials(item, rar, ilvl) {
    const count = { common: 0, fine: 1, rare: 2, epic: 3, legendary: 4 }[rar.k] || 0;
    if (!count) return [];
    const seed = this.hash(item.name + "|" + (item.type || "") + "|" + rar.k);
    const pool = this.SPECIALS.filter(s => s.k !== "grantSkill");
    const picked = [];
    for (let i = 0; i < pool.length && picked.length < count; i++) {
      const e = pool[(seed + i * 7) % pool.length];
      if (picked.includes(e)) continue;
      picked.push(e);
    }
    const out = picked.map(e => {
      let v = e.base + e.perLv * ilvl;
      v = v * rar.mult;
      v = Math.min(e.cap, v);
      if (e.k === "shieldStart" || e.k === "manaRegen") v = Math.round(v);
      else if (e.k === "crit") v = Math.round(v * 10) / 10;
      else v = Math.round(v * 1000) / 1000;
      return { k: e.k, name: e.name, val: v, text: e.fmt(v) };
    });
    if (rar.order >= 2) {
      const sk = this.grantSkill(item, rar, ilvl, seed);
      out.push({ k: "grantSkill", name: "附带技能", val: 0, text: `附带技能「${sk.name}」`, skill: sk });
    }
    return out;
  },
  grantSkill(item, rar, ilvl, seed) {
    const slot = item.type;
    const pool = slot === "weapon"
      ? [{ n: "裂空斩", fx: "s_heavy" }, { n: "破军横扫", fx: "g_sweep" }, { n: "穿甲击", fx: "s_pierce" }, { n: "烈焰斩", fx: "s_flame_lance" }]
      : slot === "armor"
        ? [{ n: "护体结界", fx: "sh_self" }, { n: "铁壁守护", fx: "b_def" }, { n: "荆棘护甲", fx: "u_reflect" }]
        : [{ n: "治愈之触", fx: "h_single" }, { n: "疾风祝福", fx: "b_spd" }, { n: "净化之光", fx: "u_cleanse" }];
    const pick = pool[(seed + 3) % pool.length];
    const c = OWGSkillLib.byId(pick.fx);
    return {
      name: (item.name ? item.name.slice(0, 6) + "·" : "装备·") + pick.n,
      desc: `装备附带：${c ? c.desc : "装备技能"}`,
      fx: pick.fx, mpCost: Math.max(4, Math.round((c ? c.mp : 12) * 0.8)),
      power: c && c.power ? Math.round((c.power + ilvl * 0.008) * 100) / 100 : 1.5,
      cd: (c ? c.cd : 2) + 1, uses: 2,
    };
  },
  /** 特效文本（详情/背包/商店） */
  specialText(item) {
    if (!item || !Array.isArray(item.special) || !item.special.length) return "";
    return item.special.map(s => s.text || s.name).join("；");
  },
  rarityName(item) { return this.rarityOf(item).name; },
  /** 汇总穿戴中的装备特效（战斗初始化用） */
  battleSpecials() {
    const out = { lifesteal: 0, thorns: 0, shieldStart: 0, crit: 0, controlResist: 0, magicReduce: 0, burnOnHit: 0, regen: 0, firstStrike: 0, execute: 0, manaRegen: 0, counter: 0, evade: 0, skills: [] };
    const p = (typeof Game !== "undefined" && Game.state && Game.state.player) || null;
    if (!p || !p.equipment) return out;
    for (const slot of EQ_SLOTS) {
      const it = p.equipment[slot];
      if (!it) continue;
      this.ensure(it, p.level);
      for (const s of (it.special || [])) {
        if (s.k === "grantSkill" && s.skill) out.skills.push(Object.assign({}, s.skill));
        else if (s.k in out) out[s.k] += (s.val || 0);
      }
    }
    out.crit = Math.round(out.crit * 10) / 10;
    return out;
  },
};

/* ---------------------------------------------------------------
 * 3) 战斗：AI 只负责生成敌方数值，战斗流程与伤害全部本地计算
 * ------------------------------------------------------------- */
const OWGCombat = {
  /** 技能信息：主动 / 被动、耗魔、威力、是否法术、效果 id、冷却、每场限次 */
  skillInfo(sk) {
    const r = OWGSkillLib.resolve(sk);
    return {
      name: r.name, desc: r.desc, passive: r.passive, magic: r.magic,
      cost: r.cost, power: Math.round((r.power || 1) * 10) / 10,
      fx: r.id, fxText: r.desc, cat: r.cat, tgt: r.tgt, kind: r.kind,
      cd: r.cd, uses: r.uses,
    };
  },
  /** 战斗单位初始化：状态/冷却/每场次数/被动/装备特效 */
  initUnit(u) {
    if (!u) return u;
    if (!u.st) u.st = [];
    if (!u.cd) u.cd = {};
    if (!u.uses) u.uses = {};
    if (u._combatInit) return u;
    u._combatInit = true;
    u.lifesteal = u.lifesteal || 0;
    u.thorns = u.thorns || 0;
    u.counter = u.counter || 0;
    u.controlResist = u.controlResist || 0;
    u.magicReduce = u.magicReduce || 0;
    u.burnOnHit = u.burnOnHit || 0;
    u.regenPct = u.regenPct || 0;
    u.executeBonus = u.executeBonus || 0;
    u.mpRegen = u.mpRegen || 0;
    u.evadeFlat = u.evadeFlat || 0;
    u.lastStand = u.lastStand || 0;
    for (const sk of (u.skills || [])) {
      const info = OWGSkillLib.resolve(sk);
      if (info.uses != null && u.uses[info.name] == null) u.uses[info.name] = info.uses;
      if (info.passive) this.applyPassive(u, info);
    }
    return u;
  },
  /** 被动常驻效果 */
  applyPassive(u, info) {
    const v = info.val || 0;
    if (info.id === "p_atk") u.atk = Math.round((u.atk || 1) * (1 + v));
    else if (info.id === "p_def") u.def = Math.round((u.def || 1) * (1 + v));
    else if (info.id === "p_spd") u.spd = Math.round((u.spd || 1) * (1 + v));
    else if (info.id === "p_crit") u.crit = Math.round(((u.crit || 0) + v) * 10) / 10;
    else if (info.id === "p_regen") u.regenPct = (u.regenPct || 0) + v;
    else if (info.id === "p_lifesteal") u.lifesteal = (u.lifesteal || 0) + v;
    else if (info.id === "p_thorns") u.thorns = (u.thorns || 0) + v;
    else if (info.id === "p_laststand") u.lastStand = (u.lastStand || 0) + Math.max(1, v);
    else if (info.id === "p_firststrike") u.firstStrike = 1 + v;
    else if (info.id === "p_manaflow") u.mpRegen = (u.mpRegen || 0) + Math.max(1, v);
  },
  /** 穿戴装备：特效注入单位 + 附带技能 + 开战护盾 */
  applyEquip(u, spec) {
    if (!u || !spec) return u;
    u.lifesteal = (u.lifesteal || 0) + (spec.lifesteal || 0);
    u.thorns = (u.thorns || 0) + (spec.thorns || 0);
    u.counter = (u.counter || 0) + (spec.counter || 0);
    u.controlResist = (u.controlResist || 0) + (spec.controlResist || 0);
    u.magicReduce = (u.magicReduce || 0) + (spec.magicReduce || 0);
    u.burnOnHit = (u.burnOnHit || 0) + (spec.burnOnHit || 0);
    u.regenPct = (u.regenPct || 0) + (spec.regen || 0);
    u.executeBonus = (u.executeBonus || 0) + (spec.execute || 0);
    u.mpRegen = (u.mpRegen || 0) + (spec.manaRegen || 0);
    u.evadeFlat = (u.evadeFlat || 0) + (spec.evade || 0);
    u.crit = Math.round(((u.crit || 0) + (spec.crit || 0)) * 10) / 10;
    if (spec.firstStrike) u.firstStrike = Math.max(u.firstStrike || 1, 1 + spec.firstStrike);
    for (const sk of (spec.skills || [])) {
      if (!(u.skills || []).some(x => x.name === sk.name)) {
        u.skills = u.skills || [];
        u.skills.push(sk);
        const info = OWGSkillLib.resolve(sk);
        if (info.uses != null && u.uses[info.name] == null) u.uses[info.name] = info.uses;
      }
    }
    if (spec.shieldStart > 0) OWGStatus.add(u, "shield", { val: spec.shieldStart, dur: 99 });
    return u;
  },
  /** 单个单位的技能可用性（UI 与结算共用） */
  skillState(u, sk) {
    const info = OWGSkillLib.resolve(sk);
    if (info.passive) return { info, passive: true, blocked: "", cd: 0, uses: null };
    const cd = Math.max(0, (u && u.cd && u.cd[info.name]) || 0);
    const uses = (u && u.uses && u.uses[info.name] != null) ? u.uses[info.name] : (info.uses != null ? info.uses : null);
    let blocked = "";
    if (OWGStatus.has(u, "silence")) blocked = "沉默中";
    else if (uses != null && uses <= 0) blocked = "本场次数已用完";
    else if (cd > 0) blocked = `冷却 ${cd} 回合`;
    else if ((u.mp || 0) < info.cost) blocked = "魔力不足";
    return { info, passive: false, blocked, cd, uses };
  },
  /** 回合开始：冷却 -1、装备/被动回复、状态结算 */
  roundStart(b, log) {
    for (const u of [...(b.allies || []), ...(b.enemies || [])]) {
      if (!u.cd) u.cd = {};
      for (const k in u.cd) u.cd[k] = Math.max(0, u.cd[k] - 1);
      u.defend = false;
    }
  },
  /** 单位行动前：DOT 掉血、控制跳过、回复类生效 */
  turnStart(b, u, log) {
    if (!u.st) u.st = [];
    let skip = false, silenced = false, dead = false;
    for (const st of u.st.slice()) {
      if (st.k === "burn" || st.k === "poison" || st.k === "bleed") {
        let d = st.dmg || 0;
        if (!d) d = Math.max(1, Math.round((u.maxHp || 50) * (st.pct || 0) + (st.flat || 0)));
        const r = this.hitDamage(b, null, u, d, { tag: "dot", ignoreEvade: true, ignoreReflect: true });
        if (r.absorbed) log.push({ t: "dmg", txt: `${u.name} 受〔${st.name}〕${r.absorbed + r.hpLost} 伤害（护盾吸收 ${r.absorbed}，生命 -${r.hpLost}）`, neg: true });
        else log.push({ t: "dmg", txt: `${u.name} 受〔${st.name}〕${r.hpLost} 伤害`, neg: true });
        if (this.isDown(b, u)) { dead = true; break; }
      } else if (st.k === "regen") {
        const heal = Math.max(1, Math.round((u.maxHp || 50) * (st.val || 0)));
        this.healUnit(u, heal, log);
      } else if (OWGStatus.CONTROL.includes(st.k)) {
        skip = true;
      } else if (st.k === "silence") {
        silenced = true;
      }
    }
    if (!dead && u.regenPct > 0 && !this.isDown(b, u)) {
      const heal = Math.max(1, Math.round((u.maxHp || 50) * u.regenPct));
      this.healUnit(u, heal, log);
    }
    if (!dead && u.mpRegen > 0) u.mp = Math.min(u.maxMp || 999, (u.mp || 0) + u.mpRegen);
    if (skip) {
      const st = u.st.find(s => OWGStatus.CONTROL.includes(s.k));
      log.push({ t: "info", txt: `${u.name} 处于〔${st ? st.name : "控制"}〕，无法行动` });
    } else if (silenced) log.push({ t: "info", txt: `${u.name} 被沉默，只能进行普通攻击` });
    return { skip, silenced, dead };
  },
  /** 单位行动后：状态持续回合 -1，过期移除（当回合刚挂上的控制按已消耗处理） */
  turnEnd(b, u, skipped) {
    if (!u.st) return;
    const keep = [];
    const consumed = skipped ? OWGStatus.CONTROL.concat(["silence"]) : [];
    for (const st of u.st) {
      if (st.fresh && !consumed.includes(st.k)) { st.fresh = false; keep.push(st); continue; }
      st.turns = (st.turns || 0) - 1;
      if (st.turns > 0) keep.push(st);
    }
    u.st = keep;
  },
  healUnit(u, amount, log) {
    if (!u || this.isDown({ kind: "normal" }, u)) return 0;
    const max = u.maxHp || 100;
    const before = u.hp || 0;
    const healed = Math.min(max - before, Math.max(0, Math.round(amount)));
    u.hp = before + healed;
    if (healed > 0 && log) log.push({ t: "heal", txt: `${u.name} 回复 ${healed} 生命` });
    return healed;
  },
  /** 统一伤害结算：闪避 → 减伤 → 护盾吸收 → 生命；护盾耗尽后溢出才打生命 */
  hitDamage(b, attacker, target, dmg, opts = {}) {
    if (!target || this.isDown(b, target)) return { hpLost: 0, absorbed: 0, missed: true };
    const evade = (target.evadeFlat || 0) + OWGStatus.get(target, "evade").reduce((a, s) => a + (s.val || 0), 0);
    if (!opts.ignoreEvade && evade > 0 && Math.random() < Math.min(0.75, evade)) {
      if (opts.log) opts.log.push({ t: "info", txt: `${target.name} 闪避了攻击` });
      return { hpLost: 0, absorbed: 0, missed: true };
    }
    let d = Math.max(1, Math.round(dmg));
    if (target.defend) d = Math.max(1, Math.floor(d / 2));
    if (opts.magic && target.magicReduce) d = Math.max(1, Math.round(d * (1 - Math.min(0.5, target.magicReduce))));
    if (OWGStatus.has(target, "vuln")) d = Math.round(d * 1.2);
    let remain = d, absorbed = 0;
    for (const sh of OWGStatus.get(target, "shield")) {
      if (remain <= 0) break;
      const take = Math.min(sh.val, remain);
      sh.val -= take; remain -= take; absorbed += take;
    }
    const hpBefore = target.hp || 0;
    let hpLost = Math.min(hpBefore, remain);
    target.hp = Math.max(0, hpBefore - remain);
    if (absorbed + hpLost > 0 && OWGStatus.has(target, "sleep")) OWGStatus.remove(target, "sleep");
    // 不屈：致命伤害留 1 点生命（每场限次）
    if (target.hp <= 0 && (target.lastStand || 0) > 0) {
      target.lastStand--;
      target.hp = 1;
      if (opts.log) opts.log.push({ t: "info", txt: `${target.name} 触发〔不屈〕，保留 1 点生命（剩余 ${target.lastStand} 次）` });
    }
    // 反伤 / 荆棘
    if (attacker && !opts.ignoreReflect && remain > 0 && !this.isDown(b, attacker)) {
      let back = 0;
      const thorns = (target.thorns || 0) + OWGStatus.get(target, "reflect").reduce((a, s) => a + (s.val || 0), 0);
      if (thorns > 0) back += Math.round(remain * thorns);
      const ctr = OWGStatus.get(target, "counter").reduce((a, s) => a + (s.val || 0), 0);
      if (ctr > 0 && Math.random() < ctr) back += Math.round(OWGStatus.stats(target, "atk", b) * 0.5);
      if (back > 0) {
        this.hitDamage(b, null, attacker, back, { ignoreReflect: true, log: opts.log });
        if (opts.log) opts.log.push({ t: "dmg", txt: `${attacker.name} 受到反伤 ${back}`, neg: true });
      }
    }
    return { hpLost, absorbed, missed: false, down: this.isDown(b, target) };
  },
  /** 选取技能目标 */
  pickTargets(b, caster, info, targetName) {
    const foeSide = b.allies && b.allies.includes(caster) ? (b.enemies || []) : (b.allies || []);
    const friendSide = b.allies && b.allies.includes(caster) ? (b.allies || []) : (b.enemies || []);
    const alive = arr => arr.filter(x => !this.isDown(b, x));
    if (info.tgt === "allEnemies") return alive(foeSide);
    if (info.tgt === "allAllies") return alive(friendSide);
    if (info.tgt === "self") return [caster];
    if (info.tgt === "oneAlly") {
      if (targetName) {
        const t = alive(friendSide).find(x => x.name === targetName);
        if (t) return [t];
      }
      const sorted = alive(friendSide).slice().sort((a, c) => (a.hp / (a.maxHp || 1)) - (c.hp / (c.maxHp || 1)));
      return sorted.length ? [sorted[0]] : [caster];
    }
    // oneEnemy
    if (targetName) {
      const t = alive(foeSide).find(x => x.name === targetName);
      if (t) return [t];
    }
    const taunt = alive(foeSide).find(x => OWGStatus.has(x, "taunt"));
    if (taunt) return [taunt];
    const sorted = alive(foeSide).slice().sort((a, c) => a.hp - c.hp);
    return sorted.length ? [sorted[0]] : [];
  },
  /** 释放技能（玩家/队友/敌方共用；冷却、限次、沉默、魔力真实校验） */
  castSkill(b, caster, sk, targetName, log) {
    const info = OWGSkillLib.resolve(sk);
    if (info.passive) return false;
    if (!caster.st) caster.st = [];
    if (!caster.cd) caster.cd = {};
    if (!caster.uses) caster.uses = {};
    if (OWGStatus.has(caster, "silence")) {
      log.push({ t: "info", txt: `${caster.name} 被沉默，无法使用技能` });
      return false;
    }
    const left = caster.uses[info.name] != null ? caster.uses[info.name] : (info.uses != null ? info.uses : null);
    const cd = caster.cd[info.name] || 0;
    if (left != null && left <= 0) {
      log.push({ t: "info", txt: `${caster.name} 的〔${info.name}〕本场次数已用完` });
      return false;
    }
    if (cd > 0) {
      log.push({ t: "info", txt: `${caster.name} 的〔${info.name}〕冷却中（还剩 ${cd} 回合）` });
      return false;
    }
    if ((caster.mp || 0) < info.cost) {
      log.push({ t: "info", txt: `${caster.name} 魔力不足，无法使用〔${info.name}〕` });
      return false;
    }
    caster.mp = Math.max(0, (caster.mp || 0) - info.cost);
    caster.cd[info.name] = info.cd || 0;
    if (left != null) caster.uses[info.name] = left - 1;
    const targets = this.pickTargets(b, caster, info, targetName);
    if (!targets.length) {
      log.push({ t: "info", txt: `${caster.name} 使用〔${info.name}〕，但没有有效目标` });
      return true;
    }
    log.push({ t: "skill", txt: `${caster.name} 使用〔${info.name}〕${info.cost ? `（-${info.cost} 魔力）` : ""}` });
    this.applyEffect(b, caster, targets, info, log);
    return true;
  },
  /** 效果结算 */
  applyEffect(b, caster, targets, info, log) {
    const isMagic = !!info.magic;
    const cAtk = OWGStatus.stats(caster, isMagic ? "matk" : "atk", b);
    const cCrit = OWGStatus.stats(caster, "crit", b) + (info.critAdd || 0);
    const cCritDmg = caster.critDmg || 110;
    const sideFriends = b.allies && b.allies.includes(caster) ? b.allies : b.enemies;
    if (info.kind === "heal") {
      for (const t of targets) {
        const amount = Math.round(cAtk * (info.power || 1) + (t.maxHp || 50) * (info.pct || 0));
        this.healUnit(t, amount, log);
      }
      return;
    }
    if (info.kind === "revive") {
      for (const t of targets) {
        const down = (b.allies || []).includes(t) ? (b.kind === "spar" ? (t.out || t.hp <= 1) : t.hp <= 0) : t.hp <= 0;
        if (!down) { this.healUnit(t, Math.round(cAtk * (info.power || 1)), log); continue; }
        t.out = false;
        t.hp = Math.max(1, Math.round((t.maxHp || 50) * (info.pct || 0.3)));
        OWGStatus.cleanse(t);
        log.push({ t: "heal", txt: `${t.name} 被复活，回复 ${t.hp} 生命` });
      }
      return;
    }
    if (info.kind === "shield") {
      const amount = Math.round(cAtk * (info.flat || 0.5) + (caster.maxHp || 50) * (info.pct || 0.1));
      for (const t of targets) {
        OWGStatus.add(t, "shield", { val: amount, dur: info.dur || 3 });
        log.push({ t: "buff", txt: `${t.name} 获得 ${amount} 点护盾（剩余 ${(OWGStatus.get(t, "shield").reduce((a, s) => a + s.val, 0))}）` });
      }
      return;
    }
    if (info.kind === "cleanse") {
      for (const t of targets) {
        const n = (t.st || []).filter(s => OWGStatus.BAD.includes(s.k)).length;
        OWGStatus.cleanse(t);
        log.push({ t: "buff", txt: `${t.name} 净化了 ${n} 个负面状态` });
      }
      return;
    }
    if (info.kind === "dispel") {
      for (const t of targets) {
        const n = OWGStatus.dispel(t);
        log.push({ t: "buff", txt: `${t.name} 的 ${n} 个增益被驱散` });
      }
      return;
    }
    if (info.kind === "buff" || info.kind === "debuff") {
      const status = info.status;
      if (info.kind === "debuff") {
        for (const t of targets) {
          if (this.tryResist(t, status, log)) continue;
          OWGStatus.add(t, status, { val: info.val || 0, dur: info.dur || 3 });
          log.push({ t: "status", txt: `${t.name} 陷入〔${OWGStatus.NAME[status] || status}〕${info.dur || 3} 回合` });
        }
      } else {
        for (const t of targets) {
          OWGStatus.add(t, status, { val: info.val || 0, dur: info.dur || 3 });
          log.push({ t: "buff", txt: `${t.name} 获得〔${OWGStatus.NAME[status] || status}〕${info.dur || 3} 回合` });
        }
      }
      return;
    }
    // 伤害类（可带状态、多段、吸血、吸魔、斩杀）
    for (const t of targets) {
      if (this.isDown(b, t)) continue;
      const def = OWGStatus.stats(t, "def", b) * (1 - (info.pierce || 0));
      const base = isMagic ? (cAtk - Math.floor(def / 2)) : (cAtk - Math.round(def));
      let raw = Math.max(1, Math.round(base * (info.power || 1)));
      if (info.execute && (t.hp || 0) <= (t.maxHp || 1) * 0.3) raw = Math.round(raw * (1 + info.execute));
      if (caster.executeBonus > 0 && (t.hp || 0) <= (t.maxHp || 1) * 0.3) raw = Math.round(raw * (1 + caster.executeBonus));
      const hits = Math.max(1, Math.round(info.hits || 1));
      let totalLost = 0, totalAbsorbed = 0, critted = false;
      for (let i = 0; i < hits; i++) {
        const isCrit = Math.random() * 100 < Math.max(0, Math.min(100, cCrit));
        let d = isCrit ? Math.round(raw * (cCritDmg / 100)) : raw;
        if (isCrit) critted = true;
        const r = this.hitDamage(b, caster, t, d, { magic: isMagic, log });
        totalLost += r.hpLost; totalAbsorbed += r.absorbed;
        if (r.absorbed) log.push({ t: "dmg", txt: `${t.name} 护盾吸收 ${r.absorbed}，生命 -${r.hpLost}` });
        else if (!r.missed) log.push({ t: "dmg", txt: `${t.name} 受到 ${r.hpLost} 伤害${isCrit ? "（暴击）" : ""}`, neg: true });
        if (info.status && Math.random() < (info.chance || 0)) {
          if (!this.tryResist(t, info.status, log)) {
            const dmgTick = Math.max(1, Math.round((t.maxHp || 50) * (info.pct || 0) + (info.flat || 0) + cAtk * 0.12));
            OWGStatus.add(t, info.status, { dur: info.dur || 2, pct: info.pct || 0, flat: info.flat || 0, dmg: dmgTick });
            log.push({ t: "status", txt: `${t.name} 陷入〔${OWGStatus.NAME[info.status] || info.status}〕${info.dur || 2} 回合` });
          }
        }
        if (this.isDown(b, t)) break;
      }
      // 吸血（技能 + 装备/被动）
      const leech = (info.leech || 0) + (caster.lifesteal || 0);
      if (leech > 0 && totalLost > 0) {
        const heal = Math.round(totalLost * leech);
        this.healUnit(caster, heal, log);
      }
      // 烧魔
      if (info.drainMp && t.mp != null) {
        const drained = Math.min(t.mp, info.drainMp);
        t.mp -= drained;
        if (info.id === "u_manadrain") caster.mp = Math.min(caster.maxMp || 999, (caster.mp || 0) + Math.round(drained / 2));
        log.push({ t: "info", txt: `${t.name} 被抽走 ${drained} 魔力` });
      }
      // 武器附魔：概率点燃
      if (caster.burnOnHit > 0 && !this.isDown(b, t) && Math.random() < caster.burnOnHit) {
        OWGStatus.add(t, "burn", { dur: 2, pct: 0.05, dmg: Math.max(1, Math.round((t.maxHp || 50) * 0.05)) });
        log.push({ t: "status", txt: `${t.name} 被装备附魔点燃 2 回合` });
      }
    }
  },
  /** 控制抗性判定 */
  tryResist(target, status, log) {
    if (!OWGStatus.BAD.includes(status)) return false;
    const resist = Math.min(0.75, target.controlResist || 0);
    if (resist > 0 && Math.random() < resist) {
      log.push({ t: "info", txt: `${target.name} 抵抗了〔${OWGStatus.NAME[status] || status}〕` });
      return true;
    }
    return false;
  },
  /** 普通攻击 */
  basicAttack(b, caster, targetName, log) {
    const foes = (b.allies && b.allies.includes(caster) ? b.enemies : b.allies) || [];
    const alive = foes.filter(x => !this.isDown(b, x));
    let t = targetName ? alive.find(x => x.name === targetName) : null;
    if (!t) {
      const taunt = alive.find(x => OWGStatus.has(x, "taunt"));
      t = taunt || alive.slice().sort((a, c) => a.hp - c.hp)[0];
    }
    if (!t) return false;
    const atk = OWGStatus.stats(caster, "atk", b);
    const def = OWGStatus.stats(t, "def", b);
    const crit = OWGStatus.stats(caster, "crit", b);
    const res = this.physDamage(atk, def, crit, caster.critDmg || 110);
    const r = this.hitDamage(b, caster, t, res.dmg, { log });
    if (r.missed) log.push({ t: "info", txt: `${t.name} 闪避了${caster.name}的攻击` });
    else log.push({ t: "dmg", txt: `${caster.name} 攻击 ${t.name}：${r.absorbed ? `护盾吸收 ${r.absorbed}，` : ""}生命 -${r.hpLost}${res.crit ? "（暴击）" : ""}`, neg: true });
    if (caster.lifesteal > 0 && r.hpLost > 0) this.healUnit(caster, Math.round(r.hpLost * caster.lifesteal), log);
    if (caster.burnOnHit > 0 && !this.isDown(b, t) && Math.random() < caster.burnOnHit) {
      OWGStatus.add(t, "burn", { dur: 2, pct: 0.05, dmg: Math.max(1, Math.round((t.maxHp || 50) * 0.05)) });
      log.push({ t: "status", txt: `${t.name} 被装备附魔点燃 2 回合` });
    }
    return true;
  },
  /** 敌方 AI：遵守冷却/限次/沉默；优先残血，有嘲讽则强制打嘲讽者 */
  enemyTurn(b, u, log) {
    const usable = (u.skills || []).filter(sk => {
      const st = this.skillState(u, sk);
      return !st.passive && !st.blocked;
    });
    if (usable.length && Math.random() < 0.62) {
      const pick = usable[Math.floor(Math.random() * usable.length)];
      const info = OWGSkillLib.resolve(pick);
      let targetName = null;
      const foes = (b.enemies && b.enemies.includes(u) ? b.allies : b.enemies) || [];
      const taunt = foes.find(x => !this.isDown(b, x) && OWGStatus.has(x, "taunt"));
      if (taunt) targetName = taunt.name;
      if (!targetName && info.tgt === "oneEnemy") {
        const alive = foes.filter(x => !this.isDown(b, x)).sort((a, c) => a.hp - c.hp);
        if (Math.random() < 0.65 && alive.length) targetName = alive[0].name;
      }
      if (this.castSkill(b, u, pick, targetName, log)) return;
    }
    this.basicAttack(b, u, null, log);
  },
  statusText(u) { return OWGStatus.summary(u); },
  /** 普通伤害：攻击 − 目标防御 */
  physDamage(atk, targetDef, critPct, critDmgPct, roll) {
    // roll：0-100 的随机值（测试可传入固定值）；缺省则自己掷
    const isCrit = roll != null ? (roll < critPct) : (Math.random() * 100 < critPct);
    let dmg;
    if (isCrit) dmg = Math.round(atk * (critDmgPct / 100)) - targetDef;
    else dmg = atk - targetDef;
    return { dmg: Math.max(1, Math.round(dmg)), crit: isCrit };
  },
  /** 法术伤害：法伤 − (目标防御 ÷ 2) */
  magDamage(matk, targetDef, critPct, critDmgPct, roll) {
    const isCrit = roll != null ? (roll < critPct) : (Math.random() * 100 < critPct);
    const half = Math.floor(targetDef / 2);
    let dmg = isCrit ? Math.round(matk * (critDmgPct / 100)) - half : matk - half;
    return { dmg: Math.max(1, Math.round(dmg)), crit: isCrit };
  },
  /**
   * 敌方经验：每 10 级一档，档内每级递增、每档每级增量翻倍
   * 1级4 / 2级8 / … / 9级36 / 10级44 / 11级52 / … / 19级116 / 20级132 / … / 30级308 …
   */
  _expCache: [0, 4],
  expForLevel(level) {
    const lv = Math.max(1, Math.min(200, Math.round(level || 1)));
    const cache = this._expCache;
    while (cache.length <= lv) {
      const L = cache.length;               // 正在求第 L 级
      const step = 4 * Math.pow(2, Math.floor(L / 10));
      cache.push(cache[L - 1] + step);
    }
    return cache[lv];
  },
  /** 单位是否已失去战斗能力（切磋：生命剩 1 即失去战斗能力） */
  isDown(b, u) {
    if (!u) return true;
    if (b && b.kind === "spar") return u.out === true || u.hp <= 1;
    return u.hp <= 0;
  },
  /** 敌人等级 → 建议属性（等级越高属性越高；作为 AI 数值的下限兜底） */
  enemyProfile(level) {
    const lv = Math.max(1, Math.round(level || 1));
    return {
      hp: Math.round(40 + lv * 12),
      mp: Math.round(10 + lv * 4),
      atk: Math.round(6 + lv * 2.2),
      def: Math.round(3 + lv * 1.1),
      spd: Math.round(5 + lv * 0.8),
      crit: Math.round((4 + lv * 0.2) * 10) / 10,
      critDmg: 110,
    };
  },
  /** 整理 AI 返回的敌方目标（补等级/技能，按等级兜底数值） */
  normalizeEnemy(e, playerLevel) {
    const lv = Math.max(1, Math.round(+e.level || (playerLevel + 1)));
    const prof = this.enemyProfile(lv);
    const num = (v, d) => { const n = Math.round(+v); return isFinite(n) && n > 0 ? n : d; };
    const floor = (v, d) => Math.max(Math.round(d * 0.85), num(v, d));   // 等级越高，属性下限越高
    const skills = (Array.isArray(e.skills) ? e.skills : []).filter(s => s && s.name).slice(0, 3).map(s => ({
      name: String(s.name).slice(0, 8),
      desc: String(s.desc || "").slice(0, 30),
      mpCost: clamp(Math.round(+s.mpCost || 6), 0, 200),
      power: Math.round(clamp(+s.power || 1.4, 1.1, 2.5) * 10) / 10,
      magic: s.magic === true,
    }));
    if (!skills.length) skills.push({ name: "猛击", desc: "凶狠的一击", mpCost: 6, power: 1.4, magic: false });
    const enemy = {
      name: String(e.name || "敌人").slice(0, 12),
      icon: String(e.icon || "👾").slice(0, 4),
      desc: String(e.desc || "").slice(0, 30),
      level: lv,
      hp: floor(e.hp, prof.hp), maxHp: floor(e.hp, prof.hp),
      mp: num(e.mp, prof.mp), maxMp: num(e.mp, prof.mp),
      atk: floor(e.atk, prof.atk), matk: floor(e.matk || e.atk, prof.atk),
      def: floor(e.def, prof.def), spd: floor(e.spd, prof.spd),
      crit: Math.round(Math.max(+e.crit || 0, prof.crit) * 10) / 10,
      critDmg: Math.round(+e.critDmg || prof.critDmg),
      skills,
      exp: 0,
    };
    OWGCombat.initUnit(enemy);
    return enemy;
  },
  /** 一次行动顺序：速度高者先攻（同速玩家先，其次我方） */
  orderUnits(b) {
    const all = [...(b.allies || []), ...(b.enemies || [])].filter(u => !this.isDown(b, u));
    const sideOf = u => b.allies && b.allies.includes(u) ? 0 : 1;
    return all.sort((x, y) => {
      const d = (y.spd || 0) - (x.spd || 0);
      if (d !== 0) return d;
      if (!!x.isPlayer !== !!y.isPlayer) return x.isPlayer ? -1 : 1;
      return sideOf(x) - sideOf(y);
    });
  },
  /** 敌方 AI：魔力够就放技能，优先打残血目标 */
  enemyAction(unit, targets, b) {
    const alive = targets.filter(t => !this.isDown(b, t));
    if (!alive.length) return null;
    const r = Math.random();
    const sorted = alive.slice().sort((a, c) => a.hp - c.hp);
    const target = (r < 0.55) ? sorted[0] : alive[Math.floor(Math.random() * alive.length)];
    const usable = (unit.skills || []).filter(s => !s.passive && (unit.mp || 0) >= (s.mpCost || 0));
    let skill = null, mpUsed = 0, res;
    if (usable.length && Math.random() < 0.55) {
      const pick = usable[Math.floor(Math.random() * usable.length)];
      skill = pick.name; mpUsed = pick.mpCost || 0;
      unit.mp = Math.max(0, (unit.mp || 0) - mpUsed);
      const power = Math.round(clamp(+pick.power || 1.4, 1.1, 2.5) * 10) / 10;
      res = pick.magic
        ? this.magDamage(Math.round((unit.matk || unit.atk) * power), target.def, unit.crit, unit.critDmg)
        : this.physDamage(Math.round(unit.atk * power), target.def, unit.crit, unit.critDmg);
    } else {
      res = this.physDamage(unit.atk, target.def, unit.crit, unit.critDmg);
    }
    let dmg = res.dmg;
    if (target.defend) dmg = Math.max(1, Math.floor(dmg / 2));
    return { actor: unit.name, target: target.name, targetObj: target, dmg, crit: res.crit, skill, mpUsed };
  },
};

/* ---------------------------------------------------------------
 * 4) 酒馆式正文渲染：markdown + 清洗 + {{render}} 代码块
 * ------------------------------------------------------------- */
const OWGMarkdown = {
  /** 允许的标签（DOMPurify 风格的清洗白名单） */
  ALLOWED: ["p", "br", "b", "strong", "i", "em", "u", "s", "del", "code", "pre", "blockquote",
    "ul", "ol", "li", "h1", "h2", "h3", "h4", "h5", "h6", "hr", "a", "img", "span", "div", "table",
    "thead", "tbody", "tr", "th", "td", "sup", "sub", "mark", "details", "summary"],
  _raw: true,
  /** 清洗 HTML：去掉 script/style/事件属性/javascript: 链接 */
  sanitize(html) {
    let s = String(html == null ? "" : html);
    s = s.replace(/<\s*(script|style|iframe|object|embed|link|meta|form|input|button)\b[\s\S]*?<\s*\/\s*\1\s*>/gi, "");
    s = s.replace(/<\s*(script|style|iframe|object|embed|link|meta|form|input|button)\b[^>]*\/?>/gi, "");
    s = s.replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "");
    s = s.replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "");
    s = s.replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, "");
    s = s.replace(/(href|src)\s*=\s*"(javascript|vbscript|data:text\/html)[^"]*"/gi, "");
    s = s.replace(/(href|src)\s*=\s*'(javascript|vbscript|data:text\/html)[^']*'/gi, "");
    s = s.replace(/javascript:/gi, "");
    return s;
  },
  escape(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  },
  /** 行内标记里的原始 HTML 标签：只保留安全属性 */
  cleanInlineTag(tag) {
    return String(tag)
      .replace(/\son[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/(href|src)\s*=\s*(?:"(?:javascript|vbscript|data:text\/html)[^"]*"|'(?:javascript|vbscript|data:text\/html)[^']*')/gi, "")
      .replace(/javascript:/gi, "");
  },
  /** 行内 markdown；raw=false 时连行内 HTML 标签也转义（纯文本模式） */
  inline(text, raw) {
    const allowRaw = raw === undefined ? this._raw !== false : raw !== false;
    let s = String(text == null ? "" : text);
    const tags = [];
    if (allowRaw) {
      // 行内 HTML（<span style=…>、<b>、<a> 等）先占位，转义后再还原，避免被 escape 掉
      s = s.replace(/<\/?(span|b|strong|i|em|u|s|del|code|mark|sup|sub|small|big|a)\b[^>]*>/gi, (m) => {
        tags.push(this.cleanInlineTag(m));
        return "\u0000T" + (tags.length - 1) + "\u0000";
      });
    }
    s = this.escape(s);
    // 行内代码
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
    // 图片
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, alt, url) => {
      if (!/^(https?:|\/)/i.test(url)) return m;
      return `<img src="${url}" alt="${alt}" loading="lazy">`;
    });
    // 链接
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, url) => {
      if (!/^(https?:|\/)/i.test(url)) return m;
      return `<a href="${url}" target="_blank" rel="noopener noreferrer">${t}</a>`;
    });
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/==([^=]+)==/g, "<mark>$1</mark>");
    s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => "<code>" + this.escape(codes[+i]) + "</code>");
    s = s.replace(/\u0000T(\d+)\u0000/g, (m, i) => tags[+i] || "");
    return s;
  },
  /** markdown → HTML（块级）；opts.raw=false 为纯文本模式 */
  render(text, opts) {
    this._raw = !(opts && opts.raw === false);
    const src = String(text == null ? "" : text).replace(/\r\n?/g, "\n");
    const lines = src.split("\n");
    const out = [];
    let i = 0;
    const flushPara = (buf) => {
      if (buf.length) out.push("<p>" + this.inline(buf.join("\n")).replace(/\n/g, "<br>") + "</p>");
      buf.length = 0;
    };
    const para = [];
    while (i < lines.length) {
      const line = lines[i];
      // 围栏代码块
      const fence = /^\s*```(.*)$/.exec(line);
      if (fence) {
        flushPara(para);
        const info = (fence[1] || "").trim().toLowerCase();
        const body = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { body.push(lines[i]); i++; }
        i++;
        const code = body.join("\n");
        if (info === "render" || info.includes("{{render}}")) out.push({ render: true, code });
        else out.push("<pre><code>" + this.escape(code) + "</code></pre>");
        continue;
      }
      // 标题
      const h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flushPara(para); const lv = h[1].length; out.push(`<h${lv}>${this.inline(h[2])}</h${lv}>`); i++; continue; }
      // 分隔线
      if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { flushPara(para); out.push("<hr>"); i++; continue; }
      // 引用
      if (/^\s*>\s?/.test(line)) {
        flushPara(para);
        const q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + this.render(q.join("\n"), opts) + "</blockquote>");
        continue;
      }
      // 无序列表
      if (/^\s*[-*+]\s+/.test(line)) {
        flushPara(para);
        const items = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
        out.push("<ul>" + items.map(x => "<li>" + this.inline(x) + "</li>").join("") + "</ul>");
        continue;
      }
      // 有序列表
      if (/^\s*\d+[.)]\s+/.test(line)) {
        flushPara(para);
        const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, "")); i++; }
        out.push("<ol>" + items.map(x => "<li>" + this.inline(x) + "</li>").join("") + "</ol>");
        continue;
      }
      // 表格
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:-]*\|[\s:|-]*$/.test(lines[i + 1])) {
        flushPara(para);
        const head = line.split("|").map(s => s.trim()).filter((x, k, arr) => !(k === 0 && x === "") && !(k === arr.length - 1 && x === ""));
        i += 2;
        const rows = [];
        while (i < lines.length && /\|/.test(lines[i])) {
          rows.push(lines[i].split("|").map(s => s.trim()).filter((x, k, arr) => !(k === 0 && x === "") && !(k === arr.length - 1 && x === "")));
          i++;
        }
        out.push("<table><thead><tr>" + head.map(h => "<th>" + this.inline(h) + "</th>").join("") + "</tr></thead><tbody>"
          + rows.map(r => "<tr>" + r.map(c => "<td>" + this.inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
        continue;
      }
      // 空行
      if (!line.trim()) { flushPara(para); i++; continue; }
      para.push(line);
      i++;
    }
    flushPara(para);
    let html = "";
    const renders = [];
    // {{render}} 块就地占位，交给上层渲染（沙箱 iframe）
    for (const x of out) {
      if (typeof x === "string") { html += x; continue; }
      renders.push({ code: x.code });
      html += "\u0000RENDER\u0000";
    }
    return { html, renders };
  },
  /** 直接得到 HTML 字符串（render 块用占位符） */
  toHTML(text) {
    const r = this.render(text);
    return { html: r.html, renders: r.renders, safe: this.sanitize(r.html) };
  },
};

/* ---------------------------------------------------------------
 * 5) 斜杠命令（酒馆同款输入习惯）
 * ------------------------------------------------------------- */
const OWGCommands = {
  list: [
    { cmd: "/help", desc: "显示可用命令" },
    { cmd: "/clear", desc: "清空当前剧情（保留角色与状态）" },
    { cmd: "/ask 文本", desc: "把文本当作玩家行动发送" },
    { cmd: "/ai 文本", desc: "同 /ask" },
    { cmd: "/sys 文本", desc: "插入一条系统提示（不发给模型）" },
    { cmd: "/me 文本", desc: "插入一句第一人称动作描写" },
    { cmd: "/impersonate 文本", desc: "以角色身份说话（预填输入框）" },
  ],
  /** 判断是否是命令；返回 {handled, kind, text} */
  parse(input) {
    const s = String(input == null ? "" : input).trim();
    if (!s.startsWith("/")) return { handled: false };
    const m = /^\/([a-zA-Z]+)\s*([\s\S]*)$/.exec(s);
    if (!m) return { handled: false };
    return { handled: true, cmd: m[1].toLowerCase(), text: (m[2] || "").trim() };
  },
};

/* ---------------------------------------------------------------
 * 6) 酒馆式世界书条目：字段与命中规则
 * ------------------------------------------------------------- */
const OWGWorldbookST = {
  POSITIONS: [
    { v: 0, name: "角色定义之前" },
    { v: 1, name: "角色定义之后" },
    { v: 2, name: "作者注之前" },
    { v: 3, name: "作者注之后" },
    { v: 4, name: "按深度插入历史" },
    { v: 5, name: "示例消息之前" },
    { v: 6, name: "示例消息之后" },
  ],
  /** 补齐字段（老条目也能用） */
  normalize(e) {
    const x = e || {};
    const keys = Array.isArray(x.keys) ? x.keys.map(String) : (x.key ? [String(x.key)] : []);
    const sec = Array.isArray(x.secondary_keys) ? x.secondary_keys.map(String) : (x.keysecondary ? [String(x.keysecondary)] : []);
    const constant = x.constant !== undefined ? !!x.constant : !!x.always;
    return {
      id: x.id || uid(),
      keys: keys.slice(0, 32),
      secondary_keys: sec.slice(0, 32),
      content: String(x.content != null ? x.content : ""),
      comment: String(x.comment || ""),
      always: constant,
      constant,
      selective: !!x.selective,
      selectiveLogic: x.selectiveLogic != null ? Number(x.selectiveLogic) : 0,
      probability: x.probability != null ? Math.max(0, Math.min(100, Number(x.probability))) : 100,
      order: x.order != null ? Number(x.order) : 100,
      position: x.position != null ? Number(x.position) : (constant ? 0 : 1),
      depth: x.depth != null ? Number(x.depth) : 4,
      enabled: x.enabled !== false,
      group: String(x.group || ""),
      caseSensitive: x.caseSensitive === true,
      matchWholeWords: x.matchWholeWords === true,
      scanDepth: x.scanDepth != null ? Number(x.scanDepth) : 6,
      source: x.source || "user",
    };
  },
  /** 关键词逻辑判定（不含概率随机）：match 与「为什么没生效」排查共用同一套规则 */
  test(entry, scanText) {
    const e = this.normalize(entry);
    const text = String(scanText == null ? "" : scanText);
    const lower = text.toLowerCase();
    if (e.constant) return true;
    const has = (k) => {
      if (!k) return false;
      const hay = e.caseSensitive ? text : lower;
      const needle = e.caseSensitive ? k : String(k).toLowerCase();
      if (e.matchWholeWords) {
        try { return new RegExp("\\b" + needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", e.caseSensitive ? "" : "i").test(text); }
        catch (err) { return hay.includes(needle); }
      }
      return hay.includes(needle);
    };
    const pHit = e.keys.some(has);
    const sHit = e.secondary_keys.some(has);
    if (!e.selective) return pHit || sHit;
    switch (e.selectiveLogic) {
      case 1: return pHit || sHit;          // OR
      case 2: return !(pHit && sHit);       // NOT AND
      case 3: return !(pHit || sHit);       // NOT OR
      default: return pHit && sHit;         // AND
    }
  },
  /** 关键词命中（酒馆规则：常驻 / 选择性 / 概率 / 顺序） */
  match(entries, scanText, { rng } = {}) {
    const text = String(scanText == null ? "" : scanText);
    const list = (entries || []).map(e => this.normalize(e)).filter(e => e.enabled !== false);
    const hit = [];
    for (const e of list) {
      if (!this.test(e, text)) continue;
      if (!e.constant && e.probability < 100) {
        const r = rng ? rng() : Math.random();
        if (r * 100 >= e.probability) continue;
      }
      hit.push(e);
    }
    // 排序：order 升序；同组条目按出现顺序成组
    hit.sort((a, b) => (a.order - b.order));
    const groups = [];
    for (const e of hit) {
      if (e.group) {
        let g = groups.find(x => x.name === e.group);
        if (!g) { g = { name: e.group, items: [] }; groups.push(g); }
        g.items.push(e);
      } else groups.push({ name: "", items: [e] });
    }
    return groups.flatMap(g => g.items);
  },
  /** 条目 → 酒馆 World Info 条目 */
  toST(e) {
    const x = this.normalize(e);
    return {
      keys: x.keys,
      secondary_keys: x.secondary_keys,
      content: x.content,
      comment: x.comment,
      constant: x.constant,
      selective: x.selective,
      selectiveLogic: x.selectiveLogic,
      order: x.order,
      position: x.position,
      depth: x.depth,
      disable: !x.enabled,
      probability: x.probability,
      group: x.group,
      caseSensitive: x.caseSensitive,
      matchWholeWords: x.matchWholeWords,
      scanDepth: x.scanDepth,
      useProbability: x.probability < 100,
    };
  },
};

<script>
/* ==========================================================================
 * 酒馆助手（JS-Slash-Runner）兼容层
 * 上游：https://github.com/n0vi028/JS-Slash-Runner
 * 在无酒馆宿主环境里，用游戏自身数据实现 TavernHelper 的核心 API：
 * 变量 / 剧情消息 / 角色 / 事件 / 生成 / 世界书 / 宏 / 斜杠指令 / 脚本按钮。
 * 用户脚本运行在独立沙箱 iframe（独立 JS 全局），报错只进日志，不影响游戏页面。
 * ========================================================================== */
"use strict";

/* 事件常量：名称与取值对齐 JS-Slash-Runner @types/iframe/event.d.ts（tavern_events） */

  WORLD_INFO_ACTIVATED: "world_info_activated",

};

/* iframe_events：酒馆助手 iframe 内部事件（@types/iframe/event.d.ts） */
const OWG_IFRAME_EVENTS = {
  MESSAGE_IFRAME_RENDER_STARTED: "message_iframe_render_started",
  MESSAGE_IFRAME_RENDER_ENDED: "message_iframe_render_ended",
  GENERATION_REQUESTED: "js_generation_requested",

  STREAM_TOKEN_RECEIVED_FULLY: "js_stream_token_received_fully",
  STREAM_TOKEN_RECEIVED_INCREMENTALLY: "js_stream_token_received_incrementally",
  GENERATION_ENDED: "js_generation_ended"
};

/* 事件名别名：内部旧写法 → 真实常量值，emit/监听时双向兼容 */
const OWG_EVENT_ALIAS = {
  "chat_changed": "chat_id_changed",
  "chat_id_changed": "chat_changed"
};
function othEventKey(name) { return String(name == null ? "" : name); }
function othEventAlias(name) { return OWG_EVENT_ALIAS[othEventKey(name)] || ""; }

const OWG_TH_METHODS = [
  "getVariables", "replaceVariables", "updateVariablesWith", "insertOrAssignVariables", "insertVariables",
  "deleteVariable", "getVariable", "setVariable",
  "getChatMessages", "setChatMessages", "setChatMessage", "createChatMessages", "deleteChatMessages",
  "rotateChatMessages", "getLastMessageId", "getMessageId", "getChatHistoryBrief", "getChatHistoryDetail",
  "getCharacterNames", "getCharacterIds", "getCurrentCharacterName", "getCurrentCharacterId",
  "getCharacter", "updateCharacterWith",
  "getPersonaName", "getCurrentPersonaName", "getPersonaNames", "getCurrentPersonaId",
  "getGameState", "getScene", "getStoryContainer", "renderStoryHTML", "setChatMessageHTML",
  "eventOn", "eventOnce", "eventMakeFirst", "eventMakeLast", "eventOnButton", "getButtonEvent", "eventRemoveListener",
  "appendInexistentScriptButtons",
  "eventEmit", "eventClearEvent", "eventClearListener", "eventClearAll",
  "getScriptId", "getScriptName", "getScriptInfo", "replaceScriptInfo",
  "getScriptButtons", "replaceScriptButtons", "getAllEnabledScriptButtons",
  "generate", "generateRaw", "generateStory", "stopGeneration", "getModelList",
  "substitudeMacros", "triggerSlash", "getTavernVersion", "getTavernHelperVersion", "getIframeName",
  "toast", "errorCatched",
  "getWorldbookNames", "getLorebooks", "getGlobalWorldbookNames", "getCharWorldbookNames",
  "getWorldbook", "replaceWorldbook", "getLorebookEntries", "replaceLorebookEntries",
  "createLorebookEntries", "deleteLorebookEntries", "updateLorebookEntriesWith",
  "initializeGlobal", "waitGlobalInitialized",
  "formatAsTavernRegexedString", "getTavernRegexes", "replaceTavernRegexes", "updateTavernRegexesWith",
  "isCharacterTavernRegexesEnabled",
  "getCharData", "getCharacterCard", "RawCharacter", "getCharacterCardFields",
  "updateScriptButtonsWith", "refreshOneMessage", "formatAsDisplayedMessage",
  "registerMacroLike", "unregisterMacroLike", "getTavernHelperExtensionId",
  "triggerSlashWithResult"
];

function othClone(v) { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return {}; } }
function othIsObj(v) { return v && typeof v === "object" && !Array.isArray(v); }
function othMerge(target, src) {
  const out = othClone(target || {});
  const walk = (dst, s) => {
    for (const k of Object.keys(s || {})) {
      const sv = s[k];
      if (Array.isArray(sv)) dst[k] = othClone(sv);
      else if (othIsObj(sv)) { if (!othIsObj(dst[k])) dst[k] = {}; walk(dst[k], sv); }
      else dst[k] = sv;
    }
  };
  walk(out, src || {});
  return out;
}

const OWGTH = {
  VERSION: "4.12.0-port",
  TA_VER: "1.13.0-shim",
  bus: new Map(),
  api: null,

  init() {
    this.buildAPI();
    window.OWGTH = this;
    window.OWG_TH_EVENTS = OWG_TH_EVENTS;
    window.__OWG_TH_LOG__ = (sid, level, text) => OWGScript.log(level, sid, text);
  },
  buildAPI() {
    const api = {};
    for (const n of OWG_TH_METHODS) api[n] = (sid, ...args) => this[n](sid, ...args);
    this.api = api;
    window.__OWG_TH_API__ = api;
  },
  macro(text) {
    let out = String(text == null ? "" : text);
    try { out = STBridge.macro(out, STBridge.macroContext()); } catch (e) { }
    for (const h of (this.macroHooks || [])) {
      try { out = out.replace(h.regex, h.replace); } catch (e) { }
    }
    return out;
  },

  /* -------------------------------------------------- 全局初始化/等待（真实 API） */
  globalWaiters: {},
  /** TavernHelper.initializeGlobal(name, value)：登记全局并唤醒 waitGlobalInitialized */
  initializeGlobal(sid, name, value) {
    const key = String(name || "");
    if (!key) return;
    try { window[key] = value; } catch (e) { }
    const list = this.globalWaiters[key];
    delete this.globalWaiters[key];
    if (list) for (const w of list) { try { w(value); } catch (e) { } }
    this.emit("global_" + key + "_initialized", value);
  },
  /** 真实实现会一直等待；单页宿主里额外给 8s 超时，避免脚本永久挂起 */
  waitGlobalInitialized(sid, name) {
    const key = String(name || "");
    let cur;
    try { cur = window[key]; } catch (e) { }
    if (cur !== undefined && cur !== null) return Promise.resolve(cur);
    return new Promise((resolve) => {
      const list = this.globalWaiters[key] || (this.globalWaiters[key] = []);
      let done = false;
      const finish = (v, timeout) => {
        if (done) return;
        done = true;
        const i = list.indexOf(fn);
        if (i >= 0) list.splice(i, 1);
        if (timeout) {
          try { OWGScript.log("warn", sid, "waitGlobalInitialized('" + key + "') 超时 8s，按未提供处理"); } catch (e) { }
        }
        resolve(v);
      };
      const fn = (v) => finish(v, false);
      list.push(fn);
      setTimeout(() => finish(undefined, true), 8000);
    });
  },
  /** Mvu（变量更新框架）最小兼容：底层读写 chat 作用域的 stat_data */
  mvuShim() {
    const read = () => {
      const v = othClone(STAssist.scopeData("chat") || {});
      if (!othIsObj(v.stat_data)) v.stat_data = {};
      return v;
    };
    const Mvu = {
      events: {
        VARIABLE_UPDATE_STARTED: "mag_variable_update_started",
        VARIABLE_UPDATE_ENDED: "mag_variable_update_ended",
        BEFORE_COMMAND_COMBINE: "mag_before_command_combine",
        COMMAND_PARSED: "mag_command_parsed",
        COMMAND_COMBINED: "mag_command_combined"
      },
      getMvuData() {
        const v = read();
        return {
          stat_data: othClone(v.stat_data || {}),
          display_data: othClone(v.display_data || {}),
          delta_data: othClone(v.delta_data || {}),
          initialized: true
        };
      },
      replaceMvuData(data) {
        const v = read();
        v.stat_data = othClone((data && data.stat_data) || {});
        v.display_data = othClone((data && data.display_data) || {});
        v.delta_data = othClone((data && data.delta_data) || {});
        STAssist.setScopeData("chat", v);
        return true;
      },
      setMvuData(data) { return this.replaceMvuData(data); },
      parseMessage() { return { newMessages: [], builtin_commands: [], contaminated_commands: [] }; },
      isDuringSwipe() { return false; }
    };
    return Mvu;
  },

  /* ---------------------------------------------------------------- 变量 */
  varOptions(option, sid) {
    const raw = Object.assign({}, othIsObj(option) ? option : {});
    const type = String(raw.type || "chat");
    if (type === "script" && !raw.script_id) raw.script_id = sid;
    return { type, raw };
  },
  readVars(option, sid) {
    const { type, raw } = this.varOptions(option, sid);
    if (type === "character" && !Game.activeCard()) throw new Error("当前没有打开角色卡，无法读写 character 作用域变量");
    if (type === "message") {
      const id = this.resolveMsgId(raw.message_id === undefined ? "latest" : raw.message_id);
      const m = this.messages()[id];
      return othClone((m && m.variables) || {});
    }
    if (type === "script") {
      const s = OWGScript.get(raw.script_id);
      return othClone((s && s.data) || {});
    }
    if (type === "extension") return {};
    if (type === "initial") return othClone(STAssist.scopeData("initial"));
    return othClone(STAssist.scopeData(type));
  },
  writeVars(option, vars, sid) {
    const { type, raw } = this.varOptions(option, sid);
    const v = othIsObj(vars) ? othClone(vars) : {};
    if (type === "message") {
      const id = this.resolveMsgId(raw.message_id === undefined ? "latest" : raw.message_id);
      const m = this.messages()[id];
      if (!m) return;
      m.variables = v;
      Game.save();
      this.emit("message_updated", id);
      return;
    }
    if (type === "script") {
      const s = OWGScript.get(raw.script_id);
      if (!s) return;
      // 通过 saveScript 写回，保证持久化（get 返回的是投影副本）
      OWGScript.saveScript({ id: s.id, data: v });
      return;
    }
    if (type === "extension") return;
    STAssist.setScopeData(type, v);
  },
  getVariables(sid, option) { return this.readVars(option, sid); },
  replaceVariables(sid, vars, option) { this.writeVars(option, vars, sid); },
  updateVariablesWith(sid, fn, option) {
    const cur = this.readVars(option, sid);
    if (typeof fn !== "function") return cur;
    let ret;
    try { ret = fn(cur); } catch (e) { throw e; }
    if (ret && typeof ret.then === "function") {

    this.writeVars(option, merged, sid);

  /* ---------------------------------------------------------------- 消息 */
  messages() { return Game.state.messages || (Game.state.messages = []); },
  resolveMsgId(id) {
    const len = this.messages().length;
    if (id === undefined || id === null || id === "latest") return len - 1;
    const n = typeof id === "number" ? id : parseInt(String(id).replace(/[^\-\d]/g, ""), 10);
    if (!Number.isFinite(n)) return -1;
    return n < 0 ? len + n : n;
  },
  toIdx(n, len) { return n < 0 ? len + n : n; },
  rangeIds(range, len) {
    let s = String(range == null ? "" : range).trim();
    if (!s || s === "all") return len ? Array.from({ length: len }, (_, i) => i) : [];
    try { s = this.macro(s); } catch (e) { }
    if (/^latest$/i.test(s)) s = "-1";
    const two = s.match(/^(-?\d+)\s*-\s*(-?\d+)$/);
    if (two) {
      let a = this.toIdx(+two[1], len), b = this.toIdx(+two[2], len);
      if (a > b) { const t = a; a = b; b = t; }
      const out = [];
      for (let i = Math.max(0, a); i <= Math.min(len - 1, b); i++) out.push(i);
      return out;
    }
    const one = s.match(/^(-?\d+)$/);
    if (one) { const i = this.toIdx(+one[1], len); return i >= 0 && i < len ? [i] : []; }
    return [];
  },
  msgName(m) {
    if (m.name) return m.name;
    if (m.role === "user") return (Game.state.player && Game.state.player.name) || "你";
    if (m.role === "sys") return "系统";
    return Game.currentCharName();
  },
  stMsg(m, i) {
    const hidden = m.role === "sys";
    const role = m.role === "user" ? "user" : m.role === "sys" ? "system" : "assistant";
    return {
      message_id: i,
      name: this.msgName(m),
      role,
      is_user: role === "user",
      is_system: role === "system",
      is_hidden: hidden,
      message: String(m.content || ""),
      mes: String(m.content || ""),
      html: String(m.html || ""),
      data: othClone(m.variables || {}),
      extra: { ts: m.ts || 0, delta: othClone(m.delta || null), image: m.image || null, shortHint: m.shortHint || null },
      swipe_id: 0,
      swipes: [String(m.content || "")],
      swipes_data: [othClone(m.variables || {})]
    };
  },
  getChatMessages(sid, range, opts) {
    const o = othIsObj(opts) ? opts : {};
    const len = this.messages().length;
    const ids = range === undefined ? (len ? Array.from({ length: len }, (_, i) => i) : []) : this.rangeIds(range, len);
    let list = ids.map(i => this.stMsg(this.messages()[i], i)).filter(m => m);
    if (o.role && o.role !== "all") list = list.filter(m => m.role === o.role);
    if (o.hide_state === "hidden") list = list.filter(m => m.is_hidden);
    else if (o.hide_state === "unhidden") list = list.filter(m => !m.is_hidden);
    return list;
  },
  applyMsgPatch(i, patch) {
    const m = this.messages()[i];
    if (!m || !patch) return false;
    if (patch.name !== undefined) m.name = String(patch.name);
    if (patch.role !== undefined) {
      const r = String(patch.role);
      m.role = r === "user" ? "user" : (r === "system" || r === "sys") ? "sys" : "assistant";
    }
    if (patch.is_hidden !== undefined) { m.role = patch.is_hidden ? "sys" : (m.role === "sys" ? "assistant" : m.role); }
    if (patch.message !== undefined) {
      m.content = String(patch.message);
      m.wordCount = OWGRender.countWords(m.content);
    }
    // 脚本自定义消息渲染已移除：html 字段不再写入，避免脚本把 UI 画进剧情区
    if (patch.html !== undefined) { owgRenderRemoved("setChatMessages{html}"); }
    if (patch.data !== undefined) m.variables = othClone(patch.data);
    if (patch.extra !== undefined && othIsObj(patch.extra)) {
      m.ts = patch.extra.ts || m.ts;
      if (patch.extra.delta !== undefined) m.delta = othClone(patch.extra.delta);
    }
    return true;
  },
  afterChange(opts) {
    Game.save();
    const refresh = (othIsObj(opts) && opts.refresh) || "affected";
    if (refresh !== "none") { try { UI.renderStory(); } catch (e) { } }
  },
  async setChatMessages(sid, list, opts) {
    if (!Array.isArray(list)) return;
    for (const it of list) {
      if (!it) continue;
      const id = this.resolveMsgId(it.message_id);
      if (id < 0 || id >= this.messages().length) continue;
      this.applyMsgPatch(id, it);
    }
    this.afterChange(opts);
  },
  async setChatMessage(sid, option, message, opts) {
    const id = (typeof option === "number" || typeof option === "string") ? option : (option && option.message_id);
    await this.setChatMessages(sid, [{ message_id: id === undefined ? "latest" : id, message: String(message == null ? "" : message) }], opts);
  },
  async createChatMessages(sid, list, opts) {
    if (!Array.isArray(list)) return;
    const st = Game.state;
    const o = othIsObj(opts) ? opts : {};
    let at = o.insert_at !== undefined ? o.insert_at : (o.insert_before !== undefined ? o.insert_before : "end");
    let idx = (at === "end" || at === undefined) ? st.messages.length : clamp(this.resolveMsgId(at), 0, st.messages.length);
    const items = list.filter(x => x).map(x => ({
      role: x.role === "user" ? "user" : (x.role === "system" || x.role === "sys") ? "sys" : "assistant",
      content: String(x.message == null ? "" : x.message),
      ts: Date.now(),
      variables: othClone(x.data || {})
    }));
    st.messages.splice(idx, 0, ...items);
    st.memoryUpto = Math.min(st.memoryUpto || 0, st.messages.length);
    this.afterChange(o);
  },
  async deleteChatMessages(sid, ids, opts) {
    const len = this.messages().length;
    // 真实签名 deleteChatMessages(message_ids: number[])，也兼容单数字/范围字符串
    let list = [];
    if (Array.isArray(ids)) list = ids.map(x => this.resolveMsgId(x));
    else if (typeof ids === "number") list = [this.resolveMsgId(ids)];
    else list = this.rangeIds(ids, len);
    list = [...new Set(list.filter(i => i >= 0 && i < len))].sort((a, b) => b - a);
    for (const i of list) this.messages().splice(i, 1);
    Game.state.memoryUpto = Math.min(Game.state.memoryUpto || 0, this.messages().length);
    this.afterChange(opts);
  },
  /** 真实语义：把 [middle, end) 整段移到 begin 之前（ST 的 /rotate） */
  async rotateChatMessages(sid, begin, middle, end, opts) {
    const len = this.messages().length;
    const b = clamp(this.resolveMsgId(begin), 0, len);
    const e = clamp(this.resolveMsgId(end), 0, len);
    const m = clamp(this.resolveMsgId(middle), b, e);
    if (e <= b || m === b) return;
    const msgs = this.messages();
    const right = msgs.splice(m, e - m);
    msgs.splice(b, 0, ...right);
    this.afterChange(opts);
  },

  /* ---------------------------------------------------------------- 事件 */
  onEvent(sid, name, fn, opts) {
    if (typeof fn !== "function") return { stop() { } };
    const key = othEventKey(name);
    let list = this.bus.get(key);
    if (!list) { list = []; this.bus.set(key, list); }
    // 真实实现：同一 (事件, listener) 重复注册不生效；MakeFirst/MakeLast 只调整顺序
    let item = list.find(x => x.fn === fn && x.sid === sid);
    if (!item) { item = { sid, fn, once: false }; list.push(item); }
    item.once = !!(opts && (opts.once || opts.once_only));
    if (opts && opts.first) { list.splice(list.indexOf(item), 1); list.unshift(item); }
    else if (opts && opts.last) { list.splice(list.indexOf(item), 1); list.push(item); }
    return { stop: () => this.eventRemoveListener(sid, key, fn) };
  },
  eventOn(sid, name, fn) { return this.onEvent(sid, name, fn, {}); },
  eventOnce(sid, name, fn) { return this.onEvent(sid, name, fn, { once: true }); },
  eventMakeFirst(sid, name, fn) { return this.onEvent(sid, name, fn, { first: true }); },
  eventMakeLast(sid, name, fn) { return this.onEvent(sid, name, fn, { last: true }); },
  eventOnButton(sid, btn, fn) { return this.onEvent(sid, "__button__name:" + String(btn), fn, {}); },
  /** TavernHelper 的 getButtonEvent：脚本用它订阅“按钮被点击”事件，必须与 mountButtons 点击时发出的事件名一致 */
  getButtonEvent(sid, name) {
    // 页面级全局与 TH 包装都会把 sid 作为第一个参数传入；直接调用时第一个参数就是按钮名
    const btnName = arguments.length >= 2 ? name : sid;
    return "__button__name:" + String(btnName || "");
  },
  eventRemoveListener(sid, name, fn) {
    const list = this.bus.get(String(name));
    if (!list) return;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].fn === fn) list.splice(i, 1);
  },
  async eventEmit(sid, name, ...data) { this.emit(name, ...data); },
  eventClearEvent(sid, name) {
    const k = String(name), l = this.bus.get(k);
    if (l) this.bus.set(k, l.filter(x => x.sid !== sid));
  },
  eventClearListener(sid, name, fn) { this.eventRemoveListener(sid, name, fn); },
  eventClearAll(sid) {
    for (const [k, l] of this.bus) {
      const keep = l.filter(x => x.sid !== sid);
      if (keep.length) this.bus.set(k, keep); else this.bus.delete(k);
    }
  },
  /** 清空所有脚本的事件订阅（换档/换卡时用，避免旧档回调残留） */
  clearAllEvents() { this.bus.clear(); },
  emit(name, ...args) {
    // 同名别名（如 chat_changed ↔ chat_id_changed）一起广播，旧脚本与新脚本都能收到
    const keys = [othEventKey(name)];
    const al = othEventAlias(name);
    if (al) keys.push(al);
    for (const key of keys) {
      const list = (this.bus.get(key) || []).slice();
      for (const it of list) {
        if (it.once) this._removeItem(key, it);
        const prevSid = OWGScript.currentSid;
        OWGScript.currentSid = it.sid;
        try { it.fn(...args); }
        catch (e) { OWGScript.log("error", it.sid, "事件 " + key + " 处理出错：" + ((e && e.message) || e)); }
        finally { OWGScript.currentSid = prevSid; }
      }
    }
  },
  _removeItem(key, item) {
    const l = this.bus.get(key);
    if (!l) return;
    const i = l.indexOf(item);
    if (i >= 0) l.splice(i, 1);
  },
