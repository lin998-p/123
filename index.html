/* ---------------------------------------------------------------
 * 6.5) 剧情代码美化渲染管线（页面内渲染，不隔离）
 *   原始文本 → 识别（<style> / 围栏代码块 / 整块 HTML）→ 白名单清洗
 *   → CSS 作用域限制在剧情页 #page-story → 直接注入剧情区
 * ------------------------------------------------------------- */
const OWGRich = {
  SCOPE: "#page-story",
  BLOCK_TAGS: "div|section|article|aside|header|footer|main|table|figure|svg|canvas|details|dl|ol|ul|h1|h2|h3|h4|h5|h6|p",
  /** 危险标签整块移除；on* 事件属性与危险协议一并去掉（<style> 保留） */
  sanitizeHTML(html) {
    let s = String(html == null ? "" : html);
    // 只移除真正危险/不可渲染的标签；表单控件放行（AI 卡片常用 input/select/button）
    const bad = "script|iframe|object|embed|link|meta|base|frame|frameset|applet|audio|video|source|track";
    s = s.replace(new RegExp("<\\s*(" + bad + ")\\b[\\s\\S]*?<\\s*\\/\\s*\\1\\s*>", "gi"), "");
    s = s.replace(new RegExp("<\\s*(" + bad + ")\\b[^>]*\\/?>", "gi"), "");
    s = s.replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "");
    s = s.replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "");
    s = s.replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, "");
    // 表单：去掉 action/method 等提交跳转属性（配合剧情区 submit 拦截）
    s = s.replace(/<form\b([^>]*)>/gi, (m, a) =>
      "<form" + a.replace(/\s(action|method|target|enctype|formaction)\s*=\s*("[^"]*"|'[^']*'|\S+)/gi, "") + ">");
    // 控件：去掉 name 等回传属性；按钮统一为 type=button，避免触发表单提交
    s = s.replace(/<(input|textarea|select|option|button)\b([^>]*)>/gi, (m, tag, a) => {
      let at = a.replace(/\s(formaction|formmethod|formtarget|formnovalidate|autofocus)\s*=\s*("[^"]*"|'[^']*'|\S+)/gi, "");
      // 单选/复选保留 name（清掉会让分组失效，切换主题/选项全部失灵）
      if (!(/input/i.test(tag) && /type\s*=\s*["']?(?:radio|checkbox)/i.test(at))) {
        at = at.replace(/\sname\s*=\s*("[^"]*"|'[^']*'|\S+)/gi, "");
      }
      if (/button/i.test(tag)) {
        at = /\stype\s*=\s*("[^"]*"|'[^']*'|\S+)/i.test(at)
          ? at.replace(/\stype\s*=\s*("[^"]*"|'[^']*'|\S+)/i, ' type="button"')
          : at + ' type="button"';
      }
      if (/input/i.test(tag)) at = at.replace(/\stype\s*=\s*"?(?:image|file)"?/i, ' type="text"');
      return "<" + tag + at + ">";
    });
    s = s.replace(/(href|src|action|formaction|xlink:href)\s*=\s*"(?:javascript|vbscript|data:text\/html)[^"]*"/gi, "");
    s = s.replace(/(href|src|action|formaction|xlink:href)\s*=\s*'(?:javascript|vbscript|data:text\/html)[^']*'/gi, "");
    s = s.replace(/javascript\s*:/gi, "");
    s = s.replace(/vbscript\s*:/gi, "");
    // 内联样式里的滚动劫持一并去掉（卡片不许把滚动圈在自己身上）
    s = s.replace(/\sstyle\s*=\s*"([^"]*)"/gi, (m, v) => ' style="' + this.deScrollHijack(v) + '"');
    s = s.replace(/\sstyle\s*=\s*'([^']*)'/gi, (m, v) => ' style="' + this.deScrollHijack(v) + '"');
    return s;
  },
  /** 事件委托兜底：<script> 被清洗后，aria-controls / data-toggle / “返回·关闭”按钮仍能交互 */
  handleClick(e) {
    const el = e.target;
    const btn = el && el.closest ? el.closest("button, [role=button]") : null;
    if (!btn || !btn.closest(".st-rich")) return;
    const sel = btn.getAttribute("data-toggle") || btn.getAttribute("aria-controls");
    if (sel) {
      let t = null;
      try { t = document.getElementById(sel.replace(/^#/, "")) || document.querySelector(sel); } catch (err) { }
      if (t) {
        const hidden = t.hasAttribute("hidden");
        if (hidden) t.removeAttribute("hidden"); else t.setAttribute("hidden", "");
        btn.setAttribute("aria-expanded", String(hidden));
        e.preventDefault(); e.stopPropagation();
        return;
      }
    }
    const sig = (btn.className || "") + " " + (btn.textContent || "");
    if (/close|back|返回|关闭|收起/i.test(sig)) {
      const box = btn.closest("section, details, .modal, .panel, .st-card") || btn.parentElement;
      if (box) { box.setAttribute("hidden", ""); e.preventDefault(); e.stopPropagation(); }
    }
  },
  /** 去掉会阻断滚动链的声明：滚到卡片边界后由剧情页接力，触摸端不被锁死 */
  deScrollHijack(css) {
    return String(css == null ? "" : css)
      .replace(/overscroll-behavior(?:-x|-y)?\s*:\s*(?:contain|none)\s*(?:!important\s*)?;?/gi, "")
      .replace(/touch-action\s*:\s*none\s*(?:!important\s*)?;?/gi, "");
  },
  /** 把一段 CSS 的选择器都加上 #story-scroll 前缀，避免污染游戏整体 UI */
  scopeCSS(css) {
    let s = String(css == null ? "" : css);
    s = s.replace(/@import[\s\S]*?;/gi, "");
    s = s.replace(/-moz-binding\s*:[^;]*;/gi, "");
    s = s.replace(/behavior\s*:[^;]*;/gi, "");
    s = this.deScrollHijack(s);
    return this._scopeRules(s);
  },
  _scopeRules(css) {
    const scope = this.SCOPE;
    let out = "";
    let i = 0;
    while (i < css.length) {
      const open = css.indexOf("{", i);
      if (open < 0) break;
      const sel = css.slice(i, open).trim();
      let depth = 1, j = open + 1;
      while (j < css.length && depth > 0) {
        const c = css.charAt(j);
        if (c === "{") depth++;
        else if (c === "}") depth--;
        j++;
      }
      const body = css.slice(open + 1, j - 1);
      if (/^@(media|supports|layer|container|document)\b/i.test(sel)) {
        out += sel + "{" + this._scopeRules(body) + "}";
      } else if (/^@(keyframes|-webkit-keyframes|font-face|page|property|charset|namespace)\b/i.test(sel)) {
        out += sel + "{" + body + "}";
      } else if (sel) {
        const scoped = sel.split(",").map(x => {
          const v = x.trim();
          if (!v || v.indexOf(scope) >= 0) return v;
          if (/^(:root|html|body)\b/i.test(v)) return v.replace(/^(:root|html|body)/i, scope);
          return scope + " " + v;
        }).filter(Boolean).join(", ");
        out += scoped + "{" + body + "}";
      }
      i = j;
    }
    return out;
  },
  /** 只把已有 <style> 作用域化（脚本注入的 HTML 走这里，其余内容保持原样） */
  scopeStyleTags(html) {
    return String(html == null ? "" : html).replace(/<style([^>]*)>([\s\S]*?)<\/style>/gi,
      (m, attrs, body) => "<style" + attrs + ">" + this.scopeCSS(body) + "</style>");
  },
  /** 去掉消息里的 <script>（全局「代码美化 → 允许脚本」关闭时的安全兜底） */
  stripScripts(html) {
    return String(html == null ? "" : html).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "");
  },
  /** 执行消息内联脚本：innerHTML 插入的 script 不会自动执行，需要替换成动态节点 */
  runScripts(box) {
    if (!box) return;
    let on = false;
    try { on = OWGRender.settings().scripts === true; } catch (e) { }
    if (!on) return;
    box.querySelectorAll("script").forEach(old => {
      if (old.dataset && old.dataset.owgRun === "1") return;
      const s = document.createElement("script");
      s.dataset.owgRun = "1";
      if (old.src) s.src = old.src; else s.text = old.textContent || "";
      old.parentNode.replaceChild(s, old);
    });
  },
  looksHtml(code) {
    return /^\s*(<!doctype|<html|<body|<div\b|<table\b|<section\b|<style\b|<span\b|<p\b|<ul\b|<ol\b|<figure\b|<svg\b|<canvas\b|<details\b|<h[1-6]\b)/i.test(String(code || ""));
  },
  textPart(seg) {
    if (!seg || !seg.trim()) return "";
    return OWGRender.markdownHTML(seg, true);
  },
  unescapeEntities(s) {
    return String(s == null ? "" : s)
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
      .replace(/&#x([0-9a-f]+);/gi, (m, h) => String.fromCharCode(parseInt(h, 16)))
      .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d))
      .replace(/&nbsp;/g, " ")
      .replace(/&amp;/g, "&");
  },
  htmlPart(tok) {
    const t = String(tok == null ? "" : tok);
    // AI 常把 HTML 先转义成 <pre><code>&lt;div&gt;…：解一层实体后按 HTML 渲染
    const pre = /^\s*<pre\b[^>]*>\s*<code\b[^>]*>([\s\S]*?)<\/code>\s*<\/pre>\s*$/i.exec(t);
    if (pre) {
      const dec = this.unescapeEntities(pre[1]);
      if (this.looksHtml(dec) || /<style[\s>]/i.test(dec)) {
        return '<div class="st-rich">' + this.sanitizeHTML(dec) + "</div>";
      }
    }
    return '<div class="st-rich">' + this.sanitizeHTML(t) + "</div>";
  },
  cssSource(body) {
    return '<div class="st-rich"><details class="st-css-src"><summary>CSS（已应用到剧情区）</summary><pre>'
      + OWGMarkdown.escape(String(body || "").trim()) + "</pre></details></div>";
  },
  /** 从 JSON/JS 字符串值里捞出真正的 HTML（AI 常把 HTML 塞进 JSON 字符串） */
  decodeJsonStrings(body) {
    const out = [];
    const re = /"(?:[^"\\]|\\.)*"/g;
    let m;
    while ((m = re.exec(String(body || "")))) {
      let v = m[0];
      try { v = JSON.parse(v); } catch (e) { continue; }
      if (typeof v === "string" && v.length > 20 && this.looksHtml(v)) out.push(v);
    }
    return out;
  },
  /** 去掉 JSON/JSONC 里的注释（字符串内的 // 不动） */
  stripJsonComments(str) {
    let out = "", q = "";
    const s = String(str == null ? "" : str);
    for (let i = 0; i < s.length; i++) {
      const c = s.charAt(i);
      if (q) {
        out += c;
        if (c === "\\") { out += s.charAt(++i); }
        else if (c === q) q = "";
        continue;
      }
      if (c === '"' || c === "'") { q = c; out += c; continue; }
      if (c === "/" && s.charAt(i + 1) === "/") { while (i < s.length && s.charAt(i) !== "\n") i++; out += "\n"; continue; }
      if (c === "/" && s.charAt(i + 1) === "*") {
        i += 2;
        while (i < s.length && !(s.charAt(i) === "*" && s.charAt(i + 1) === "/")) i++;
        i++;
        continue;
      }
      out += c;
    }
    return out;
  },
  /** 宽容解析：去注释、去尾逗号、补引号键（JSONC / JS 对象字面量都能吃下） */
  looseParse(src) {
    const clean = this.stripJsonComments(String(src == null ? "" : src)).trim();
    const tries = [
      clean,
      clean.replace(/,\s*([}\]])/g, "$1"),
      clean.replace(/([{,]\s*)([A-Za-z_$][\w$-]*)\s*:/g, '$1"$2":').replace(/,\s*([}\]])/g, "$1"),
    ];
    for (const t of tries) {
      try {
        const o = JSON.parse(t);
        if (o && typeof o === "object") return o;
      } catch (e) { /* 继续尝试下一种 */ }
    }
    return null;
  },
  /** 兜底：逐个“键: 值”行解析（完全不合法的 JSON 也能出字段行） */
  looseRows(src) {
    const rows = [];
    const s = this.stripJsonComments(String(src == null ? "" : src));
    for (const raw of s.split("\n")) {
      const line = raw.trim().replace(/,$/, "");
      if (!line || /^[\[\]{}]+$/.test(line)) continue;
      let m = /^"([^"]+)"\s*:\s*\{\s*$/.exec(line) || /^([A-Za-z_$][\w$]*)\s*:\s*\{\s*$/.exec(line);
      if (m) { rows.push({ k: m[1], group: true }); continue; }
      m = /^"([^"]+)"\s*:\s*([\s\S]*)$/.exec(line) || /^([A-Za-z_$][\w$]*)\s*:\s*([\s\S]*)$/.exec(line);
      if (m) rows.push({ k: m[1], v: m[2].trim().replace(/^"(.*)"$/, "$1") });
    }
    return rows;
  },
  /** 裸 JSON / JS 对象（没有围栏、没有语言标识）→ 卡片化渲染 */
  jsonCard(body) {
    const src = String(body || "");
    const esc = OWGMarkdown.escape;
    const srcBox = '<details class="st-json-src"><summary>原始数据</summary><pre class="story-code">'
      + esc(src.trim()) + "</pre></details>";
    const htmls = this.decodeJsonStrings(src);
    if (htmls.length) {
      return '<div class="st-rich">' + htmls.map(h => this.sanitizeHTML(h)).join("") + srcBox + "</div>";
    }
    const fmt = (v) => {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (typeof v === "number" || typeof v === "boolean") return String(v);
      if (Array.isArray(v)) return v.every(x => typeof x !== "object") ? v.join("、") : "[" + v.length + " 项]";
      return JSON.stringify(v);
    };
    const row = (k, v, depth) => {
      if (k === "$meta") return "";
      if (v && typeof v === "object" && !Array.isArray(v)) {
        const kids = Object.keys(v).filter(kk => kk !== "$meta").map(kk => row(kk, v[kk], depth + 1)).join("");
        if (!kids) return "";
        return '<div class="st-group"><div class="st-key">' + esc(k) + "</div>" + kids + "</div>";
      }
      return '<div class="st-field"><span class="st-key">' + esc(k) + '</span><span class="st-val">'
        + esc(fmt(v) || "—") + "</span></div>";
    };
    const obj = this.looseParse(src);
    let inner = "";
    if (obj) {
      inner = Object.keys(obj).map(k => row(k, obj[k], 0)).join("");
    } else {
      const rows = this.looseRows(src);
      inner = rows.map(r => r.group
        ? '<div class="st-group"><div class="st-key">' + esc(r.k) + "</div></div>"
        : '<div class="st-field"><span class="st-key">' + esc(r.k) + '</span><span class="st-val">'
          + esc(r.v || "—") + "</span></div>").join("");
    }
    if (!inner) {
      return '<div class="st-rich"><pre class="story-code">' + esc(src.trim()) + "</pre></div>";
    }
    return '<div class="st-rich">' + inner + srcBox + "</div>";
  },
  /** 把没有围栏的多行 JSON/JS 对象抽出来（否则会被当普通段落转义成“代码原文”） */
  _extractBareJson(text, out) {
    const lines = String(text).split("\n");
    const res = [];
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      const startish = /^\{$/.test(t) || /^\{\s*"/.test(t) || /^["']?[\w$]+["']?\s*:\s*[\{\[]\s*$/.test(t);
      if (startish) {
        let depth = 0, j = i, ok = false;
        for (; j < lines.length; j++) {
          const line = lines[j];
          for (let c = 0; c < line.length; c++) {
            const ch = line.charAt(c);
            if (ch === "{" || ch === "[") depth++;
            else if (ch === "}" || ch === "]") depth--;
          }
          if (depth <= 0 && j > i) { ok = true; break; }
        }
        // 模型输出被截断、括号没收全时，也把剩余部分当数据块（否则会原样刷出代码文本）
        const end = ok ? j : lines.length - 1;
        const body = lines.slice(i, end + 1).join("\n");
        const enough = ok ? (j - i >= 2) : (lines.length - i >= 3);
        if (enough && /:\s/.test(body) && (body.match(/"/g) || []).length >= 4
            && /^\s*["']?[\w$]+["']?\s*:/m.test(body)) {
          out.push(body);
          res.push("\u0000J" + (out.length - 1) + "\u0000");
          i = end + 1;
          continue;
        }
      }
      res.push(lines[i]);
      i++;
    }
    return res.join("\n");
  },
  /** 主入口：原始文本 → 剧情区 HTML（样式已作用域化） */
  render(text) {
    const src = String(text == null ? "" : text)
      .replace(/\r\n?/g, "\n")
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      // 整页外壳（酒馆里常见的“整段 HTML 文档”形态）：只去掉外层标签，head 里的 <style> 原样保留
      .replace(/<!doctype[^>]*>/gi, "")
      .replace(/<title\b[^>]*>[\s\S]*?<\/title>/gi, "")
      .replace(/<\/?(?:html|head|body|gui)\b[^>]*>/gi, "")
      // 坏标签 “< img” / “< div” → 正常标签，否则会被当成纯文本显示出来
      .replace(/<\s+(?=(?:img|div|span|a|br|p|button|details|summary|svg|input|label|section|main|figure|table|tr|td)\b)/gi, "<");
    const fences = [];
    const jsons = [];
    const css = [];
    // ① 先抽出围栏代码块与 <style>，避免它们被 HTML 块吞掉
    let work = src.replace(/```[\s\S]*?```/g, (tok) => {
      const f = /^```([^\n]*)\n?([\s\S]*?)```$/.exec(tok) || [];
      fences.push({ info: String(f[1] || "").trim().toLowerCase(), body: String(f[2] || "") });
      return "\u0000F" + (fences.length - 1) + "\u0000";
    });
    // ①a 未闭合围栏（模型截断时常见：只有开头的 ```html，没有结尾）
    work = work.replace(/```([A-Za-z0-9_+-]*)\n([\s\S]*)$/, (m, info, body) => {
      fences.push({ info: String(info || "").trim().toLowerCase(), body: String(body || "") });
      return "\u0000F" + (fences.length - 1) + "\u0000";
    });
    // ①b 已被包成 <pre><code>&lt;div&gt;… 的 HTML：解实体后按 HTML 渲染
    work = work.replace(/<pre\b[^>]*>\s*<code\b[^>]*>([\s\S]*?)<\/code>\s*<\/pre>/gi, (m, inner2) => {
      const dec = this.unescapeEntities(inner2);
      if (this.looksHtml(dec)) {
        fences.push({ info: "html", body: dec });
        return "\u0000F" + (fences.length - 1) + "\u0000";
      }
      return m;
    });
    work = work.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (m, body) => {
      css.push(body);
      return "";
    });
    // ② 裸 JSON / JS 对象（截图里那种没有围栏的结构）单独识别
    work = this._extractBareJson(work, jsons);
    const fenceHTML = (i) => {
      const p = fences[i];
      if (!p) return "";
      if (/^(json|jsonc|json5)$/.test(p.info)) return this.jsonCard(p.body);
      if (/^(html|htm|xhtml|svg|render|xml|vue)$/.test(p.info) || (!p.info && this.looksHtml(p.body))) {
        return this.htmlPart(p.body);
      }
      if (/^(css|scss|less|style)$/.test(p.info)) {
        css.push(p.body);
        return this.cssSource(p.body);
      }
      return `<pre class="story-code">${OWGMarkdown.escape(p.body.replace(/\n$/, ""))}</pre>`;
    };
    const piece = (seg) => {
      if (!seg) return "";
      let out = "", last = 0, m;
      const re = /\u0000([FJ])(\d+)\u0000/g;
      while ((m = re.exec(seg))) {
        if (m.index > last) out += this.textPart(seg.slice(last, m.index));
        out += m[1] === "F" ? fenceHTML(+m[2]) : this.jsonCard(jsons[+m[2]]);
        last = re.lastIndex;
      }
      if (last < seg.length) out += this.textPart(seg.slice(last));
      return out;
    };
    // ③ 再识别整块 HTML（贪婪匹配，保证嵌套标签完整）
    let html = "";
    const re = new RegExp("<(" + this.BLOCK_TAGS + ")\\b[\\s\\S]*<\\/\\1>", "gi");
    let last = 0, m;
    while ((m = re.exec(work))) {
      if (m.index > last) html += piece(work.slice(last, m.index));
      html += this.htmlPart(m[0].replace(/\u0000[FJ]\d+\u0000/g, ""));
      last = re.lastIndex;
    }
    if (last < work.length) html += piece(work.slice(last));
    // ④ 整段就是一段未闭合的 HTML（模型偶尔直接吐 <div>…）
    if (!html && !fences.length && !jsons.length && /^<[\w-]+[\s>]/.test(work.trim())) html = this.htmlPart(work);
    let out = "";
    if (css.length) out += "<style>" + css.join("\n") + "</style>";
    out += html;
    return this.scopeStyleTags(out);
  },
};

/* ---------------------------------------------------------------
 * 6.6) 角色卡前端渲染美化已移除：不再注入卡 CSS / 执行卡显示正则
 *   卡内脚本仍由 OWGScript 管理；正文只走 OWGRich 代码美化管线
 * ------------------------------------------------------------- */

/* ---------------------------------------------------------------
 * 思维链：从模型输出里拆到后台，正文只留叙述
 * 形态：<!-- charThink / jp: ... --> 注释块、<thinking|think|draft|review|dice_calculation> 标签块
 * ------------------------------------------------------------- */
const OWGReason = {
  TAGS: "thinking|think|draft|charthink|review|dice_calculation|analysis|reasoning|cot",
  /** 思维块判定词表（summary 文本 / details 的 class·id 都按它判定） */
  WORD: /思维|思考|推理|变量|模板|自检|内心|独白|心理|分析|草稿|检查|复盘|推导|设定|提示词|thought|think|reason|self-?check|analysis|draft|review|check|monologue|inner|plan|prompt|cot/i,
  tagPair() { return new RegExp("<(" + this.TAGS + ")\\b[^>]*>[\\s\\S]*?<\\/\\1\\s*>", "gi"); },
  strayTags() { return new RegExp("<\\/?(?:" + this.TAGS + ")\\b[^>]*>", "gi"); },
  detailsBegin(tagText) { return this.WORD.test(String(tagText || "")); },
  /** 去掉空容器 / 空围栏，避免思维块被摘掉后正文里残留空壳 */
  tidy(s) {
    let t = String(s == null ? "" : s);
    t = t.replace(/```[A-Za-z0-9_+-]*[ \t]*\n?([\s\S]*?)```/g, (m, inner) => {
      const left = String(inner || "")
        .replace(/<(\w+)\b[^>]*>\s*<\/\1>/gi, " ")
        .replace(/<[^>]+>/g, " ")
        .replace(/[`\s]/g, "");
      return left ? m : "";
    });
    for (let i = 0; i < 2; i++) {
      t = t.replace(/<(div|section|p|span)\b[^>]*>\s*<\/\1>/gi, "");
    }
    return t.replace(/\n{3,}/g, "\n\n").trim();
  },
  /** 拆分：body=可见正文，reasoning=后台思考内容（details/注释/推理标签都算后台） */
  split(text) {
    let src = String(text == null ? "" : text);
    const picked = [];
    const push = (s) => {
      const t = String(s || "")
        .replace(/<\/?[a-z][^>]*>/gi, " ")
        .replace(/\[OS\]/gi, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
      if (t) picked.push(t);
    };
    // 1) <details> 块：summary 可带属性；summary 文字或 details 的 class/id 命中词表即视为思维
    src = src.replace(/<details\b([^>]*)>([\s\S]*?)<\/details>/gi, (m, attrs, inner) => {
      const sm = String(inner || "").match(/<summary\b[^>]*>([\s\S]*?)<\/summary>/i);
      const sumTxt = sm ? String(sm[1] || "").trim() : "";
      if (this.WORD.test(sumTxt) || this.detailsBegin(attrs)) {
        push(sumTxt + "\n" + String(inner || ""));
        return "";
      }
      return m;
    });
    // 2) 推理标签块
    src = src.replace(this.tagPair(), m => { push(m); return ""; });
    // 3) 注释块
    src = src.replace(/<!--[\s\S]*?-->/g, m => {
      push(m.replace(/^<!--/, "").replace(/-->$/, ""));
      return "";
    });
    // 4) 外层包裹（<div class="think-wrap">…</div>）：命中词表则整块收后台
    src = src.replace(/<(div|section)\b[^>]*(?:class|id)="[^"]*(?:think|reason|draft|cot|analysis|monologue)[^"]*"[^>]*>([\s\S]*?)<\/\1>/gi, (m, tag, inner) => {
      push(inner);
      return "";
    });
    // 5) 未闭合的 details（流式/截断）：最后一个 details 无闭合标签，且 summary/属性命中时整段收后台
    const lastD = src.lastIndexOf("<details");
    if (lastD >= 0 && src.indexOf("</details>", lastD) < 0) {
      const tail = src.slice(lastD);
      const sm = tail.match(/<summary\b[^>]*>([\s\S]*?)<\/summary>/i);
      const head = tail.match(/<details\b([^>]*)>/i);
      if (this.WORD.test(sm ? sm[1] : "") || this.detailsBegin(head ? head[1] : "")) {
        push(tail);
        src = src.slice(0, lastD);
      }
    }
    // 6) 清理残留标签与空壳
    src = src.replace(this.strayTags(), "");
    src = this.tidy(src);
    return {
      body: src.replace(/\[OS\]/gi, "").replace(/\n{3,}/g, "\n\n").trim(),
      reasoning: picked.filter(Boolean).join("\n\n").trim(),
    };
  },
  /** 流式输出：已闭合的思维块直接去掉；未闭合的 details / 围栏 / 推理标签 / 注释从起始处截断，避免闪现 */
  visible(text) {
    let out = this.split(text).body;
    out = out.replace(new RegExp("<(" + this.TAGS + ")\\b[^>]*>[\\s\\S]*", "i"), "");
    const d = out.lastIndexOf("<details");
    if (d >= 0 && out.indexOf("</details>", d) < 0) out = out.slice(0, d);
    const fences = (out.match(/```/g) || []).length;
    if (fences % 2 === 1) out = out.slice(0, out.lastIndexOf("```"));
    const c = out.lastIndexOf("<!--");
    if (c >= 0 && out.indexOf("-->", c) < 0) out = out.slice(0, c);
    return out.trim();
  },
  strip(text) { return this.split(text).body; },
};

const OWGRender = {
  settings() {
    const s = Game.state.settings;
    if (!s.render || typeof s.render !== "object") s.render = { code: true, scripts: false, hideInternal: true, showMacros: false, showReasoning: false, keepReasoningInPrompt: true };
    if (typeof s.render.code !== "boolean") s.render.code = true;
    if (typeof s.render.scripts !== "boolean") s.render.scripts = false;
    if (typeof s.render.hideInternal !== "boolean") s.render.hideInternal = true;
    if (typeof s.render.showMacros !== "boolean") s.render.showMacros = false;
    if (typeof s.render.showReasoning !== "boolean") s.render.showReasoning = false;
    if (typeof s.render.keepReasoningInPrompt !== "boolean") s.render.keepReasoningInPrompt = true;
    return s.render;
  },
  /** 剧情正文里不该出现的东西：思维链、变量/模板转储（统一走 OWGReason，避免两套正则不一致） */
  stripInternal(text) {
    let s = OWGReason.strip(String(text == null ? "" : text));
    s = s.replace(/\[\/?(?:思维|思考|推理|变量|模板)\]/g, "");
    return s;
  },
  /** 剧情正文 → HTML（宏生效、markdown、代码/HTML/CSS 美化渲染、内部信息隐藏） */
  toHTML(text) {
    const cfg = this.settings();
    let s = String(text == null ? "" : text);
    s = OWGPanel.extract(s).text; // 历史消息/其它入口的面板块兜底清除（只删不应用）
    if (cfg.hideInternal !== false) s = this.stripInternal(s);

    const ctx = (typeof STBridge !== "undefined" && STBridge.macroContext) ? STBridge.macroContext() : {};
    try { s = STBridge.macro(s, Object.assign({}, ctx, { original: s })); } catch (e) { /* 宏失败保留原文 */ }
    try { if (STAssist.renderOn()) s = STAssist.applyMacroLike(s); } catch (e) { }
    try { if (STAssist.templateOn()) { s = STAssist.applySugar(s, ctx); s = STAssist.runEjs(s, {}); } } catch (e) { }
    // 预设里没有对应美化正则时，把剧情用的标签壳去掉，只留文字（避免正文里出现 <now_plot> 之类的源码）
    s = s.replace(/<\/?(?:now_plot|scene_time|scene)\b[^>]*>/gi, "");
    if (cfg.showMacros === false) s = s.replace(/{{[^{}]*}}/g, "");
    // 总开关关闭：保持纯文本行为（HTML 一律转义）
    if (cfg.code === false) return this.markdownHTML(s, false);
    return OWGRich.render(s);
  },
  /** 正文 markdown → HTML（酒馆式），raw=false 时行内 HTML 也被转义 */
  markdownHTML(t, raw) {
    let s = String(t == null ? "" : t);
    const parts = OWGMarkdown.render(s, { raw: raw !== false });
    let html = parts.html;
    for (const r of parts.renders) {
      html = html.replace("\u0000RENDER\u0000", () => `<pre class="story-code">${OWGMarkdown.escape(r.code)}</pre>`);
    }
    return OWGMarkdown.sanitize(html);
  },
  /** 纯文本模式（单条消息切换「源码」或关闭总开关时使用） */
  plainHTML(t) {
    return this.markdownHTML(t, false);
  },
  /** 去掉 HTML 卡片/容器的整块内容（含其中的装饰文字），按同名标签配对扫描 */
  stripHtmlContainers(s) {
    const TAGS = ["div", "section", "article", "header", "footer", "main", "nav", "aside",
      "table", "thead", "tbody", "tr", "td", "th", "ul", "ol", "dl", "dt", "dd",
      "form", "fieldset", "figure", "figcaption", "details", "svg", "canvas",
      "button", "select", "picture", "video", "audio"];
    const openRe = new RegExp("<\\s*(" + TAGS.join("|") + ")\\b[^>]*>", "i");
    let out = "", i = 0, guard = 0;
    const src = String(s == null ? "" : s);
    while (i < src.length && guard++ < 200) {
      const rest = src.slice(i);
      const m = openRe.exec(rest);
      if (!m) { out += rest; break; }
      out += rest.slice(0, m.index);
      const tag = m[1].toLowerCase();
      const tagRe = new RegExp("<\\s*(/?)" + tag + "\\b[^>]*>", "gi");
      tagRe.lastIndex = m.index;
      let depth = 0, end = -1, mm;
      while ((mm = tagRe.exec(rest))) {
        if (mm[1] === "/") depth--;
        else if (!/\/\s*>$/.test(mm[0])) depth++;
        if (depth === 0 && mm[1] === "/") { end = mm.index + mm[0].length; break; }
        if (tagRe.lastIndex > rest.length) break;
      }
      if (end === -1) { out += " "; break; } // 未闭合：视作卡片延到结尾
      i += end;
      out += " ";
    }
    return out;
  },
  /** 只保留叙述正文（围栏代码块 / script / style / pre / HTML 卡片 / 裸 JSON 都不计入） */
  narrativeOnly(text) {
    let s = String(text == null ? "" : text).replace(/\r\n?/g, "\n");

    s = OWGPanel.extract(s).text;
    s = this.stripInternal(s);
    s = s.replace(/```[\s\S]*?```/g, " ");
    s = s.replace(/```([A-Za-z0-9_+-]*)\n[\s\S]*$/g, " ");
    s = s.replace(/<style[\s\S]*?<\/style>/gi, " ");
    s = s.replace(/<script[\s\S]*?<\/script>/gi, " ");
    s = s.replace(/<pre[\s\S]*?<\/pre>/gi, " ");
    const jsons = [];
    s = OWGRich._extractBareJson(s, jsons);
    s = s.replace(/\u0000[A-Z]\d+\u0000/g, " ");
    s = this.stripHtmlContainers(s);
    s = s.replace(/\{\{[^{}]*\}\}/g, "");
    s = s.replace(/<%[\s\S]*?%>/g, "");
    s = s.replace(/<[^>]+>/g, " ");
    s = s.replace(/&[a-z#0-9]+;/gi, " ");
    return s.replace(/\s+/g, "");
  },
  /** 正文字数：只统计叙述正文；思维链 / 代码块 / 变量 / 模板 / 美化卡片都不计入 */
  countWords(text) {
    return this.narrativeOnly(text).length;
  },
};

/* ---------------------------------------------------------------
 * 9) 剧情插图：原图不压缩 + 灯箱查看
 * ------------------------------------------------------------- */
const OWGImage = {
  open(src) {
    if (!src) return;
    const root = document.querySelector("#lightbox-root") || (() => {
      const d = document.createElement("div");
      d.id = "lightbox-root";
      document.body.appendChild(d);
      return d;
    })();
    root.innerHTML = `<div class="lb-mask"><img class="lb-img" src="${src}" alt="剧情插图大图"><div class="lb-tip">点击任意处关闭</div></div>`;
    root.classList.add("show");
    const close = () => { root.classList.remove("show"); root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    root.querySelector(".lb-mask").onclick = close;
    document.addEventListener("keydown", onKey);
  },
};

/* ---------------------------------------------------------------
 * 6) 按角色卡隔离的存档
 * ------------------------------------------------------------- */
const OWGSaves = {
  cardKey() { return Game.state.cardId || "default"; },
  cardName() { const c = Game.activeCard(); return c ? c.name : "默认世界"; },
  /** 旧档兼容：补 cardId 字段，旧的自动档 id 迁移为 auto@<card> */
  migrate(list) {
    let changed = false;
    for (const s of list) {
      if (!s || typeof s !== "object") continue;
      if (s.cardId === undefined) {
        s.cardId = (s.data && s.data.cardId) || null;
        changed = true;
      }
      if (s.auto && s.id === "auto") {
        s.id = "auto@" + (s.cardId || "default");
        changed = true;
      }
    }
    return changed;
  },
  all() {
    const list = Game.slots();
    if (this.migrate(list)) Game.saveSlots(list);
    return list;
  },
  /** 当前角色卡的存档 */
  current() {
    const k = this.cardKey();
    return this.all().filter(s => (s.cardId || "default") === k);
  },
  /** 指定角色卡的存档（启用前筛选该卡名下存档，不混入其他卡/全局档） */
  forCard(cardId) {
    const k = cardId || "default";
    return this.all().filter(s => (s.cardId || "default") === k);
  },
  /** 其它角色卡的存档（只读展示，不受当前卡操作影响） */
  others() {
    const k = this.cardKey();
    return this.all().filter(s => (s.cardId || "default") !== k);
  },
  /** 存档摘要：条数 / 正文字数 / 等级 */
  /** 存档摘要：返回一行文字说明；空档 / 缺字段都不抛错 */
  summary(slot) {
    const d = (slot && slot.data) || {};
    const msgs = Array.isArray(d.messages) ? d.messages : [];
    const words = msgs.reduce((n, m) => n + OWGRender.countWords((m && m.content) || ""), 0);
    const p = d.player || null;
    const parts = [msgs.length + " 条剧情", "约 " + words + " 字"];
    if (p && p.level) parts.push("Lv." + p.level + (p.cls ? " " + p.cls : ""));
    return parts.join(" · ");
  },
};

/* ---------------------------------------------------------------
 * 1) 主属性与衍生属性（按云的定义）
 *    体质 con ：主 生命、防御 ；次 魔力
 *    精神 spi ：主 魔力、法伤 ；次 暴击率
 *    力量 str ：主 攻击、暴击伤害 ；次 暴击率
 *    敏捷 agi ：主 速度、暴击率 ；次 法伤
 * ------------------------------------------------------------- */
const OWGAttr = {
  primary: ["con", "spi", "str", "agi"],
  meta: {
    con: { name: "体质", icon: "💪", desc: "主：生命、防御；次：魔力" },
    spi: { name: "精神", icon: "🧠", desc: "主：魔力、法伤；次：暴击率" },
    str: { name: "力量", icon: "⚔️", desc: "主：攻击、暴击伤害；次：暴击率" },
    agi: { name: "敏捷", icon: "💨", desc: "主：速度、暴击率；次：法伤" },
  },
  /** 职业成长系数（由职业数值风格推断，法师系与战士系不同） */
  growth(cls) {
    const a = (cls && cls.attrs) || {};
    const caster = (a.int || 0) >= (a.atk || 0);
    const bulky = (a.hp || 0) >= 110;
    return {
      hpPerCon: 12 + (bulky ? 4 : 0),
      mpPerCon: 2,
      mpPerSpi: 10 + ((a.mp || 0) > 80 ? 4 : 0),
      matkPerSpi: caster ? 5 : 3.5,
      matkPerAgi: 1,
      atkPerStr: caster ? 1.6 : 3,
      critDmgPerStr: 5,
      defPerCon: 1 + ((a.def || 0) > 10 ? 0.4 : 0),
      spdPerAgi: 1,
      critPerSpi: 0.5,
      critPerStr: 0.3,
      critPerAgi: 0.8,
    };
  },
  /** 由主属性 + 等级 + 职业基础算衍生属性 */
  calc(p, cls) {
    const g = this.growth(cls);
    const a = (cls && cls.attrs) || {};
    const A = (p && p.attrs) || {};
    const lv = (p && p.level) || 1;
    const con = A.con || 0;
    const spi = A.spi != null ? A.spi : (A.int || 0);
    const str = A.str || 0;
    const agi = A.agi != null ? A.agi : (A.luk || 0);
    return {
      maxHp: Math.round((a.hp || 80) * 0.5 + con * g.hpPerCon + (lv - 1) * 8),
      maxMp: Math.round((a.mp || 40) * 0.5 + spi * g.mpPerSpi + con * g.mpPerCon + (lv - 1) * 4),
      atk: Math.round((a.atk || 8) * 0.5 + str * g.atkPerStr + (lv - 1) * 2),
      matk: Math.round((a.int || a.atk || 8) * 0.4 + spi * g.matkPerSpi + agi * g.matkPerAgi + (lv - 1) * 2),
      def: Math.round((a.def || 5) * 0.5 + con * g.defPerCon + (lv - 1) * 1),
      spd: Math.round((a.spd || 8) * 0.5 + agi * g.spdPerAgi + (lv - 1) * 1),
      crit: Math.round((5 + spi * g.critPerSpi + str * g.critPerStr + agi * g.critPerAgi) * 10) / 10,
      critDmg: Math.round(100 + str * g.critDmgPerStr),
    };
  },
  /** 旧存档属性名迁移：int→精神，luk→敏捷 */
  migrate(p) {
    if (!p || !p.attrs) return;
    const A = p.attrs;
    if (A.spi == null && A.int != null) A.spi = A.int;
    if (A.agi == null && A.luk != null) A.agi = A.luk;
    delete A.int; delete A.luk;

};

/* ---------------------------------------------------------------
 * 2) 升级经验表（云给定的完整表，逐级核对，不另推公式）

 * ------------------------------------------------------------- */
const OWGLevel = {
  TABLE: [

  /** 升到下一级所需经验 */
  need(level) {

    if (has(/复活|复苏|重生|回生|亡者归来|起死回生/)) return "h_revive";

    if (has(/治疗|治愈|疗伤|圣光|愈合|回复|恢复/)) {
      if (has(/再生|回春|持续|每回合/)) return "h_regen";
      return has(/全体|群体|全部|普照/) ? "h_group" : "h_single";
    }
    if (has(/战意|强化|鼓舞|狂暴|攻击提升|战神|斗志/)) return has(/全体|群体|全部/) ? "b_all" : "b_atk";

    if (has(/易伤|脆弱|受伤增加/)) return "n_vuln";
    // 群体攻击（含元素细分）
    if (has(/全体|群体|全场|范围|八方|横扫|风暴|箭雨|弹幕|冲击波|乱射/)) {
      if (has(/冰|霜/)) return "g_iceburst";
      if (has(/毒/)) return "g_poisoncloud";
      if (has(/血|割|刃/)) return "g_bladestorm";
      if (has(/箭|矢|射/)) return "g_arrowrain";
      if (has(/火|炎|焰/)) return "g_firestorm";
      return "g_sweep";
    }
    if (has(/沉默|禁言|封口|禁咒/)) return "c_silence";
    if (has(/冰冻|冻结|寒冰|冰封|霜冻/)) return "c_freeze";
    if (has(/麻痹|感电|雷击|电击/)) return "c_paralyze";

    if (has(/流血|撕裂|割裂|出血|放血/)) return "d_bleed";
    if (has(/吸魔|汲魔|抽魔|烧蓝|燃魔/)) return "u_manaburn";
    if (has(/斩杀|处决|终结|断头/)) return "s_execute";
    if (has(/穿刺|贯穿|破甲一击|穿甲/)) return "s_pierce";
    if (has(/背刺|偷袭|暗杀/)) return "s_backstab";

    if (has(/蓄力|巨力|毁灭|崩山|全力|重斩/)) return "s_charged";
    if (has(/狙击|精准|瞄准/)) return "s_snipe";
