<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>开放世界 · 文字冒险</title>
<style>

/* ========== 开放世界·文字冒险 — 移动优先样式 ========== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f1220;
  --bg2: #161b2d;
  --panel: #1a2036;
  --panel2: #212842;
  --line: #2b3354;
  --txt: #e8eaf6;
  --txt2: #9aa3c7;
  --acc: #8b7cf6;
  --acc2: #a99cf9;
  --gold: #e8c574;
  --red: #e06c75;
  --green: #7ecb8f;
  --blue: #6fb3e0;
  --radius: 14px;
  --nav-h: 62px;
}
html { font-size: 16px; }
body {
  background: var(--bg); color: var(--txt);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  line-height: 1.6; overflow: hidden; height: 100vh; height: 100dvh;
}
#app { max-width: 720px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; background-color: var(--bg); background-image: var(--bg-image, none); background-size: cover; background-position: center; }
@media (min-width: 721px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 7px) 12px 7px;
  background: linear-gradient(180deg, #171c30, #131727);
  border-bottom: 1px solid var(--line); flex-shrink: 0; z-index: 5;
}
.tb-left { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; overflow: hidden; }
.tb-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tb-sub { font-size: 11px; color: var(--txt2); flex-shrink: 0; max-width: 32vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-right { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.chip {
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: var(--panel2); color: var(--txt2); border: 1px solid var(--line); white-space: nowrap;
}
.chip-gold { color: var(--gold); border-color: #4d4128; background: #2a2338; }

/* ---------- 页面区 ---------- */
#pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 20px); display: none; -webkit-overflow-scrolling: touch; }
.page.active { display: block; }
.page.active.fade { animation: fadeIn .22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 底部导航 ---------- */
#tabbar {
  position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; background: #141829; border-top: 1px solid var(--line); z-index: 10;
}
.tab {
  flex: 1; border: none; background: none; color: var(--txt2);
  font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; transition: color .15s;
}
.tab span { font-size: 21px; line-height: 1; filter: grayscale(.6); transition: filter .15s; }
.tab.active { color: var(--acc2); }
.tab.active span { filter: none; }
.tab-story span { transform: scale(1.15); }
i { font-style: normal; }

/* ---------- 通用组件 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 15px; font-size: 14px; cursor: pointer;
  transition: transform .1s, background .15s; min-height: 40px; font-family: inherit;
}
.btn:active { transform: scale(.96); }
.btn.primary { background: linear-gradient(135deg, #7a6af0, #9a8cf8); border-color: transparent; color: #fff; font-weight: 600; }
.btn.gold { background: linear-gradient(135deg, #c9a24a, #e8c574); border-color: transparent; color: #241a05; font-weight: 700; }
.btn.danger { background: #3a1f26; border-color: #6b2f3a; color: #f098a1; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 30px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.block { width: 100%; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 26px rgba(0,0,0,var(--shadow-a, 0)); }
.card-title { font-size: 14px; font-weight: 700; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title .btn { flex-shrink: 0; }
.hint { font-size: 12px; color: var(--txt2); }
.divider { height: 1px; background: var(--line); margin: 10px 0; }

input[type=text], input[type=password], input[type=url], input[type=number], textarea, select {
  width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
  color: var(--txt); padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--acc); }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--txt2) 50%), linear-gradient(135deg, var(--txt2) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
label.field { display: block; font-size: 12px; color: var(--txt2); margin-bottom: 12px; }
label.field > span { display: block; margin-bottom: 5px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.row > .btn { flex-shrink: 0; }

.switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; transition: .2s; cursor: pointer; }
.switch i::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--txt2); top: 2px; left: 2px; transition: .2s; }
.switch input:checked + i { background: var(--acc); border-color: var(--acc); }
.switch input:checked + i::after { left: 22px; background: #fff; }

input[type=range] { width: 100%; accent-color: var(--acc); }

/* ---------- 世界页 ---------- */
.map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.map-card {
  background: linear-gradient(160deg, var(--panel), #1c2240); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 13px; cursor: pointer; position: relative; overflow: hidden;
  transition: transform .12s, border-color .15s;
}
.map-card:active { transform: scale(.97); }
.map-card.current { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.map-emoji { font-size: 30px; margin-bottom: 8px; }
.map-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.map-desc { font-size: 11.5px; color: var(--txt2); line-height: 1.5; min-height: 34px; }
.map-meta { font-size: 11px; color: var(--txt2); margin-top: 8px; }
.badge-now { position: absolute; top: 10px; right: 10px; font-size: 10px; background: var(--acc); color: #fff; padding: 2px 8px; border-radius: 999px; }

.page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.page-head .btn { flex-shrink: 0; }
.page-head h2 { font-size: 17px; flex: 1; }

.loc-item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.loc-item.now { border-color: var(--acc); }
.loc-emoji { font-size: 22px; width: 34px; text-align: center; flex-shrink: 0; }
.loc-info { flex: 1; min-width: 0; }
.loc-name { font-size: 14.5px; font-weight: 600; }
.loc-name .badge-now { position: static; margin-left: 6px; vertical-align: 2px; }
.loc-desc { font-size: 12px; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 状态页 ---------- */
.panel-hero { display: flex; gap: 14px; align-items: center; }
.avatar {
  width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0;
  background: linear-gradient(135deg, #2a3358, #1c2240); display: flex; align-items: center; justify-content: center;
  font-size: 30px; border: 1px solid var(--line); overflow: hidden; background-size: cover; background-position: center;
}
.ph-name { font-size: 18px; font-weight: 700; }
.ph-class { font-size: 12.5px; color: var(--txt2); margin: 2px 0 6px; }
.exp-bar { height: 8px; background: var(--bg2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.exp-bar > div { height: 100%; background: linear-gradient(90deg, #7a6af0, #b39dfa); border-radius: 99px; transition: width .4s; }
.exp-text { font-size: 11px; color: var(--txt2); margin-top: 4px; }

.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.attr-row { display: flex; align-items: center; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.attr-row .an { font-size: 12px; color: var(--txt2); flex: 1; }
.attr-row .av { font-size: 15px; font-weight: 700; }
.attr-row .av small { color: var(--txt2); font-weight: 400; font-size: 11px; }
.attr-plus { width: 28px; height: 28px; border-radius: 8px; background: var(--acc); color: #fff; border: none; font-size: 17px; line-height: 1; margin-left: 8px; cursor: pointer; flex-shrink: 0; }
.attr-plus:disabled { opacity: .3; }
.points-tip { font-size: 12.5px; color: var(--gold); margin-bottom: 10px; }

.skill-item { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.skill-name { font-size: 14px; font-weight: 600; color: var(--acc2); }
.skill-desc { font-size: 12px; color: var(--txt2); margin-top: 2px; }

.status-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; background: #26304f; border: 1px solid #38466e; color: #b8c4ee; border-radius: 999px; padding: 4px 12px; margin: 0 6px 6px 0; }
.status-chip.bad { background: #34202c; border-color: #5d3346; color: #eba8b5; }

.item-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.item-row:last-child { border-bottom: none; }
.item-row .cnt { color: var(--gold); }
.gold-line { font-size: 14px; color: var(--gold); }

/* ---------- 剧情页 ---------- */
#page-story { display: none; flex-direction: column; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
#page-story.active { display: flex; }
.story-scroll { flex: 1; overflow-y: auto; padding: 4px 2px 10px; -webkit-overflow-scrolling: touch; min-height: 0; }
.story-banner { font-size: 12px; background: #33290f; border: 1px solid #57461a; color: #e8c574; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; }
.story-banner a { color: #ffe9b0; text-decoration: underline; cursor: pointer; }
.msg { display: flex; gap: 9px; margin-bottom: 14px; animation: fadeIn .25s ease; }
.msg .m-avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 17px; border: 1px solid var(--line); background-color: var(--panel2); }
.msg .m-body { flex: 1; min-width: 0; }
.msg .m-name { font-size: 11px; color: var(--txt2); margin-bottom: 3px; }
.msg .m-text { font-size: 14.5px; line-height: 1.75; background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 13px; word-break: break-word; white-space: pre-wrap; }
.msg.user { flex-direction: row-reverse; }
.msg.user .m-name { text-align: right; }
.msg.user .m-text { background: #2c2a55; border-color: #453f86; border-radius: 14px 4px 14px 14px; }
.msg.sys { justify-content: center; }
.msg.sys .m-text { background: none; border: none; color: var(--txt2); font-size: 12px; padding: 2px; text-align: center; }
.delta-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.d-chip { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #1f2a1f; color: var(--green); border: 1px solid #2f4530; }
.d-chip.neg { background: #301f24; color: var(--red); border-color: #4a2b33; }
.d-chip.gold { background: #2f2817; color: var(--gold); border-color: #4d4128; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--txt2); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.cursor-blink::after { content: "▍"; color: var(--acc2); animation: blink 1s infinite; }

.story-input { position: relative; border-top: 1px solid var(--line); background: #141829; padding: 6px 14px 6px; margin: 0 -14px; }
/* 紧凑功能按钮：单行，窄屏横向滚动，不挤压输入框 */
.si-tools { display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.si-tools::-webkit-scrollbar { display: none; }
.si-tool {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px;
  height: 27px; padding: 0 8px; border-radius: 8px; white-space: nowrap;
  background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
  font-size: 11.5px; font-family: inherit; cursor: pointer;
}
.si-tool:active { transform: scale(.95); }
.si-tool:disabled { opacity: .45; pointer-events: none; }
.si-tool .ico { font-size: 13px; line-height: 1; }
.si-row { display: flex; gap: 8px; align-items: flex-end; }
.si-row textarea { flex: 1; resize: none; max-height: 110px; min-height: 42px; line-height: 1.5; border-radius: 12px; }
#story-send { flex-shrink: 0; width: 58px; height: 42px; border-radius: 12px; padding: 0; }
#story-send.stop { background: #3a1f26; border-color: #6b2f3a; color: #f098a1; }

/* ---------- 存档页 ---------- */
.save-slot { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
.save-slot .s-info { flex: 1; min-width: 0; }
.save-slot .s-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-slot .s-meta { font-size: 11.5px; color: var(--txt2); margin-top: 2px; }
.save-slot.auto { border-color: var(--gold); }
.tag-auto { font-size: 10px; color: var(--gold); border: 1px solid #4d4128; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.wb-badge { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.wb-badge.ok { color: var(--green); border-color: #2f5540; background: #16281f; }
.wb-badge.no { color: var(--red); border-color: #5a2b33; background: #2a1820; }
.wb-badge.idle { color: var(--txt2); }

/* ---------- 我的页 ---------- */
.mine-item { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
.mine-item:last-child { border-bottom: none; }
.mine-item .mi-ico { font-size: 19px; width: 26px; text-align: center; flex-shrink: 0; }
.mine-item .mi-main { flex: 1; min-width: 0; }
.mine-item .mi-title { font-size: 14.5px; font-weight: 600; }
.mine-item .mi-sub { font-size: 11.5px; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-lib-item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 9px; }
.card-lib-item .avatar { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
.card-lib-item .cli-info { flex: 1; min-width: 0; }
.card-lib-item .cli-name { font-size: 14px; font-weight: 600; }
.card-lib-item .cli-sub { font-size: 11px; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-on { color: var(--green); font-size: 11px; }

/* ---------- 弹窗 ---------- */
#modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
#modal-root.show { display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 721px) { #modal-root.show { align-items: center; } }
.modal-mask { position: absolute; inset: 0; background: rgba(5, 8, 18, .72); backdrop-filter: blur(3px); }
.modal {
  position: relative; width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); animation: slideUp .25s ease;
}
@media (min-width: 721px) { .modal { border-radius: 20px; animation: fadeIn .2s ease; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }
.modal-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg2); color: var(--txt2); font-size: 15px; cursor: pointer; }

.cls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.cls-opt { background: var(--bg2); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: border-color .15s; }
.cls-opt .ce { font-size: 24px; }
.cls-opt .cn { font-size: 13.5px; font-weight: 600; margin: 4px 0 2px; }
.cls-opt .cd { font-size: 10.5px; color: var(--txt2); line-height: 1.4; }
.cls-opt.sel { border-color: var(--acc); background: #252c52; }
.cls-opt.sel .cn { color: var(--acc2); }

.ana-block { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 9px; }
.ana-block h4 { font-size: 12.5px; color: var(--gold); margin-bottom: 4px; }
.ana-block p { font-size: 13px; color: var(--txt); line-height: 1.7; white-space: pre-wrap; }

.loading-dots { text-align: center; padding: 24px 0; color: var(--txt2); font-size: 13px; }
.loading-dots .dots { display: inline-block; animation: dots 1.4s infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.progress-note { font-size: 12px; color: var(--txt2); text-align: center; margin-top: 8px; }

/* ---------- Toast ---------- */
#toast-root { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 200; pointer-events: none; }
.toast { background: #262e4f; border: 1px solid #3d4a7c; color: var(--txt); font-size: 13.5px; padding: 10px 18px; border-radius: 999px; max-width: 86vw; box-shadow: 0 6px 22px rgba(0,0,0,.4); animation: toastIn .25s ease; }
.toast.err { background: #3a2029; border-color: #6b2f3a; color: #f2b3bc; }
.toast.ok { background: #1e3126; border-color: #2f5a41; color: #a9e0bb; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

.empty { text-align: center; color: var(--txt2); font-size: 13px; padding: 34px 10px; }
.empty .ee { font-size: 34px; display: block; margin-bottom: 8px; opacity: .7; }

/* ---------- 子页签 ---------- */
.subtabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  padding: 8px 16px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line);
  font-size: 13.5px; color: var(--txt2); white-space: nowrap; cursor: pointer; flex-shrink: 0;
  transition: all .15s; font-family: inherit;
}
.subtab.active { background: linear-gradient(135deg, #7a6af0, #9a8cf8); color: #fff; border-color: transparent; font-weight: 600; }
.subtab.subtab-gold { color: var(--gold); border-color: #4d4128; background: #2a2338; font-weight: 600; }
.subtab .cnt { font-size: 10px; opacity: .8; margin-left: 3px; }

/* ---------- 装备槽 ---------- */
.eq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.eq-slot { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; min-height: 86px; }
.eq-slot.filled { border-color: var(--acc); background: #232a4e; }
.eq-ico { font-size: 22px; }
.eq-name { font-size: 12.5px; font-weight: 600; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eq-bonus { font-size: 10.5px; color: var(--green); margin-top: 2px; min-height: 14px; }

/* ---------- 背包条目 ---------- */

/* ---------- 商店 ---------- */
.shop-item { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 9px; }

.shop-info { flex: 1; min-width: 0; }

.shop-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }
.shop-price { font-size: 14px; color: var(--gold); font-weight: 700; }

/* ---------- 剧情角色卡 ---------- */
.char-card { display: flex; gap: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; }
.char-ava { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; background-size: cover; background-position: center; background-color: var(--panel2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.char-info { flex: 1; min-width: 0; }
.char-name { font-size: 14.5px; font-weight: 700; }
.char-rel { font-size: 11px; color: var(--acc2); margin: 1px 0 3px; }
.char-note { font-size: 12px; color: var(--txt2); line-height: 1.55; }

/* ---------- 3×3 地图视窗 / 环境栏 ---------- */
.grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.env-bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: linear-gradient(135deg, #20264a, #1b2038); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.env-rumor { font-size: 12px; color: var(--txt2); background: var(--bg2); border: 1px dashed var(--line); border-radius: 10px; padding: 7px 12px; margin-bottom: 12px; line-height: 1.5; }

/* ---------- 4×4 网格（大地图/地点） ---------- */
.grid16 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.g16-cell { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; min-height: 84px; overflow: hidden; cursor: pointer; transition: transform .1s, border-color .15s; }
.g16-cell:active { transform: scale(.95); }
.g16-cell.current { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); background: #232a4e; }
.g16-cell.empty-cell { border-style: dashed; color: var(--txt2); cursor: default; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; opacity: .55; }
.gc-emoji { font-size: 22px; }
.gc-name { font-size: 12px; font-weight: 600; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-meta { font-size: 10px; color: var(--txt2); margin-top: 2px; }
.gc-desc { font-size: 9.5px; color: var(--txt2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g16-cell .badge-now { position: absolute; top: 5px; right: 5px; font-size: 9px; padding: 1px 6px; }

/* ---------- 方向键 ---------- */
.dpad-wrap { margin-top: 14px; }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 46px); gap: 6px; justify-content: center; }
.dpad button { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); font-size: 19px; cursor: pointer; }
.dpad button:active { background: var(--acc); color: #fff; }
.dpad-c { display: flex; align-items: center; justify-content: center; font-size: 18px; background: var(--bg2); border-radius: 10px; border: 1px dashed var(--line); }

/* ---------- 剧情插图 ---------- */
.story-img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 12px; margin-top: 8px; border: 1px solid var(--line); cursor: zoom-in; }
.msg.user .story-img { margin-left: auto; }

/* ---------- 任务 ---------- */
.quest-item { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.q-title { font-size: 13.5px; font-weight: 600; }
.q-sub { font-size: 11.5px; color: var(--txt2); margin-top: 3px; }

/* ---------- 对战 ---------- */
.bt-label { font-size: 11.5px; color: var(--txt2); margin-bottom: 6px; font-weight: 600; }
.bt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.bt-card { flex: 1 1 21%; min-width: 70px; max-width: 120px; background: var(--bg2); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
.bt-card.enemy { background: #2a1c22; border-color: #4a2b33; }
.bt-card.sel { border-color: var(--red); box-shadow: 0 0 0 1.5px var(--red); }

.bt-ico { font-size: 22px; }
.bt-name { font-size: 11.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-stat { font-size: 10px; color: var(--txt2); }
.bt-hp { height: 6px; background: #10131f; border-radius: 99px; overflow: hidden; margin-top: 5px; }
.bt-hp i { display: block; height: 100%; background: linear-gradient(90deg, #4fae67, #7ecb8f); border-radius: 99px; transition: width .4s; }
.bt-card.enemy .bt-hp i { background: linear-gradient(90deg, #b5485a, #e06c75); }
.bt-hpn { font-size: 9.5px; color: var(--txt2); }
.bt-log { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; max-height: 150px; overflow-y: auto; font-size: 12px; color: var(--txt); line-height: 1.7; }

/* ---- 第三版新增：剧情区渲染 / 灯箱 / 预设 / 职业效果 ---- */
.m-words { font-size: 11px; color: var(--txt2); margin-top: 4px; padding-left: 2px; }
.story-codebox { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel2); white-space: normal; }
.story-code-cap { font-size: 11px; color: var(--txt2); padding: 4px 10px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.03); }
.story-frame { display: block; width: 100%; min-height: 90px; max-height: 420px; border: 0; background: transparent; }
.story-code-src { border-top: 1px solid var(--line); font-size: 12px; }
.story-code-src summary { cursor: pointer; padding: 4px 10px; color: var(--txt2); }
.story-code-src pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.story-code { margin: 8px 0; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }

/* ---------- 剧情里的代码 / HTML / CSS 渲染美化（参考图卡片风格） ---------- */
.st-rich { font-size: 14px; line-height: 1.75; color: #d5d9ea; letter-spacing: .2px; }
.st-rich > :first-child { margin-top: 0; }
.st-rich > :last-child { margin-bottom: 0; }
.st-rich p { margin: .7em 0; }
.st-rich h1, .st-rich h2, .st-rich h3, .st-rich h4 {
  margin: 1.1em 0 .55em; color: #fff; line-height: 1.45; font-weight: 700; letter-spacing: .4px;
}
.st-rich h1 { font-size: 18px; }
.st-rich h2 { font-size: 17px; }
.st-rich h3 { font-size: 15px; }
.st-rich h4 { font-size: 14px; color: #c9cee2; }
.st-rich ul, .st-rich ol { margin: .6em 0; padding-left: 1.35em; }
.st-rich li { margin: .25em 0; }
.st-rich blockquote { margin: .9em 0; padding: 6px 12px; border-left: 2px solid var(--acc); background: rgba(139,124,246,.08); border-radius: 0 10px 10px 0; color: #b9c0d4; }
.st-rich code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: rgba(255,255,255,.06); border-radius: 5px; padding: 1px 5px; }
.st-rich pre { margin: .8em 0; padding: 10px 12px; background: #0d1119; border: 1px solid #232a3a; border-radius: 12px; overflow-x: auto; }
.st-rich pre code { background: none; padding: 0; }
.st-rich table { width: 100%; border-collapse: collapse; margin: .9em 0; font-size: 13px; }
.st-rich th, .st-rich td { padding: 8px 10px; border-bottom: 1px solid #262c3d; text-align: left; }
.st-rich th { color: #9aa3c7; font-weight: 600; }
.st-rich img { max-width: 100%; border-radius: 12px; }
.st-rich hr { border: 0; border-top: 1px solid #262c3d; margin: 1.1em 0; }
.st-rich a { color: var(--acc2); }
/* 卡片容器：深色圆角面 + 细描边 + 柔和投影 */
.st-rich .st-card, .st-rich .card, .st-rich .panel, .st-rich .sheet, .st-rich .box {
  background: #0d1017; border: 1px solid #232838; border-radius: 20px;
  padding: 18px 18px 14px; margin: 12px 0; box-shadow: 0 12px 28px rgba(0,0,0,.38);
}
.st-rich .st-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.st-rich .st-icon {
  width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px;
  background: linear-gradient(135deg, #6b4ff0, #9a7cf8); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  box-shadow: 0 6px 16px rgba(107,79,240,.4);
}
.st-rich .st-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.st-rich .st-sub { font-size: 11.5px; color: #8b93a7; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
.st-rich .st-divider { height: 1px; background: #242a3a; margin: 14px 0 16px; }
/* 字段 / 输入框外观 */
.st-rich .st-label, .st-rich .label { font-size: 13px; color: #8b93a7; margin: 12px 0 6px; letter-spacing: .2px; }
.st-rich .st-field, .st-rich .field, .st-rich .input, .st-rich .value {
  background: #10131b; border: 1px solid #262c3d; border-radius: 13px;
  padding: 13px 15px; color: #b9c0d4; font-size: 13px; margin: 6px 0;
}
.st-rich .st-hint { font-size: 12px; color: #7d8598; }
.st-rich details.st-css-src { margin: 4px 0 8px; font-size: 11px; color: #8b93a7; }
.st-rich details.st-css-src summary { cursor: pointer; }
.st-rich details.st-css-src pre { margin: 6px 0 0; font-size: 11.5px; }
/* JSON / 结构化数据卡片 */
.st-rich .st-group { background: #0d1017; border: 1px solid #232838; border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
.st-rich .st-group > .st-key { font-size: 12px; color: #8b93a7; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
.st-rich .st-field { display: flex; align-items: baseline; gap: 10px; background: #10131b; border: 1px solid #262c3d; border-radius: 12px; padding: 10px 13px; margin: 6px 0; }
.st-rich .st-key { font-size: 12.5px; color: #8b93a7; white-space: nowrap; }
.st-rich .st-val { font-size: 13.5px; color: #d5d9ea; word-break: break-word; }
.st-rich details.st-json-src { margin: 6px 0 0; font-size: 11px; color: #8b93a7; }
.st-rich details.st-json-src summary { cursor: pointer; }
.st-rich details.st-json-src pre { margin: 6px 0 0; font-size: 11.5px; }
/* 渲染 HTML 的尺寸兜底：固定 px 宽度的卡片不撑破剧情区 */
.st-rich {
  position: relative; overflow-wrap: anywhere;
  border-radius: 12px;
}
.st-rich > *, .st-rich img, .st-rich table, .st-rich pre, .st-rich svg { max-width: 100%; }
.st-rich [style*="position: fixed"], .st-rich [style*="position:fixed"] { position: absolute !important; }
/* 表单控件（AI 卡片里的输入框/下拉/按钮）：只做观感兜底，交互属性由清洗器限制 */
.st-rich input, .st-rich textarea, .st-rich select, .st-rich button, .st-rich label, .st-rich option {
  box-sizing: border-box; font-family: inherit; max-width: 100%;
}
.st-rich input:focus, .st-rich textarea:focus, .st-rich select:focus {
  outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.18);
}
.st-rich button { cursor: pointer; transition: transform .12s, filter .15s; }
.st-rich button:active { transform: scale(.97); filter: brightness(1.08); }
.st-rich button:hover { filter: brightness(1.06); }
.st-rich option { background: #16181f; color: #f8fafc; }
/* 可点选的状态（卡片选项被选中时给出清晰反馈） */
.st-rich label:has(input) { cursor: pointer; }
.st-rich label:has(input:checked) { outline: 2px solid rgba(139,124,246,.55); outline-offset: 1px; border-radius: 8px; }
.st-rich input[type="radio"], .st-rich input[type="checkbox"] { accent-color: #8b7cf6; cursor: pointer; }
#lightbox-root { display: none; position: fixed; inset: 0; z-index: 9999; }
#lightbox-root.show { display: block; }
.lb-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
.lb-img { max-width: 100%; max-height: 88vh; object-fit: contain; border-radius: 10px; }
.lb-tip { color: #cfcfdd; font-size: 12px; }
.wb-scope-tag { font-size: 10px; color: var(--txt2); }

/* ============================================================
 * 剧情区消息卡片（按参考图结构：左上头像 / 右上编号 / 加粗标题
 * + ⋯ 菜单 + ✎ 编辑 / 灰色时间戳 / 居中插图块 / 右缘浮动按钮 /
 * 底部功能按钮组）
 * ============================================================ */
.msg.st-msg { display: block; margin-bottom: 16px; }
.msg.st-msg .st-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px 14px 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
}
.msg.st-msg.user .st-card { background: #232848; border-color: #3c3f78; }
.msg.st-msg .st-top { display: flex; align-items: flex-start; gap: 10px; }
.msg.st-msg .st-avatar {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; border: 1px solid var(--line); background-color: var(--panel2);
}
.msg.st-msg .st-idx { margin-left: auto; font-size: 11.5px; color: var(--txt2); padding-top: 4px; letter-spacing: .5px; }
.msg.st-msg .st-head { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
.msg.st-msg .st-title { font-size: 14.5px; font-weight: 700; color: var(--txt); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.st-msg .st-tools { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
.msg.st-msg .st-tool {
  background: none; border: none; color: var(--txt2); cursor: pointer;
  font-size: 14px; line-height: 1; padding: 4px 5px; border-radius: 8px;
}
.msg.st-msg .st-tool:hover { color: var(--txt); background: var(--panel2); }
.msg.st-msg .st-time { font-size: 11.5px; color: var(--txt2); margin-top: 3px; }
.msg.st-msg .st-body {
  margin-top: 9px; background: transparent; border: none; padding: 0;
  border-radius: 0; white-space: normal; font-size: var(--t-fs, 14.5px); line-height: var(--t-lh, 1.75);
}
.msg.st-msg .st-body p { margin: 0 0 8px; }
.msg.st-msg .st-body p:last-child { margin-bottom: 0; }
.msg.st-msg .st-body pre { overflow-x: auto; }
.msg.st-msg .st-body img { max-width: 100%; border-radius: 10px; }
.msg.st-msg .m-words { font-size: 11px; color: var(--txt2); margin-top: 7px; }
.msg.st-msg .st-think { margin-top: 8px; border-left: 2px solid rgba(139,92,246,.45); padding-left: 8px; }
.msg.st-msg .st-think summary { cursor: pointer; font-size: 11px; color: var(--txt2); list-style: none; user-select: none; }
.msg.st-msg .st-think summary::-webkit-details-marker { display: none; }
.msg.st-msg .st-think summary:hover { color: var(--txt); }
.msg.st-msg .st-think-body { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 11.5px; line-height: 1.55; color: var(--txt2); background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 8px 10px; margin: 6px 0 0; max-height: 180px; overflow: auto; }
.msg.st-msg .delta-chips { margin-top: 8px; }

/* 居中图文展示块：金色细边 + 四角叶饰 + 投影 + 居中灰字说明 */
.msg.st-msg .st-figure { margin: 12px auto 2px; text-align: center; max-width: 340px; }
.msg.st-msg .st-fig-box {
  position: relative; display: inline-block; padding: 10px;
  border: 1px solid var(--gold); border-radius: 12px;
  background: rgba(232, 197, 116, 0.06);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
}
.msg.st-msg .st-fig-box::before,
.msg.st-msg .st-fig-box::after {
  content: ""; position: absolute; width: 11px; height: 11px;
  border: 1px solid var(--gold); opacity: .85;
}
.msg.st-msg .st-fig-box::before { left: -1px; top: -1px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
.msg.st-msg .st-fig-box::after { right: -1px; bottom: -1px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }
.msg.st-msg .st-fig-img {
  display: block; max-width: 100%; height: auto; border-radius: 8px; cursor: zoom-in;
}
.msg.st-msg .st-fig-cap { font-size: 11.5px; color: var(--txt2); margin-top: 8px; text-align: center; }

/* 右缘紫色圆形浮动按钮 */
.st-fab {
  position: absolute; right: 12px; bottom: calc(var(--nav-h) + 96px);
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--acc); color: #fff; border: none; font-size: 20px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
  display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6;
}
.st-fab:active { transform: scale(.94); }

/* 功能合集：按钮行最左侧的固定小按钮 + 原位弹出列表（无悬浮层、无拖动、无记忆） */
.fn-pop {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
  max-height: 62vh; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .5); z-index: 14;
}
.fn-pop[hidden] { display: none; }
.fn-pop-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
  background: var(--panel2); border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700;
}
.fn-pop-head span { flex: 1; min-width: 0; }
.fn-pop-close {
  width: 24px; height: 24px; flex-shrink: 0; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg2); color: var(--txt2); font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0; font-family: inherit;
}
.fn-pop-close:active { transform: scale(.94); }
.fn-pop-body { padding: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.fn-pop-body .fn-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
.fn-pop-body .fn-grid:last-child { margin-bottom: 0; }
.fn-pop-body .fn-item { font-size: 11.5px; padding: 9px 4px; }

/* 功能合集网格 */
.fn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.fn-item {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  color: var(--txt); font-size: 12.5px; padding: 11px 4px; cursor: pointer;
}
.fn-item:hover { border-color: var(--acc); }

/* ============================================================
 * 改造版：图二式正文排版 / 转职组队 / 图库
 * ============================================================ */

/* 图二式正文：去掉气泡卡片，改为扁平书页段落 */
.msg.st-msg { display: block; margin: 0; padding: 20px 0 22px; border-bottom: 1px solid var(--line); }

<script>
/* ========== 工具函数 & 本地存储 ========== */
"use strict";

const LS_PREFIX = "owg_";

/* ---------------------------------------------------------------
 * 报错日志（全局，不随存档）
 * - 存在 localStorage 的 owg_errlog：所有存档共用一份，刷新后仍可查看
 * - 上限 200 条，超出丢最旧；写入去抖 300ms，记录失败绝不向外抛错
 * - 只做记录，不改变任何业务流程
 * ------------------------------------------------------------- */
const OWGLog = (() => {
  const KEY = LS_PREFIX + "errlog", MAX = 200;
  const TYPES = ["异常", "Promise", "脚本", "请求", "面板", "存档", "图库", "其他"];
  // 级别：错误＝功能真的坏了；警告＝环境/容量问题，功能已降级但还能玩；提示＝已自动处理好的情况
  const LEVELS = ["错误", "警告", "提示"];
  let list = null, timer = 0, persistOk = true, notified = false, hooked = false;
  /** 旧记录没有级别字段：按类型给一个保守默认（环境类问题算警告） */
  function levelOf(x) {
    const v = x && x.lv;
    if (LEVELS.indexOf(v) >= 0) return v;
    return (x && (x.type === "存档" || x.type === "图库")) ? "警告" : "错误";
  }

  function read() {
    if (list) return list;
    list = [];
    try {
      const v = localStorage.getItem(KEY);
      if (v) {
        const a = JSON.parse(v);
        if (Array.isArray(a)) list = a.filter(x => x && typeof x === "object" && x.msg != null).slice(-MAX);
      }
    } catch (e) { list = []; }
    return list;
  }
  function flush() {
    if (timer) { try { clearTimeout(timer); } catch (e) { } timer = 0; }
    if (!persistOk) return;
    try { localStorage.setItem(KEY, JSON.stringify(read())); }
    catch (e) { persistOk = false; }   // 配额满 / 环境不可用：本次会话内存里仍可查看，不反复重试
  }
  function schedule() {
    if (timer || !persistOk) return;
    try { timer = setTimeout(() => { timer = 0; flush(); }, 300); } catch (e) { flush(); }
  }
  /** 把任意异常/拒绝原因转成可读详情（含堆栈） */
  function detailOf(e) {
    if (e == null) return "";
    if (typeof e === "string") return e;
    let msg = "";
    try { msg = e && e.message ? String(e.message) : String(e); } catch (x) { msg = "（无法读取错误内容）"; }
    const st = (e && e.stack) ? String(e.stack) : "";
    return st && st !== msg ? (msg + "\n" + st) : (st || msg);
  }
  /** 当前是否有酒馆脚本正在执行（用于把错误归到脚本类） */
  function scriptSid() {
    try { return (typeof OWGScript !== "undefined" && OWGScript && (OWGScript.currentSid || OWGScript.lastSid)) || ""; } catch (e) { return ""; }
  }
  function add(type, msg, detail, opt) {
    try {
      const arr = read();
      const t = TYPES.indexOf(type) >= 0 ? type : "其他";
      const lv = (opt && LEVELS.indexOf(opt.lv) >= 0) ? opt.lv : "错误";
      const key = (opt && opt.key) ? String(opt.key) : "";
      // 同一 key 5 分钟内合并成一条并计数：存储写满这类反复发生的问题不再刷屏占满 200 条上限
      if (key) {
        for (let i = arr.length - 1; i >= 0; i--) {
          const x = arr[i];
          if (!x || x.key !== key) continue;
          if (Date.now() - (x.ts || 0) > 300000) break;
          x.n = (x.n || 1) + 1;
          x.ts = Date.now();
          if (msg != null && msg !== "") x.msg = String(msg).slice(0, 500);
          if (detail != null && detail !== "") x.detail = String(detail).slice(0, 1500);
          schedule();
          return true;
        }
      }
      arr.push({
        ts: Date.now(),
        type: t,
        lv,
        key,
        msg: String(msg == null ? "" : msg).slice(0, 500),
        detail: String(detail == null ? "" : detail).slice(0, 1500),
      });
      if (arr.length > MAX) arr.splice(0, arr.length - MAX);
      schedule();
      // 未捕获错误只提示一次，避免刷屏
      if (opt && opt.notify && !notified) {
        notified = true;
        try { toast("运行中出现错误，可在「功能合集 → 报错日志」查看详情", "err"); } catch (e2) { }
      }
    } catch (e) { }
    return true;
  }
  /** 安装全局错误监听：window.onerror / 未处理 Promise 拒绝 */
  function hook() {
    if (hooked || typeof window === "undefined") return;
    hooked = true;
    window.addEventListener("error", (ev) => {
      try {
        if (!ev) return;
        const sid = scriptSid();
        const err = ev.error;
        const msg = ev.message || (err && err.message) || "未知错误";
        let where = "";
        if (ev.filename) where = ev.filename + ":" + (ev.lineno || 0) + ":" + (ev.colno || 0);
        add(sid ? "脚本" : "异常", msg, (err && err.stack) ? String(err.stack) : where, { notify: true });
      } catch (e) { }
    }, true);
    window.addEventListener("unhandledrejection", (ev) => {
      try {
        const sid = scriptSid();
        const r = ev && ev.reason;
        add(sid ? "脚本" : "Promise", "未处理的 Promise 拒绝：" + (r && r.message ? r.message : String(r)), detailOf(r), { notify: true });
      } catch (e) { }
    });
  }

  hook();
  return {
    MAX,
    add,
    hook,
    types: () => TYPES.slice(),
    levels: () => LEVELS.slice(),
    levelOf,
    all: () => read().slice(),
    count: () => read().length,
    clear() {
      try { list = []; localStorage.removeItem(KEY); } catch (e) { list = []; }
      if (timer) { try { clearTimeout(timer); } catch (e) { } timer = 0; }
    },
    text() {
      return read().map(x => "[" + fmtTime(x.ts) + "] [" + levelOf(x) + "·" + x.type + "] " + x.msg + (x.n > 1 ? "（×" + x.n + "）" : "") + (x.detail ? "\n" + x.detail : "")).join("\n");
    },
    flush,
  };
})();

// 存储层：localStorage 不可用（微信预览/隐私模式/某些 file:// 环境）时自动回退到内存，保证能玩
const store = (() => {
  let ok = true;
  let quotaToastShown = false;
  const mem = {};
  // 写给玩家看的键名（日志里不出现裸英文键）
  const LABELS = {
    state: "游戏进度", saves: "存档列表", cards: "角色卡",
    gallery: "旧版图库", errlog: "报错日志", th_scripts: "酒馆脚本",
    seen: "首次引导标记",
  };
  const labelOf = k => (LABELS[k] ? LABELS[k] + "（" + LS_PREFIX + k + "）" : LS_PREFIX + k);
  const sizeText = v => {
    try { return (JSON.stringify(v).length / 1048576).toFixed(1) + " MB"; } catch (e) { return "体积未知"; }
  };
  try { const k = LS_PREFIX + "__t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); }
  catch (e) { ok = false; }
  if (!ok) setTimeout(() => {
    try { toast("当前环境无法本地保存（常见于微信内置预览）：进度仅本次有效。请点右上角菜单「在浏览器中打开」，或把文件保存后用 Chrome/Edge 打开即可正常存档。", ""); } catch (e) { }
  }, 1200);
  return {
    get(k, d = null) {
      const key = LS_PREFIX + k;
      // 内存副本优先：写入失败（配额满）后仍能读到本次会话的最新值
      if (key in mem) return mem[key];
      if (ok) {
        try { const v = localStorage.getItem(key); if (v != null) return JSON.parse(v); }
        catch (e) { try { OWGLog.add("存档", "本地数据读取失败：" + labelOf(k), String((e && e.message) || e), { lv: "警告" }); } catch (e2) { } }
      }
      return d;
    },
    set(k, v) {
      // 每次都尝试写 localStorage（配额满等失败仅回退内存副本，不永久禁用持久化）
      if (ok) {
        try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); delete mem[LS_PREFIX + k]; return true; }
        catch (e) {
          mem[LS_PREFIX + k] = v;
          // 存储写满属于「环境容量问题」：记成警告并合并计数，不再每条消息刷一条错误
          try {
            const raw = String((e && e.message) || e);
            const known = /quota|exceeded|storage/i.test(raw);
            OWGLog.add(
              "存档",
              "本地保存失败：" + labelOf(k) + (known ? " 写不进浏览器存储（超出容量上限）" : " 写入被浏览器拒绝") + "，当前数据约 " + sizeText(v),
              "浏览器原始报错：" + raw +
              "\n影响：本次修改只留在内存里，刷新/关页面后会回到上一次成功保存的状态。" +
              "\n自动处理：已尝试把剧情插图移到大容量图库（IndexedDB）后重试。" +
              "\n仍有问题可：功能合集 → 图库 → 清理不需要的图片，或减少手动存档数量后重试。",
              { lv: "警告", key: "quota:" + k }
            );
          } catch (e3) { }

/* DOM 查询助手：除选择器外，也兼容用户脚本里的 jQuery 写法
 *  - $(function(){...}) / $(() => {...}) 当作 DOM ready 回调
 *  - $(节点) 原样返回；$$(类数组) 转数组
 * 这样脚本里常见的 $(function(){ init(); }) 不会再被当成 CSS 选择器而抛
 * "Failed to execute 'querySelector': ... is not a valid selector"。 */
const $ = (s, root) => {
  if (typeof s === "function") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", s, { once: true });
    else setTimeout(s, 0);
    return null;
  }
  if (s == null) return null;
  if (typeof s === "object") return s.nodeType ? s : null;
  return (root || document).querySelector(String(s));
};
const $$ = (s, root) => {
  if (typeof s === "function") { $(s); return []; }
  if (s == null) return [];
  if (typeof s === "object") {
    if (s.nodeType) return [s];
    return typeof s.length === "number" ? Array.from(s) : [];
  }
  return Array.from((root || document).querySelectorAll(String(s)));
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------------------------------------------------------------
 * 图库存储：IndexedDB（大容量、异步、无数量上限）
 * - 旧版 localStorage 里的 owg_gallery 会在启动时一次性迁移过来
 * - 图片以 Blob 存库，显示时转 object URL；远程 URL 原样保存
 * - IDB 不可用时回退 localStorage（只提示失败，绝不删旧图）
 * ------------------------------------------------------------- */
const OWGGallery = (() => {
  const DB_NAME = "owg_gallery_db", OS_NAME = "imgs", LEGACY_KEY = "gallery";
  let dbp = null, legacy = false, migrating = null;
  const urls = new Map();   // id -> objectURL

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(OS_NAME)) {
          const os = db.createObjectStore(OS_NAME, { keyPath: "id" });
          os.createIndex("ts", "ts");
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error("indexedDB blocked"));
    }).catch(() => { legacy = true; return null; });
    return dbp;
  }

  function tx(db, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = db.transaction(OS_NAME, mode); } catch (e) { rej(e); return; }
      const os = t.objectStore(OS_NAME);
      let out = null;
      try { out = fn(os); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error || new Error("idb tx failed"));
      t.onabort = () => rej(t.error || new Error("idb tx aborted"));
    });
  }

  function legacyList() {
    const v = store.get(LEGACY_KEY, []);
    return Array.isArray(v) ? v : [];
  }

  async function toBlob(src) {
    try { const r = await fetch(src); return await r.blob(); } catch (e) { return null; }
  }

  async function migrate() {
    if (migrating) return migrating;
    migrating = (async () => {
      const db = await open();
      if (!db) return 0;                       // 没有 IDB：旧数据原样留着，仍可查看
      const old = legacyList();
      if (!old.length) return 0;
      let done = 0;
      for (const it of old) {
        const src = (it && (it.src || it.img || it.url)) || "";
        if (!src) continue;
        try {
          const rec = { id: String(it.id || uid()), ts: Number(it.ts) || Date.now(), prompt: String(it.prompt || "").slice(0, 200) };
          if (/^https?:/i.test(src)) rec.url = src;
          else { const b = await toBlob(src); if (b) { rec.blob = b; rec.type = b.type; } else rec.url = src; }
          await tx(db, "readwrite", os => os.put(rec));
          done++;
        } catch (e) { console.warn("图库迁移失败一张：", e); }
      }
      // 只有全部成功搬完才删旧键；失败则保留 localStorage 原数据，下次再试
      if (done === old.length) store.del(LEGACY_KEY);
      return done;
    })();
    return migrating;
  }

  async function list() {
    const db = await open();
    if (!db) return legacyList();
    const all = await tx(db, "readonly", os => os.getAll());
    return (Array.isArray(all) ? all : []).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  }

  async function add(src, prompt = "") {
    const plain = String(src || "");
    if (!plain) return null;
    const rec = { id: uid(), ts: Date.now(), prompt: String(prompt || "").slice(0, 200) };
    const db = await open();
    if (db) {
      if (/^https?:/i.test(plain) && plain.length < 2000) rec.url = plain;
      else {
        const b = await toBlob(plain);
        if (b) { rec.blob = b; rec.type = b.type || "image/jpeg"; } else rec.url = plain;
      }
      await tx(db, "readwrite", os => os.put(rec));
      return rec;
    }
    // 回退：保留全部旧图，只追加；写不进去就明确提示（不丢任何图片）
    const arr = legacyList();
    arr.unshift({ id: rec.id, src: plain, prompt: rec.prompt, ts: rec.ts });
    const ok = store.set(LEGACY_KEY, arr);
    if (!ok) toast("图片保存失败：当前环境无法使用大容量图库（IndexedDB），本地存储也写不下。图片仅本次会话可见，未删除任何旧图；请换 Chrome/Edge 打开本文件。", "err");
    return rec;
  }

  async function remove(id) {
    const db = await open();
    if (db) { await tx(db, "readwrite", os => os.delete(id)); }
    else store.set(LEGACY_KEY, legacyList().filter(g => g.id !== id));
    const u = urls.get(id);
    if (u) { try { URL.revokeObjectURL(u); } catch (e) { } urls.delete(id); }
  }

  async function clear() {
    const db = await open();
    if (db) await tx(db, "readwrite", os => os.clear());
    else store.set(LEGACY_KEY, []);
    for (const u of urls.values()) { try { URL.revokeObjectURL(u); } catch (e) { } }
    urls.clear();
  }

  /** 记录 → 可显示的 URL（Blob 走 object URL，缓存避免重复创建） */
  function urlOf(rec) {
    if (!rec) return "";
    if (urls.has(rec.id)) return urls.get(rec.id);
    if (rec.blob) {
      try { const u = URL.createObjectURL(rec.blob); urls.set(rec.id, u); return u; } catch (e) { }
    }
    return rec.url || rec.src || "";
  }

  /** 异步图库操作包一层：失败记入「报错日志」后照常抛出，不改变调用方行为 */
  const guard = (label, fn) => (...args) => Promise.resolve().then(() => fn(...args)).catch(e => {
    try { OWGLog.add("图库", label + "失败", String((e && e.stack) || (e && e.message) || e), { lv: "警告" }); } catch (e2) { }
    throw e;
  });

  return {
    open, migrate: guard("图库迁移", migrate), list,
    add: guard("图库写入", add), remove: guard("图库删除", remove), clear: guard("图库清空", clear),
    urlOf, isLegacy: () => legacy,
  };
})();

function toastOnce(key, msg, type = "", ms = 3000) {
  try {
    const now = Date.now();
    window.__OWG_TOAST_ONCE__ = window.__OWG_TOAST_ONCE__ || {};
    const k = String(key || msg);
    if (window.__OWG_TOAST_ONCE__[k] && now - window.__OWG_TOAST_ONCE__[k] < ms) return false;
    window.__OWG_TOAST_ONCE__[k] = now;
    toast(msg, type);
    return true;
  } catch (e) { return false; }
}
/** 已移除的前端渲染能力统一提示：不抛错、脚本日志留痕、同名 3 秒只 toast 一次 */
function owgRenderRemoved(name) {
  const key = String(name || "render");
  const msg = "该渲染能力已移除：" + key;
  try { console.warn("[OWG] " + msg); } catch (e) { }
  try { if (window.OWGScript && typeof OWGScript.log === "function") OWGScript.log("warn", OWGScript.currentSid || "", msg); } catch (e) { }
  try {
    const now = Date.now();
    window.__OWG_RM_TOAST__ = window.__OWG_RM_TOAST__ || {};
    if (!window.__OWG_RM_TOAST__[key] || now - window.__OWG_RM_TOAST__[key] > 3000) {
      window.__OWG_RM_TOAST__[key] = now;
      toast(msg, "err");
    }
  } catch (e) { }
  return null;
}
function toast(msg, type = "") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  $("#toast-root").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 2400);
  setTimeout(() => el.remove(), 2800);
}

/* ---------- 弹窗 ---------- */
function openModal(html, { closable = true } = {}) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-mask"></div><div class="modal">${closable ? '<button class="modal-close">✕</button>' : ""}${html}</div>`;
  root.classList.add("show");
  if (closable) {
    root.querySelector(".modal-mask").onclick = closeModal;
    root.querySelector(".modal-close").onclick = closeModal;
  }
  return root.querySelector(".modal");
}
function closeModal() {
  const root = $("#modal-root");
  root.classList.remove("show");
  root.innerHTML = "";
}

/* ---------- 文件 ---------- */
function downloadFile(filename, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json;charset=utf-8" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- 复制到剪贴板 ---------- */
function copyText(text) {
  const s = String(text == null ? "" : text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s); return true; }
  } catch (e) { /* 退回到 execCommand */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = s;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function readFileAs(file, as) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("读取文件失败"));
    if (as === "text") r.readAsText(file);
    else if (as === "buffer") r.readAsArrayBuffer(file);
    else r.readAsDataURL(file);
  });
}

/* ---------- 文本清洗：去除角色卡中的渲染代码（HTML/CSS/JS/宏） ---------- */
/** 剧情区专用清洗：保留围栏代码块、宏与 <style>（样式交给渲染器作用域化），只去掉 <script> 等可执行/外链标签 */
function stripForStory(text) {
  if (!text) return "";
  const parts = String(text).split(/(```[\s\S]*?```)/g);
  return parts.map((p, i) => {
    if (i % 2 === 1) return p;
    return p.replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<\/?(?:script|link|meta|object|embed)\b[^>]*>/gi, "");
  }).join("");
}
function stripRender(text, ctx = {}) {
  if (!text) return "";
  let s = String(text);
  const userName = ctx.user || "你";
  const charName = ctx.char || "";
  // 酒馆宏替换
  s = s.replace(/\{\{user\}\}/gi, userName).replace(/\{\{char\}\}/gi, charName || "角色");
  s = s.replace(/\{\{(?:random|pick|roll)[^}]*\}\}/gi, "").replace(/\{\{[^}]{0,60}\}\}/g, "");
  // 成对代码块：包含 html/css/js 的整块删除
  s = s.replace(/```[a-zA-Z]*\s*[\s\S]*?```/g, (m) => {
    const inner = m.replace(/```[a-zA-Z]*/g, "");
    return /<\s*(style|script|div|span|img|html)|\{[^{}]*:[^{}]*;|@import|font-face/i.test(inner) ? "" : inner;
  });
  // style / script 标签
  s = s.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "");
  s = s.replace(/<\/?(?:style|script|link|meta|iframe|object|embed)\b[^>]*>/gi, "");
  // 换行标签转换，其余 HTML 标签全部去除（保留文字）
  s = s.replace(/<\s*br\s*\/?\s*>/gi, "\n").replace(/<\/\s*(?:p|div|tr|li|h[1-6])\s*>/gi, "\n");
  s = s.replace(/<[^>]+>/g, "");
  // HTML 实体
  s = s.replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/&lt;/gi, "<")
       .replace(/&gt;/gi, ">").replace(/&quot;/gi, '"').replace(/&#39;/g, "'").replace(/&#(\d+);/g, (m, c) => String.fromCharCode(+c));
  // 残留的 CSS 片段行
  s = s.split("\n").filter(line => !/^\s*(?:[.#@][\w-]+[^;{}]*\{[^}]*\}|@import[^;]+;|<\/?)/.test(line)).join("\n");
  // 压缩多余空行空格
  s = s.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/[ \t]{2,}/g, " ").trim();
  return s;
}

/* ---------- 从模型输出中提取 JSON ---------- */
/* ---------- 文本清洗：保留酒馆宏的版本（用于角色卡导入导出，不破坏 {{...}}） ---------- */
function stripRenderKeepMacros(text, ctx = {}) {

  s = s.replace(/```[a-zA-Z]*\s*[\s\S]*?```/g, (m) => {
    const inner = m.replace(/```[a-zA-Z]*/g, "");
    return /<\s*(style|script|div|span|img|html)|\{[^{}]*:[^{}]*;|@import|font-face/i.test(inner) ? "" : inner;
  });
  s = s.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<script[\s\S]*?<\/script>/gi, "");
  s = s.replace(/<\/?(?:style|script|link|meta|iframe|object|embed)\b[^>]*>/gi, "");
  s = s.replace(/<\s*br\s*\/?\s*>/gi, "\n").replace(/<\/\s*(?:p|div|tr|li|h[1-6])\s*>/gi, "\n");
  s = s.replace(/<(?!\/?START\b)[^>]+>/g, "");
  s = s.replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/&lt;/gi, "<")
       .replace(/&gt;/gi, ">").replace(/&quot;/gi, '"').replace(/&#39;/g, "'").replace(/&#(\d+);/g, (m, c) => String.fromCharCode(+c));
  return s.replace(/\n{3,}/g, "\n\n").trim();
}

function extractJSON(text) {
  if (!text) return null;
  const t = String(text).trim();
  try { return JSON.parse(t); } catch (e) { /* continue */ }
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) { try { return JSON.parse(fence[1].trim()); } catch (e) { /* continue */ } }
  const first = t.indexOf("{"), last = t.lastIndexOf("}");
  if (first >= 0 && last > first) {
    try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* continue */ }
  }
  return null;
}

/* ---------- 解析 "名称x数量" ---------- */
function parseItemEntry(str) {
  const m = String(str).trim().match(/^(.+?)\s*[x×*＊]\s*(\d+)$/);
  if (m) return { name: m[1].trim(), count: parseInt(m[2], 10) };
  return { name: String(str).trim(), count: 1 };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
