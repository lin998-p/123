<script>
/* ========== OpenAI 兼容 API 客户端（支持多模型分工：主模型/世界观/玩法/记忆） ========== */
"use strict";

const API_ROLES = [
  { key: "main", name: "主模型（剧情生成）" },
  { key: "worldview", name: "世界观分析模型" },
  { key: "gameplay", name: "玩法分析模型" },
  { key: "memory", name: "剧情记忆模型" },
];

const API = {
  /** 规范化接口地址：自动补 /v1，处理末尾斜杠；# 结尾表示强制使用原样前缀 */
  normBase(url) {
    const raw = String(url || "").trim();
    if (!raw) return "";
    if (/#$/.test(raw)) return raw.replace(/#+$/, "").replace(/\/+$/, "");
    let u = raw.replace(/\s+/g, "");
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    u = u.replace(/\/+$/, "");
    if (!/\/v\d+$/i.test(u) && !/\/openai$/i.test(u)) u += "/v1";
    return u;
  },

  /** 解析某个分工角色实际使用的接口配置（仅显式关闭或字段不全时回落主模型） */
  resolve(role = "main", { needModel = true } = {}) {
    const apis = Game.state.settings.apis || {};
    const main = apis.main || {};
    if (role !== "main") {
      const r = apis[role] || {};
      // 只有显式关闭（enabled === false）才回落；旧存档缺 enabled 字段时按“已启用”处理，
      // 避免默认结构的 enabled:false 把已经填好的独立配置静默吞掉
      if (r.enabled !== false && r.url && r.key && (!needModel || r.model)) return r;
    }
    return main;
  },

  /** 生图提示词强制英文：有中文先让模型翻译，失败再用词典兜底 */
  async ensureEnglish(text, role = "gameplay") {
    const s = String(text == null ? "" : text);
    if (!/[\u4e00-\u9fa5]/.test(s)) return s;
    try {
      const t = await this.chat({
        role,
        messages: [
          { role: "system", content: "Translate the following image prompt into concise English Stable Diffusion tags. English tags only, comma-separated, no explanations, no quality words." },
          { role: "user", content: s.slice(0, 800) },
        ],
        temperature: 0.2, maxTokens: 220, stream: false,
      });
      const r = String(t || "").trim();
      if (r && !/[\u4e00-\u9fa5]/.test(r)) return r;
    } catch (e) { }
    return OWGEn.englishOnly(s);
  },

  /** 该角色当前实际生效的配置来自哪里（供界面提示，避免“填了却被静默回落”） */
  effect(role = "main") {
    const apis = Game.state.settings.apis || {};
    const r = apis[role] || {};
    const main = apis.main || {};
    if (role === "main") return { using: "main", conf: main, reason: "" };
    const miss = [];
    if (!r.url) miss.push("地址");
    if (!r.key) miss.push("密钥");
    if (!r.model) miss.push("模型名");
    const ready = r.enabled !== false && !miss.length;
    return {
      using: ready ? role : "main",
      conf: ready ? r : main,
      reason: ready ? "" : (r.enabled === false ? "独立接口未开启" : "缺" + miss.join("/")),
    };
  },

  roleReady(role = "main") {
    const p = this.resolve(role);
    return !!(p && p.url && p.key && p.model);
  },

  headers(key) {
    return { "Content-Type": "application/json", "Authorization": "Bearer " + (key || "").trim() };
  },

  /** 跨域代理：设置.proxy 非空时把请求地址包一层（支持 {url} 占位符，否则前缀拼接） */
  proxied(url) {
    const p = (Game.state.settings.proxy || "").trim();
    if (!p) return url;
    if (p.includes("{url}")) return p.replace("{url}", encodeURIComponent(url));
    return p + url;
  },

  /** 网络失败时的友好提示（CORS 是网页直连 API 最常见的坑；不会自动改用任何公共代理） */
  netHint() {
    return "网络请求失败。常见原因：①接口地址/密钥填错 ②浏览器跨域(CORS)限制——大部分官方接口不允许网页直接调用。本程序只会请求你填写的接口地址，不会自动切换到公共代理；如确需代理，请在「我的→模型→代理前缀」填写你自己的代理地址（支持 {url} 占位符）③服务端 4xx 响应缺少 CORS 头时，浏览器会把它当成网络错误并隐藏原始错误文本";
  },

  /** 请求摘要（不含密钥）：错误提示中用于定位是哪一项导致失败 */
  reqSummary(p, body, extra = "") {
    const ms = Array.isArray(body.messages) ? body.messages : [];
    const roles = {};
    let chars = 0;
    for (const m of ms) {
      roles[m.role] = (roles[m.role] || 0) + 1;
      chars += String(m.content == null ? "" : m.content).length;
    }
    const est = Math.round(chars * 0.75);
    const opt = Object.keys(body)
      .filter(k => k !== "messages" && k !== "model")
      .map(k => k + "=" + JSON.stringify(body[k]))
      .join(", ");
    return "模型=" + body.model + "｜地址=" + this.normBase(p.url) + "/chat/completions" +
      "｜消息=" + ms.length + "条(" + (Object.entries(roles).map(([k, v]) => k + ":" + v).join("/") || "空") + ")" +
      "｜正文≈" + est + " tokens｜参数=" + (opt || "无") + extra;
  },

  /** 统一消息：合法化 role、丢弃空消息；保持原有顺序（卡锚点等后置 system 不被挪位） */
  normalizeMessages(list) {
    const out = [];
    for (const m of (Array.isArray(list) ? list : [])) {
      if (!m) continue;
      let r = String(m.role || "user").toLowerCase();
      if (r === "sys" || r === "system") r = "system";
      else if (r === "human") r = "user";
      else if (r === "ai" || r === "bot" || r === "char") r = "assistant";
      else if (r !== "user" && r !== "assistant") r = "user";
      const c = String(m.content == null ? "" : m.content);
      if (!c.trim()) continue;
      out.push({ role: r, content: c });
    }
    return out;
  },

  /** 降级用：把所有 system 合并到首条（Gemini 等不接受多条/后置 system） */
  mergeSystemMessages(list) {
    const sys = [], out = [];
    for (const m of (Array.isArray(list) ? list : [])) {
      if (!m) continue;
      if (m.role === "system") { if (String(m.content || "").trim()) sys.push(String(m.content)); continue; }
      out.push(m);
    }
    if (sys.length) out.unshift({ role: "system", content: sys.join("\n\n") });
    return out;
  },

  /** 组装请求体；full=false 时只发 OpenAI 标准字段（降级重试用） */
  buildBody(model, messages, { temperature, maxTokens, stream, sampling, full }) {
    const body = {
      model,
      messages,
      temperature: Math.min(2, Math.max(0, Number(temperature) || 0.8)),
      max_tokens: Math.max(32, Math.floor(Number(maxTokens) || 2048)),
      stream: !!stream,
    };
    const sp = sampling || {};
    const ranges = { top_p: [0, 1], frequency_penalty: [-2, 2], presence_penalty: [-2, 2] };
    for (const k of Object.keys(ranges)) {
      const v = sp[k];
      if (v === null || v === undefined || v === "" || isNaN(+v)) continue;
      if (+v < ranges[k][0] || +v > ranges[k][1]) continue;
      if (k === "top_p" && +v <= 0) continue;
      body[k] = +v;
    }
    if (full) {
      for (const k of ["top_k", "min_p", "repetition_penalty"]) {
        const v = sp[k];
        if (v === null || v === undefined || v === "" || isNaN(+v) || +v <= 0) continue;
        body[k] = +v;
      }
      if (sp.seed !== null && sp.seed !== undefined && +sp.seed >= 0) body.seed = Math.floor(+sp.seed);
      if (sp.reasoning_effort) body.reasoning_effort = String(sp.reasoning_effort);
    }
    return body;
  },

  /** 把服务端 400 文本翻译成可操作的排查方向 */
  paramHint(text) {
    const t = String(text || "");
    if (/context length|context_length|too many tokens|maximum context|token limit|reduce the length|上下文|超过.{0,8}(长度|上限)/i.test(t)) return "上下文超长：请降低「正文长度/上下文预算」，或清空早期历史/前情记忆";
    if (/multiple system|system message|system_instruction|system role/i.test(t)) return "该服务只接受一条开头的 system：请到「我的 → 预设」检查是否有多条 system 提示词条目";
    if (/max_tokens|maximum.*output|output token|max output/i.test(t)) return "max_tokens 超过模型上限：请把「我的 → 预设 → max_tokens」或「目标字数」调低后再发";
    if (/top_k|min_p|repetition_penalty|unknown.*parameter|unsupported.*parameter|unrecognized|extra fields/i.test(t)) return "模型不支持部分采样字段：请到「我的 → 预设 → 采样与上下文」把 top_k / min_p / repetition_penalty 等留空后再发";
    if (/invalid.*temperature|temperature.*range|top_p/i.test(t)) return "采样参数超出服务允许范围：请检查 temperature（0–2）与 top_p（0–1）";
    if (/stream|sse/i.test(t)) return "该服务不支持流式：请到「我的 → 模型」关闭流式输出后重发";
    if (/model.*(not found|does not exist|unsupported)|invalid model/i.test(t)) return "模型名不被该服务接受：请从「拉取模型」列表里重新选择";
    return "";
  },

  async readError(res) {
    let raw = "";
    try { raw = await res.text(); } catch (e) { raw = String(res.statusText || ""); }
    return String(raw == null ? "" : raw).slice(0, 600);
  },

  /** 拉取模型列表（不要求该角色已选模型） */
  async listModels(role = "main") {
    const p = this.resolve(role, { needModel: false });
    if (!p.url) throw new Error("请填写接口地址（我的 → 模型 → 接口地址）");
    if (!p.key) throw new Error("请填写接口密钥（我的 → 模型 → 密钥）");
    const murl = this.proxied(this.normBase(p.url) + "/models");
    let res;
    try {
      res = await fetch(murl, { headers: this.headers(p.key) });
    } catch (e) {
      try { OWGLog.add("请求", "模型列表请求失败：" + murl, "错误：" + String((e && e.message) || e) + "\n" + this.netHint()); } catch (e0) { }
      throw new Error(this.netHint());
    }
    if (!res.ok) {
      const htxt = await this.httpError(res);
      try { OWGLog.add("请求", "模型列表 HTTP " + res.status + "：" + murl, htxt); } catch (e0) { }
      throw new Error(htxt);
    }
    const j = await res.json();
    const list = (j.data || j.models || []).map(m => m.id || m.name || String(m)).filter(Boolean);
    return [...new Set(list)].sort();
  },

  async httpError(res) {
    const raw = await this.readError(res);
    let detail = raw;
    try {
      const j = JSON.parse(raw);
      detail = (j.error && (j.error.message || j.error.code)) || j.message || j.detail || raw;
    } catch (e) { }
    detail = String(detail == null ? "" : detail).replace(/\s+/g, " ").trim().slice(0, 320);
    const map = {
      400: "请求被拒绝(400)",
      401: "密钥无效或未授权(401)",
      403: "无权限访问(403)",
      404: "接口路径不存在(404)，请检查地址是否需要 /v1",
      413: "请求体过大(413)",
      422: "参数不被接受(422)",
      429: "请求过于频繁或额度不足(429)",
      500: "服务端内部错误(500)",
      502: "网关错误(502)",
      503: "服务不可用(503)",
    };
    return (map[res.status] || "HTTP " + res.status) + (detail ? "：" + detail : "：服务端未返回错误文本");
  },

  /** 生图提示词记账：本轮尺度级别、依据句、互动/尺度段与最终 prompt 全部可查 */
  logImagePrompt(info) {
    const o = info || {};
    const ev = String(o.evidence || "");
    const names = Array.isArray(o.names) ? o.names.filter(Boolean) : [];
    const item = {
      ts: Date.now(),
      type: "生图提示词",
      reason: "尺度：" + String(o.level || "日常") +
        " · 依据：" + (ev ? "「" + ev + "」" : "（剧情未出现亲密/裸露描写）") +
        " · 人物：" + (names.length ? names.join("、") : "无"),
      attempt: 1,
      model: "",
      messages: 0,
      max_tokens: 0,
      stream: false,
      result: "已发送",
      detail: "最终正面提示词：" + String(o.prompt || "") +
        (o.interaction ? "\n互动段：" + String(o.interaction) : "") +
        (o.scale ? "\n尺度段：" + String(o.scale) : ""),
    };
    this.requestLog = this.requestLog || [];
    this.requestLog.push(item);
    if (this.requestLog.length > 50) this.requestLog.shift();
    try {
      console.info("[OWG生图] " + item.reason);
    } catch (e) { }
    return item;
  },

  /** 请求记账：类型/原因/次数/结果，供「提示词预览」底部核对 */
  _logReq(type, reason, body, attempt) {
    const item = {
      ts: Date.now(),
      type: String(type || "模型请求"),
      reason: String(reason || ""),
      attempt: Number(attempt) || 1,
      model: body && body.model,
      messages: (body && body.messages ? body.messages.length : 0),
      max_tokens: body && body.max_tokens,
      stream: !!(body && body.stream),
      result: "进行中",
    };
    this.requestLog = this.requestLog || [];
    this.requestLog.push(item);
    if (this.requestLog.length > 50) this.requestLog.shift();
    try {
      console.info("[OWG请求] " + item.type + (item.reason ? " · " + item.reason : "") +
        " · 第" + item.attempt + "次 · " + item.messages + " 条消息 · max_tokens=" + item.max_tokens +
        " · stream=" + item.stream);
    } catch (e) { }
    return item;
  },

  /**
   * 对话补全（支持 SSE 流式）
   * @param {string} role 分工角色：main | worldview | gameplay | memory
   * @returns {Promise<string>} 完整回复文本
   */
  async chat({ role = "main", messages, temperature = 0.9, maxTokens = 2048, stream = true, onDelta = null, onReasoning = null, signal = null, model = null, sampling = null, reqType = "模型请求", reason = "" }) {
    const p = this.resolve(role);
    if (!p.url) throw new Error("请填写接口地址（我的 → 模型 → 接口地址）");
    if (!p.key) throw new Error("请填写接口密钥（我的 → 模型 → 密钥）");
    const mdl = model || p.model;
    if (!mdl) throw new Error("请先选择模型（在「我的」页点击拉取模型）");

    // 首次请求保持原顺序：卡锚点等后置 system 留在末尾，保证卡内容在最后一次注意位置仍生效。
    // 若服务商（Gemini 等）不接受多条/后置 system，会 400 或（缺 CORS 时）表现为网络错误，
    // 下面再自动降级为“system 合并到首条 + 最小请求体 + 非流式”重试一次。
    const msgs = this.normalizeMessages(messages);
    if (!msgs.length) throw new Error("请求体为空：messages 没有有效内容");
    const url = this.proxied(this.normBase(p.url) + "/chat/completions");
    const headers = this.headers(p.key);
    const wantStream = !!stream;
    // 只记录主线剧情的思维链：后台生图/人物扫描也用 gameplay 模型，
    // 并发时若都写 this.lastReasoning 会把主线的思维内容覆盖掉
    if (role === "main") this.lastReasoning = "";
    this.lastFinish = "";

    const fullBody = this.buildBody(mdl, msgs, { temperature, maxTokens, stream: wantStream, sampling, full: true });
    this.lastDiag = {
      url: this.normBase(p.url) + "/chat/completions",
      model: mdl,
      messages: msgs.length,
      systems: msgs.filter(m => m.role === "system").length,
      type: reqType,
      reason: reason || "",
      attempts: 0,
      degraded: false,
      ok: false,
    };

    const send = async (body, type, attempt) => {
      const log = this._logReq(type, reason, body, attempt);
      let res;
      this.lastDiag.attempts = attempt;
      try {
        res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal });
      } catch (e) {
        if (e && e.name === "AbortError") throw e;
        log.result = "网络失败";
        try {
          OWGLog.add("请求", "网络请求失败：" + url,
            "第 " + attempt + " 次" + (this.lastDiag && this.lastDiag.degraded ? "（降级后重试）" : "") +
            "\n错误：" + String((e && e.message) || e) + "\n" + this.netHint());
        } catch (e0) { }
        const err = new Error(this.netHint() + "\n请求摘要：" + this.reqSummary(p, body));
        err.net = true;
        err.body = body;
        throw err;
      }
      if (!res.ok) {
        log.result = "HTTP " + res.status;
        const htxt = await this.httpError(res);
        try {
          OWGLog.add("请求", "HTTP " + res.status + "：" + url,
            "第 " + attempt + " 次" + (this.lastDiag && this.lastDiag.degraded ? "（降级后重试）" : "") + "\n" + htxt);
        } catch (e0) { }
        const err = new Error(htxt);
        err.status = res.status;
        err.body = body;
        throw err;
      }
      log.result = "OK";
      this.lastDiag.ok = true;
      return res;
    };

    let res;
    const usedBody = fullBody;
    try {
      res = await send(fullBody, reqType, 1);
    } catch (e) {
      if (e && e.name === "AbortError") throw e;
      // 一次发送只发一次主请求：不再自动降级重发，直接把真实错误抛给界面
      const msg = String((e && e.message) || e);
      const hint = (e && e.net) ? "" : this.paramHint(msg);
      const err = new Error(msg + (hint ? "\n可能原因：" + hint : ""));
      err.status = e && e.status;
      err.net = !!(e && e.net);
      throw err;
    }

    // 响应解析：优先真流式（Content-Type: text/event-stream）；其余整段读取后再判定 SSE/JSON
    const ctype = String(res.headers.get("content-type") || "").toLowerCase();
    let text = "", reasoningAcc = "", sawSSE = false, rawText = "";
    // 正文可能是字符串，也可能是分段数组（部分中转/多模态接口），统一成纯文本
    const piece = (v) => {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (Array.isArray(v)) return v.map(x => (typeof x === "string" ? x : (x && (x.text || x.content || "")) || "")).join("");
      if (typeof v === "object") return String(v.text || v.content || "");
      return String(v);
    };
    if (wantStream && res.body && ctype.includes("text/event-stream")) {
      sawSSE = true;
      const reader = res.body.getReader();
      const dec = new TextDecoder("utf-8");
      let buf = "";
      const eat = (line) => {
        const t = line.trim();
        if (!t.startsWith("data:")) return;
        const payload = t.slice(5).trim();
        if (!payload || payload === "[DONE]") return;
        let j = null;
        try { j = JSON.parse(payload); } catch (e) { return; }
        if (j && j.error) throw new Error("服务端在流中返回错误：" + (j.error.message || JSON.stringify(j.error)));
        const ch0 = (j && j.choices && j.choices[0]) || {};
        if (ch0.finish_reason) this.lastFinish = String(ch0.finish_reason);
        const delta = ch0.delta || ch0.message || {};
        const rc = delta.reasoning_content ?? delta.reasoning ?? "";
        if (rc) { reasoningAcc += rc; if (role === "main") this.lastReasoning += rc; if (onReasoning) onReasoning(rc); }
        const d = piece(delta.content ?? ch0.text);
        if (d) { text += d; if (onDelta) onDelta(text); }
      };
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) { rawText += line + "\n"; eat(line); }
      }
      if (buf) { rawText += buf; eat(buf); }
    } else {
      rawText = await res.text();
      if (!rawText) throw new Error("服务端返回空响应（HTTP " + res.status + "）\n请求摘要：" + this.reqSummary(p, usedBody));
      if (/(^|\n)\s*data:/.test(rawText)) {
        sawSSE = true;
        for (const line of rawText.split(/\r?\n/)) {
          const t = line.trim();
          if (!t.startsWith("data:")) continue;
          const payload = t.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let j = null;
          try { j = JSON.parse(payload); } catch (e) { continue; }
          if (j && j.error) throw new Error("服务端在流中返回错误：" + (j.error.message || JSON.stringify(j.error)));
          const ch0 = (j && j.choices && j.choices[0]) || {};
          if (ch0.finish_reason) this.lastFinish = String(ch0.finish_reason);
          const delta = ch0.delta || ch0.message || {};
          const rc = delta.reasoning_content ?? delta.reasoning ?? "";
          if (rc) { reasoningAcc += rc; if (role === "main") this.lastReasoning += rc; if (onReasoning) onReasoning(rc); }
          const d = piece(delta.content ?? ch0.text);
          if (d) { text += d; if (onDelta) onDelta(text); }
        }
      } else {
        let j = null;
        try { j = JSON.parse(rawText); } catch (e) { j = null; }
        if (!j) {
          throw new Error("无法解析服务端响应（HTTP " + res.status + "，Content-Type=" + (ctype || "空") + "）" +
            "\n响应片段：" + rawText.slice(0, 240) + "\n请求摘要：" + this.reqSummary(p, usedBody));
        }
        if (j.error) throw new Error("服务端返回错误：" + (j.error.message || JSON.stringify(j.error).slice(0, 200)));
        const ch = (j.choices && j.choices[0]) || {};
        const msg = ch.message || {};
        // 依次尝试 OpenAI 兼容的常见正文位置；content 可能是字符串或分段数组
        text = piece(msg.content);
        if (!text) text = piece(msg.text);
        if (!text) text = piece(ch.text);
        if (!text) text = piece(j.content) || piece(j.output_text);
        if (ch.finish_reason) this.lastFinish = String(ch.finish_reason);
        const rc = String(msg.reasoning_content ?? msg.reasoning ?? ch.reasoning_content ?? "");
        if (rc) { reasoningAcc = rc; if (role === "main") this.lastReasoning = rc; }
        if (onDelta) onDelta(text);
      }
    }

    // 200 但正文为空、只拿到思考内容：不再自动去掉思考参数重发第二次请求，
    // 直接走下面的空正文报错，把真实原因（思考模型/参数）告诉用户。

    // 200 但正文为空：明确报错（此前会静默返回空串，表现为“模型失效/剧情出不来”）
    if (!text) {
      const reasoning = role === "main" ? (this.lastReasoning || reasoningAcc) : reasoningAcc;
      const mode = sawSSE ? "流式" : "非流式";
      const extra = this.lastFinish === "length" ? "；输出已达到 max_tokens 上限，建议调大目标字数" : "";
      try {
        OWGLog.add("请求", "模型没有返回正文：" + mdl + (reasoning ? "（只返回了思考内容）" : "（响应为空）"),
          (reasoning ? "思考片段：" + String(reasoning).slice(0, 300) : "响应片段：" + String(rawText || "").slice(0, 400)) +
          "\n" + this.reqSummary(p, usedBody),
          { lv: "错误", key: "empty-body:" + mdl });
      } catch (e0) { }
      if (reasoning) {
        throw new Error("模型只返回了思考内容（reasoning_content），没有正文（" + mode + "）" + extra +
          "\n建议：换用非思考模型，或到「我的 → 预设」把 reasoning_effort 设为“不发送”" +
          "\n思考片段：" + String(reasoning).slice(0, 160) +
          "\n请求摘要：" + this.reqSummary(p, usedBody));
      }
      throw new Error("服务端返回 200 但正文为空（" + mode + "）" + extra +
        "\n响应片段：" + String(rawText || "").slice(0, 240) + "\n请求摘要：" + this.reqSummary(p, usedBody));
    }
    return String(text);
  },

  /**
   * 生图（通用）：NAI 官方接口（返回 zip 内 png）或 OpenAI 兼容 images 接口
   * @returns {Promise<string>} 压缩后的 jpeg dataURL
   */
  async generateImage({ prompt, neg = "", width, height, steps, scale, sampler, model }) {
    const cfg = Game.state.settings.image;
    if (!cfg?.url) throw new Error("请填写接口地址（我的 → 设置 → 生图接口地址）");
    if (!cfg?.key) throw new Error("请填写生图接口密钥（我的 → 设置 → 生图密钥）");
    // 单张可覆盖：预设/世界书里的 <size> 与采样参数会真正进入请求体
    const useW = +width > 0 ? +width : (+cfg.width || 832);
    const useH = +height > 0 ? +height : (+cfg.height || 1216);
    const useSteps = +steps > 0 ? clamp(Math.round(+steps), 1, 100) : clamp(+cfg.steps || 28, 1, 100);
    const useScale = +scale > 0 ? +scale : (+cfg.scale || 6.5);
    const useSampler = sampler || cfg.sampler || "k_euler_ancestral";
    const useModel = model || cfg.model || "nai-diffusion-4-full";
    let dataURL = null;
    // 正向提示词为空时绝不发请求：空 prompt 会让服务端收到一条没有正面词的请求，且界面看不出原因
    const posText = String(prompt == null ? "" : prompt).trim();
    if (!posText) {
      try { OWGLog.add("请求", "生图提示词为空，已阻止发送", "检查预设流程里的正向提示词 / 生图流程各步骤是否被停用"); } catch (e0) { }
      throw new Error("生图提示词为空：已阻止发送（请检查生图流程的正向提示词步骤）");
    }
    // NAI 类型填了 OpenAI 兼容地址（路径含 /openai/）时按 OpenAI images 协议发送，
    // 否则服务端只看到 input 字段、看不到 prompt，会表现为“请求里没有正面提示词”
    const urlLooksOpenAI = /\/openai(\/|$)/i.test(String(cfg.url || ""));
    if (cfg.type === "nai" && urlLooksOpenAI) {
      try { OWGLog.add("请求", "生图协议已按地址切换为 OpenAI 兼容（prompt 字段）", String(cfg.url).slice(0, 120)); } catch (e0) { }
    }
    if (cfg.type === "nai" && !urlLooksOpenAI) {
      const params = {
        width: useW, height: useH,
        scale: useScale, steps: useSteps,
        sampler: useSampler, n_samples: 1,
        // 以下字段对齐 st-chatu8 的 NAI payload（index.js 组装 requestBody 的那段）
        noise_schedule: cfg.scheduler || "karras",
        ucPreset: cfg.ucPreset == null ? 3 : +cfg.ucPreset,
        qualityToggle: cfg.qualityToggle !== false,
        sm: cfg.sm !== false, sm_dyn: cfg.smDyn !== false,
        dynamic_thresholding: false,
        cfg_rescale: cfg.cfgRescale == null ? 0.18 : +cfg.cfgRescale,
        params_version: /nai-diffusion-4/i.test(useModel) ? 3 : 1,
        negative_prompt: neg || undefined,
      };
      const nurl = this.proxied(cfg.url);
      let res;
      try {
        res = await fetch(nurl, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key.trim() },
          body: JSON.stringify({
            input: posText.slice(0, 1000),
            model: useModel,
            action: "generate",
            parameters: params,
          }),
        });
      } catch (e) {
        try { OWGLog.add("请求", "生图请求失败（NAI）：" + nurl, "错误：" + String((e && e.message) || e)); } catch (e0) { }
        throw e;
      }
      if (!res.ok) {
        try { OWGLog.add("请求", "生图 HTTP " + res.status + "（NAI）：" + nurl, "检查 NAI 密钥/订阅"); } catch (e0) { }
        throw new Error("生图失败 HTTP " + res.status + "（检查 NAI 密钥/订阅）");
      }
      const buf = await res.arrayBuffer();
      const png = this.extractZipPNG(buf);
      if (!png) throw new Error("生图返回内容无法解析（非 zip/png）");
      dataURL = "data:image/png;base64," + this.bytesToB64(png);
    } else {
      // OpenAI 兼容 /images/generations
      const base = this.normBase(cfg.url);
      const body = { model: useModel || "dall-e-3", prompt: posText.slice(0, 1000), n: 1, size: `${useW}x${useH}`, response_format: "b64_json" };
      if (neg) body.negative_prompt = neg;
      if (+steps > 0) body.steps = useSteps;
      if (+scale > 0) body.scale = useScale;
      if (sampler) body.sampler = useSampler;
      const ourl = this.proxied(base + "/images/generations");
      let res;
      try {
        res = await fetch(ourl, {
          method: "POST",
          headers: this.headers(cfg.key),
          body: JSON.stringify(body),
        });
      } catch (e) {
        try { OWGLog.add("请求", "生图请求失败（OpenAI 兼容）：" + ourl, "错误：" + String((e && e.message) || e)); } catch (e0) { }
        throw e;
      }
      if (!res.ok) {
        try { OWGLog.add("请求", "生图 HTTP " + res.status + "（OpenAI 兼容）：" + ourl, "检查生图接口地址/密钥"); } catch (e0) { }
        throw new Error("生图失败 HTTP " + res.status);
      }
      const j = await res.json();
      const d = j.data?.[0];
      if (d?.b64_json) dataURL = "data:image/png;base64," + d.b64_json;
      else if (d?.url) {
        const img = await (await this._origFetchSafe(d.url)).blob();
        dataURL = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(img); });
      }
      if (!dataURL) throw new Error("生图返回为空");
    }
    // 9) 画质：默认保存并展示原图（原分辨率、不转码）；需要省空间时可在设置里开启压缩
    const icfg = Game.state.settings.image || {};
    if (icfg.compress === true) return await this.compressImage(dataURL, 512, 0.78);
    return dataURL;
  },

  async _origFetchSafe(u) { return fetch(u); },

  bytesToB64(u8) {
    let s = "";
    for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
    return btoa(s);
  },

  /** 从 zip 二进制中提取首个 stored（无压缩）文件的 png 数据 */
  extractZipPNG(buf) {
    const b = new Uint8Array(buf);
    const dv = new DataView(buf);
    for (let i = 0; i + 30 <= b.length; i++) {
      if (b[i] === 0x50 && b[i + 1] === 0x4b && b[i + 2] === 0x03 && b[i + 3] === 0x04) { // PK\x03\x04
        const method = dv.getUint16(i + 8, true);
        const compSize = dv.getUint32(i + 18, true);
        const nameLen = dv.getUint16(i + 26, true);
        const extraLen = dv.getUint16(i + 28, true);
        const start = i + 30 + nameLen + extraLen;
        if (method === 0 && compSize > 0 && start + compSize <= b.length) {
          const data = b.subarray(start, start + compSize);
          if (data[0] === 0x89 && data[1] === 0x50) return data; // PNG 魔数
        }
      }
    }
    return null;
  },

  /** dataURL 图片压缩 */
  compressImage(dataURL, maxSide = 512, quality = 0.78) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const r = Math.min(1, maxSide / Math.max(img.width, img.height));
        c.width = Math.max(1, Math.round(img.width * r));
        c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { res(c.toDataURL("image/jpeg", quality)); } catch (e) { res(dataURL); }
      };
      img.onerror = () => rej(new Error("图片处理失败"));
      img.src = dataURL;
    });
  },
};

</script>
<script>
/* ========== 酒馆角色卡解析与导入 ========== */
"use strict";

const Card = {
  /** 从 PNG 文件中提取内嵌角色卡（tEXt/iTXt 块: chara / ccv3） */
  async parsePNG(buffer) {
    const bytes = new Uint8Array(buffer);
    const SIG = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
    for (let i = 0; i < 8; i++) if (bytes[i] !== SIG[i]) throw new Error("不是有效的 PNG 文件");
    const dv = new DataView(buffer);
    const td = new TextDecoder("latin1");
    let pos = 8;
    const found = {};
    while (pos + 12 <= bytes.length) {
      const len = dv.getUint32(pos);
      const type = td.decode(bytes.subarray(pos + 4, pos + 8));
      if (type === "tEXt" || type === "iTXt") {
        const data = bytes.subarray(pos + 8, pos + 8 + len);
        const nul = data.indexOf(0);
        if (nul > 0) {
          const keyword = td.decode(data.subarray(0, nul));
          let value = td.decode(data.subarray(nul + 1));
          if (keyword === "chara" || keyword === "ccv3" || keyword === "Chara") {
            try {
              if (/^[A-Za-z0-9+/=\s]+$/.test(value)) value = this.b64ToUtf8(value);
              found[keyword] = value;
            } catch (e) { /* base64 解码失败则跳过 */ }
          }
        }
      }
      if (type === "IEND") break;
      pos += 12 + len;
    }
    const raw = found.ccv3 || found.chara || found.Chara;
    if (!raw) throw new Error("该 PNG 中没有嵌入角色卡数据（tEXt: chara）");
    return JSON.parse(raw);
  },

  b64ToUtf8(b64) {
    const bin = atob(String(b64).replace(/\s+/g, ""));
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(u8);
  },

  /** 归一化 V1/V2/V3 各种结构 -> 统一字段 */
  normalize(json) {
    if (!json || typeof json !== "object") throw new Error("角色卡格式不正确");
    let d = json.data && typeof json.data === "object" ? json.data : json; // V2/V3: {spec, data:{...}}
    const pick = (...keys) => { for (const k of keys) if (d[k] != null && String(d[k]).trim()) return String(d[k]); return ""; };
    const name = pick("name", "char_name") || "未知角色";
    let book = d.character_book || json.character_book || null;
    const entries = [];
    if (book && Array.isArray(book.entries)) {
      for (const e of book.entries.slice(0, 60)) {
        const c = e.content || e.text || "";
        if (c) entries.push({ keys: (e.keys || []).slice(0, 6), content: String(c) });
      }
    }
    // 清洗渲染代码
    const clean = t => stripRenderKeepMacros(t, { char: name });
    return {
      name,
      description: clean(pick("description")),
      personality: clean(pick("personality")),
      scenario: clean(pick("scenario")),
      first_mes: clean(pick("first_mes", "first_mes_e")), 
      mes_example: clean(pick("mes_example", "mes_example_e")),
      system_prompt: clean(pick("system_prompt")),
      creator_notes: clean(pick("creator_notes", "creatorcomment")),
      tags: Array.isArray(d.tags) ? d.tags.slice(0, 12).map(String) : [],
      alt_greetings: (Array.isArray(d.alternate_greetings) ? d.alternate_greetings : []).slice(0, 24).map(clean).filter(Boolean),
      alternate_greetings: (Array.isArray(d.alternate_greetings) ? d.alternate_greetings : []).slice(0, 24).map(clean).filter(Boolean),
      post_history_instructions: clean(pick("post_history_instructions")),
      creator: pick("creator"),
      character_version: pick("character_version"),
      extensions: (d.extensions && typeof d.extensions === "object") ? d.extensions : {},
      book: entries.filter(e => e.content.length < 1200).slice(0, 30),
    };
  },

  /** 导入文件（.json / .png）→ 归一化角色卡 */
  async importFile(file) {
    const ext = (file.name.match(/\.(\w+)$/) || [])[1]?.toLowerCase() || "";
    let json = null, avatar = "";
    if (ext === "png") {
      const buf = await readFileAs(file, "buffer");
      json = await this.parsePNG(buf);
      try { avatar = await this.compressAvatar(file); } catch (e) { /* 头像压缩失败不影响导入 */ }
    } else if (ext === "json" || ext === "txt") {
      json = JSON.parse(await readFileAs(file, "text"));
      // 支持酒馆多角色导出数组
      if (Array.isArray(json)) json = json[0];
    } else {
      throw new Error("仅支持 .png 角色卡或 .json 文件");
    }
    // 初始化卡绑定的世界书（来自卡自带 Lorebook；AI 分析后会合并更新）
    const rawEntries = (json && json.data && Array.isArray(json.data.character_book?.entries)) ? json.data.character_book.entries
      : (json && json.character_book && Array.isArray(json.character_book.entries)) ? json.character_book.entries : [];
    const worldbook = (typeof STBridge !== "undefined")
      ? STBridge.toAppEntries(rawEntries, "card")
      : rawEntries.map(e => ({ keys: (e.keys || []).map(String).slice(0, 6), content: String(e.content || "").slice(0, 300) })).filter(e => e.content);
    const base = this.normalize(json);
    const alts = base.alternate_greetings || base.alt_greetings || [];
    // 保留原始 extensions（含 tavern_helper.scripts / scripts），供酒馆脚本导入使用
    const rawExtensions = this.collectExtensions(json);
    const scripts = (typeof OWGScript !== "undefined") ? OWGScript.extractScripts(rawExtensions) : [];
    const display = this.rawDisplayFields(json);
    return { ...base, alternate_greetings: alts, alt_greetings: alts, worldbook,
      book: worldbook.map(e => ({ keys: (e.keys || []).slice(0, 6), content: String(e.content || "").slice(0, 300) })),
      extensions: rawExtensions, scripts, display,
      avatar, importedAt: Date.now(), id: uid() };
  },

  /** 汇总卡 JSON 各层 extensions（顶层/data、extensions/tavern_helper、scripts） */
  collectExtensions(json) {
    const out = {};
    const bag = { scripts: [] };
    const merge = o => {
      if (!o || typeof o !== "object" || Array.isArray(o)) return;
      for (const k of Object.keys(o)) {
        if (k === "tavern_helper") {
          const th = o[k];
          if (th && typeof th === "object" && !Array.isArray(th)) {
            out.tavern_helper = Object.assign({}, out.tavern_helper || {}, th);
            if (Array.isArray(th.scripts)) bag.scripts = bag.scripts.concat(th.scripts);
            delete out.tavern_helper.scripts;
          }
        } else if (k === "scripts") {
          if (Array.isArray(o[k])) bag.scripts = bag.scripts.concat(o[k]);
        } else {
          out[k] = o[k];
        }
      }
    };
    const d = (json && json.data && typeof json.data === "object") ? json.data : {};
    merge(json && json.extensions);
    merge(json && json.tavern_helper);
    merge(d && d.extensions);
    merge(d && d.tavern_helper);
    if (Array.isArray(json && json.scripts)) bag.scripts = bag.scripts.concat(json.scripts);
    if (Array.isArray(d && d.scripts)) bag.scripts = bag.scripts.concat(d.scripts);
    const seen = new Set();
    out.scripts = bag.scripts.filter(it => {
      if (!it || typeof it !== "object") return false;
      const key = String(it.id || "") + "|" + String(it.content || "").slice(0, 80);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    return out;
  },

  /** 原始展示字段（不经 stripRender 清洗）：用于开场正文的 HTML/CSS 还原 */
  rawDisplayFields(json) {
    const d = (json && json.data && typeof json.data === "object") ? json.data : {};
    const pick = k => {
      for (const o of [d, json]) if (o && o[k] != null && String(o[k]).trim()) return String(o[k]);
      return "";
    };
    const alts = Array.isArray(d.alternate_greetings) ? d.alternate_greetings
      : (Array.isArray(json && json.alternate_greetings) ? json.alternate_greetings : []);
    return {
      first_mes: pick("first_mes"),
      mes_example: pick("mes_example"),
      system_prompt: pick("system_prompt"),
      post_history_instructions: pick("post_history_instructions"),
      // 同时给出两种键名：老的 alts 与酒馆字段名 alternate_greetings
      alternate_greetings: alts.map(x => String(x == null ? "" : x)).filter(x => x.trim()),
      alts: alts.map(x => String(x == null ? "" : x)).filter(x => x.trim()),
    };
  },

  /** 压缩头像为 96px JPEG dataURL，避免撑爆 localStorage */
  compressAvatar(file, maxSide = 96) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const r = Math.min(1, maxSide / Math.max(img.width, img.height));
        c.width = Math.max(1, Math.round(img.width * r));
        c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { res(c.toDataURL("image/jpeg", 0.82)); } catch (e) { rej(e); }
      };
      img.onerror = () => rej(new Error("图片读取失败"));
      img.src = URL.createObjectURL(file);
    });
  },

  /** 用指定模型跑一次世界观分析（原始 JSON，未校验） */
  async analyzeWorldviewRaw(card, model, { onDelta = null, signal = null } = {}) {
    const content = await API.chat({
      role: "worldview", model,
      messages: this.buildWorldviewMessages(card),
      temperature: 0.7, maxTokens: 12000, stream: true, onDelta, signal,

  /** 玩家自写世界观：AI 分析 → 校验 → 结构化结果 */
  async analyzeCustomWorldview(text, { model = null, onDelta = null, signal = null } = {}) {
    const content = await API.chat({
      role: "worldview", model,
      messages: this.buildCustomWorldviewMessages(text),
      temperature: 0.7, maxTokens: 12000, stream: true, onDelta, signal,
    });
    const raw = extractJSON(content);
    const v = this.validateWorldview(raw, { name: "我的世界" });
    if (!v) throw new Error("AI 没有返回可用的世界观结构，请重试或改写设定");
    while (v.maps.length < 9) v.maps.push({ id: uid(), name: (v.world_name || "无名之地") + "·未名之地" + v.maps.length, desc: "尚未探明的区域", emoji: "🌫️", locations: [] });
    v.maps.forEach((m, i) => { m.ax = RING[i][0]; m.ay = RING[i][1]; });
    return { ...v, analyzedAt: Date.now() };
  },
  /** 校验并补齐一份世界观结果（3×3 环形地图 + 职业表 + 属性名/术语 + 世界书） */
  validateWorldview(wv, card) {
    if (!wv || !wv.worldview) return null;
    const maps = [];
    for (let m of (wv.maps || []).slice(0, 9)) {
      if (!m || !m.name) continue;
      const locs = [];
      for (const l of (m.locations || []).slice(0, 16)) {
        if (!l || !l.name) continue;
        locs.push({ id: uid(), name: String(l.name).slice(0, 12), desc: String(l.desc || "").slice(0, 40), emoji: String(l.emoji || "📍").slice(0, 4) });
      }
      if (locs.length >= 5) maps.push({ id: uid(), name: String(m.name).slice(0, 14), desc: String(m.desc || "").slice(0, 60), emoji: String(m.emoji || "🗺️").slice(0, 4), locations: locs });
    }
    const ATTR_KEYS = ["hp", "mp", "atk", "def", "spd", "luk", "int"];
    let classes = null;
    if (Array.isArray(wv.classes)) {
      const valid = wv.classes.slice(0, 8).map(c => {
        if (!c || !c.name) return null;
        const base = CLASSES["剑士"].attrs;
        const attrs = {};
        for (const k of ATTR_KEYS) {
          const v = Math.round(+((c.attrs || {})[k]));
          attrs[k] = (isNaN(v) || v <= 0) ? base[k] : clamp(v, 1, 400);
        }
        const skill = c.skill && c.skill.name
          ? {
            name: String(c.skill.name).slice(0, 14), desc: String(c.skill.desc || "初始技能").slice(0, 80),
            mpCost: clamp(Math.round(+c.skill.mpCost) || 8, 0, 200),
            power: Math.round(clamp(+c.skill.power || (c.skill.magic ? 1.6 : 1.3), 1.1, 2.4) * 10) / 10,
            magic: c.skill.magic === true,
          }
          : { name: "基础技艺", desc: "职业生涯的基础能力。", mpCost: 6, power: 1.3, magic: false };
        return { name: String(c.name).slice(0, 8), icon: String(c.icon || "⚔️").slice(0, 4), desc: String(c.desc || "").slice(0, 20), attrs, skills: [skill] };
      }).filter(Boolean);
      if (valid.length >= 3) classes = valid.slice(0, 6);
    }
    let attrNames = null;
    if (wv.attr_names && typeof wv.attr_names === "object") {
      const an = {};
      for (const k of ATTR_KEYS) { const v = String(wv.attr_names[k] || "").trim().slice(0, 6); if (v) an[k] = v; }
      if (Object.keys(an).length === ATTR_KEYS.length) attrNames = an;
    }
    let termNames = null;
    if (wv.term_names && typeof wv.term_names === "object") {
      const tn = {};
      for (const k of ["level", "exp", "gold", "skill", "class"]) { const v = String(wv.term_names[k] || "").trim().slice(0, 4); if (v) tn[k] = v; }
      if (Object.keys(tn).length >= 3) termNames = tn;
    }
    const normWb = arr => (Array.isArray(arr) ? arr : [])
      .filter(e => e && e.content)
      .map(e => ({
        keys: (Array.isArray(e.keys) ? e.keys : String(e.keys || "").split(/[,，、\s]+/)).map(x => String(x).trim()).filter(Boolean).slice(0, 6),
        content: String(e.content).slice(0, 300),
      })).filter(e => e.content);
    return {
      world_name: String(wv.world_name || card.name + "的世界").slice(0, 20),
      worldview: String(wv.worldview).slice(0, 1900),
      attr_names: attrNames, term_names: termNames, classes, maps, worldbook: normWb(wv.worldbook),
      ...this.loadoutOf({
        initial_gold: wv.initial_gold,
        initial_gold_reason: wv.initial_gold_reason,
        price_level: wv.price_level,
        initial_items: wv.initial_items,
      }),
    };
  },

  /**
   * 多模型联合分析：世界观阶段用 models 列表依次生成并合并（第一份为基准，后续补缺），
   * 玩法阶段单独一次。models 为空时使用默认分工模型。
   */
  async analyze(card, { models = [], onDelta = null, signal = null, onStage = null } = {}) {
    // —— 世界观阶段（多模型）——
    const useModels = models.length ? models : [null];
    const results = [];
    for (let i = 0; i < useModels.length; i++) {
      onStage && onStage("worldview", i + 1, useModels.length, useModels[i]);
      try {
        const raw = await this.analyzeWorldviewRaw(card, useModels[i], { onDelta, signal });
        const v = this.validateWorldview(raw, card);
        if (v) results.push({ model: useModels[i] || API.resolve("worldview").model, data: v });
      } catch (e) { if (results.length === 0 && i === useModels.length - 1) throw e; /* 至少要有一份成功 */ }
    }
    if (!results.length) throw new Error("所有模型的世界观分析都失败了，请重试");
    // 合并：第一份为基准，后续补齐地图/职业/世界书/属性名/术语
    const base = JSON.parse(JSON.stringify(results[0].data));
    for (const { data } of results.slice(1)) {
      while (base.maps.length < 9 && data.maps.length) base.maps.push(data.maps.pop());
      if (!base.classes && data.classes) base.classes = data.classes;
      if (!base.attr_names && data.attr_names) base.attr_names = data.attr_names;
      if (!base.term_names && data.term_names) base.term_names = data.term_names;
      if (base.worldbook.length < 15) {
        const seen = new Set(base.worldbook.map(e => e.content.slice(0, 30)));
        for (const e of data.worldbook) {
          if (base.worldbook.length >= 15) break;
          if (!seen.has(e.content.slice(0, 30))) { base.worldbook.push(e); seen.add(e.content.slice(0, 30)); }
        }
      }
    }
    // —— 玩法阶段（单次）——
    let gp = null;
    try {
      onStage && onStage("gameplay", 1, 1, null);
      const gpText = await API.chat({
        role: "gameplay",
        messages: this.buildGameplayMessages(card),
        temperature: 0.7, maxTokens: 3000, stream: true, onDelta, signal,
      });
      gp = extractJSON(gpText);
    } catch (e) { gp = null; }
    const persona = gp?.persona || card.personality || card.description?.slice(0, 300) || "";
    const gameplay = gp?.gameplay || "";
    const player_role = gp?.player_role || "旅行者";
    const opening = gp?.opening || card.first_mes || "";

    // 地图补齐至 9 张（环形布局），地点补 16 由 normalizeWorldGrid 完成
    while (base.maps.length < 9) {
      base.maps.push({ id: uid(), name: `${base.world_name}·未名之地${base.maps.length + 1}`, desc: "尚未探明的区域", emoji: "🌫️", locations: [] });
    }
    base.maps.forEach((m, i) => { m.ax = RING[i][0]; m.ay = RING[i][1]; });
    // 世界书：AI 合并结果 + 卡自带 Lorebook 去重（上限 30）
    const seen2 = new Set(base.worldbook.map(e => e.content.slice(0, 30)));
    const worldbook = [...base.worldbook, ...(card.book || []).map(e => ({ keys: e.keys || [], content: String(e.content).slice(0, 300) }))]
      .filter(e => { const k = e.content.slice(0, 30); if (seen2.has(k)) return false; seen2.add(k); return true; })
      .slice(0, 30);
    return {
      world_name: base.world_name,
      worldview: base.worldview,
      persona: String(persona).slice(0, 1700),
      gameplay: String(gameplay).slice(0, 1050),
      player_role: String(player_role).slice(0, 320),
      opening: String(opening).slice(0, 1200),
      ...this.loadoutOf({
        initial_gold: gp?.initial_gold,
        initial_gold_reason: gp?.initial_gold_reason,
        price_level: gp?.price_level,
        initial_items: gp?.initial_items,
      }),
      maps: base.maps, classes: base.classes, attr_names: base.attr_names, term_names: base.term_names, worldbook,
      analyzedAt: Date.now(),
      models: { worldview: results.map(r => r.model), gameplay: gp ? API.resolve("gameplay").model : "" },
    };
  },

  /** 初始物品归一化：接受对象或字符串，过滤空名，限制件数 */
  normalizeInitialItems(raw) {
    const out = [];
    for (const x of (Array.isArray(raw) ? raw : [])) {
      if (!x) continue;
      const name = String(typeof x === "string" ? x : (x.name || "")).trim().slice(0, 14);
      if (!name) continue;
      const count = clamp(Math.round(+((x && x.count) || 1)) || 1, 1, 20);
      const price = clamp(Math.round(+((x && x.price) || 0)) || 0, 0, 999999);
      out.push({ name, count, price, desc: String((x && x.desc) || "").slice(0, 30) });
      if (out.length >= 6) break;
    }
    return out;
  },

  /** 初始货币/背包：优先分析结果，缺失或非法时回落到通用默认值（旧卡不报错） */
  loadoutOf(an) {
    const a = an || {};
    const g = Math.round(+a.initial_gold);
    const gold = (isFinite(g) && g > 0) ? clamp(g, 5, 999999) : 50;
    let items = this.normalizeInitialItems(a.initial_items);
    if (!items.length) items = [{ name: "面包", count: 3, price: 5 }, { name: "初级治疗药水", count: 1, price: 20 }];
    return {
      initial_gold: gold,
      initial_gold_reason: String(a.initial_gold_reason || "").slice(0, 200) || "未提供依据（旧卡或分析失败），按通用物价档给出一份基础行囊",
      price_level: String(a.price_level || "").slice(0, 60),
      initial_items: items,
    };
  },

  /** 无 API 时的本地降级分析 */
  localAnalyze(card) {
    const wv = [card.scenario, card.description].filter(Boolean).join("\n").slice(0, 500) || "（未提供世界观，使用默认开放世界）";
    return {
      world_name: (card.name + "的世界").slice(0, 20),
      worldview: wv,
      persona: card.personality || card.description?.slice(0, 300) || "",
      gameplay: "未配置 API，已跳过智能分析。配置后可在角色卡列表点击「分析」获得完整玩法设计（含专属职业与世界书）。",
      player_role: "旅行者",
      opening: card.first_mes || "",
      ...this.loadoutOf(null),
      initial_gold_reason: "本地降级分析：未拿到世界观物价，按通用物价档给出基础行囊",
      maps: null, // 使用默认世界
      classes: null, attr_names: null, term_names: null,
      // 卡自带 Lorebook 转为世界书条目
      worldbook: (card.book || []).map(e => ({ keys: e.keys || [], content: e.content.slice(0, 300) })),
      analyzedAt: 0,
    };
  },
};

/* ========== 游戏核心：状态、剧情引擎、存档 ========== */
"use strict";

const STATE_RE = /<<<STATE>>>\s*([\s\S]*?)(?:<<<END>>>|$)/;

/* ---------------------------------------------------------------
 * 面板数据隔离：模型可能用 <<<PANEL>>> / [STATE] / json 围栏 / 裸 JSON 输出面板，
 * 这些只允许写进玩家面板，绝不能留在剧情正文里。
 * ------------------------------------------------------------- */
const OWGPanel = {
  KEYS: ["exp", "hp", "mp", "gold", "add_items", "remove_items", "add_status", "remove_status", "new_skills",
    "scene", "battle", "statuses", "inventory", "items", "bag", "attrs", "equipment", "level", "panel", "player_panel",
    "time_minutes", "weather", "rumor", "region", "place",
    "等级", "生命", "魔力", "金币", "属性", "背包", "面板", "状态", "物品"],
  /** 只有“所有键都属于面板字段”的对象才认定为面板数据，避免误伤剧情里的普通 JSON 卡片 */
  isPanel(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
    const ks = Object.keys(obj);
    return !!ks.length && ks.every(k => this.KEYS.includes(k));
  },
  merge(a, b) {
    if (!b) return a;
    const o = Object.assign({}, a || {});
    for (const k of Object.keys(b)) {
      const v = b[k];
      if (k === "panel" || k === "面板") {
        if (v && typeof v === "object" && !Array.isArray(v)) Object.assign(o, this.merge({}, v));
        continue;
      }
      if (typeof v === "number" && typeof o[k] === "number") o[k] += v;
      else if (Array.isArray(v)) o[k] = (Array.isArray(o[k]) ? o[k] : []).concat(v);
      else if (k === "scene" || k === "battle") { if (v && (!Array.isArray(v) || v.length)) o[k] = v; }
      else if (v !== undefined && v !== null && v !== "") o[k] = v;
    }
    return o;
  },
  /** 从任意文本里抽出面板块：返回 { text（已删除面板块）, delta（合并后的变化量） } */
  extract(text) {
    let src = String(text == null ? "" : text);
    const found = [];
    const take = (jsonText) => {
      let obj = null;
      try { obj = extractJSON(jsonText); } catch (e) { obj = null; }
      if (!obj) { try { obj = JSON.parse(String(jsonText).trim()); } catch (e) { obj = null; } }
      if (this.isPanel(obj)) { found.push(obj); return true; }
      return false;
    };
    // ① <<<STATE/PANEL/STATUS/面板>>> … <<<END>>>（允许未闭合）
    src = src.replace(/<<<(?:STATE|PANEL|STATUS|面板)>>>\s*([\s\S]*?)(?:<<<END>>>|$)/gi, (m, j) => (take(j) ? "" : m));
    // ② [STATE]…[/STATE]
    src = src.replace(/\[STATE\]([\s\S]*?)\[\/STATE\]/gi, (m, j) => (take(j) ? "" : m));
    // ③ ```json / ``` 围栏
    src = src.replace(/```(?:json|json5|jsonc)?[ \t]*\n?([\s\S]*?)```/gi, (m, inner) => (take(inner) ? "" : m));
    // ④ 裸 JSON（花括号配平扫描，忽略字符串内的括号）
    const spans = [];
    const matchBrace = (s, start) => {
      let depth = 0, str = false, esc = false;
      for (let i = start; i < s.length; i++) {
        const c = s.charAt(i);
        if (str) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') str = false; continue; }
        if (c === '"') { str = true; continue; }
        if (c === "{") depth++;
        else if (c === "}") { depth--; if (depth === 0) return i; }
      }
      return -1;
    };
    let i = 0;
    while (i < src.length) {
      const p = src.indexOf("{", i);
      if (p < 0) break;
      const e = matchBrace(src, p);
      if (e < 0) break;
      const body = src.slice(p, e + 1);
      if (body.length > 1 && take(body)) { spans.push([p, e + 1]); i = e + 1; }
      else i = p + 1;
    }
    for (let k = spans.length - 1; k >= 0; k--) {
      src = src.slice(0, spans[k][0]) + src.slice(spans[k][1]);
    }
    const delta = found.reduce((acc, x) => this.merge(acc, x), null);
    return { text: src.replace(/\n{3,}/g, "\n\n").trim(), delta };
  },
};
