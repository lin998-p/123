    try { window.OWGTH && OWGTH.emit("owg_battle_started", { kind: "spar", enemies: [c.name] }); } catch (e) { }
    return st.battle;
  },

  /** 判断某个单位是否已失去战斗能力（切磋：生命剩 1 即失去战斗能力） */
  unitDown(u, b = this.state.battle) {
    if (!u) return true;
    return OWGCombat.isDown(b, u);
  },
  allDown(list, b = this.state.battle) {
    return (list || []).every(u => OWGCombat.isDown(b, u));
  },
  /** 扣血：切磋生命下限为 1，到 1 即失去战斗能力 */
  _dealDamage(b, target, dmg) {
    const before = Math.max(0, target.hp);
    if (b.kind === "spar") {
      target.hp = Math.max(1, before - Math.max(1, Math.round(dmg)));
      if (target.hp <= 1) target.out = true;
    } else {
      target.hp = Math.max(0, before - Math.max(1, Math.round(dmg)));
      if (target.hp <= 0) target.out = true;
    }
    return before - target.hp;
  },

  /** 执行一回合：按速度行动序依次结算（玩家、队友、敌人共用一套顺序） */
  async battleRound(action, { onDelta = null } = {}) {
    const st = this.state, b = st.battle;
    if (!b || b.status !== "fighting") throw new Error("没有进行中的对战");
    const p = st.player;
    const me = b.allies.find(a => a.isPlayer);
    if (!me) throw new Error("战斗状态异常：找不到我方角色");
    const act = action || { type: "attack" };
    if (OWGCombat.isDown(b, me) && act.type !== "wait") throw new Error("你已失去战斗能力，只能观战");
    const log = [];
    const isEnemy = u => b.enemies.includes(u);
    const isPlayerSide = u => b.allies.includes(u);
    // 回合开始：冷却 -1、清空防御姿态
    OWGCombat.roundStart(b, log);

    // —— 速度行动序：速度高者先行动，同速我方优先 ——
    for (const u of OWGCombat.orderUnits(b)) {
      if (this.allDown(b.enemies, b) || this.allDown(b.allies, b)) break;
      if (OWGCombat.isDown(b, u)) continue;
      // 行动前状态：DOT / 控制 / 回复
      const phase = OWGCombat.turnStart(b, u, log);
      if (phase.dead) { OWGCombat.turnEnd(b, u, phase.skip); continue; }
      if (phase.skip) { OWGCombat.turnEnd(b, u, phase.skip); continue; }

      if (u.isPlayer) {
        if (act.type === "flee") {
          if (b.kind === "spar") { log.push({ txt: "切磋点到为止，不能逃跑，请继续过招。" }); }
          else {
            const avgSpd = b.enemies.length ? b.enemies.reduce((s, e) => s + (e.spd || 0), 0) / b.enemies.length : 0;
            if (Math.random() < 0.5 + (me.spd - avgSpd) / 200) {
              b.status = "fled";
              b.endedAt = Date.now();
              b.log.push("🏃 成功脱离了战斗。");
              this.syncPlayerFromBattle(b); this.save();
              return { battle: b, rewards: null, fled: true, dead: false };
            }
            log.push({ txt: "逃跑失败，敌人拦住了你。" });
          }
        } else if (act.type === "defend") {
          me.defend = true;
          log.push({ txt: "你凝神防守，本回合受到的伤害减半。" });
        } else if (act.type === "item") {
          const it = p.items.find(x => x.name === act.item && x.count > 0);
          if (!it) log.push({ txt: "背包里没有这件物品。" });
          else {
            const r = this.useItem(act.item);
            if (r.applied) { log.push({ txt: "使用「" + act.item + "」：" + (r.log || []).join("，") }); me.hp = p.d.hp; me.mp = p.d.mp; }
            else log.push({ txt: "使用「" + act.item + "」，但看不出效果。" });
          }
        } else if (act.type === "skill") {
          const sk = ((me.skills || p.skills || [])).find(s => s.name === act.skill);
          if (!sk) log.push({ txt: "没有技能「" + act.skill + "」。" });
          else {
            const stt = OWGCombat.skillState(me, sk);
            if (stt.passive) log.push({ txt: "「" + stt.info.name + "」是被动技能，会一直生效，不用主动释放。" });
            else if (stt.blocked) log.push({ txt: `无法使用〔${stt.info.name}〕：${stt.blocked}。` });
            else OWGCombat.castSkill(b, me, sk, act.target, log);
          }
        } else if (act.type !== "wait") {
          OWGCombat.basicAttack(b, me, act.target, log);
        }
      } else if (isPlayerSide(u)) {
        // —— 队友自动作战：有可用技能就放，否则普攻 ——
        const usable = (u.skills || []).filter(sk => {
          const st = OWGCombat.skillState(u, sk);
          return !st.passive && !st.blocked;
        });
        if (usable.length && Math.random() < 0.5) OWGCombat.castSkill(b, u, usable[0], null, log);
        else OWGCombat.basicAttack(b, u, null, log);
      } else if (isEnemy(u)) {
        OWGCombat.enemyTurn(b, u, log);
      }
      OWGCombat.turnEnd(b, u, false);
    }

    this.syncPlayerFromBattle(b);
    b.round++;
    let rewards = null;
    let fled = false;
    const won = this.allDown(b.enemies, b);
    const lost = this.allDown(b.allies, b);
    if (won && b.status === "fighting") {
      b.status = "won"; b.endedAt = Date.now(); fled = false;
      rewards = this.battleRewards(b);
      b.log.push(b.kind === "spar" ? "🤝 切磋获胜（点到为止）" : "⚔️ 战斗胜利！");
      if (b.kind === "spar") { p.d.hp = b.preSpar?.hp ?? p.d.hp; p.d.mp = b.preSpar?.mp ?? p.d.mp; me.hp = p.d.hp; me.mp = p.d.mp; }
      this.commitBattleNarrative(b, true, rewards);
    } else if (lost && b.status === "fighting") {
      b.status = "lost"; b.endedAt = Date.now();
      b.log.push(b.kind === "spar" ? "🤝 切磋落败（点到为止）" : "💀 战斗失败……");
      if (b.kind === "spar") { p.d.hp = b.preSpar?.hp ?? p.d.hp; p.d.mp = b.preSpar?.mp ?? p.d.mp; }
      else p.d.hp = 0;
      this.commitBattleNarrative(b, false, null);
    }
    b.log.push(...log.slice(0, 20).map(l => typeof l === "string" ? l : (l.txt || "")).filter(Boolean));
    this.save();
    return { battle: b, rewards, dead: p.d.hp <= 0 && b.kind !== "spar", won: b.status === "won", spar: b.kind === "spar" };
  },

  /** 战斗结束后把过程接回剧情正文（先写本地结果，再让 AI 自然衔接） */
  commitBattleNarrative(b, won, rewards) {
    const st = this.state;
    const head = b.kind === "spar" ? "【切磋结束】" : (won ? "【战斗胜利】" : "【战斗失败】");
    const tail = b.log.slice(-5).join("；").slice(0, 150);
    const fallback = head + tail;
    const msg = { role: "assistant", content: fallback, delta: (rewards && rewards.log) || [], ts: Date.now(), wordCount: OWGRender.countWords(fallback), battleResult: true, scene: String(st.scene || "").slice(0, 80) };
    st.messages.push(msg);
    this.save();
    try { window.OWGTH && OWGTH.emit("owg_battle_ended", { kind: b.kind || "normal", won: !!won, message_id: st.messages.length - 1 }); } catch (e) { }
    this.narrateBattle(b, won, msg).catch(() => {});
  },

  /** 用 AI 把战斗结果写成剧情段落（失败时不阻断，保留本地兜底文本） */
  async narrateBattle(b, won, msg) {
    const st = this.state, p = st.player;
    if (!API.roleReady("gameplay")) return;
    const outcome = b.kind === "spar" ? (won ? "切磋获胜" : "切磋落败") : (won ? "战斗胜利" : "战斗失败");
    const logText = b.log.slice(-10).join("\n");
    const ctx = b.ctx || {};
    const allies = b.allies.map(a => `${a.name}（生命 ${Math.max(0, a.hp)}/${a.maxHp}）`).join("、");
    const enemies = b.enemies.map(e => `${e.name} Lv.${e.level}（生命 ${Math.max(0, e.hp)}/${e.maxHp}）`).join("、");
    try {
      const t = await API.chat({
        role: "gameplay",
        messages: [
          { role: "system", content: `你是剧情衔接助手。把刚刚结束的战斗（${outcome}）自然接回主线剧情：写 150-260 字，必须沿用同一地点、同一时间与天气，紧接当前场景写清战斗结果、双方状态与后续走向；战斗中的伤势、体力/魔力消耗、装备损耗都要保留；不得凭空出现武器或转移到新场景；不要重复面板数值罗列，不要标题/解释/JSON。` },
          { role: "user", content: `【角色卡】${this.activeCard()?.name || ""}\n【地点】${ctx.loc || this.locNameText()} · 【天气】${ctx.weather || ""} · 【时间】${ctx.time || this.timeText()}\n【当前场景】${ctx.scene || st.scene || ""}\n【在场人物】${(ctx.present || []).join("、")}\n【我方】${allies}\n【敌方】${enemies}\n【战斗记录】\n${logText}\n【结算】${(msg.delta || []).map(d => d.txt).join("，") || "无奖励"}` },
        ],
        temperature: st.settings.temperature, maxTokens: 700, stream: false,
      });
      let text = stripForStory(String(t || "").trim());
      const m = text.match(STATE_RE);
      if (m) text = text.replace(STATE_RE, "").trim();
      if (!text) return;
      msg.content = text;
      msg.wordCount = OWGRender.countWords(text);
      this.save();
      if (UI.tab === "story") UI.renderStory();
      UI.renderTopbar();
    } catch (e) { /* 保留本地兜底文本 */ }
  },
  /** 把战斗中的我方数值写回玩家面板（血蓝不会自动回满） */
  syncPlayerFromBattle(b) {
    const p = this.state.player;
    const me = (b.allies || []).find(a => a.isPlayer);
    if (!me || !p || !p.d) return;
    p.d.hp = clamp(Math.round(me.hp), 0, p.d.maxHp);
    p.d.mp = clamp(Math.round(me.mp != null ? me.mp : p.d.mp), 0, p.d.maxMp);
  },
  /** 战斗奖励：经验按敌方等级表；切磋只给 1/5 经验、不给其他奖励 */
  battleRewards(b) {
    const p = this.state.player;
    let exp = 0, gold = 0;
    for (const e of (b.enemies || [])) {
      exp += OWGCombat.expForLevel(e.level || p.level);
      if (b.kind !== "spar") gold += Math.max(1, Math.round((e.level || p.level) * 3));
    }
    if (b.kind === "spar") exp = Math.max(1, Math.floor(exp / 5));
    const res = this.applyDelta(b.kind === "spar" ? { exp } : { exp, gold });
    if (b.kind === "spar") res.log = res.log.filter(x => x.t === "gold");
    return res;
  },


  endBattle() {
    this.state.battle = null;
    if (UI && UI._battleSel != null) UI._battleSel = null;
    this.save();
  },

  /* ---------- 剧情插图（生图 API） ---------- */
  /** 默认生图流程：每一步都可在设置里停用/改模板/调顺序；request 固定最后且不可停用 */
  defaultImageFlow() {
    return [
      { id: "pos", name: "① 套用正向前缀", type: "pos", enabled: true, template: "{pos}, {tags}, {interaction}, {scale}" },
      { id: "clip", name: "② 取剧情片段", type: "clip", enabled: true, template: "在剧情中定位与画面最贴近的段落，作为提炼依据" },
      { id: "tags", name: "③ 提炼场景 tag", type: "tags", enabled: true, template: "把给定剧情里最有画面感的一幕转成 Stable Diffusion 风格的英文 tag。写清场景、光线、天气、环境、人物动作、男女互动、表情、构图；人物外貌与服装只写剧情明确写到的部分，不得编造。不要质量词、不要中文，逗号分隔。只输出 JSON：{\"shots\":[{\"anchor\":\"剧情原文中的一句话\",\"tags\":\"英文tags\"}]}，shots 数量为 {count}。" },
      { id: "chars", name: "④ 并入角色提示词", type: "chars", enabled: true, template: "{chars}" },
      { id: "style", name: "⑤ 追加风格词", type: "style", enabled: true, template: "" },
      { id: "neg", name: "⑥ 负向提示词", type: "neg", enabled: true, template: "{neg}" },
      { id: "request", name: "⑦ 发起生图请求", type: "request", enabled: true, locked: true, template: "" },
    ];
  },
  /** 流程归一：保留用户顺序与模板，补齐缺失步骤，request 永远最后 */
  normalizeImageFlow(saved) {
    const def = this.defaultImageFlow();
    if (!Array.isArray(saved) || !saved.length) return def.map(s => Object.assign({}, s));
    const out = [];
    saved.forEach(s => {
      if (!s || !s.id) return;
      const d = def.find(x => x.id === s.id);
      if (!d || out.some(x => x.id === d.id)) return;
      out.push({
        id: d.id, type: d.type, name: String(s.name || d.name), locked: !!d.locked,
        enabled: d.locked ? true : s.enabled !== false,
        template: typeof s.template === "string" ? s.template : d.template,
      });
    });
    def.forEach(d => { if (!out.some(x => x.id === d.id)) out.push(Object.assign({}, d)); });
    out.sort((a, b) => (a.type === "request" ? 1 : 0) - (b.type === "request" ? 1 : 0));
    return out;
  },
  imageFlow() { return this.normalizeImageFlow(this.state.settings.image.flow); },
  imageStepEnabled(id) { const s = this.imageFlow().find(x => x.id === id); return !!(s && s.enabled); },
  /** 从任意文本里抽出英文 tag（世界书式标签库是「中文标题 + 英文 tag 行」） */
  presetTagList(text, max) {
    const seen = Object.create(null), out = [];
    String(text || "").split(/[,，\n\r;；]+/).forEach(raw => {
      let s = String(raw || "").trim();
      s = s.replace(/^[#>*\-\d.、)）\s]+/, "").replace(/^\{+|\}+$/g, "").trim();
      if (!s || s.length > 48) return;
      if (/[\u4e00-\u9fa5]/.test(s)) return;
      if (!/[a-z]/i.test(s)) return;
      if (/^(prompt|tags?|image|regex|size|uc|centers|scene_composition|character_\d+)$/i.test(s)) return;
      const k = s.toLowerCase().replace(/\s+/g, " ");
      if (seen[k]) return;
      seen[k] = 1; out.push(s);
      if (out.length >= (max || 80)) return;
    });
    return out.join(", ");
  },
  /** 世界书式条目：中文小标题 + 英文 tag 行 → 可套用模板 */
  presetTemplatesFromContent(content, entryName) {
    const out = [];
    let group = "", title = "", buf = [];
    const flush = () => {
      const tags = this.presetTagList(buf.join(", "), 200);
      buf = [];
      if (tags) out.push({ name: (title || group || entryName || "模板").slice(0, 40), tags: tags, group: group.slice(0, 40) });
    };
    String(content || "").split(/\r?\n/).forEach(raw => {
      let line = String(raw || "").trim();
      if (!line) return;
      if (/^#+\s*/.test(line)) { flush(); group = line.replace(/^#+\s*/, "").trim(); title = ""; return; }
      const cjk = /[\u4e00-\u9fa5]/.test(line);
      const latin = /[a-z]/i.test(line);
      if (!latin) {
        if (cjk && line.length <= 40) { flush(); title = line.replace(/^[-*]\s*/, "").trim(); }
        return;
      }
      if (cjk) {
        // 中文说明混英文：单独成一条，不与上下英文行合并
        flush();
        const tags = this.presetTagList(line, 120);
        if (tags) out.push({ name: (title || group || entryName || "模板").slice(0, 40), tags: tags, group: group.slice(0, 40) });
        return;
      }
      buf.push(line);
    });
    flush();
    return out;
  },
  presetTemplateKind(text) {
    const s = String(text || "");
    if (/界面|UI|hud|status screen|game ui/i.test(s)) return "general";
    if (/角色|同人|人物/.test(s)) return "character";
    if (/服装|服饰|穿着|汉服|和服|紧身衣|内衣|圣诞|女仆|泳装|校服|丝袜/.test(s)) return "clothing";
    if (/场景|背景|构图|时间|地点|室内|室外|公共|自然|人造|天气|镜头|视角/.test(s)) return "scene";
    return "general";
  },
  /** 标准扁平预设：pos/neg + 采样参数 + 角色/场景模板 */
  normalizeFlatImagePreset(j, nameHint) {
    const src = (j && typeof j === "object" && !Array.isArray(j)) ? j : {};
    const nested = (o) => (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
    const layers = [nested(src.params), nested(src.parameters), nested(src.settings), nested(src.preset), src];
    const pick = (...ks) => {
      for (const o of layers) for (const k of ks) if (o && o[k] != null && o[k] !== "") return o[k];
      return "";
    };
    const pos = String(pick("pos", "positive", "prompt", "positive_prompt") || "").trim();
    const neg = String(pick("neg", "negative", "negative_prompt", "uc") || "").trim();
    const styleRaw = pick("style", "style_prompt", "style_tags", "styles");
    const style = Array.isArray(styleRaw) ? styleRaw.map(String).filter(Boolean).join(", ") : String(styleRaw || "").trim();
    const model = String(pick("model", "model_name", "checkpoint", "ckpt") || "").trim();
    const sampler = String(pick("sampler", "sampler_name", "samplerName") || "").trim();
    const steps = parseInt(pick("steps", "step", "steps_count"), 10);
    const scale = parseFloat(pick("scale", "cfg", "cfg_scale", "guidance", "guidance_scale"));
    let width = parseInt(pick("width", "w"), 10), height = parseInt(pick("height", "h"), 10);
    if (!(width > 0 && height > 0)) {
      const size = String(pick("size", "resolution", "image_size") || "");
      const m = size.match(/(\d{3,4})\s*[x×*]\s*(\d{3,4})/i);
      if (m) { width = +m[1]; height = +m[2]; }
    }
    const templates = [];
    const rawTpl = pick("templates", "scene_templates", "scenes", "tag_templates");
    if (Array.isArray(rawTpl)) rawTpl.forEach(x => {
      if (!x) return;
      if (typeof x === "string") { const tags = this.presetTagList(x, 120); if (tags) templates.push({ name: "模板", tags: tags }); return; }
      const name = String(x.name || x.title || "模板").slice(0, 40);
      const tags = Array.isArray(x.tags) ? x.tags.join(", ") : String(x.tags || x.prompt || x.content || "").trim();
      if (tags) templates.push({ name, tags, kind: this.presetTemplateKind(name + " " + tags) });
    });
    const characters = [];
    const rawChars = pick("characters", "character_prompts", "character_tags");
    if (Array.isArray(rawChars)) rawChars.forEach(x => {
      if (!x || typeof x !== "object" || !(x.name || x.prompt)) return;
      characters.push({
        id: "cp" + Math.random().toString(36).slice(2, 8),
        name: String(x.name || "未命名").slice(0, 40),
        aliases: Array.isArray(x.aliases) ? x.aliases.map(String) : String(x.aliases || "").split(/[,，、]/).filter(Boolean),
        prompt: String(x.prompt || x.tags || "").trim(),
        negative: String(x.negative || x.uc || "").trim(),
      });
    });
    const stepTemplates = {};
    const flowSrc = pick("flow", "steps_template", "step_templates");
    if (flowSrc && typeof flowSrc === "object" && !Array.isArray(flowSrc)) {
      ["clip", "tags", "pos", "chars", "style", "neg"].forEach(k => {
        if (typeof flowSrc[k] === "string" && flowSrc[k].trim()) stepTemplates[k] = flowSrc[k];
      });
    }
    const miss = [];
    if (!pos) miss.push("正向提示词（pos / positive / prompt）");
    if (!neg) miss.push("负向提示词（neg / negative / negative_prompt）");
    if (!pos && !neg && !characters.length && !templates.length) return { ok: false, error: "缺少字段：" + (miss.join("、") || "正向/负向提示词") };
    return {
      ok: true, preset: {
        id: "ip" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: String(nameHint || pick("name", "preset_name") || "导入预设").slice(0, 40),
        format: "flat",
        pos: pos || "",
        neg: neg || "",
        style,
        model,
        sampler,
        steps: Number.isFinite(steps) && steps > 0 ? clamp(steps, 1, 100) : 0,
        scale: Number.isFinite(scale) && scale > 0 ? clamp(scale, 0.1, 30) : 0,
        width: Number.isFinite(width) && width >= 64 ? width : 0,
        height: Number.isFinite(height) && height >= 64 ? height : 0,
        characters, templates, stepTemplates,
        missing: miss,
        importedAt: Date.now(),
      },
    };
  },
  /** 世界书 / SillyTavern 预设：{entries:[{name,content,enabled,role,...}]} → 设置 + 流程模板 */
  normalizeWorldInfoImagePreset(key, obj, nameHint) {
    const entries = (obj && Array.isArray(obj.entries)) ? obj.entries.filter(e => e && typeof e === "object" && e.content != null) : [];
    if (!entries.length) return null;
    const nameOf = e => String(e.name || "").trim();
    const find = (re) => entries.find(e => re.test(nameOf(e))) || null;
    const contentOf = (re) => { const e = find(re); return e ? String(e.content || "").trim() : ""; };
    const exact = (n) => { const e = entries.find(x => nameOf(x) === n); return e ? String(e.content || "").trim() : ""; };
    const ruleNames = ["年龄盾", "身份与绝对红线", "【勿动】系统", "插入机制", "【勿动】图片限制", "【勿动】一致性与Tag总数", "【勿动】Tag优化", "【NAI】Tag构成规则", "【NAI】格式模板", "最终输出模板"];
    const positiveInstr = ruleNames.map(exact).filter(Boolean).join("\n\n");
    const clipInstr = exact("插入机制") || "在剧情中定位与画面最贴近的段落，作为提炼依据";
    const sizeText = exact("分辨率选择") || contentOf(/分辨率/);
    const sizeMatches = [...sizeText.matchAll(/(\d{3,4})\s*[x×*]\s*(\d{3,4})/gi)]
      .map(m => ({ w: +m[1], h: +m[2] })).filter(s => s.w >= 64 && s.h >= 64);
    const width = sizeMatches.length ? sizeMatches[0].w : 0;
    const height = sizeMatches.length ? sizeMatches[0].h : 0;
    const isComfy = /comfy/i.test(key);
    // 游戏生图接口目前只支持 NAI / OpenAI 兼容；ComfyUI 预设只取流程与模板，不把 "comfyui" 写进 NAI model
    const model = /nai/i.test(key) ? "nai-diffusion-4-full" : "";
    const templates = [];
    entries.forEach(e => {
      const n = nameOf(e);
      if (!n || /^[-#/]/.test(n)) return;
      if (/^(阿撒托斯之梦|年龄盾|身份与绝对红线|【勿动】|【NAI】|插入机制|分辨率选择|最终输出模板|任务提问|任务确认|----)/.test(n)) return;
      const kind = this.presetTemplateKind(n);
      const list = this.presetTemplatesFromContent(e.content, n);
      list.forEach(t => { if (templates.length < 1200) templates.push(Object.assign({ kind }, t)); });
    });
    const explicitPos = contentOf(/正向提示词|positive.?prompt/i);
    const explicitNeg = contentOf(/负向提示词|negative.?prompt|负面提示词/i);
    const missing = [];
    if (!explicitPos) missing.push("正向提示词字段（已把系统/Tag 规则映射到「③ 提炼场景 tag」）");
    if (!explicitNeg) missing.push("负向提示词字段（已保留当前负向前缀）");
    if (!sizeMatches.length) missing.push("尺寸字段");
    if (isComfy && !model) missing.push("ComfyUI 模型（当前接口不支持，未写入 model）");
    missing.push("采样器/步数/scale（世界书预设未提供，沿用当前设置）");
    const isV2 = /image###/.test(positiveInstr);
    const outInstr = isV2
      ? "【本游戏的输出要求】严格按上面的规则输出，共 {count} 张，分布在不同段落。每张图格式：\n<image>\nregex:本轮剧情里的原句（逐字复制，用于定位插图位置）\n<font color=\"steelblue\">5-15字中文标题</font>\n<Tag_think>60-100字画面概括：只写画面里看得见的东西——在场角色、动作、接触点、场景、光影</Tag_think>\nimage###Scene Composition:(场景/背景/光影/构图 英文tag);Character 1 Prompt:(该角色外观+服装+当前动作+当前表情 英文tag)|centers:C3;Character 1 UC:(该角色需要排除的tag);###\n</image>\n硬性要求：单图只取同一瞬间的一个动作（不要连续动作）；角色只写本轮剧情里实际在场的人；只输出英文 tag，不输出词库条目原文；每张图的英文 tag 总数控制在 25-40 条。"
      : "【本游戏的输出要求】按上面的规则输出 <images><image>…</image></images>；每张图包含 <regex>剧情原句</regex>、<size>宽x高</size>、<scene_composition>英文tag</scene_composition>，每个角色一个 <character_1>…<prompt>英文tag</prompt><uc>英文负面tag</uc></character_1>。共 {count} 张，分布在不同段落。";
    const stepTemplates = {
      clip: clipInstr,
      tags: [
        positiveInstr,
        outInstr,
      ].filter(Boolean).join("\n\n").slice(0, 12000),
      pos: "{pos}, {tags}, {interaction}, {scale}",
      chars: "{chars}",
      style: "",
      neg: "{neg}",
    };
    return {
      id: "ip" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: String(nameHint ? (key + " · " + nameHint) : (key || "世界书预设")).slice(0, 60),
      format: "worldinfo",
      pos: explicitPos || "",
      neg: explicitNeg || "",
      style: "",
      model,
      sampler: "", steps: 0, scale: 0,
      width, height,
      characters: [],
      templates,
      stepTemplates,
      entryCount: entries.length,
      usedEntries: entries.filter(e => /身份|系统|红线|法则|梦境|年龄盾|插入机制|一致性与Tag总数|Tag优化|Tag构成规则|格式模板|最终输出模板|图片限制/.test(nameOf(e))).map(e => nameOf(e)),
      missing,
      importedAt: Date.now(),
    };
  },
  /** 解析一份或多份预设；世界书多预设（NAI/ComfyUI）会拆成多条 */
  parseImagePresets(text, nameHint) {
    let j = null;
    try { j = typeof text === "string" ? JSON.parse(text) : text; } catch (e) { return { ok: false, error: "JSON 解析失败：" + e.message }; }
    if (!j || typeof j !== "object") return { ok: false, error: "顶层必须是 JSON 对象或数组" };
    const out = [], warnings = [];
    if (Array.isArray(j)) {
      j.forEach((x, i) => { const r = this.normalizeFlatImagePreset(x, (nameHint || "导入预设") + " " + (i + 1)); if (r.ok) out.push(r.preset); else warnings.push(r.error); });
    } else if (Array.isArray(j.entries)) {
      const p = this.normalizeWorldInfoImagePreset(nameHint || "世界书预设", j, nameHint);
      if (p) out.push(p);
    } else if (Array.isArray(j.presets)) {
      j.presets.forEach((x, i) => { const r = this.normalizeFlatImagePreset(x, (nameHint || "导入预设") + " " + (i + 1)); if (r.ok) out.push(r.preset); else warnings.push(r.error); });
    } else {
      const wiKeys = Object.keys(j).filter(k => j[k] && typeof j[k] === "object" && Array.isArray(j[k].entries));
      if (wiKeys.length) {
        wiKeys.forEach(k => { const p = this.normalizeWorldInfoImagePreset(k, j[k], nameHint || ""); if (p) out.push(p); });
      } else {
        const r = this.normalizeFlatImagePreset(j, nameHint);
        if (r.ok) out.push(r.preset); else return { ok: false, error: r.error };
      }
    }
    if (!out.length) return { ok: false, error: "未识别到可用内容：" + (warnings.join("；") || "需要正向/负向提示词，或 entries 世界书条目") };
    return { ok: true, presets: out, warnings };
  },
  /** 兼容旧调用：只取第一份 */
  parseImagePreset(text, nameHint) {
    const r = this.parseImagePresets(text, nameHint);
    if (!r.ok) return r;
    return { ok: true, preset: r.presets[0], warnings: r.warnings };
  },
  applyImagePreset(id) {
    const img = this.state.settings.image;
    const p = (img.presets || []).find(x => x.id === id);
    if (!p) return false;
    if (p.pos) img.pos = p.pos;
    if (p.neg) img.neg = p.neg;
    if (p.model) img.model = p.model;
    if (p.steps) img.steps = p.steps;
    if (p.scale) img.scale = p.scale;
    if (p.width && p.height) { img.width = p.width; img.height = p.height; }
    if (p.sampler) img.sampler = p.sampler;
    let flow = this.imageFlow();
    if (p.stepTemplates && typeof p.stepTemplates === "object") {
      ["clip", "tags", "pos", "chars", "style", "neg"].forEach(k => {
        const v = p.stepTemplates[k];
        if (typeof v !== "string" || !v.trim()) return;
        const st = flow.find(s => s.id === k);
        if (st) { st.template = v; st.enabled = true; }
      });
    }
    if (p.style) {
      const st = flow.find(s => s.id === "style");
      if (st) { st.template = [st.template, p.style].filter(Boolean).join(", "); st.enabled = true; }
    }
    img.flow = flow;
    if (Array.isArray(p.characters) && p.characters.length) {
      p.characters.forEach(c => {
        if (!c || !c.name || !c.prompt) return;
        const rec = {
          id: c.id || ("cp" + Math.random().toString(36).slice(2, 8)),
          name: String(c.name).slice(0, 40),
          aliases: Array.isArray(c.aliases) ? c.aliases.map(String).filter(Boolean) : [],
          prompt: String(c.prompt || ""), negative: String(c.negative || ""),
        };
        img.characters = (img.characters || []).filter(x => x.name !== rec.name);
        img.characters.push(rec);
      });
    }
    this.save();
    return true;
  },
  /** 把预设里的角色/场景模板套到流程或角色登记 */
  applyPresetTemplate(id, index, mode) {
    const img = this.state.settings.image;
    const p = (img.presets || []).find(x => x.id === id);
    const t = p && Array.isArray(p.templates) ? p.templates[index] : null;
    if (!t || !t.tags) return false;
    if (mode === "character") {
      const rec = {
        id: "cp" + Math.random().toString(36).slice(2, 8),
        name: String(t.name || "模板角色").slice(0, 40),
        aliases: [], prompt: String(t.tags), negative: "",
      };
      img.characters = (img.characters || []).filter(x => x.name !== rec.name);
      img.characters.push(rec);
    } else {
      const flow = this.imageFlow();
      const st = flow.find(s => s.id === "style");
      if (st) { st.template = [st.template, t.tags].filter(Boolean).join(", "); st.enabled = true; }
      img.flow = flow;
    }
    this.save();
    return true;
  },
  /** 中文提示词转英文：自动配图只在独立玩法模型下额外请求；手动生图才允许主模型翻译 */
  async imgEnglish(text, allowMain) {
    const s = String(text || "");
    if (!/[\u4e00-\u9fa5]/.test(s)) return s;
    if (API.effect("gameplay").using === "gameplay") {
      const r = await API.ensureEnglish(s, "gameplay").catch(() => "");
      if (r && !/[\u4e00-\u9fa5]/.test(r)) return r;
    } else if (allowMain) {
      // 手动「立即生图」允许用主模型翻译一次；自动配图不额外打主模型（发送只有一次主请求）
      const r = await API.ensureEnglish(s, "main").catch(() => "");
      if (r && !/[\u4e00-\u9fa5]/.test(r)) return r;
    }
    return OWGEn.englishOnly(s);
  },
  /** 按段落切剧情；段落太少时按空行/换行/句号逐级降级 */
  splitStoryParagraphs(storyText) {
    const text = String(storyText || "");
    let parts = text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) parts = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) {
      const sents = text.split(/(?<=[。！？!?])/).map(s => s.trim()).filter(Boolean);
      parts = [];
      for (let i = 0; i < sents.length; i += 2) parts.push(sents.slice(i, i + 2).join(""));
    }
    return parts.filter(p => OWGRender.countWords(p) >= 6);
  },
  /** 选 N 个落点：均匀分布的基础上优先挑画面词更多的段落 */
  pickStoryAnchors(paras, count) {
    const VIS = ["雨", "雪", "风", "夜", "灯", "光", "火", "血", "门", "窗", "街", "巷", "城", "山", "海", "林", "花", "月", "剑", "枪", "刀", "马", "船", "桥", "桌", "床", "吻", "抱", "拥", "握", "眼", "泪", "笑", "哭", "裙", "发", "手", "脸", "肩", "背", "冲", "跑", "站", "坐", "跪", "碎", "裂", "燃", "爆"];
    const score = p => VIS.reduce((n, w) => n + (p.indexOf(w) >= 0 ? 1 : 0), 0) + Math.min(6, OWGRender.countWords(p) / 40);
    const n = Math.max(1, Math.min(paras.length || 1, count));
    const picked = [];
    for (let i = 0; i < n && paras.length; i++) {
      const center = Math.round((i + 0.5) * paras.length / n) - 1;
      const span = Math.max(1, Math.floor(paras.length / (n * 2)));
      let best = -1, bestScore = -1;
      for (let k = center - span; k <= center + span; k++) {
        const j = Math.max(0, Math.min(paras.length - 1, k));
        if (picked.indexOf(j) >= 0) continue;
        const sc = score(paras[j]) - Math.abs(j - center) * 0.8;
        if (sc > bestScore) { bestScore = sc; best = j; }
      }
      if (best < 0) { for (let j = 0; j < paras.length; j++) if (picked.indexOf(j) < 0) { best = j; break; } }
      if (best >= 0) picked.push(best);
    }
    return picked.sort((a, b) => a - b);
  },
  /** 角色登记命中：名字/别名出现在片段里就并入提示词；按登记顺序拼接，保证多轮逐字稳定 */
  matchCharPrompts(clip) {
    const list = this.state.settings.image.characters || [];
    const names = [], prompts = [];
    let negative = "";
    list.forEach(c => {
      if (!c) return;
      const all = [c.name].concat(Array.isArray(c.aliases) ? c.aliases : []).filter(Boolean).map(String);
      if (!all.some(n => n && clip.indexOf(n) >= 0)) return;
      names.push(c.name || all[0]);
      if (c.prompt) prompts.push(String(c.prompt).trim());
      if (c.negative) negative = [negative, String(c.negative).trim()].filter(Boolean).join(", ");
    });
    return { names, prompt: prompts.join(", "), negative };
  },
  /** 去掉 v2 / 模板残留：image###、centers:、$占位$、中文占位词，避免拼进生图 prompt 变成乱码 */
  sanitizeImageTags(s) {
    return String(s || "")
      .replace(/image###|###/g, " ")
      .replace(/\|?\s*centers\s*:[^;]*/gi, " ")
      .replace(/\$[^$]*\$/g, " ")
      .split(",").map(x => x.trim())
      .filter(x => x && !/^(通用|背景|构图|当前坐标|当前动作|当前表情|路人屏蔽|多角色屏蔽|动态排除)$/i.test(x))
      .filter(x => !/[\u4e00-\u9fa5]/.test(x))
      .join(", ");
  },
  /** 控制 tag 密度：按整条 tag 截断，绝不切半条；默认 40 条 / 460 字符 */
  limitImageTags(text, maxTags, maxChars) {
    const arr = String(text || "").split(",").map(s => s.trim()).filter(Boolean);
    const out = [], seen = Object.create(null);
    const mt = maxTags || 40, mc = maxChars || 460;
    for (const raw of arr) {
      // 对齐 st-chatu8 的 stripChineseAnnotations：先剥掉（中文注释），再去掉残留中文的 tag，纯标点丢弃
      const t = raw.replace(/（[^）]*）/g, "").replace(/\([^)]*[\u4e00-\u9fa5][^)]*\)/g, "").trim();
      if (!t || !/[a-z0-9]/i.test(t) || /[\u4e00-\u9fa5]/.test(t)) continue;
      const k = t.toLowerCase();
      if (seen[k]) continue;
      seen[k] = 1;
      if (out.length >= mt) break;
      if (out.join(", ").length + t.length + 2 > mc) break;
      out.push(t);
    }
    return out.join(", ");
  },
  /** 从 <image> 块里取锚点：<regex> 标签优先，其次 regex: 行 */
  imageAnchorOf(block) {
    const b = String(block || "");
    const t = (/<regex\b[^>]*>([\s\S]*?)<\/regex>/i.exec(b) || [])[1];
    const line = (/(?:^|\n)\s*regex\s*[：:]\s*([^\n<]+)/i.exec(b) || [])[1];
    return String(t || line || "").trim().replace(/^["'“”]+|["'“”]+$/g, "").replace(/<[^>]+>/g, "").trim().slice(0, 60);
  },
  /** 解析模型返回：JSON shots / 世界书 XML / 新版 v2 image###（Scene Composition + Character N Prompt/UC） */
  parseImageShots(text, n) {
    const raw = String(text || "");
    const j = extractJSON(raw);
    if (j && Array.isArray(j.shots) && j.shots.length) {
      return j.shots.filter(x => x && x.tags).slice(0, n).map(x => ({
        anchor: String(x.anchor || "").trim().slice(0, 60),
        tags: this.sanitizeImageTags(x.tags),
        neg: this.sanitizeImageTags(x.neg || x.uc || ""),
        width: parseInt(x.width, 10) || 0, height: parseInt(x.height, 10) || 0,
      }));
    }
    const shots = [];
    const blocks = [...raw.matchAll(/<image\b[^>]*>([\s\S]*?)<\/image>/gi)].map(m => m[1]);
    // 模型偶尔漏写 <image> 包裹，裸 image### 也要能解析
    if (!blocks.length) [...raw.matchAll(/image###[\s\S]*?###/gi)].forEach(m => blocks.push(m[0]));
    blocks.forEach(b => {
      const v2 = /image###([\s\S]*?)###/i.exec(b);
      if (v2) {
        const body = v2[1];
        const scene = (/Scene\s*Composition\s*:\s*\(([\s\S]*?)\)\s*;/i.exec(body) || [])[1] || "";
        const chars = [], ucs = [];
        let cm;
        const chRe = /Character\s*\d+\s*Prompt\s*:\s*\(([\s\S]*?)\)\s*(?:\|\s*centers\s*:\s*[^;]*)?;/gi;
        while ((cm = chRe.exec(body))) { const v = this.sanitizeImageTags(cm[1]); if (v) chars.push(v); }
        const ucRe = /Character\s*\d+\s*UC\s*:\s*\(([\s\S]*?)\)\s*;?/gi;
        while ((cm = ucRe.exec(body))) { const v = this.sanitizeImageTags(cm[1]); if (v) ucs.push(v); }
        const tags = this.sanitizeImageTags([scene].concat(chars).filter(Boolean).join(", "));
        if (!tags) return;
        const size = (/<size\b[^>]*>([\s\S]*?)<\/size>/i.exec(b) || [])[1] || "";
        let width = 0, height = 0;
        const sm = String(size).match(/(\d{3,4})\s*[x×*]\s*(\d{3,4})/i);
        if (sm) { width = +sm[1]; height = +sm[2]; }
        shots.push({ anchor: this.imageAnchorOf(b), tags, neg: ucs.join(", "), width, height });
        return;
      }
      const tag = (name) => {
        const r = new RegExp("<" + name + "\\b[^>]*>([\\s\\S]*?)<\\/" + name + ">", "i").exec(b);
        return r ? String(r[1] || "").trim() : "";
      };
      const anchor = this.imageAnchorOf(b);
      const size = tag("size");
      let width = 0, height = 0;
      const sm = size.match(/(\d{3,4})\s*[x×*]\s*(\d{3,4})/i);
      if (sm) { width = +sm[1]; height = +sm[2]; }
      const scene = tag("scene_composition");
      const chars = [], ucs = [];
      const chrRe = /<character_(\d+)\b[^>]*>([\s\S]*?)<\/character_\1>/gi;
      let cm;
      while ((cm = chrRe.exec(b))) {
        const cb = cm[2];
        const p = (/<prompt\b[^>]*>([\s\S]*?)<\/prompt>/i.exec(cb) || [])[1] || "";
        const uc = (/<uc\b[^>]*>([\s\S]*?)<\/uc>/i.exec(cb) || [])[1] || "";
        const pv = this.sanitizeImageTags(p), uv = this.sanitizeImageTags(uc);
        if (pv) chars.push(pv);
        if (uv) ucs.push(uv);
      }
      const tags = this.sanitizeImageTags([scene].concat(chars).filter(Boolean).join(", "));
      if (!tags) return;
      shots.push({ anchor, tags, neg: ucs.join(", "), width, height });
    });
    return shots.slice(0, n);
  },
  /** 所有图共用一次玩法模型调用：返回 N 个 {anchor, tags, neg, width, height}；失败/未配玩法模型则按段落退化 */
  async buildImageShots(storyText, scene, count, allowMainTranslate) {
    const n = clamp(Math.round(+count) || 1, 1, 6);
    const story = String(storyText || "");
    const sc = String(scene != null ? scene : (this.state.scene || ""));
    const paras = this.splitStoryParagraphs(story);
    let shots = [];
    // 本轮剧情里实际出现的已登记角色：作为“可用角色外观”提示给玩法模型，保证角色跟着剧情走且前后一致
    const hinted = this.matchCharPrompts(story + "\n" + sc);
    const charHint = String((hinted && hinted.prompt) || "");
    const charNames = String((hinted && hinted.names && hinted.names.join(", ")) || "");
    if (this.imageStepEnabled("tags") && API.effect("gameplay").using === "gameplay") {
      const step = this.imageFlow().find(s => s.id === "tags");
      const sys = String(step && step.template || "")
        .replace(/\{count\}/g, String(n)).replace(/\{story\}/g, story.slice(0, 2400))
        .replace(/\{scene\}/g, sc).replace(/\{tags\}/g, "").replace(/\{chars\}/g, charHint)
        .replace(/\{names\}/g, charNames).replace(/\{pos\}/g, "").replace(/\{neg\}/g, "");
      try {
        const t = await API.chat({
          role: "gameplay",
          messages: [
            { role: "system", content: sys },
            { role: "user", content: "场景：" + sc
              + (charHint ? "\n可用角色外观（沿用，保持角色一致）：" + charHint : "")
              + "\n剧情：" + story.slice(0, 2400) },
          ],
          temperature: 0.5, maxTokens: 700 * n, stream: false,
        });
        shots = this.parseImageShots(t, n);
      } catch (e) { shots = []; }
    }
    if (!shots.length) {
      const idxs = this.pickStoryAnchors(paras, n);
      shots = (idxs.length ? idxs.map(i => ({ anchor: String(paras[i] || "").slice(0, 40), tags: "" })) : [{ anchor: "", tags: "" }]);
    }
    // 锚点必须是正文里真实存在的句子，否则该图退化为末尾
    shots.forEach(s => { if (s.anchor && story.indexOf(s.anchor.slice(0, 20)) < 0) s.anchor = ""; });
    const out = [];
    for (const s of shots) {
      const clip = s.anchor ? (paras.find(p => p.indexOf(s.anchor.slice(0, 20)) >= 0) || s.anchor) : String(paras[0] || story.slice(0, 300));
      const mood = OWGIntim.analyze(clip + "\n" + sc);
      const chars = this.matchCharPrompts(clip + "\n" + story);
      if (chars && chars.prompt) chars.prompt = this.limitImageTags(chars.prompt, 20, 160);
      // 玩法模型没给 tag（解析不到 / 未配玩法模型）时，改用本轮原句翻译成英文，避免正向词只剩固定模板
      const rawTags = String(s.tags || "").trim();
      const tags = this.limitImageTags(await this.imgEnglish(rawTags ? (rawTags + ", " + sc) : clip, rawTags ? !!allowMainTranslate : true));
      const part = { tags, chars, mood, neg: s.neg || "", width: s.width || 0, height: s.height || 0 };
      if (!tags) {
        // 不静默：提炼不到场景 tag 时留痕（日志页可见），提示词只剩固定前缀与角色外观
        try { OWGLog.add("提示词", "本轮没提炼到场景 tag，已用兜底提示词", String(clip).slice(0, 160)); } catch (e0) { }
      }
      out.push({
        prompt: this.assembleImagePrompt(part),
        neg: this.assembleNegative(part),
        width: s.width || 0, height: s.height || 0,
        mood: { level: mood.level, evidence: mood.evidence, interaction: mood.interaction, scale: mood.scale },
        anchor: s.anchor, clip, chars,
      });
    }
    return out;
  },
  /** 按流程顺序拼正向词；停用的步骤跳过，request/clip/neg 不进入正向词 */
  assembleImagePrompt(part) {
    const img = this.state.settings.image;
    const vars = {
      tags: String(part.tags || ""),
      chars: String((part.chars && part.chars.prompt) || ""),
      names: String((part.chars && part.chars.names && part.chars.names.join(", ")) || ""),
      pos: String(img.pos || ""),
      interaction: String((part.mood && part.mood.interaction) || ""),
      scale: String((part.mood && part.mood.scale) || ""),
    };
    const chunks = [];
    this.imageFlow().forEach(s => {
      // tags 步是「让玩法模型提炼 tag」的指令，不进正向词；clip/neg/request 同理
      if (!s.enabled || s.type === "clip" || s.type === "tags" || s.type === "neg" || s.type === "request") return;
      let t = String(s.template || "");
      Object.keys(vars).forEach(k => { t = t.split("{" + k + "}").join(vars[k]); });
      if (s.type === "chars" && !String(s.template || "").trim()) t = vars.chars;
      if (s.type === "pos" && !String(s.template || "").trim()) t = [vars.pos, vars.tags, vars.interaction, vars.scale].filter(Boolean).join(", ");
      t = OWGEn.englishOnly(t);
      if (t) chunks.push(t);
    });
    // 兜底：任何步骤都没写 {tags} 时，把剧情提炼出的场景/角色 tag 追加进正向词
    if (vars.tags && chunks.join(", ").indexOf(vars.tags) < 0) chunks.push(vars.tags);
    // 参考实现（st-chatu8）的质量预设 AQT 常驻在正向词末尾
    const aqt = OWGEn.englishOnly(String(img.qualityTags == null ? "best quality, amazing quality, very aesthetic, absurdres" : img.qualityTags));
    if (aqt && chunks.join(", ").toLowerCase().indexOf(aqt.toLowerCase()) < 0) chunks.push(aqt);
    if (!chunks.length) chunks.push(vars.pos);
    return chunks.join(", ");
  },
  /** 负向词：neg 步启用则用其模板；角色登记里的负向补充一并并入 */
  assembleNegative(part) {
    const img = this.state.settings.image;
    const step = this.imageFlow().find(s => s.id === "neg");
    let neg = "";
    if (step && step.enabled) neg = String(step.template || "").trim() ? String(step.template).split("{neg}").join(img.neg || "") : String(img.neg || "");
    const extra = [String((part && part.chars && part.chars.negative) || ""), String((part && part.neg) || "")].filter(Boolean).join(", ");
    if (extra) neg = [neg, extra].filter(Boolean).join(", ");
    const seen = Object.create(null);
    return OWGEn.englishOnly(neg).split(",").map(s => s.trim())
      .filter(s => s && !seen[s.toLowerCase()] && (seen[s.toLowerCase()] = 1)).join(", ");
  },
  /** 兼容旧调用：单张提示词（已按流程拼好，含正向前缀/互动/尺度/角色词） */
  async buildImagePrompt(storyText, sceneOverride) {
    const img = this.state.settings.image;
    if (!img.enabled || !img.url || !img.key) return "";
    const shots = await this.buildImageShots(storyText, sceneOverride != null ? sceneOverride : this.state.scene, 1, true);
    const s0 = shots[0];
    if (!s0 || !s0.prompt) return "";
    return { prompt: s0.prompt, neg: s0.neg, mood: s0.mood, anchor: s0.anchor, names: s0.chars ? s0.chars.names : [] };
  },

  /** 真正调用生图：去重/限长（不切半 tag）→ 记录日志 → 请求 → 入图库 */
  async finishImage(prompt, storyText, meta) {
    const st = this.state;
    const img = st.settings.image;
    if (prompt && typeof prompt === "object") { meta = prompt; prompt = meta.prompt; }
    if (!img.enabled || !img.url || !img.key) return null;
    if (!String(prompt == null ? "" : prompt).trim()) {
      // 不静默：让调用方把原因写进图位的错误提示
      return { err: new Error("提示词为空（正向词步骤没有产出内容）"), empty: true };
    }
    const mood = (meta && meta.mood) || { level: "日常", evidence: "", interaction: "", scale: "" };
    const neg = OWGEn.englishOnly((meta && meta.neg) || img.neg || "");
    const seen = Object.create(null);
    let finalPrompt = OWGEn.englishOnly(String(prompt));
    // 超长时在最后一个完整 tag 处截断，绝不切半条 tag
    if (finalPrompt.length > 1000) {
      const cut = finalPrompt.lastIndexOf(",", 1000);
      finalPrompt = cut > 0 ? finalPrompt.slice(0, cut) : finalPrompt.slice(0, 1000);
    }
    finalPrompt = finalPrompt.split(",").map(s => s.trim().replace(/（[^）]*）/g, "").replace(/\([^)]*[\u4e00-\u9fa5][^)]*\)/g, "").trim())
      .filter(s => s && /[a-z0-9]/i.test(s) && !/[\u4e00-\u9fa5]/.test(s))
      .filter(s => !seen[s.toLowerCase()] && (seen[s.toLowerCase()] = 1)).join(", ");
    if (!finalPrompt) {
      try { OWGLog.add("请求", "生图提示词为空，已阻止发送", "原始正向词：" + String(prompt).slice(0, 200)); } catch (e0) { }
      return { err: new Error("提示词为空（正向词里只有中文或已被英文过滤）"), empty: true };
    }
    try {
      API.logImagePrompt({
        prompt: finalPrompt, level: mood.level || "日常", evidence: mood.evidence || "",
        names: (meta && Array.isArray(meta.names)) ? meta.names : [],
        interaction: mood.interaction || "", scale: mood.scale || "",
      });
    } catch (e) { }
    const data = await API.generateImage({
      prompt: finalPrompt, neg: neg,
      width: (meta && meta.width) || 0, height: (meta && meta.height) || 0,
    });
    let rec = null;
    if (data) {
      rec = await this.galleryAdd(data, finalPrompt);
      try { this.save(); } catch (e) { }
    }
    return { data: data, rec: rec };
  },

  /** 生成本轮剧情插图（失败只影响插图，不影响剧情） */
  async generateStoryImage(storyText) {
    const prompt = await this.buildImagePrompt(storyText);
    if (!prompt) return null;
    return this.finishImage(prompt, storyText);
  },
  /* ---------- 后台生图队列 ---------- */
  newMsgId() { return "m" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8); },
  findMessageById(msgId) { return (this.state.messages || []).find(m => m && m.id === msgId) || null; },
  /** 只保留最近 12 张正文插图，避免存档无限膨胀 */
  trimMessageImages() {
    let kept = 0;
    const list = this.state.messages || [];
    for (let i = list.length - 1; i >= 0; i--) {
      if (list[i] && list[i].image) { kept++; if (kept > 12) delete list[i].image; }
      // 多图只保留引用；base64 兜底数据同样只留最近 12 张
      if (list[i] && Array.isArray(list[i].imageList)) {
        list[i].imageList.forEach(s => { if (s && s.data) { kept++; if (kept > 12) delete s.data; } });
      }
    }
  },
  /** 入队剧情插图：count>1 时一次为整条消息规划多张；slotIndex 用于单张重试 */
  enqueueStoryImage(msgId, storyText, scene, cardId, count, slotIndex, anchor) {
    const st = this.state;
    const img = st.settings.image;
    if (!img || !img.enabled || !img.url || !img.key) return;
    const m = this.findMessageById(String(msgId));
    if (!m) return;
    if (slotIndex == null) {
      m.imageState = "pending";
      delete m.imageError;
      m.imageList = [];
    }
    this.save();
    try { UI.patchMessageImage(m.id); } catch (e) { }
    this.imageQueue.push({
      msgId: String(msgId),
      storyText: String(storyText || ""),
      scene: String(scene != null ? scene : (st.scene || "")),
      cardId: cardId || null,
      count: clamp(Math.round(+count) || 1, 1, 6),
      slotIndex: slotIndex == null ? null : slotIndex,
      anchor: String(anchor || ""),
      state: st,
    });
    this.pumpImageQueue();
  },
  /** 顺序处理：一次任务内可连续生成多张，仍不阻塞发送 */
  pumpImageQueue() {
    if (this.imageBusy) return;
    const job = this.imageQueue.shift();
    if (!job) return;
    this.imageBusy = true;
    Promise.resolve()
      .then(() => this.runImageJob(job))
      .catch(() => { })
      .then(() => { this.imageBusy = false; this.pumpImageQueue(); });
  },
  async runImageJob(job) {
    // 换卡/读档会替换 state，旧任务直接作废（不写错存档）
    if (!job || job.state !== this.state) return;
    const m = this.findMessageById(job.msgId);
    if (!m) return;                                   // 消息已被删除/回退
    const single = job.slotIndex != null;
    try {
      if (!single) {
        const shots = await this.buildImageShots(job.storyText, job.scene, job.count).catch(() => []);
        if (job.state !== this.state) return;
        if (!shots.length) { this.failMessageImage(job.msgId, "提示词为空（请检查生图接口与玩法模型）"); return; }
        // 先把所有落点画出来（占位图按锚点插进正文），再逐张填图
        const cur = this.findMessageById(job.msgId);
        if (!cur) return;
        cur.imageList = shots.map(s => ({ anchor: s.anchor || "", state: "pending" }));
        cur.imageState = "pending";
        delete cur.imageError;
        this.save();
        try { UI.patchMessageImage(job.msgId); } catch (e) { }
        for (let i = 0; i < shots.length; i++) {
          if (job.state !== this.state) return;
          const mm = this.findMessageById(job.msgId);
          if (!mm || !Array.isArray(mm.imageList) || !mm.imageList[i]) return;
          const res = await this.finishImage(shots[i], job.storyText).catch(e => ({ err: e }));
          if (job.state !== this.state) return;
          const live = this.findMessageById(job.msgId);
          if (!live || !Array.isArray(live.imageList) || !live.imageList[i]) return;
          const slot = live.imageList[i];
          if (res && res.data) {
            slot.state = "done"; delete slot.error;
            delete slot.data;
            if (res.rec && res.rec.id) {
              slot.ref = String(res.rec.id);
              this.imgCache.set(String(res.rec.id), OWGGallery.urlOf(res.rec));
              if (!live.imageRef) live.imageRef = slot.ref;
            } else {
              slot.data = res.data;
            }
          } else {
            slot.state = "error";
            slot.error = String((res && res.err && res.err.message) || "生图失败").slice(0, 140);
          }
          this.save();
          try { UI.patchMessageImage(job.msgId); } catch (e) { }
        }
        const fin = this.findMessageById(job.msgId);
        if (!fin) return;
        const anyDone = (fin.imageList || []).some(x => x && (x.state === "done" || x.ref || x.data));
        fin.imageState = anyDone ? "done" : "error";
        if (!anyDone) fin.imageError = "生图接口未返回图片";
        this.trimMessageImages();
        this.save();
        try { UI.patchMessageImage(job.msgId); } catch (e) { }
        return;
      }
      // 单张重试：只重画这一格，其它图不动
      const slot = (m.imageList || [])[job.slotIndex];
      if (!slot) return;
      slot.state = "pending"; delete slot.error;
      this.save();
      try { UI.patchMessageImage(job.msgId); } catch (e) { }
      const shots = await this.buildImageShots(job.storyText, job.scene, 1).catch(() => []);
      if (job.state !== this.state) return;
      const shot = shots[0] || { prompt: await this.imgEnglish(job.scene), neg: "", mood: OWGIntim.analyze(job.scene), anchor: job.anchor };
      if (job.anchor) shot.anchor = job.anchor;
      if (!shot.prompt) { this.failSlotImage(job.msgId, job.slotIndex, "提示词为空"); return; }
      const res = await this.finishImage(shot, job.storyText).catch(e => ({ err: e }));
      if (job.state !== this.state) return;
      const live = this.findMessageById(job.msgId);
      const s2 = live && Array.isArray(live.imageList) && live.imageList[job.slotIndex];
      if (!s2) return;
      if (res && res.data) {
        s2.state = "done"; delete s2.error; delete s2.data;
        if (res.rec && res.rec.id) {
          s2.ref = String(res.rec.id);
          this.imgCache.set(String(res.rec.id), OWGGallery.urlOf(res.rec));
          if (!live.imageRef) live.imageRef = s2.ref;
        } else s2.data = res.data;
        if ((live.imageList || []).some(x => x && (x.state === "done" || x.ref || x.data))) {
          live.imageState = "done"; delete live.imageError;
        }
      } else {
        s2.state = "error";
        s2.error = String((res && res.err && res.err.message) || "生图失败").slice(0, 140);
      }
      this.trimMessageImages();
      this.save();
      try { UI.patchMessageImage(job.msgId); } catch (e) { }
    } catch (e) {
      if (single) this.failSlotImage(job.msgId, job.slotIndex, (e && e.message) || String(e));
      else this.failMessageImage(job.msgId, (e && e.message) || String(e));
    }
  },
  failSlotImage(msgId, idx, text) {
    const m = this.findMessageById(msgId);
    const slot = m && Array.isArray(m.imageList) && m.imageList[idx];
    if (slot) { slot.state = "error"; slot.error = String(text || "生成失败").slice(0, 140); }
    this.save();
    try { UI.patchMessageImage(msgId); } catch (e) { }
  },
  failMessageImage(msgId, text) {
    if (!this.state) return;
    const m = this.findMessageById(msgId);
    if (!m) return;
    m.imageState = "error";
    m.imageError = String(text || "生成失败").slice(0, 140);
    this.save();
    try { UI.patchMessageImage(msgId); } catch (e) { }
  },
  /** 单条消息重试生图：idx 为空时重画整条，指定 idx 只重试那一张 */
  retryMessageImage(msgId, idx) {
    const m = this.findMessageById(msgId);
    if (!m) return false;
    const img = this.state.settings.image;
    if (!img || !img.enabled || !img.url || !img.key) { toast("还没配置生图接口：我的 → ⚙️ 设置 → 剧情插图", "err"); return false; }
    if (idx != null && Array.isArray(m.imageList) && m.imageList[idx]) {
      const slot = m.imageList[idx];
      slot.state = "pending"; delete slot.error;
      this.save();
      try { UI.patchMessageImage(msgId); } catch (e) { }
      this.enqueueStoryImage(msgId, m.content || "", m.scene || this.state.scene, this.state.cardId, 1, idx, slot.anchor || "");
      return true;
    }
    m.imageState = "pending";
    delete m.imageError;
    m.imageList = [];
    this.save();
    try { UI.patchMessageImage(msgId); } catch (e) { }
    this.enqueueStoryImage(msgId, m.content || "", m.scene || this.state.scene, this.state.cardId, clamp(img.count || 1, 1, 6));
    return true;
  },

  /* ---------- 图库（IndexedDB，大容量、无数量上限；查看/放大/单删/清空不变） ---------- */
