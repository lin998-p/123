        personality: c.personality || "",
        scenario: c.scenario || "",
        first_mes: c.first_mes || "",
        mes_example: c.mes_example || "",
        creator_notes: c.creator_notes || "",
        system_prompt: c.system_prompt || "",
        post_history_instructions: c.post_history_instructions || "",
        alternate_greetings: Array.isArray(c.alternate_greetings) ? c.alternate_greetings.slice(0, 24) : (Array.isArray(c.alt_greetings) ? c.alt_greetings.slice(0, 24) : []),
        character_book: book,
        tags: Array.isArray(c.tags) ? c.tags.slice(0, 32).map(String) : [],
        creator: c.creator || "",
        character_version: c.character_version || "1.0",
        extensions: (c.extensions && typeof c.extensions === "object") ? c.extensions : {},
      },
    };
  },
  /** 角色卡自带世界书 → V2 character_book */
  buildCharacterBook(card) {
    const c = card || {};
    const src = Array.isArray(c.worldbook) && c.worldbook.length ? c.worldbook : (Array.isArray(c.book) ? c.book : []);
    const entries = [];
    src.forEach((e, i) => {
      const content = String(e.content || "");
      if (!content) return;
      const constant = e.constant !== undefined ? !!e.constant : !!e.always;
      const pos = this.positionOf(e);
      const depth = e.depth != null ? e.depth : 4;
      entries.push({
        keys: (e.keys || []).map(String),
        secondary_keys: (e.secondary_keys || []).map(String),
        comment: String(e.comment || (e.keys || []).join("/") || ("条目 " + (i + 1))),
        content: content,
        constant: constant,
        selective: !!e.selective,
        selectiveLogic: e.selectiveLogic != null ? e.selectiveLogic : 0,
        order: e.order != null ? e.order : 100,
        position: pos,
        disabled: e.enabled === false,
        exclude_recursion: false,
        prevent_recursion: false,
        extensions: {
          position: pos,
          depth: depth,
          exclude_recursion: false,
          prevent_recursion: false,
          probability: 100,
          useProbability: true,
          group: "",
          group_override: false,
          group_weight: 100,
          scan_depth: null,
          case_sensitive: null,
          match_whole_words: null,
          use_group_scoring: null,
          automation_id: "",
          role: 0,
          vectorized: false,
          sticky: 0,
          cooldown: 0,
          delay: 0,
          display_index: i,
        },
      });
    });
    return {
      name: (c.name ? c.name + " 的世界书" : "世界书"),
      description: String(c.book_description || ""),
      scan_depth: 2,
      token_budget: 512,
      recursive_scanning: false,
      extensions: {},
      entries: entries,
    };
  },

  /* ---------------- 世界书文件（酒馆 World Info JSON）---------------- */
  /** 本页世界书 → 酒馆世界书文件结构 { entries: { uid: {...} } } */
  buildWorldInfoFile(entries, name) {
    const out = { entries: {} };
    (entries || []).forEach((e, i) => {
      const constant = e.constant !== undefined ? !!e.constant : !!e.always;
      const pos = this.positionOf(e);
      out.entries[i] = {
        uid: i,
        key: (e.keys || []).map(String),
        keysecondary: (e.secondary_keys || []).map(String),
        comment: String(e.comment || ""),
        content: String(e.content || ""),
        constant: constant,
        selective: !!e.selective,
        selectiveLogic: e.selectiveLogic != null ? e.selectiveLogic : 0,
        order: e.order != null ? e.order : 100,
        position: pos,
        disable: e.enabled === false,
        excludeRecursion: false,
        preventRecursion: false,
        delayUntilRecursion: false,
        addMemo: !!e.comment,
        displayIndex: i,
        probability: e.probability != null ? e.probability : 100,
        useProbability: e.probability != null && e.probability < 100,
        outletName: "",
        group: String(e.group || ""),
        groupOverride: false,
        groupWeight: 100,
        scanDepth: null,
        caseSensitive: null,
        matchWholeWords: null,
        useGroupScoring: null,
        automationId: "",
        role: 0,
        vectorized: false,
        sticky: null,
        cooldown: null,
        delay: null,
        triggers: [],
        ignoreBudget: false,
        depth: e.depth != null ? e.depth : 4,
      };
    });
    return { name: name || "世界书", entries: out.entries };
  },
  /** 酒馆世界书文件 → 本页条目 */
  parseWorldInfo(text) {
    let j;
    try { j = JSON.parse(text); } catch (e) { throw new Error("不是合法的 JSON 文件"); }
    if (!j || typeof j !== "object") throw new Error("世界书文件内容不是对象");
    let arr = null;
    if (Array.isArray(j)) arr = j;
    else if (j.entries && Array.isArray(j.entries)) arr = j.entries;
    else if (j.entries && typeof j.entries === "object") arr = Object.keys(j.entries).map(k => j.entries[k]);
    else if (j.character_book && Array.isArray(j.character_book.entries)) arr = j.character_book.entries;
    if (!arr) throw new Error("世界书文件缺少 entries 字段，无法识别");
    const entries = this.toAppEntries(arr, "user");
    if (!entries.length) throw new Error("世界书里没有可用条目");
    return { name: String(j.name || ""), entries: entries };
  },

  /* ---------------- 聊天记录（酒馆 chat JSONL）---------------- */
  buildChatJSONL(messages, opt) {
    const o = opt || {};
    const userName = o.userName || "用户";
    const charName = o.charName || "角色";
    const lines = [];
    lines.push(JSON.stringify({ chat_metadata: {}, user_name: userName, character_name: charName }));
    (messages || []).forEach(m => {
      const isUser = m.role === "user";
      lines.push(JSON.stringify({
        name: isUser ? userName : charName,
        is_user: isUser,
        is_system: m.role === "system" ? true : false,
        send_date: this.nowISO(m.ts || Date.now()),
        mes: String(m.content == null ? "" : m.content),
        extra: {},
        swipes: [],
        swipe_info: 0,
        swipe_id: 0,
      }));
    });
    return lines.join("\n");
  },
  parseChatJSONL(text) {
    const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) throw new Error("聊天文件是空的");
    const out = [];
    let header = null;
    for (const line of lines) {
      let o;
      try { o = JSON.parse(line); } catch (e) { continue; }
      if (!o || typeof o !== "object") continue;
      if (o.mes === undefined) {
        if (o.chat_metadata || o.user_name !== undefined || o.character_name !== undefined) header = o;
        continue;
      }
      out.push({
        role: o.is_user ? "user" : (o.is_system ? "system" : "assistant"),
        content: String(o.mes),
        ts: this.parseDate(o.send_date),
      });
    }
    if (!out.length) throw new Error("聊天文件里没有可用消息（每行应为含 mes 字段的消息对象）");
    return { header: header, messages: out };
  },
  parseDate(d) {
    if (d == null) return Date.now();
    if (typeof d === "number") return d;
    const t = Date.parse(d);
    return isNaN(t) ? Date.now() : t;
  },
};

/* ========== 酒馆互通 · PNG 角色卡 / 提示词拼装 / 界面 ========== */
"use strict";

Object.assign(STBridge, {
  /* ---------------- PNG 编码（无外部依赖）---------------- */
  crcTable() {
    if (this._crcTable) return this._crcTable;
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    this._crcTable = t;
    return t;
  },
  crc32(bytes) {
    const t = this.crcTable();
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  },
  adler32(bytes) {
    let a = 1, b = 0;
    for (let i = 0; i < bytes.length; i++) {
      a = (a + bytes[i]) % 65521;
      b = (b + a) % 65521;
    }
    return ((b << 16) | a) >>> 0;
  },
  /** zlib（stored 块，无压缩）封装，用于生成合法 PNG 的 IDAT */
  zlibStore(data) {
    const parts = [];
    parts.push(new Uint8Array([0x78, 0x01]));
    let off = 0;
    if (data.length === 0) {
      const hdr = new Uint8Array(5);
      hdr[0] = 1;
      parts.push(hdr);
    }
    while (off < data.length) {
      const len = Math.min(65535, data.length - off);
      const last = (off + len >= data.length) ? 1 : 0;
      const hdr = new Uint8Array(5);
      hdr[0] = last;
      hdr[1] = len & 0xFF;
      hdr[2] = (len >>> 8) & 0xFF;
      hdr[3] = (~len) & 0xFF;
      hdr[4] = ((~len) >>> 8) & 0xFF;
      parts.push(hdr, data.subarray(off, off + len));
      off += len;
    }
    const ad = new Uint8Array(4);
    const dv = new DataView(ad.buffer);
    dv.setUint32(0, this.adler32(data));
    parts.push(ad);
    let total = 0;
    parts.forEach(p => { total += p.length; });
    const out = new Uint8Array(total);
    let o = 0;
    parts.forEach(p => { out.set(p, o); o += p.length; });
    return out;
  },
  pngChunk(type, data) {
    const typeBytes = new TextEncoder().encode(type);
    const len = data.length;
    const out = new Uint8Array(12 + len);
    const dv = new DataView(out.buffer);
    dv.setUint32(0, len);
    out.set(typeBytes, 4);
    out.set(data, 8);
    dv.setUint32(8 + len, this.crc32(out.subarray(4, 8 + len)));
    return out;
  },
  /** 生成一张纯色渐变的合法 PNG（不依赖 canvas） */
  makePlainPNG(width, height, seed) {
    const raw = new Uint8Array(height * (1 + width * 3));
    let o = 0;
    let h = 0;
    for (let y = 0; y < height; y++) {
      raw[o++] = 0;
      for (let x = 0; x < width; x++) {
        const t = y / Math.max(1, height - 1);
        const r = Math.round(40 + 70 * t + ((seed + x) % 17));
        const g = Math.round(30 + 45 * t);
        const b = Math.round(70 + 110 * t + ((seed + y) % 13));
        raw[o++] = Math.min(255, r);
        raw[o++] = Math.min(255, g);
        raw[o++] = Math.min(255, b);
      }
      h = (h + 1) % 1000;
    }
    const ihdr = new Uint8Array(13);
    const dv = new DataView(ihdr.buffer);
    dv.setUint32(0, width);
    dv.setUint32(4, height);
    ihdr[8] = 8; ihdr[9] = 2; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
    const sig = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]);
    const chunks = [
      this.pngChunk("IHDR", ihdr),
      this.pngChunk("IDAT", this.zlibStore(raw)),
      this.pngChunk("IEND", new Uint8Array(0)),
    ];
    let total = sig.length;
    chunks.forEach(c => { total += c.length; });
    const out = new Uint8Array(total);
    let p = 0;
    out.set(sig, p); p += sig.length;
    chunks.forEach(c => { out.set(c, p); p += c.length; });
    return out;
  },
  /** 用 canvas 把头像画成 PNG（可选，失败时回落到纯色图） */
  async makeAvatarPNG(avatarDataUrl, size) {
    const px = size || 512;
    if (!avatarDataUrl) return null;
    try {
      const img = await Promise.race([
        new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = () => rej(new Error("头像读取失败"));
          im.src = avatarDataUrl;
        }),
        new Promise((res, rej) => setTimeout(() => rej(new Error("头像加载超时")), 2500)),
      ]);
      const c = document.createElement("canvas");
      c.width = px; c.height = px;
      const g = c.getContext("2d");
      g.fillStyle = "#1a1430";
      g.fillRect(0, 0, px, px);
      const r = Math.min(1, px / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * r));
      const h = Math.max(1, Math.round(img.height * r));
      g.drawImage(img, Math.floor((px - w) / 2), Math.floor((px - h) / 2), w, h);
      const blob = await new Promise(res => c.toBlob(res, "image/png"));
      if (!blob) return null;
      return new Uint8Array(await blob.arrayBuffer());
    } catch (e) {
      return null;
    }
  },
  /** 在 PNG 中写入 / 替换 tEXt 块（keyword 形如 chara） */
  injectPngText(pngBytes, keyword, value) {
    const sig = pngBytes.subarray(0, 8);
    const parts = [sig];
    const dv = new DataView(pngBytes.buffer, pngBytes.byteOffset, pngBytes.byteLength);
    let pos = 8;
    while (pos + 12 <= pngBytes.length) {
      const len = dv.getUint32(pos);
      const type = String.fromCharCode(pngBytes[pos + 4], pngBytes[pos + 5], pngBytes[pos + 6], pngBytes[pos + 7]);
      const chunk = pngBytes.subarray(pos, pos + 12 + len);
      if (type === "IEND") {
        parts.push(this.pngChunk("tEXt", this.pngTextData(keyword, value)));
        parts.push(chunk);
        pos += 12 + len;
        break;
      }
      if (type === "tEXt" || type === "iTXt") {
        const data = pngBytes.subarray(pos + 8, pos + 8 + len);
        const nul = data.indexOf(0);
        const kw = nul > 0 ? String.fromCharCode.apply(null, Array.from(data.subarray(0, nul))) : "";
        if (kw === "chara" || kw === "ccv3" || kw === "Chara") { /* 丢弃旧的卡数据 */ }
        else parts.push(chunk);
      } else {
        parts.push(chunk);
      }
      pos += 12 + len;
      if (type === "IEND") break;
    }
    let total = 0;
    parts.forEach(p => { total += p.length; });
    const out = new Uint8Array(total);
    let o = 0;
    parts.forEach(p => { out.set(p, o); o += p.length; });
    return out;
  },
  pngTextData(keyword, value) {
    const k = new TextEncoder().encode(keyword);
    const v = new TextEncoder().encode(value);
    const out = new Uint8Array(k.length + 1 + v.length);
    out.set(k, 0);
    out[k.length] = 0;
    out.set(v, k.length + 1);
    return out;
  },
  /** 导出角色卡 PNG（tEXt: chara = base64(V2 JSON)） */
  async buildCardPNGBytes(card) {
    const json = this.buildCardV2(card);
    const b64 = this.utf8ToB64(JSON.stringify(json));
    let png = await this.makeAvatarPNG(card && card.avatar, 512);
    if (!png) png = this.makePlainPNG(512, 512, 7);
    return this.injectPngText(png, "chara", b64);
  },
  async buildCardPNG(card) {
    const bytes = await this.buildCardPNGBytes(card);
    return new Blob([bytes], { type: "image/png" });
  },

  /* ---------------- 提示词拼装（酒馆风格分段）---------------- */
  worldbookBlock(entries, ctx, title) {
    if (!entries || !entries.length) return "";
    const lines = entries.map(e => {
      const k = (e.keys || []).join("/");
      return "· " + (k ? "[" + k + "] " : "") + this.macro(e.content || "", ctx);
    });
    return "\n【" + title + "】\n" + lines.join("\n") + "\n";
  },
  /** 解析 mes_example 成 user/assistant 交替的示例消息 */
  parseExamples(text) {
    if (!text) return [];
    const out = [];
    const chunks = String(text).split(/<\/?START>/i);
    for (const chunk of chunks) {
      const lines = String(chunk).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for (const line of lines) {
        let role = null, content = line;
        let m = /^\{\{\s*user\s*\}\}\s*[:：]\s*([\s\S]*)$/i.exec(line);
        if (m) { role = "user"; content = m[1]; }
        else {
          m = /^\{\{\s*char\s*\}\}\s*[:：]\s*([\s\S]*)$/i.exec(line);
          if (m) { role = "assistant"; content = m[1]; }
          else {
            m = /^\{\{\s*user\s*\}\}\s*[:：]\s*([\s\S]*)$/i.exec(line);
            if (m) { role = "user"; content = m[1]; }
          }
        }
        if (!role) continue;
        out.push({ role: role, content: content.trim() });
      }
    }
    return out;
  },
  /** 组合最终提示词分段 */
  composeParts(userText) {
    const st = Game.state;
    const card = Game.activeCard();
    const ctx = this.macroContext();
    const collect = {};
    const full = Game.buildSystemPrompt(userText || "", collect);
    const tokA = "\u0002A\u0002", tokB = "\u0002B\u0002";
    let marked = full;
    if (collect.wb) marked = marked.split(collect.wb).join(tokA);
    if (collect.card) marked = marked.split(collect.card).join(tokB);
    const segs = marked.split(/\u0002[AB]\u0002/);
    let head = segs[0] || "";
    let tail = "";
    if (collect.wb && collect.card) { tail = segs[2] || ""; }
    else { tail = segs[1] || ""; }
    head = this.macro(head.trim(), ctx);
    tail = this.macro(tail.trim(), ctx);

    const wb = Game.activeWorldbook(userText || "");
    const byPos = p => wb.filter(e => this.positionOf(e) === p);
    const before = byPos(0), after = byPos(1);
    const beforeAn = byPos(2), afterAn = byPos(3);
    const emTop = byPos(5), emBottom = byPos(6);
    const atDepth = byPos(4);

    const segBefore = this.worldbookBlock(before, ctx, "世界书·角色定义前");
    const segAfter = this.worldbookBlock(after, ctx, "世界书·角色定义后");
    const segCard = collect.card ? this.macro(collect.card.trim(), ctx) : "";
    const segments = [];
    if (head) segments.push({ kind: "gm", label: "① 系统指令与世界观总述", text: head });
    if (segBefore) segments.push({ kind: "wi_before", label: "② 世界书·角色定义前 (before_char)", text: segBefore.trim() });
    if (segCard) segments.push({ kind: "char", label: "③ 角色卡正文 (角色定义)", text: segCard });
    if (segAfter) segments.push({ kind: "wi_after", label: "④ 世界书·角色定义后 (after_char)", text: segAfter.trim() });
    if (tail) segments.push({ kind: "state", label: "⑤ 世界状态与叙事规则", text: tail });
    for (const seg of segments) seg.text = STAssist.applyPipeline(seg.text, ctx);
    const system = segments.map(s => s.text).join("\n").trim();
    return {
      segments: segments,
      system: system,
      ctx: ctx,
      card: card,
      beforeAn: beforeAn,
      afterAn: afterAn,
      emTop: emTop,
      emBottom: emBottom,
      atDepth: atDepth,
      examples: card ? this.parseExamples(card.mes_example || "") : [],
      phi: card && card.post_history_instructions ? this.macro(card.post_history_instructions, ctx) : "",
    };
  },
  /** 完整消息数组（system + 历史前模块 + 示例 + 历史 + 历史后模块 + 作者注 + PHI） */
  buildMessages(userText) {
    const st = Game.state;
    const p = this.composeParts(userText);
    const ctx = p.ctx;
    const conf = OWGPreset.assembly();
    const run = t => STAssist.applyPipeline(this.macro(String(t || ""), ctx), ctx, { stMacro: true });
    const msgs = [];
    msgs.push({ role: "system", content: p.system });
    // 1) prompt_order 中位于 chatHistory 之前的模块（按酒馆顺序插在系统提示之后）
    for (const it of conf.pre) { const t = run(it.content); if (t.trim()) msgs.push({ role: it.role || "system", content: t.trim() }); }
    // 2) 用户人设（酒馆 personaDescription）
    if (st.settings.persona) msgs.push({ role: "system", content: run(`【玩家设定 / persona】${st.settings.persona}`) });
    // 3) 示例消息前世界书
    const emTopText = this.worldbookBlock(p.emTop, ctx, "世界书·示例消息前");
    if (emTopText.trim()) msgs.push({ role: "system", content: STAssist.applyPipeline(emTopText.trim(), ctx) });
    for (const ex of p.examples) msgs.push({ role: ex.role, content: STAssist.applyPipeline(this.macro(ex.content, ctx), ctx) });
    const emBottomText = this.worldbookBlock(p.emBottom, ctx, "世界书·示例消息后");
    if (emBottomText.trim()) msgs.push({ role: "system", content: STAssist.applyPipeline(emBottomText.trim(), ctx) });

    // 4) 聊天历史（思考过程以 <thinking> 包裹保留；是否最终发送交给预设正则决定）
    // 主剧情不再按 historyLimit 截断：历史全量进入请求，避免“只读了几百 token 的上下文”
    const keepThink = OWGRender.settings().keepReasoningInPrompt !== false;
    const hist = st.messages.map(m => {
      let c = String(m.content == null ? "" : m.content);
      if (m.role === "assistant" && m.reasoning && keepThink) c = "<thinking>\n" + m.reasoning + "\n</thinking>\n" + c;
      return { role: m.role, content: c };
    });
    const ins = (text, depth, label) => {
      const t = run(text);
      if (!t.trim()) return;
      const idx = Math.max(0, hist.length - (Number(depth) || 0));
      hist.splice(idx, 0, { role: "system", content: label ? `【${label}】\n${t.trim()}` : t.trim() });
    };
    const an = OWGPreset.data().authorNote;
    if (an && String(an.text || "").trim()) ins(an.text, an.depth, "作者注释");
    for (const e of p.atDepth) ins(this.worldbookBlock([e], ctx, "世界书·指定深度").trim(), e.depth != null ? e.depth : 4, "");
    for (const it of conf.depth) ins(it.content, it.injection_depth || 4, "预设提示词");
    for (const h of hist) msgs.push({ role: h.role, content: STAssist.applyPipeline(h.content, ctx, { stMacro: true }) });

    // 5) prompt_order 中位于 chatHistory 之后的模块
    for (const it of conf.post) { const t = run(it.content); if (t.trim()) msgs.push({ role: it.role || "system", content: t.trim() }); }

    // 6) 世界书作者注位置 / 角色卡 post_history_instructions
    const beforeAnText = this.worldbookBlock(p.beforeAn, ctx, "世界书·作者注前");
    if (beforeAnText.trim()) msgs.push({ role: "system", content: STAssist.applyPipeline(beforeAnText.trim(), ctx) });
    if (p.phi) msgs.push({ role: "system", content: STAssist.applyPipeline(p.phi, ctx) });
    const afterAnText = this.worldbookBlock(p.afterAn, ctx, "世界书·作者注后");
    if (afterAnText.trim()) msgs.push({ role: "system", content: STAssist.applyPipeline(afterAnText.trim(), ctx) });
    // 6.5) 最终卡锚点复述：追加在最后一条 user 之后（消息数组末尾），让模型在最后一次注意的位置仍看到本卡设定
    if (p.card) {
      const c = p.card;
      // 不再截断卡内设定：世界观/人设全量复述，避免长卡被截到几百字后模型“忘设定”
      const cWorld = [c.scenario, c.description].filter(Boolean).join("\n");
      const cPers = [c.personality, c.description].filter(Boolean).join("\n");
      const anchor = `【最终提醒·角色卡「${c.name}」为最高优先级】本剧情只属于这张卡：世界观、身份、称呼与氛围必须来自卡内设定；NPC 只能是卡内角色与卡内合理的衍生角色。禁止出现卡外作品、卡外地名/人物/组织/设定，禁止回退到通用奇幻模板。${cWorld ? `\n卡内世界观：${cWorld}` : ""}${cPers ? `\n卡内人设：${cPers}` : ""}\n若上文（含历史消息、前情记忆或预设模块）与本卡冲突，一律以上文为误并立即纠正到本卡设定。`;
      msgs.push({ role: "system", content: run(anchor) });
    }
    // 7) 预设正则：按列表顺序依次作用在最终提示词上
    for (const m of msgs) { try { m.content = OWGPreset.applyToPrompt(m.content); } catch (e) { } }
    // 8) 主剧情不做上下文裁剪：历史与卡设定全量进入（预设的 context_tokens 只用于统计，不再丢最旧历史）
    this.lastBudget = { messages: msgs.length, chars: msgs.reduce((a, m) => a + String(m.content || "").length, 0), estTokens: Math.ceil(msgs.reduce((a, m) => a + String(m.content || "").length, 0) / 1.4), budget: OWGPreset.contextBudget(), trimmed: 0 };
    return msgs;
  },
});

/* ========== 酒馆互通 · 界面与导入导出 ========== */
"use strict";

Object.assign(STBridge, {
  /* ---------------- 导出 ---------------- */
  activeCardOrWarn() {
    const c = Game.activeCard();
    if (!c) { toast("请先在「存档 → 角色卡」中启用一张角色卡", "err"); return null; }
    return c;
  },
  exportCardJSON() {
    const c = this.activeCardOrWarn();
    if (!c) return;
    const name = this.safeName(c.name, "角色卡");
    this.downloadText(name + ".json", JSON.stringify(this.buildCardV2(c), null, 2));
    toast("已导出角色卡 JSON：" + name + ".json（Character Card V2）", "ok");
  },
  async exportCardPNG() {
    const c = this.activeCardOrWarn();
    if (!c) return;
    try {
      const blob = await this.buildCardPNG(c);  // Blob 包装供下载
      const name = this.safeName(c.name, "角色卡");
      this.downloadBlob(name + ".png", blob);
      toast("已导出角色卡 PNG：" + name + ".png（内嵌 tEXt chara）", "ok");
    } catch (e) {
      toast("导出 PNG 失败：" + e.message, "err");
    }
  },
  exportWorldInfo() {
    const entries = Game.worldbookEntries();
    if (!entries.length) { toast("当前没有世界书条目可导出", "err"); return; }
    const card = Game.activeCard();
    const name = card ? this.safeName(card.name, "世界书") + "_世界书" : "世界书";
    const obj = this.buildWorldInfoFile(entries, name);
    this.downloadText(name + ".json", JSON.stringify(obj, null, 2));
    toast("已导出世界书：" + name + ".json（" + entries.length + " 条，World Info 格式）", "ok");
  },
  exportChatJSONL() {
    const msgs = Game.state.messages || [];
    if (!msgs.length) { toast("当前没有剧情消息可导出", "err"); return; }
    const card = Game.activeCard();
    const charName = card ? card.name : "角色";
    const groupName = (Game.state.world && Game.state.world.name) || "默认";
    const text = this.buildChatJSONL(msgs, {
      userName: (Game.state.player && Game.state.player.name) || "用户",
      charName: charName,
      groupName: groupName,
    });
    const fname = this.safeName(charName, "角色") + "_" + this.safeName(groupName, "默认") + ".jsonl";
    this.downloadText(fname, text, "application/x-ndjson");
    toast("已导出聊天记录：" + fname + "（" + msgs.length + " 条，chat JSONL）", "ok");
  },

  /* ---------------- 导入 ---------------- */
  saveImportedCard(entry) {
    const list = Game.cards();
    const same = list.findIndex(c => c.name === entry.name);
    if (same >= 0) {
      // 同名卡覆盖时沿用原 id，避免正在启用的卡与配置错位
      entry.id = list[same].id;
      list.splice(same, 1);
    }
    list.unshift(entry);
    Game.saveCards(list);
    return entry;
  },
  importCardFile(file) {
    return UI.importCardFlow(file);
  },
  importCardFromText(text) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error("不是合法的 JSON 文件"); }
    if (Array.isArray(json)) json = json[0];
    if (!json || typeof json !== "object") throw new Error("角色卡文件内容不是对象");
    const card = Card.normalize(json);
    const rawEntries = (json.data && json.data.character_book && json.data.character_book.entries)
      || (json.character_book && json.character_book.entries) || [];
    const book = this.toAppEntries(rawEntries, "card");
    // 与 importFile 保持一致：保留原始展示字段 / 卡自带美化 / 正则 / 脚本，否则开场白 HTML 会在导入口就被清洗掉
    const rawExt = Card.collectExtensions(json);
    const scripts = (typeof OWGScript !== "undefined") ? OWGScript.extractScripts(rawExt) : [];
    const display = Card.rawDisplayFields(json);
    const entry = Object.assign({}, card, {
      alternate_greetings: card.alternate_greetings || card.alt_greetings || [],
      alt_greetings: card.alternate_greetings || card.alt_greetings || [],
      worldbook: book,
      book: book.map(e => ({ keys: (e.keys || []).slice(0, 6), content: String(e.content || "").slice(0, 300) })),
      extensions: rawExt,
      scripts: scripts,
      display: display,
      avatar: "",
      importedAt: Date.now(),
      id: uid(),
    });
    this.saveImportedCard(entry);
    try { if (typeof OWGScript !== "undefined" && scripts.length) OWGScript.importFromCard(entry); } catch (e) { }
    toast("已导入角色卡「" + entry.name + "」", "ok");
    UI.refresh();
    return entry;
  },
  importWorldInfoText(text) {
    const res = this.parseWorldInfo(text);
    const cur = Game.worldbookEntries().slice();
    const sig = e => JSON.stringify([e.keys, e.content]);
    const seen = new Set(cur.map(sig));
    let added = 0, skipped = 0;
    for (const e of res.entries) {
      if (seen.has(sig(e))) { skipped++; continue; }
      cur.push(e);
      seen.add(sig(e));
      added++;
    }
    Game.saveWorldbook(cur);
    UI.refresh();
    toast("已导入世界书：新增 " + added + " 条" + (skipped ? "，重复跳过 " + skipped + " 条" : "")
      + (res.name ? "（来源：" + res.name + "）" : ""), "ok");
    return added;
  },
  importChatText(text) {
    const res = this.parseChatJSONL(text);
    const cur = Game.state.messages;
    const sig = m => JSON.stringify([m.role, m.content, m.ts]);
    const seen = new Set(cur.map(sig));
    let added = 0;
    for (const m of res.messages) {
      if (seen.has(sig(m))) continue;
      cur.push({ role: m.role === "system" ? "assistant" : m.role, content: m.content, delta: null, ts: m.ts });
      seen.add(sig(m));
      added++;
    }
    Game.save();
    UI.refresh();
    toast("已导入聊天记录：新增 " + added + " 条"
      + (res.header && res.header.character_name ? "（酒馆角色：" + res.header.character_name + "）" : ""), "ok");
    return added;
  },
  importWorldInfoFile(file) {
    return readFileAs(file, "text")
      .then(t => { this.importWorldInfoText(t); })
      .catch(e => { toast("导入世界书失败：" + e.message, "err"); });
  },
  importChatFile(file) {
    return readFileAs(file, "text")
      .then(t => { this.importChatText(t); })
      .catch(e => { toast("导入聊天记录失败：" + e.message, "err"); });
  },
  /** 按扩展名与内容自动判断导入类型 */
  importByExtension(file) {
    const name = String(file.name || "").toLowerCase();
    try {
      if (name.endsWith(".png")) { this.importCardFile(file); return; }
      if (name.endsWith(".jsonl") || name.endsWith(".txt")) { this.importChatFile(file); return; }
      if (name.endsWith(".json")) {
        readFileAs(file, "text").then(text => {
          let j = null;
          try { j = JSON.parse(text); } catch (e) { j = null; }
          if (j && typeof j === "object" && (j.entries || (j.character_book && j.character_book.entries))) {
            this.importWorldInfoText(text);
          } else {
            this.importCardFromText(text);
          }
        }).catch(e => { toast("导入失败：" + e.message, "err"); });
        return;
      }
      toast("只支持 .png / .json / .jsonl 文件", "err");
    } catch (e) {
      toast("导入失败：" + e.message, "err");
    }
  },

  /* ---------------- 跨域代理诊断 ---------------- */
  async testDirectNoProxy() {
    const role = "main";
    const p = API.resolve(role, { needModel: false });
    if (!p || !p.url || !p.key) { toast("请先填写接口地址与密钥，再测试直连", "err"); return; }
    const orig = Game.state.settings.proxy;
    Game.state.settings.proxy = "";
    toast("正在测试不带代理的直连…");
    try {
      const res = await fetch(API.normBase(p.url) + "/models", { headers: API.headers(p.key) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      toast("直连成功：该接口允许浏览器跨域，代理前缀可以留空", "ok");
    } catch (e) {
      toast("直连失败：" + (e && e.message ? e.message : e) + "。若提示跨域/CORS，说明该接口不允许网页直连，仍需保留代理前缀；或改用酒馆作为对话前端", "err");
    } finally {
      Game.state.settings.proxy = orig;
    }
  },

  /* ---------------- 界面 ---------------- */
  renderPanelHTML() {
    const s = Game.state.settings;
    return `
      <div class="card">
        <div class="card-title">🍷 酒馆互通（SillyTavern）</div>
        <p class="hint" style="margin-bottom:10px">与酒馆双向互通：角色卡按 Character Card V2 规范（PNG 内嵌 tEXt chara），世界书按酒馆 World Info JSON，聊天记录按酒馆 chat JSONL。导出文件可直接拖进酒馆，酒馆导出的文件也能拖回本页。</p>
        <label class="field"><span>用户人设（{{persona}} 宏）</span>
          <textarea id="st-persona" rows="2" placeholder="例如：一名四处旅行的年轻学者，习惯用第一人称">${escapeHtml(s.persona || "")}</textarea></label>
        <div class="card-title" style="font-size:13px;margin-top:14px">导出</div>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn sm" id="st-exp-png">🖼️ 角色卡 PNG</button>
          <button class="btn sm" id="st-exp-json">📄 角色卡 JSON</button>
          <button class="btn sm" id="st-exp-wi">📚 世界书</button>
          <button class="btn sm" id="st-exp-chat">💬 聊天 JSONL</button>
        </div>
        <div class="card-title" style="font-size:13px;margin-top:14px">导入</div>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn sm" id="st-imp-png">🖼️ 角色卡 PNG</button>
          <button class="btn sm" id="st-imp-json">📄 角色卡 JSON</button>
          <button class="btn sm" id="st-imp-wi">📚 世界书</button>
          <button class="btn sm" id="st-imp-chat">💬 聊天 JSONL</button>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn sm primary" id="st-preview">👁️ 查看最终拼装提示词</button>
        </div>
        <div id="st-drop" style="margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--txt2)">
          把酒馆导出的 .png / .json / .jsonl 拖到这里 → 自动按类型导入
        </div>
        <p class="hint" style="margin-top:8px">导出文件进入浏览器下载目录，文件名沿用酒馆习惯：角色卡「角色名.png / 角色名.json」，世界书「角色名_世界书.json」，聊天记录「角色名_世界名.jsonl」。</p>
      </div>`;
  },
  bindPanel() {
    const s = Game.state.settings;
    const persona = $("#st-persona");
    if (persona) persona.onchange = (e) => { s.persona = e.target.value; Game.save(); toast("用户人设已保存", "ok"); };
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on("#st-exp-png", () => STBridge.exportCardPNG());
    on("#st-exp-json", () => STBridge.exportCardJSON());
    on("#st-exp-wi", () => STBridge.exportWorldInfo());
    on("#st-exp-chat", () => STBridge.exportChatJSONL());
    on("#st-imp-png", () => UI.pickFile(".png", f => STBridge.importCardFile(f)));
    on("#st-imp-json", () => UI.pickFile(".json", f => STBridge.importCardFile(f)));
    on("#st-imp-wi", () => UI.pickFile(".json", f => STBridge.importWorldInfoFile(f)));
    on("#st-imp-chat", () => UI.pickFile(".jsonl,.txt", f => STBridge.importChatFile(f)));
    on("#st-preview", () => STBridge.showPromptPreview());

    const drop = $("#st-drop");
    if (!drop) return;
    const hl = (on_) => { drop.style.borderColor = on_ ? "var(--acc)" : "var(--line)"; drop.style.color = on_ ? "var(--acc2)" : "var(--txt2)"; };
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); hl(true); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); hl(false); }));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) STBridge.importByExtension(f);
    });
  },
  showPromptPreview() {
    const p = this.composeParts("");
    const msgs = this.buildMessages("");
    let html = `<h3>👁️ 最终拼装提示词</h3>`;
    html += `<p class="hint" style="margin-bottom:10px">按酒馆顺序分段：系统指令 → 世界书(before_char) → 角色卡正文 → 世界书(after_char) → 世界状态与规则；示例消息与历史随后，at_depth 条目按深度插入历史，历史之后是 post_history_instructions。</p>`;
    html += `<div style="max-height:52vh;overflow-y:auto">`;
    p.segments.forEach(seg => {
      html += `<div class="ana-block"><h4>${escapeHtml(seg.label)}</h4><pre style="white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.55;margin:0;opacity:.9">${escapeHtml(seg.text)}</pre></div>`;
    });
    if (p.examples.length) {
      html += `<div class="ana-block"><h4>⑥ 示例消息（mes_example）</h4><pre style="white-space:pre-wrap;font-size:11.5px;margin:0">${escapeHtml(p.examples.map(e => e.role + "：" + e.content).join("\n"))}</pre></div>`;
    }
    html += `<div class="ana-block"><h4>⑦ 聊天历史（${msgs.filter(m => m.role === "user" || m.role === "assistant").length} 条）</h4><pre style="white-space:pre-wrap;font-size:11.5px;margin:0;max-height:30vh;overflow:auto">${escapeHtml(msgs.filter(m => m.role === "user" || m.role === "assistant").map(m => (m.role === "user" ? "用户" : "角色") + "：" + String(m.content).slice(0, 200)).join("\n"))}</pre></div>`;
    if (p.phi) html += `<div class="ana-block"><h4>⑧ 历史后指令（post_history_instructions）</h4><pre style="white-space:pre-wrap;font-size:11.5px;margin:0">${escapeHtml(p.phi)}</pre></div>`;
    html += `</div>`;
    const logs = (API.requestLog || []).slice(-20);
    html += `<div class="ana-block"><h4>⑨ 最近请求记录（${logs.length} 条）</h4><pre style="white-space:pre-wrap;font-size:11.5px;margin:0;max-height:24vh;overflow:auto">${
      logs.length ? escapeHtml(logs.map(x => {
        const head = `${new Date(x.ts).toLocaleTimeString()} · ${x.type}${x.reason ? " · " + x.reason : ""}`;
        if (x.detail) return `${head}\n    ${x.detail}`;
        return `${head} · 第${x.attempt}次 · ${x.messages}msgs · max=${x.max_tokens} · ${x.result}`;
      }).join("\n")) : "（本次打开页面后还没有请求）"
    }</pre></div>`;
    html += `<div class="modal-actions"><button class="btn primary" onclick="closeModal()">关闭</button></div>`;
    openModal(html);
  },
});
