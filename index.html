<script>
/* ============================================================================
 * 酒馆助手（JS-Slash-Runner 移植） + 提示词模板（ST-Prompt-Template 移植）
 *
 * 【酒馆助手】来源：https://github.com/n0vi028/JS-Slash-Runner
 *   上游许可：PolyForm Noncommercial License 1.0.0（LICENSE 原文抄录在《1_开放世界-酒馆兼容-说明.md》）
 *   移植模块：
 *     src/function/macro_like.ts      → 助手宏（get_/format_*_variable 变量宏）的正则与取值语义
 *     src/function/variables.ts        → 变量作用域（global/chat/character/preset/message）与路径式读写模型
 *     src/panel/render/macro_like.ts   → 渲染时对文本做宏替换（demacro）的处理方式
 *
 * 【提示词模板】来源：https://github.com/zonde306/ST-Prompt-Template
 *   上游许可：MIT（LICENSE 原文抄录在《1_开放世界-酒馆兼容-说明.md》）
 *   移植模块：
 *     src/function/ejs.ts              → EJS 模板的编译方式与执行上下文（escape 为恒等、outputFunctionName=print）
 *     src/function/variables.ts        → setvar/getvar/incvar/... 的作用域、flags、results 语义
 *     src/utils/evaluate.ts            → 模板出错时的处理方式（中文提示、保留原文、不中断聊天）
 *
 * 【本页自有扩展】上游两个仓库都没有 {{ }} 糖衣宏（条件块/循环/变量运算），
 *   属于本页为方便使用而加的一层，已在说明文档中单独标注。
 * ========================================================================== */
const STAssist = {
  VAR_KEY: "stvars",
  SCOPES: ["global", "chat", "character", "preset", "message", "initial"],
  ejsCache: new Map(),
  lastError: "",

  /* ------------------------------------------------------------------ */
  /* 开关                                                                */
  /* ------------------------------------------------------------------ */
  settings() {
    const s = Game.state.settings;
    if (!s.assist || typeof s.assist !== "object") s.assist = { render: true, template: true };
    if (typeof s.assist.render !== "boolean") s.assist.render = true;
    if (typeof s.assist.template !== "boolean") s.assist.template = true;
    return s.assist;
  },
  renderOn() { return this.settings().render !== false; },
  templateOn() { return this.settings().template !== false; },

  /* ------------------------------------------------------------------ */
  /* 变量存储（沿用本页既有 localStorage 体系，前缀 owg_）               */
  /* ------------------------------------------------------------------ */
  allVars() {
    // 变量属于「当前这一档」：优先读 Game.state.vars（随存档快照保存/恢复）
    const st = (typeof Game !== "undefined" && Game.state) ? Game.state : null;
    let v = st && st.vars;
    if (!v || typeof v !== "object" || Array.isArray(v)) {
      // 旧版把变量存在全局 owg_stvars：首次升级时收进当前档，之后各档各自独立
      const legacy = store.get(this.VAR_KEY, null);
      v = (legacy && typeof legacy === "object" && !Array.isArray(legacy)) ? JSON.parse(JSON.stringify(legacy)) : {};
      if (st) st.vars = v;
    }
    for (const sc of this.SCOPES) {
      if (!v[sc] || typeof v[sc] !== "object" || Array.isArray(v[sc])) v[sc] = {};
    }
    // character 按角色卡分桶：{ byCard: { cardId: {...} } }；旧版扁平数据迁到当前卡
    const c = v.character;
    if (!c.byCard || typeof c.byCard !== "object" || Array.isArray(c.byCard)) {
      const legacy = {};
      for (const k of Object.keys(c)) if (k !== "byCard") legacy[k] = c[k];
      v.character = { byCard: {} };
      if (Object.keys(legacy).length) v.character.byCard[this.charScopeKey()] = legacy;
    }
    return v;
  },
  saveVars(v) {
    const st = (typeof Game !== "undefined" && Game.state) ? Game.state : null;
    if (st) { st.vars = v; Game.save(); }
    else store.set(this.VAR_KEY, v);
  },
  /** 新开一档时的初始变量：运行时作用域清空，预设/初始这类「配置型」作用域保留 */
  freshVars() {
    const cur = this.allVars();
    return {
      global: {}, chat: {},
      character: { byCard: {} },
      preset: othClone(cur.preset || {}),
      message: {},
      initial: othClone(cur.initial || {})
    };
  },
  /* 当前角色卡标识：character 作用域按卡隔离 */
  charScopeKey() {
    try { return String((Game.state && Game.state.cardId) || "default"); } catch (e) { return "default"; }
  },
  scopeData(scope) {
    const v = this.allVars();
    if (scope === "character") {
      const key = this.charScopeKey();
      if (!v.character.byCard[key] || typeof v.character.byCard[key] !== "object") v.character.byCard[key] = {};
      return v.character.byCard[key];
    }
    return v[scope] || {};
  },
  setScopeData(scope, data) {
    const v = this.allVars();
    if (scope === "character") {
      v.character.byCard[this.charScopeKey()] = data || {};
    } else {
      v[scope] = data || {};
    }
    this.saveVars(v);
    return data || {};
  },
  clearScope(scope) {
    if (scope === "character") return this.setScopeData("character", {});
    const v = this.allVars();
    v[scope] = {};
    this.saveVars(v);
  },
  /** 换卡时清理「本档之外」的临时变量：剧情上下文作用域（chat / message） */
  clearTransient() {
    const v = this.allVars();
    v.chat = {};
    v.message = {};
    this.saveVars(v);
  },
  clearAllVars() {
    const v = {};
    for (const sc of this.SCOPES) v[sc] = {};
    v.character = { byCard: {} };
    this.saveVars(v);
  },
  /* 合并视图：global → preset → character(当前卡) → chat → message（后者覆盖前者） */
  mergedVars() {
    const v = this.allVars();
    const out = {};
    const ch = (v.character.byCard && v.character.byCard[this.charScopeKey()]) || {};
    for (const sc of ["global", "preset"]) {
      const src = v[sc] || {};
      for (const k of Object.keys(src)) out[k] = src[k];
    }
    for (const k of Object.keys(ch)) out[k] = ch[k];
    for (const sc of ["chat", "message"]) {
      const src = v[sc] || {};
      for (const k of Object.keys(src)) out[k] = src[k];
    }
    return out;
  },

  /* ------------------------------------------------------------------ */
  /* 路径读写（对应上游使用的 lodash _.get / _.set / _.unset 语义）        */
  /* ------------------------------------------------------------------ */
  pathParts(path) {
    return String(path == null ? "" : path)
      .replace(/\[(\d+)\]/g, ".$1")
      .split(".")
      .filter(p => p !== "");
  },
  pathGet(obj, path) {
    if (path == null || path === "") return obj;
    const parts = this.pathParts(path);
    let cur = obj;
    for (const p of parts) {
      if (cur == null) return undefined;
      cur = cur[p];
    }
    return cur;
  },
  pathSet(obj, path, value) {
    if (path == null || path === "") return value;
    const parts = this.pathParts(path);
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (typeof cur[p] !== "object" || cur[p] === null) cur[p] = /^\d+$/.test(parts[i + 1]) ? [] : {};
      cur = cur[p];
    }
    cur[parts[parts.length - 1]] = value;
    return value;
  },
  pathUnset(obj, path) {
    const parts = this.pathParts(path);
    if (!parts.length) return;
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (typeof cur !== "object" || cur === null) return;
      cur = cur[parts[i]];
    }
    if (cur && typeof cur === "object") delete cur[parts[parts.length - 1]];
  },
  pathExists(obj, path) {
    const parts = this.pathParts(path);
    let cur = obj;
    for (const p of parts) {
      if (cur == null || typeof cur !== "object" || !(p in cur)) return false;
      cur = cur[p];
    }
    return true;
  },
  deepMerge(target, source) {
    if (Array.isArray(source)) {
      const base = Array.isArray(target) ? target.slice() : [];
      source.forEach((v, i) => { base[i] = this.deepMerge(base[i], v); });
      return base;
    }
    if (source && typeof source === "object") {
      const base = (target && typeof target === "object" && !Array.isArray(target)) ? Object.assign({}, target) : {};
      for (const k of Object.keys(source)) base[k] = this.deepMerge(base[k], source[k]);
      return base;
    }
    return source;
  },
  /* 上游 getWithout$：剔除以 $ 开头的内部键 */
  withoutDollar(obj) {
    if (Array.isArray(obj)) return obj.map(x => this.withoutDollar(x));
    if (obj && typeof obj === "object") {
      const out = {};
      for (const k of Object.keys(obj)) {
        if (k.startsWith("$")) continue;
        out[k] = this.withoutDollar(obj[k]);
      }
      return out;
    }
    return obj;
  },

  /* ------------------------------------------------------------------ */
  /* 酒馆助手：变量宏（移植 src/function/macro_like.ts）                  */
  /* ------------------------------------------------------------------ */
  scopeOfType(type) {
    switch (type) {
      case "message": return "message";
      case "character": return "character";
      case "preset": return "preset";
      case "global": return "global";
      case "chat": return "chat";
      default: return "chat";
    }
  },
  macroLikeMacros() {
    const self = this;
    return [
      {
        // {{get_<类型>_variable::路径}}
        regex: /\{\{get_(message|chat|character|preset|global)_variable::(.*?)\}\}/gi,
        replace: (_m, type, path) => {
          const data = self.scopeData(self.scopeOfType(String(type).toLowerCase()));
          const value = self.withoutDollar(self.pathGet(data, path));
          if (value === undefined) return "";
          return typeof value === "string" ? value : JSON.stringify(value);
        },
      },
      {
        // {{format_<类型>_variable_quoted::路径}}（对象带引号输出）
        regex: /^(.*)\{\{format_(message|chat|character|preset|global)_variable_quoted::(.*?)\}\}/gim,
        replace: (_m, prefix, type, path) => {
          const data = self.scopeData(self.scopeOfType(String(type).toLowerCase()));
          const value = self.withoutDollar(self.pathGet(data, path));
          const body = value === undefined ? "" : (typeof value === "string" ? value : JSON.stringify(value, null, 2));
          return prefix + body.replace(/\n/g, "\n" + " ".repeat(String(prefix || "").length));
        },
      },
      {
        // {{format_<类型>_variable::路径}}
        regex: /^(.*)\{\{format_(message|chat|character|preset|global)_variable::(.*?)\}\}/gim,
        replace: (_m, prefix, type, path) => {
          const data = self.scopeData(self.scopeOfType(String(type).toLowerCase()));
          const value = self.withoutDollar(self.pathGet(data, path));
          const body = value === undefined ? "" : (typeof value === "string" ? value : JSON.stringify(value, null, 2));
          return prefix + body.replace(/\n/g, "\n" + " ".repeat(String(prefix || "").length));
        },
      },
    ];
  },
  applyMacroLike(text) {
    if (!text || text.indexOf("{{") < 0) return text;
    let out = String(text);
    for (const macro of this.macroLikeMacros()) {
      macro.regex.lastIndex = 0;
      out = out.replace(macro.regex, (...args) => macro.replace(...args));
    }
    return out;
  },

  /* ------------------------------------------------------------------ */
  /* 提示词模板：变量函数（移植 src/function/variables.ts 的语义）        */
  /* ------------------------------------------------------------------ */
  normVarOpts(options) {
    const o = (options && typeof options === "object") ? options : {};
    let scope = o.scope, flags = o.flags, results = o.results;
    if (typeof options === "string") {
      const s = String(options);
      if (["global", "local", "message", "cache", "initial"].includes(s)) scope = s;
      else if (["nx", "xx", "n", "nxs", "xxs"].includes(s)) flags = s;
      else if (["old", "new", "fullcache"].includes(s)) results = s;
    }
    return {
      scope: scope || "message",
      flags: flags || "n",
      results: results || "new",
      defaults: o.defaults,
      merge: !!o.merge,
      index: o.index,
    };
  },
  scopeKey(scope) {
    switch (scope) {
      case "global": return "global";
      case "preset": return "preset";
      case "character": return "character";
      case "local": return "chat";
      case "chat": return "chat";
      case "message": return "message";
      case "initial": return "initial";
      case "cache": return "chat";
      default: return "chat";
    }
  },
  getVar(key, options) {
    const o = this.normVarOpts(options);
    let value;
    if (o.scope === "cache") {
      value = this.pathGet(this.mergedVars(), key);
    } else {
      value = this.pathGet(this.scopeData(this.scopeKey(o.scope)), key);
    }
    if (value === undefined && o.defaults !== undefined) return o.defaults;
    return value;
  },
  setVar(key, value, options) {
    const o = this.normVarOpts(options);
    const scopeKey = this.scopeKey(o.scope);
    if (scopeKey === "initial") return undefined;   // initial 只读
    const data = this.scopeData(scopeKey);
    const existed = this.pathExists(data, key);
    const flag = String(o.flags || "n");
    if (flag.startsWith("nx") && existed) return o.results === "old" ? this.pathGet(data, key) : undefined;
    if (flag.startsWith("xx") && !existed) return undefined;
    const oldValue = this.pathGet(data, key);
    if (o.merge) {
      this.pathSet(data, key, this.deepMerge(oldValue, value));
    } else {
      this.pathSet(data, key, value);
    }
    this.setScopeData(scopeKey, data);
    if (o.results === "old") return oldValue;
    if (o.results === "fullcache") return this.mergedVars();
    return value;
  },
  incVar(key, delta = 1, options) {
    const o = this.normVarOpts(options);
    const cur = Number(this.getVar(key, { scope: o.scope === "cache" ? "cache" : o.scope, defaults: 0 }));
    const next = (isFinite(cur) ? cur : 0) + (Number(delta) || 0);
    return this.setVar(key, next, Object.assign({}, o, { results: "new" }));
  },
  decVar(key, delta = 1, options) {
    return this.incVar(key, -(Number(delta) || 0), options);
  },
  delVar(key, options) {
    const o = this.normVarOpts(options);
    const scopeKey = this.scopeKey(o.scope);
    if (scopeKey === "initial") return undefined;
    const data = this.scopeData(scopeKey);
    const old = this.pathGet(data, key);
    this.pathUnset(data, key);
    this.setScopeData(scopeKey, data);
    return o.results === "old" ? old : undefined;
  },
  insVar(key, value, index, options) {
    const o = this.normVarOpts(options);
    const scopeKey = this.scopeKey(o.scope);
    const data = this.scopeData(scopeKey);
    const arr = this.pathGet(data, key);
    const list = Array.isArray(arr) ? arr.slice() : [];
    const at = index == null ? list.length : Math.max(0, Math.min(list.length, Number(index)));
    list.splice(at, 0, value);
    this.pathSet(data, key, list);
    this.setScopeData(scopeKey, data);
    return list;
  },

  /* ------------------------------------------------------------------ */
  /* 提示词模板：EJS 引擎（移植 src/function/ejs.ts + src/3rdparty/ejs.js）*/
  /* ------------------------------------------------------------------ */
  compileEjs(tpl) {
    if (this.ejsCache.has(tpl)) return this.ejsCache.get(tpl);
    const src = [];
    let rest = String(tpl), i = 0;
    while (true) {
      const open = rest.indexOf("<%", i);
      if (open < 0) {
        const tail = rest.slice(i);
        if (tail) src.push("__out += " + JSON.stringify(tail) + ";");
        break;
      }
      const close = rest.indexOf("%>", open);
      if (close < 0) {
        const tail = rest.slice(i);
        src.push("__out += " + JSON.stringify(tail) + ";");
        break;
      }
      let tag = rest.slice(open + 2, close);
      let text = rest.slice(i, open);
      let trimLeft = false, trimRight = false;
      if (tag.startsWith("_")) { trimLeft = true; tag = tag.slice(1); }
      if (tag.endsWith("_")) { trimRight = true; tag = tag.slice(0, tag.length - 1); }
      let kind = "", code = tag;
      if (tag.startsWith("=")) { kind = "="; code = tag.slice(1); }
      else if (tag.startsWith("-")) { kind = "-"; code = tag.slice(1); }
      else if (tag.startsWith("#")) { kind = "#"; code = tag.slice(1); }
      if (trimLeft) text = text.replace(/[ \t]*$/, "");
      if (text) src.push("__out += " + JSON.stringify(text) + ";");
      if (kind === "=") src.push("__out += __esc(" + code + ");");
      else if (kind === "-") src.push("__out += __str(" + code + ");");
      else if (kind === "#") { /* 注释，丢弃 */ }
      else src.push(code);
      i = close + 2;
      if (trimRight) { while (i < rest.length && (rest[i] === " " || rest[i] === "\t")) i++; }
      else if (rest[i] === "\n") { i++; }   /* -%> 之后的换行会被去掉，默认保留 */
    }
    const body = "var __out='';var print=function(){__out += Array.prototype.map.call(arguments,__str).join(' ');};"
      + "with(locals||{}){\n" + src.join("\n") + "\n}\nreturn __out;";
    let fn;
    try {
      fn = new Function("locals", "__esc", "__str", body);
    } catch (e) {
      fn = null;
      this.lastError = "模板语法错误：" + (e && e.message ? e.message : e);
    }
    this.ejsCache.set(tpl, fn);
    return fn;
  },
  toStr(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "string") return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  },
  templateContext(extra) {
    const self = this;
    const merged = this.mergedVars();
    const ctx = Object.assign({}, merged, {
      variables: merged,
      setvar: (k, v, o) => self.setVar(k, v, o),
      getvar: (k, o) => self.getVar(k, o),
      incvar: (k, v, o) => self.incVar(k, v, o),
      decvar: (k, v, o) => self.decVar(k, v, o),
      delvar: (k, o) => self.delVar(k, o),
      insvar: (k, v, i, o) => self.insVar(k, v, i, o),
      setLocalVar: (k, v, o) => self.setVar(k, v, Object.assign({}, o, { scope: "local" })),
      getLocalVar: (k, o) => self.getVar(k, Object.assign({}, o, { scope: "local" })),
      setGlobalVar: (k, v, o) => self.setVar(k, v, Object.assign({}, o, { scope: "global" })),
      getGlobalVar: (k, o) => self.getVar(k, Object.assign({}, o, { scope: "global" })),
      setMessageVar: (k, v, o) => self.setVar(k, v, Object.assign({}, o, { scope: "message" })),
      getMessageVar: (k, o) => self.getVar(k, Object.assign({}, o, { scope: "message" })),
      incLocalVar: (k, v, o) => self.incVar(k, v, Object.assign({}, o, { scope: "local" })),
      incGlobalVar: (k, v, o) => self.incVar(k, v, Object.assign({}, o, { scope: "global" })),
      incMessageVar: (k, v, o) => self.incVar(k, v, Object.assign({}, o, { scope: "message" })),
      decLocalVar: (k, v, o) => self.decVar(k, v, Object.assign({}, o, { scope: "local" })),
      decGlobalVar: (k, v, o) => self.decVar(k, v, Object.assign({}, o, { scope: "global" })),
      decMessageVar: (k, v, o) => self.decVar(k, v, Object.assign({}, o, { scope: "message" })),
      delLocalVar: (k, o) => self.delVar(k, Object.assign({}, o, { scope: "local" })),
      delGlobalVar: (k, o) => self.delVar(k, Object.assign({}, o, { scope: "global" })),
      delMessageVar: (k, o) => self.delVar(k, Object.assign({}, o, { scope: "message" })),
      insLocalVar: (k, v, i, o) => self.insVar(k, v, i, Object.assign({}, o, { scope: "local" })),
      insGlobalVar: (k, v, i, o) => self.insVar(k, v, i, Object.assign({}, o, { scope: "global" })),
      insMessageVar: (k, v, i, o) => self.insVar(k, v, i, Object.assign({}, o, { scope: "message" })),
      define: (name, value, merge) => {
        /* 写入当前执行上下文，使 <% define('x', 1) %> 后面的 <%= x %> 立刻可见 */
        const c = self._ctx || (self._defines = self._defines || {});
        c[name] = merge ? self.deepMerge(c[name], value) : value;
        return c[name];
      },
      parseJSON: (text) => { try { return JSON.parse(text); } catch (e) { return null; } },
      jsonPatch: (dest, change) => self.deepMerge(dest, change),
      allVariables: () => self.mergedVars(),
      getChatMessage: (idx, role) => {
        const list = Game.state.messages || [];
        const i = idx == null ? list.length - 1 : (idx < 0 ? list.length + Number(idx) : Number(idx));
        let m = list[i];
        if (m && role && m.role !== role) m = list.filter(x => x.role === role).slice(-1)[0];
        return m ? { role: m.role, content: m.content, ts: m.ts } : undefined;
      },
      getChatMessages: (a, b, role) => {
        const list = Game.state.messages || [];
        let from = 0, to = list.length;
        if (typeof a === "number") {
          if (b == null) to = list.length, from = Math.max(0, list.length - a);
          else { from = Math.max(0, a); to = Math.min(list.length, b); }
        }
        let out = list.slice(from, to);
        if (role) out = out.filter(m => m.role === role);
        return out.map(m => ({ role: m.role, content: m.content, ts: m.ts }));
      },
      matchChatMessages: (pattern) => {
        const re = new RegExp(String(pattern));
        return (Game.state.messages || [])
          .filter(m => re.test(String(m.content || "")))
          .map(m => ({ role: m.role, content: m.content, ts: m.ts }));
      },
      activateRegex: (pattern, str) => {
        try { return String(str).replace(new RegExp(pattern, "g"), ""); } catch (e) { return str; }
      },
    }, extra || {});
    if (this._defines) Object.assign(ctx, this._defines);
    this._ctx = ctx;
    return ctx;
  },
  runEjs(text, extra) {
    if (!text || text.indexOf("<%") < 0) return text;
    const fn = this.compileEjs(text);
    if (!fn) return text;
    try {
      const ctx = this.templateContext(extra);
      const out = fn(ctx, v => this.toStr(v), v => this.toStr(v));
      return out == null ? text : String(out);
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      this.lastError = "模板执行出错：" + msg;
      try { toast("提示词模板出错：" + msg + "（该段已保留原文，不影响聊天）", "err"); } catch (e2) { }
      return text;
    }
  },

  /* ------------------------------------------------------------------ */
  /* 本页自有扩展：{{ }} 糖衣宏（条件块 / 循环 / 变量运算）               */
  /* ------------------------------------------------------------------ */
  evalExpr(code, scope) {
    const fn = new Function("scope", "with(scope||{}){ return (" + code + "); }");
    return fn(scope);
  },
  sugarScope(extra) {
    const scope = Object.assign({}, this.mergedVars(), {
      getvar: (k, o) => this.getVar(k, o),
      setvar: (k, v, o) => this.setVar(k, v, o),
      addvar: (k, d, o) => this.incVar(k, d, o),
      random: (list) => {
        const arr = String(list == null ? "" : list).split(",").map(x => x.trim()).filter(Boolean);
        return arr.length ? arr[Math.floor(Math.random() * arr.length)] : "";
      },
      pick: (list) => {
        const arr = String(list == null ? "" : list).split(",").map(x => x.trim()).filter(Boolean);
        return arr.length ? arr[Math.floor(Math.random() * arr.length)] : "";
      },
      roll: (dice) => {
        const m = /^\s*(\d+)\s*d\s*(\d+)\s*$/i.exec(String(dice || ""));
        if (m) {
          const n = Math.max(1, parseInt(m[1], 10) || 1), faces = Math.max(1, parseInt(m[2], 10) || 6);
          let total = 0;
          for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * faces);
          return total;
        }
        const faces = Math.max(1, parseInt(String(dice).trim(), 10) || 20);
        return 1 + Math.floor(Math.random() * faces);
      },
    }, extra || {});
    return scope;
  },
  findBlockEnd(text, from) {
    const re = /\{\{#(if|each|for)\b([^}]*)\}\}|\{\{\/(if|each|for)\}\}/g;
    re.lastIndex = from;
    let depth = 1, m;
    while ((m = re.exec(text))) {
      if (m[1]) depth++;
      else {
        depth--;
        if (depth === 0) return { start: m.index, end: re.lastIndex };
      }
    }
    return null;
  },
  findElse(body) {
    const re = /\{\{#(if|each|for)\b([^}]*)\}\}|\{\{\/(if|each|for)\}\}|\{\{(#?)else\}\}/g;
    let depth = 0, m;
    while ((m = re.exec(body))) {
      if (m[1]) { depth++; continue; }
      if (m[4] !== undefined) { if (depth === 0) return { index: m.index, len: m[0].length }; continue; }
      depth--;
    }
    return null;
  },
  applySugarBlocks(text, scope) {
    let out = "", i = 0;
    const openRe = /\{\{#(if|each|for)\b([^}]*)\}\}/g;
    while (true) {
      openRe.lastIndex = i;
      const m = openRe.exec(text);
      if (!m) { out += text.slice(i); break; }
      out += text.slice(i, m.index);
      const kind = m[1], args = String(m[2] || "").trim();
      const end = this.findBlockEnd(text, openRe.lastIndex);
      if (!end) { out += text.slice(m.index); break; }
      const body = text.slice(openRe.lastIndex, end.start);
      const els = this.findElse(body);
      const mainBody = els ? body.slice(0, els.index) : body;
      const elseBody = els ? body.slice(els.index + els.len) : "";
      out += this.renderSugarBlock(kind, args, mainBody, elseBody, scope);
      i = end.end;
    }
    return out;
  },
  renderSugarBlock(kind, args, mainBody, elseBody, scope) {
    try {
      if (kind === "if") {
        const cond = this.evalExpr(args, scope);
        return this.applySugarBlocks(cond ? mainBody : elseBody, scope);
      }
      if (kind === "each") {
        let expr = args, alias = null;
        const asM = /\s+as\s+([A-Za-z_$][\w$]*)\s*$/.exec(expr);
        if (asM) { alias = asM[1]; expr = expr.slice(0, asM.index); }
        let list = this.evalExpr(expr, scope);
        if (!Array.isArray(list)) {
          if (list && typeof list === "object") list = Object.keys(list).map(k => list[k]);
          else list = [];
        }
        let out = "";
        list.forEach((item, idx) => {
          const sc = Object.assign({}, scope);
          sc["this"] = item;
          sc["@index"] = idx;
          sc["@key"] = idx;
          sc["@first"] = idx === 0;
          sc["@last"] = idx === list.length - 1;
          if (alias) sc[alias] = item;
          out += this.fillLoopVars(this.applySugarBlocks(mainBody, sc), sc);
        });
        return out;
      }
      if (kind === "for") {
        const m = /^\s*(-?\d+)\s*\.\.\s*(-?\d+)\s*(?:\.\.\s*(-?\d+))?\s*$/.exec(args);
        if (!m) return "";
        const from = parseInt(m[1], 10), to = parseInt(m[2], 10);
        let step = m[3] ? Math.abs(parseInt(m[3], 10)) || 1 : 1;
        let out = "";
        if (from <= to) { for (let v = from; v <= to; v += step) { const sc = Object.assign({}, scope); sc["this"] = v; sc["@index"] = v - from; out += this.fillLoopVars(this.applySugarBlocks(mainBody, sc), sc); } }
        else { for (let v = from; v >= to; v -= step) { const sc = Object.assign({}, scope); sc["this"] = v; sc["@index"] = from - v; out += this.fillLoopVars(this.applySugarBlocks(mainBody, sc), sc); } }
        return out;
      }
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      this.lastError = "条件/循环表达式出错：" + msg;
      try { toast("提示词模板的 " + kind + " 块出错：" + msg + "（该段已保留原文）", "err"); } catch (e2) { }
      return mainBody;
    }
    return mainBody;
  },
  fillLoopVars(text, sc) {
    let out = String(text);
    out = out.replace(/\{\{\s*this\s*\}\}/g, () => this.toStr(sc["this"]));
    out = out.replace(/\{\{\s*@index\s*\}\}/g, () => this.toStr(sc["@index"]));
    out = out.replace(/\{\{\s*@key\s*\}\}/g, () => this.toStr(sc["@key"]));
    out = out.replace(/\{\{\s*@first\s*\}\}/g, () => this.toStr(sc["@first"]));
    out = out.replace(/\{\{\s*@last\s*\}\}/g, () => this.toStr(sc["@last"]));
    for (const k of Object.keys(sc)) {
      if (k.startsWith("@") || k === "this") continue;
      if (!/^[A-Za-z_$][\w$]*$/.test(k)) continue;
      const re = new RegExp("\\{\\{\\s*" + k.replace(/\$/g, "\\$") + "\\s*\\}\\}", "g");
      out = out.replace(re, () => this.toStr(sc[k]));
    }
    return out;
  },
  applySugarMacros(text, scope) {
    let out = String(text);
    // {{set::名称::值}} / {{add::名称::增量}} / {{get::名称}}：一次从左到右替换，保证顺序语义
    out = out.replace(/\{\{\s*(set|add|get)\s*::([^:}]*?)(?:::(.*?))?\s*\}\}/g, (_m, op, name, val) => {
      const key = String(name).trim();
      if (op === "set") {
        this.setVar(key, val === undefined ? "" : val, { scope: "chat" });
        return "";
      }
      if (op === "add") {
        const d = val === undefined ? 1 : Number(val);
        return this.toStr(this.incVar(key, isFinite(d) ? d : 1, { scope: "chat" }));
      }
      const v = this.getVar(key, { scope: "cache" });
      return v === undefined ? "" : this.toStr(v);
    });
    // {{shuffle::a,b,c}} / {{trim::文本}} / {{upper::文本}} / {{lower::文本}}
    out = out.replace(/\{\{\s*shuffle\s*::([^}]*?)\s*\}\}/g, (_m, list) => {
      const arr = String(list).split(",").map(x => x.trim()).filter(Boolean);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr.join(",");
    });
    out = out.replace(/\{\{\s*trim\s*::([^}]*?)\s*\}\}/g, (_m, t) => String(t).trim());
    out = out.replace(/\{\{\s*upper\s*::([^}]*?)\s*\}\}/g, (_m, t) => String(t).toUpperCase());
    out = out.replace(/\{\{\s*lower\s*::([^}]*?)\s*\}\}/g, (_m, t) => String(t).toLowerCase());
    return out;
  },
  applySugar(text, ctx) {
    if (!text || text.indexOf("{{") < 0) return text;
    const scope = this.sugarScope(this.sugarExtra(ctx));
    let out = this.applySugarBlocks(String(text), scope);
    out = this.applySugarMacros(out, scope);
    return out;
  },
  sugarExtra(ctx) {
    const c = ctx || {};
    const extra = {};
    for (const k of ["user", "char", "persona", "description", "personality", "scenario", "creatorNotes", "lastMessage"]) {
      if (c[k] !== undefined) extra[k] = c[k];
    }
    return extra;
  },

  /* ------------------------------------------------------------------ */
  /* 渲染管线                                                            */
  /* ------------------------------------------------------------------ */
  applyPipeline(text, ctx, opts) {
    if (!text) return text;
    const o = opts || {};
    const c = ctx || {};
    let out = String(text);
    if (o.stMacro) out = STBridge.macro(out, Object.assign({}, c, { original: out }));
    if (this.renderOn()) out = this.applyMacroLike(out);
    if (this.templateOn()) {
      out = this.applySugar(out, c);
      out = this.runEjs(out, this.sugarExtra(c));
    }
    return out;
  },

  /* ------------------------------------------------------------------ */
  /* 界面                                                                */
  /* ------------------------------------------------------------------ */
  panelHTML() {
    return `
      <div class="card">
        <div class="card-title">⚡ 酒馆助手 / 提示词模板</div>
        <p class="hint">移植自 <code>JS-Slash-Runner</code>（变量宏与渲染替换）与 <code>ST-Prompt-Template</code>（EJS 模板与变量函数）。上游都没有 <code>{{#if}}</code> 这类糖衣宏，那是本页自己加的一层。模板会执行文本里的脚本（<code>&lt;% %&gt;</code>），只在你自己的角色卡／世界书里用。</p>
        <div class="row" style="flex-wrap:wrap;margin-bottom:10px">
          <button class="btn sm" id="stt-render-toggle">启用酒馆助手渲染</button>
          <button class="btn sm" id="stt-template-toggle">启用提示词模板宏</button>
        </div>
        <div class="row" style="flex-wrap:wrap;margin-bottom:10px">
          <button class="btn sm" id="stt-vars">查看模板变量</button>
          <button class="btn sm" id="stt-vars-clear-one">清空当前作用域</button>
          <button class="btn sm" id="stt-vars-clear-all">清空全部变量</button>
          <button class="btn sm primary" id="stt-preview">预览拼装结果</button>
        </div>
        <p class="hint" id="stt-state"></p>
      </div>`;
  },
  bindPanel() {
    const self = this;
    const el = id => document.querySelector(id);
    const tgl = el("#stt-render-toggle");
    if (tgl) tgl.onclick = () => {
      const s = self.settings();
      s.render = !s.render;
      Game.save();
      toast(s.render ? "已启用酒馆助手渲染" : "已停用酒馆助手渲染");
      UI.renderMine();
    };
    const tpl = el("#stt-template-toggle");
    if (tpl) tpl.onclick = () => {
      const s = self.settings();
      s.template = !s.template;
      Game.save();
      toast(s.template ? "已启用提示词模板宏" : "已停用提示词模板宏");
      UI.renderMine();
    };
    const vw = el("#stt-vars");
    if (vw) vw.onclick = () => self.showVars();
    const vc = el("#stt-vars-clear-one");
    if (vc) vc.onclick = () => {
      const scope = self.scopeForCurrent();
      self.clearScope(scope);
      toast("已清空「" + scope + "」作用域的变量");
      UI.renderMine();
    };
    const va = el("#stt-vars-clear-all");
    if (va) va.onclick = () => {
      self.clearAllVars();
      toast("已清空全部模板变量");
      UI.renderMine();
    };
    const pv = el("#stt-preview");
    if (pv) pv.onclick = () => self.showPreview();
    const st = el("#stt-state");
    if (st) {
      const s = self.settings();
      const v = self.allVars();
      const count = Object.keys(v.global).length + Object.keys(v.chat).length + Object.keys(v.character).length
        + Object.keys(v.preset).length + Object.keys(v.message).length;
      st.innerHTML = "当前状态：渲染 <b>" + (s.render ? "开" : "关") + "</b> · 模板 <b>" + (s.template ? "开" : "关")
        + "</b> · 变量 <b>" + count + "</b> 个"
        + (self.lastError ? " · <span style=\"color:var(--bad)\">上次错误：" + escapeHtml(self.lastError) + "</span>" : "");
    }
  },
  scopeForCurrent() {
    const card = Game.activeCard();
    return card ? "character" : "chat";
  },
  showVars() {
    const v = this.allVars();
    const block = sc => {
      const data = (sc === "character") ? this.scopeData("character") : (v[sc] || {});
      const keys = Object.keys(data);
      const body = keys.length
        ? Object.keys(data).map(k => "  " + escapeHtml(k) + ": " + escapeHtml(this.toStr(data[k]))).join("\n")
        : "  （空）";
      return "<div class=\"ana-block\"><h4>" + escapeHtml(sc) + "（" + keys.length + "）</h4><p>" + body + "</p></div>";
    };
    const html = "<h3>模板变量</h3>"
      + "<p class=\"hint\">变量保存在浏览器本地（localStorage），不随存档走；作用域：global 全局 / chat 当前剧情 / character 当前角色卡 / preset 预设 / message 最近一条消息。</p>"
      + ["global", "chat", "character", "preset", "message", "initial"].map(block).join("");
    openModal(html);
  },
  showPreview() {
    const self = this;
    let text = "", err = "";
    try {
      const msgs = STBridge.buildMessages("");
      text = msgs.map(m => "[" + m.role + "]\n" + m.content).join("\n\n");
    } catch (e) {
      err = (e && e.message) ? e.message : String(e);
    }
    if (this.lastError) err = this.lastError;
    const html = "<h3>最终拼装提示词（含酒馆助手 / 模板处理）</h3>"
      + (err ? "<p class=\"hint\" style=\"color:var(--bad)\">处理提示：" + escapeHtml(err) + "</p>" : "")
      + "<div class=\"ana-block\"><h4>内容</h4><p>" + escapeHtml(text) + "</p></div>";
    openModal(html);
  },
};

</script>


<script>
/* 第三版新增能力（十条修改） */
/* ================================================================
 * 第三版新增能力（云提出的十条修改）
 *
 * 1) 剧情内代码渲染：OWGRender.codeHTML / splitCode
 * 2) 对战面板入口：Game.prepareBattle + UI.openBattle/showBattleModal
 * 3) 世界书分层：OWGWorldbook（全局 / 角色卡）
 * 4) 预设与正则：OWGPreset（酒馆预设导入 + 正则按序生效）
 * 5) 职业面板随世界观：Game.syncClassToWorld / classInfo
 * 6) 按角色卡隔离的存档：OWGSaves
 * 7) 剧情内宏生效 + 隐藏内部信息：OWGRender.toHTML / stripInternal
 * 8) 正文字数统计与下限：OWGRender.countWords；不足只提示，不自动补写
 * 9) 原图不压缩 + 灯箱：OWGImage
 * 10) 分析字数 1000 字出头：见 Card 侧 buildWorldviewMessages / buildGameplayMessages
 *
 * 说明：本块为本页自有实现，不含任何外部依赖。
 * ================================================================ */

/* ---------------------------------------------------------------
 * 4) 预设（酒馆预设导入 + 预设正则按序生效）
 * ------------------------------------------------------------- */
const OWGPreset = {
  /** 酒馆占位 marker：本身不带内容，决定世界书/角色描述/聊天历史插在哪 */
  MARKERS: ["worldInfoBefore", "worldInfoAfter", "charDescription", "personaDescription", "charPersonality", "scenario", "dialogueExamples", "chatHistory"],
  data() {
    const s = Game.state.settings;
    if (!s.preset || typeof s.preset !== "object") s.preset = { name: "默认预设", prompts: [], regexes: [] };
    if (!Array.isArray(s.presetLibrary)) s.presetLibrary = [];
    const p = s.preset;
    if (!Array.isArray(p.prompts)) p.prompts = [];
    if (!Array.isArray(p.regexes)) p.regexes = [];
    if (!Array.isArray(p.order)) p.order = [];
    if (!p.vars || typeof p.vars !== "object") p.vars = {};
    if (!p.authorNote || typeof p.authorNote !== "object") p.authorNote = { text: "", depth: 4 };
    if (!p.sampling || typeof p.sampling !== "object") p.sampling = {};
    // 老存档补齐：识别出 marker / 注入位置
    for (const x of p.prompts) {
      if (x.marker === undefined) x.marker = this.MARKERS.includes(x.identifier);
      if (x.injection_position === undefined) x.injection_position = 0;
      if (x.injection_depth === undefined) x.injection_depth = 4;
    }
    return p;
  },
  /** 实际生效的采样参数：预设值优先，其次老字段 settings.temperature */
  sampling() {
    const s = OWGPreset.data().sampling || {};
    const st = Game.state.settings;
    const pick = (v, fb) => (v === null || v === undefined || v === "" || (typeof v === "number" && isNaN(v))) ? fb : v;
    return {
      temperature: pick(s.temperature, st.temperature),
      top_p: pick(s.top_p, null), top_k: pick(s.top_k, null), min_p: pick(s.min_p, null),
      frequency_penalty: pick(s.frequency_penalty, null), presence_penalty: pick(s.presence_penalty, null),
      repetition_penalty: pick(s.repetition_penalty, null),
      seed: pick(s.seed, -1),
      max_tokens: pick(s.max_tokens, null),
      context_tokens: pick(s.context_tokens, null),
      reasoning_effort: pick(s.reasoning_effort, ""),
    };
  },
  /** 预设库：可保存当前预设快照、载入、删除（只影响预设本身） */
  lib() {
    const s = Game.state.settings;
    if (!Array.isArray(s.presetLibrary)) s.presetLibrary = [];
    return s.presetLibrary;
  },
  saveToLib(name) {
    const p = this.data();
    const e = { id: uid(), name: String(name || p.name || "预设").slice(0, 24), ts: Date.now(), data: JSON.parse(JSON.stringify(p)) };
    this.lib().unshift(e);
    if (this.lib().length > 12) this.lib().length = 12;
    this.save();
    return e;
  },
  loadFromLib(id) {
    const e = this.lib().find(x => x.id === id);
    if (!e || !e.data) return false;
    Game.state.settings.preset = JSON.parse(JSON.stringify(e.data));
    if (typeof Game.state.settings.presetLibrary === "undefined") Game.state.settings.presetLibrary = this.lib();
    this.save();
    return true;
  },
  deleteFromLib(id) {
    const s = Game.state.settings;
    const before = this.lib().length;
    s.presetLibrary = this.lib().filter(x => x.id !== id);
    this.save();
    return before !== s.presetLibrary.length;
  },
  /** 上下文预算（token）：0 = 不限制 */
  contextBudget() { return Math.max(0, Number(this.sampling().context_tokens) || 0); },
  /** 按 token 预算裁剪：保留首条 system 与最后一条消息，从最旧的历史开始丢 */
  fit(msgs) {
    const budget = this.contextBudget();
    if (!budget) return msgs;
    const est = m => Math.ceil(String(m.content || "").length / 1.4);
    let total = msgs.reduce((a, m) => a + est(m), 0);
    let guard = 0;
    while (total > budget && msgs.length > 3 && guard++ < msgs.length * 2) {
      // 只丢最旧的一条对话历史，最前面的系统提示与模块、最后一条消息都保留
      const i = msgs.findIndex((m, idx) => idx > 0 && idx < msgs.length - 1 && m.role !== "system");
      if (i < 0) break;
      total -= est(msgs[i]);
      msgs.splice(i, 1);
    }
    return msgs;
  },
  /** 按 prompt_order 把启用的提示词模块分组：历史前 / 历史后 / 按深度 */
  assembly() {
    const d = this.data();
    const list = d.prompts;
    const hi = list.findIndex(x => x.identifier === "chatHistory");
    const split = hi < 0 ? list.length : hi;
    const items = [];
    list.forEach((x, i) => {
      if (!x.enabled || !x.content || x.marker) return;
      items.push({ ...x, _at: i });
    });
    const depth = items.filter(x => Number(x.injection_position) === 1);
    const normal = items.filter(x => Number(x.injection_position) !== 1);
    return {
      pre: normal.filter(x => x._at < split),
      post: normal.filter(x => x._at >= split),
      depth,
      total: items.length,
    };
  },
  save() { Game.save(); },
  /** 解析酒馆 findRegex："/pattern/flags" 或裸正则 */
  parseFind(find) {
    const s = String(find == null ? "" : find);
    const m = /^\/([\s\S]*)\/([gimsuy]*)$/.exec(s);
    if (m) {
      try { return new RegExp(m[1], m[2] || "g"); } catch (e) { return null; }
    }
    try { return new RegExp(s, "g"); } catch (e) { return null; }
  },
  /** 按列表顺序依次作用；enabled=false 跳过；target 限定作用面 */
  apply(text, target) {
    let out = String(text == null ? "" : text);
    for (const r of this.data().regexes) {
      if (!r || r.enabled === false) continue;
      const t = r.target || "both";
      if (t === "prompt" && target !== "prompt") continue;
      if (t === "display" && target !== "display") continue;
      const re = this.parseFind(r.find);
      if (!re) continue;
      const rep = r.replace == null ? "" : String(r.replace);
      // 降级：整页 HTML 美化模板（带 doctype/script，动辄 100KB）无法安全嵌进单条剧情消息，跳过
      if (target === "display" && rep.length > 8000) continue;
      re.lastIndex = 0;
      let next = out.replace(re, rep);
      const trims = Array.isArray(r.trimStrings) ? r.trimStrings : [];
      for (const t2 of trims) { if (t2) next = next.split(String(t2)).join(""); }
      out = next;
    }
    return out;
  },
  applyToPrompt(t) { return this.apply(t, "prompt"); },
  /** 导入酒馆预设 JSON（prompts / prompt_order / regex_scripts） */
  importST(jsonText) {
    let j;
    try { j = typeof jsonText === "string" ? JSON.parse(jsonText) : jsonText; }
    catch (e) { throw new Error("不是合法的 JSON 文件"); }
    if (!j || typeof j !== "object" || Array.isArray(j)) throw new Error("预设文件内容无法识别（应为 JSON 对象）");
    const ext0 = (j.extensions && typeof j.extensions === "object") ? j.extensions : {};
    const regexSrc = Array.isArray(ext0.regex_scripts) ? ext0.regex_scripts : (Array.isArray(j.regex_scripts) ? j.regex_scripts : []);
    const hasAny = Array.isArray(j.prompts) || regexSrc.length || Array.isArray(j.prompt_order);
    if (!hasAny) throw new Error("预设文件里没有 prompts / regex_scripts 字段，无法识别为酒馆预设");
    // prompt_order → 启用顺序
    const orderMap = {};
    const seq = [];
    for (const po of (Array.isArray(j.prompt_order) ? j.prompt_order : [])) {
      if (!po || !Array.isArray(po.order)) continue;
      for (const o of po.order) {
        if (!o || !o.identifier) continue;
        orderMap[o.identifier] = o.enabled !== false;
        seq.push(o.identifier);
      }
    }
    const prompts = [];
    for (const p of (Array.isArray(j.prompts) ? j.prompts : [])) {
      if (!p || !p.identifier) continue;
      prompts.push({
        identifier: String(p.identifier),
        name: String(p.name || p.identifier),
        role: String(p.role || "system"),
        content: String(p.content || "").slice(0, 8000),
        enabled: orderMap[String(p.identifier)] !== false,   // 跟随预设自带的启用设置（prompt_order）
        order: seq.indexOf(String(p.identifier)),
        marker: p.marker === true || this.MARKERS.includes(String(p.identifier)),
        injection_position: p.injection_position === 1 ? 1 : 0,   // 1 = 按深度注入历史
        injection_depth: Number.isFinite(+p.injection_depth) ? Math.max(0, +p.injection_depth) : 4,
      });
    }
    prompts.sort((a, b) => (a.order < 0 ? 999 : a.order) - (b.order < 0 ? 999 : b.order));
    const regexes = [];
    for (const r of regexSrc) {
      if (!r) continue;
      const find = String(r.findRegex != null ? r.findRegex : (r.find || ""));
      if (!find) continue;
      let target = "both";
      if (r.promptOnly === true) target = "prompt";
      else if (r.displayOnly === true) target = "display";
      else if (Array.isArray(r.placement) && r.placement.length && !r.placement.includes(1) && r.placement.includes(2)) target = "display";
      regexes.push({
        id: uid(),
        name: String(r.scriptName || r.name || "正则"),
        find,
        replace: r.replaceString == null ? "" : String(r.replaceString),
        trimStrings: Array.isArray(r.trimStrings) ? r.trimStrings.map(String).filter(Boolean) : [],
        enabled: r.disabled !== true,
        target,
      });
    }
    const p = this.data();
    p.name = String(j.name || j.preset_name || (p.name || "导入的预设"));
    p.prompts = prompts;
    p.regexes = regexes;
    p.order = seq;
    // 采样参数：0 在酒馆代表"关闭"，这里转成 null 不发送
    const nz = (v, def) => (v == null ? def : (Number(v) === 0 ? null : Number(v)));
    p.sampling = {
      temperature: j.temperature != null ? Number(j.temperature) : null,
      top_p: nz(j.top_p, null),
      top_k: nz(j.top_k, null),
      min_p: nz(j.min_p, null),
      frequency_penalty: nz(j.frequency_penalty, null),
      presence_penalty: nz(j.presence_penalty, null),
      repetition_penalty: nz(j.repetition_penalty, null),
      seed: j.seed != null ? Number(j.seed) : -1,
      max_tokens: j.openai_max_tokens != null ? Number(j.openai_max_tokens) : null,
      context_tokens: j.openai_max_context != null ? Number(j.openai_max_context) : null,
      reasoning_effort: String(j.reasoning_effort || ""),
    };
    // 酒馆助手宏变量（同时写入 STAssist 的 preset 作用域，宏与 getVariables 都能取到）
    const th = (j.extensions && (j.extensions.tavern_helper || j.extensions.tavernHelper || j.extensions.TavernHelper))
      || (j.tavern_helper || j.tavernHelper || j.TavernHelper || {});
    let varCount = 0, scriptRes = null;
    if (th.variables && typeof th.variables === "object" && !Array.isArray(th.variables)) {
      const scoped = {};
      for (const [k, v] of Object.entries(th.variables)) {
        const s = String(v == null ? "" : v);
        p.vars[String(k)] = s;
        scoped[String(k)] = s;
      }
      varCount = Object.keys(scoped).length;
      try { STAssist.setScopeData("preset", scoped); } catch (e) { }
    }
    // 预设自带脚本：按 hash 去重导入，重复导入只更新来源
    let scriptTotal = 0, scriptEnabled = 0;
    try {
      const allItems = (typeof OWGScript !== "undefined") ? OWGScript.extractScripts({
        scripts: (Array.isArray(j.scripts) ? j.scripts : []),
        tavern_helper: th,
      }) : [];
      scriptTotal = allItems.length;
      if (allItems.length) {
        scriptRes = OWGScript.importScripts(allItems, { kind: "preset", presetName: p.name });
        OWGScript.notifyImport(scriptRes, "预设脚本");
        // 预设脚本按需自动运行（已启用者）
        for (const s of OWGScript.list()) {
          const src = s.source || null;
          if (!src || src.kind !== "preset" || src.presetName !== p.name) continue;
          if (s.enabled) scriptEnabled++;
          if (!s.enabled) continue;
          try { OWGScript.run(s.id, { auto: true }); } catch (e) { }
        }
      }
    } catch (e) { }
    // 作者注释（酒馆聊天级字段；预设里带了就一起导入）
    const an = j.author_note || j.authorNote;
    if (an && typeof an === "object") p.authorNote = { text: String(an.text || an.content || ""), depth: Number(an.depth) || 4 };
    this.save();
    return { name: p.name, prompts: prompts.length, regexes: regexes.length, enabledRegex: regexes.filter(r => r.enabled).length, vars: varCount,
      scripts: { added: scriptRes ? scriptRes.added.length : 0, skipped: scriptRes ? scriptRes.skipped.length : 0, total: scriptTotal, enabled: scriptEnabled } };
  },
  /** 导出为酒馆预设格式（便于回灌酒馆） */
  exportST() {
    const p = this.data();
    const sp = this.sampling();
    const obj = {
      name: p.name || "预设",
      temperature: sp.temperature,
      top_p: sp.top_p ?? 0, top_k: sp.top_k ?? 0, min_p: sp.min_p ?? 0,
      frequency_penalty: sp.frequency_penalty ?? 0, presence_penalty: sp.presence_penalty ?? 0,
      repetition_penalty: sp.repetition_penalty ?? 1,
      openai_max_context: sp.context_tokens ?? 0, openai_max_tokens: sp.max_tokens ?? 0,
      reasoning_effort: sp.reasoning_effort || "",
      prompts: p.prompts.map(x => ({ identifier: x.identifier, name: x.name, role: x.role, content: x.content, enabled: x.enabled, marker: !!x.marker, injection_position: x.injection_position || 0, injection_depth: x.injection_depth || 4 })),
      prompt_order: [{
        character_id: 100001,
        order: p.prompts.map(x => ({ identifier: x.identifier, enabled: !!x.enabled })),
      }],
      regex_scripts: p.regexes.map(r => ({
        id: r.id || uid(),
        scriptName: r.name || "正则",
        findRegex: r.find,
        replaceString: r.replace == null ? "" : String(r.replace),
        trimStrings: Array.isArray(r.trimStrings) ? r.trimStrings : [],
        placement: r.target === "display" ? [2] : (r.target === "prompt" ? [1] : [1, 2]),
        disabled: r.enabled === false,
        promptOnly: r.target === "prompt",
      })),
    };
    return JSON.stringify(obj, null, 2);
  },

  bind() {

      const e = self.lib().find(x => x.id === id);
      let isCurrent = false;
      try { isCurrent = !!(e && e.data && JSON.stringify(e.data) === JSON.stringify(p())); } catch (e0) { }
      openModal(`<h3>删除预设</h3><p>确定删除预设库中的「${escapeHtml(e ? e.name : "")}」？只会移除这份快照，当前预设与其他数据不受影响。${isCurrent ? "<br><b>注意：当前启用的预设内容就来自这份快照。</b>删除后当前预设会原样保留（不再与快照关联），不会变成空预设。" : ""}</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="pre-lib-del-ok">删除</button></div>`);
      document.querySelector("#pre-lib-del-ok").onclick = () => {

    });
    document.querySelectorAll("[data-pre-prompt-up]").forEach(el => el.onclick = () => self.movePrompt(el.dataset.prePromptUp, -1));
    document.querySelectorAll("[data-pre-prompt-down]").forEach(el => el.onclick = () => self.movePrompt(el.dataset.prePromptDown, 1));
    document.querySelectorAll("[data-pre-prompt-edit]").forEach(el => el.onclick = () => self.showPromptEditor(el.dataset.prePromptEdit));
    document.querySelectorAll("[data-pre-prompt-del]").forEach(el => el.onclick = () => {
      const i = Number(el.dataset.prePromptDel);
      const it = p().prompts[i];
      if (!it) return;
      if (it.marker) { toast("占位条目由程序注入，不能删除", "err"); return; }
      openModal(`<h3>删除提示词条目</h3><p>确定删除「${escapeHtml(it.name || "未命名")}」？只从当前预设移除这一条，其他条目、正则、变量与存档都不受影响；需要时可重新导入原预设恢复。</p>
        <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="pre-prompt-del-ok">删除</button></div>`);
      document.querySelector("#pre-prompt-del-ok").onclick = () => {
        const list = p().prompts;
        if (list[i] === it) list.splice(i, 1);
        else { const k = list.indexOf(it); if (k >= 0) list.splice(k, 1); }
        self.save(); closeModal(); UI.renderMine(); toast("已删除「" + (it.name || "条目") + "」", "ok");
      };
    });
    document.querySelectorAll("[data-pre-prompt-tgl]").forEach(el => el.onchange = () => {
      const id = el.dataset.prePromptTgl;
      const it = p().prompts.find(x => x.identifier === id);
      if (it) { it.enabled = el.checked; self.save(); toast(it.enabled ? "已启用「" + it.name + "」" : "已停用「" + it.name + "」"); }
    });
    document.querySelectorAll("[data-pre-tgl]").forEach(b => b.onclick = () => {
      const r = p().regexes.find(x => x.id === b.dataset.preTgl);
      if (r) { r.enabled = r.enabled === false; self.save(); UI.renderMine(); }
    });
    document.querySelectorAll("[data-pre-del]").forEach(b => b.onclick = () => {
      p().regexes = p().regexes.filter(x => x.id !== b.dataset.preDel);
      self.save(); UI.renderMine(); toast("已删除正则");
    });
    document.querySelectorAll("[data-pre-up]").forEach(b => b.onclick = () => self.moveRegex(b.dataset.preUp, -1));
    document.querySelectorAll("[data-pre-down]").forEach(b => b.onclick = () => self.moveRegex(b.dataset.preDown, 1));
    document.querySelectorAll("[data-pre-edit]").forEach(b => b.onclick = () => {
      const r = p().regexes.find(x => x.id === b.dataset.preEdit);
      if (r) self.showRegexEditor(r);
    });
  },
  /** 提示词上下调序 */
  movePrompt(identifier, dir) {
    const list = this.data().prompts;
    const i = list.findIndex(x => x.identifier === identifier);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= list.length) { toast("已经在" + (dir < 0 ? "最前" : "最后") + "了"); return; }
    const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    this.save(); UI.renderMine();
  },
  /** 编辑一条提示词（内容 / 名称 / 角色 / 启用） */
  showPromptEditor(identifier) {
    const p = this.data();
    const x = p.prompts.find(y => y.identifier === identifier);
    if (!x) return;
    openModal(`
      <h3>✏️ 编辑提示词条目</h3>
      <label class="field"><span>名称</span><input type="text" id="pp-name" value="${escapeHtml(x.name || "")}"></label>
      <label class="field"><span>角色</span>
        <select id="pp-role">
          ${["system", "user", "assistant"].map(r => `<option value="${r}" ${x.role === r ? "selected" : ""}>${r}</option>`).join("")}
        </select></label>
      <label class="field"><span>内容</span><textarea id="pp-content" rows="10">${escapeHtml(x.content || "")}</textarea></label>
      <div class="mine-item" style="padding-left:0;padding-right:0">
        <div class="mi-ico">📝</div><div class="mi-main"><div class="mi-title">启用</div><div class="mi-sub">启用后追加到系统提示词末尾</div></div>
        <label class="switch"><input type="checkbox" id="pp-enabled" ${x.enabled ? "checked" : ""}><i></i></label>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="pp-save">保存</button></div>`);
    document.querySelector("#pp-save").onclick = () => {
      x.name = document.querySelector("#pp-name").value.trim() || x.name;
      x.role = document.querySelector("#pp-role").value;
      x.content = document.querySelector("#pp-content").value;
      x.enabled = document.querySelector("#pp-enabled").checked;
      this.save(); closeModal(); UI.renderMine(); toast("已保存", "ok");
    };
  },
  moveRegex(id, dir) {
    const list = this.data().regexes;
    const i = list.findIndex(x => x.id === id);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= list.length) { toast("已经在" + (dir < 0 ? "最前" : "最后") + "了"); return; }
    const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    this.save(); UI.renderMine();
  },
  showRegexEditor(r) {
    const isNew = !r;
    openModal(`
      <h3>${isNew ? "＋ 新增预设正则" : "✏️ 编辑预设正则"}</h3>
      <label class="field"><span>名称</span><input type="text" id="rx-name" value="${escapeHtml(r?.name || "")}" placeholder="例如：去掉思考标签"></label>
      <label class="field"><span>查找（可用 /正则/flags 或裸正则）</span><input type="text" id="rx-find" value="${escapeHtml(r?.find || "")}" placeholder="/<think>[\\s\\S]*?<\\/think>/g"></label>
      <label class="field"><span>替换为（留空 = 删除匹配内容）</span><input type="text" id="rx-replace" value="${escapeHtml(r?.replace == null ? "" : r.replace)}"></label>
      <label class="field"><span>作用面</span>
        <select id="rx-target">
          <option value="both" ${(!r || r.target === "both") ? "selected" : ""}>提示词 + 剧情显示</option>
          <option value="prompt" ${r && r.target === "prompt" ? "selected" : ""}>仅提示词</option>
          <option value="display" ${r && r.target === "display" ? "selected" : ""}>仅剧情显示</option>
        </select></label>
      <label class="field"><span>额外删除的字符串（每行一个，可留空）</span><textarea id="rx-trim" rows="2">${escapeHtml((r?.trimStrings || []).join("\n"))}</textarea></label>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="rx-save">保存</button></div>`);
    document.querySelector("#rx-save").onclick = () => {
      const find = document.querySelector("#rx-find").value;
      if (!find.trim()) { toast("查找内容不能为空", "err"); return; }
      if (!this.parseFind(find)) { toast("正则表达式写错了，请检查", "err"); return; }
      const obj = {
        id: r?.id || uid(),
        name: document.querySelector("#rx-name").value.trim() || "正则",
        find,
        replace: document.querySelector("#rx-replace").value,
        trimStrings: document.querySelector("#rx-trim").value.split("\n").map(s => s.trim()).filter(Boolean),
        enabled: r ? r.enabled !== false : true,
        target: document.querySelector("#rx-target").value,
      };
      const list = this.data().regexes;
      if (isNew) list.push(obj);
      else { const i = list.findIndex(x => x.id === obj.id); if (i >= 0) list[i] = obj; }
      this.save(); closeModal(); UI.renderMine(); toast("已保存", "ok");
    };
  },
};

/* ---------------------------------------------------------------
 * 3) 世界书分层：全局世界书 / 角色卡世界书
 * ------------------------------------------------------------- */
const OWGWorldbook = {
  globalEntries() { return Game.worldbookEntries().filter(e => e.source !== "card"); },
  cardEntries() { return Game.worldbookEntries().filter(e => e.source === "card"); },
  cardName() { const c = Game.activeCard(); return c ? c.name : "（未启用角色卡）"; },
  /** 导入世界书到指定归属：global=全局，card=绑定到当前角色卡 */
  importTo(text, scope) {
    const res = STBridge.parseWorldInfo(text);
    const card = Game.activeCard();
    if (scope === "card" && !card) throw new Error("当前没有启用角色卡，无法绑定到角色卡");
    const cur = Game.worldbookEntries().slice();
    const sig = e => JSON.stringify([e.keys, e.content]);
    const seen = new Set(cur.map(sig));
    let added = 0, skipped = 0;
    for (const e of res.entries) {
      if (scope === "card") e.source = "card"; else e.source = "user";
      if (seen.has(sig(e))) { skipped++; continue; }
      cur.push(e); seen.add(sig(e)); added++;
    }
    Game.saveWorldbook(cur);
    if (scope === "card") this.writeBackCard();
    UI.refresh();
    toast("已导入" + (scope === "card" ? "角色卡世界书" : "全局世界书") + "：新增 " + added + " 条"
      + (skipped ? "，重复跳过 " + skipped + " 条" : "") + (res.name ? "（来源：" + res.name + "）" : ""), "ok");
    return added;
  },
  /** 导出指定归属的世界书 */
  exportScope(scope) {
    const entries = scope === "card" ? this.cardEntries() : this.globalEntries();
    if (!entries.length) { toast("当前没有" + (scope === "card" ? "角色卡世界书" : "全局世界书") + "条目可导出", "err"); return; }
    const card = Game.activeCard();
    const name = scope === "card"
      ? (card ? STBridge.safeName(card.name, "角色") + "_角色卡世界书" : "角色卡世界书")
      : "全局世界书";
    const obj = STBridge.buildWorldInfoFile(entries, name);
    STBridge.downloadText(name + ".json", JSON.stringify(obj, null, 2));
    toast("已导出" + (scope === "card" ? "角色卡世界书" : "全局世界书") + "：" + name + ".json（" + entries.length + " 条）", "ok");
  },
  /** 把角色卡来源的条目写回角色卡本身 */
  writeBackCard() {
    const card = Game.activeCard();
    if (!card) return false;
    const list = Game.cards();
    const idx = list.findIndex(c => c.id === card.id);
    if (idx < 0) return false;
    const entries = this.cardEntries().map(e => ({
      keys: (e.keys || []).slice(0, 16),
      secondary_keys: (e.secondary_keys || []).slice(0, 16),
      content: String(e.content || ""),
      comment: String(e.comment || ""),
      constant: !!e.constant, selective: !!e.selective, selectiveLogic: e.selectiveLogic || 0,
      order: e.order != null ? e.order : 100,
      position: e.position != null ? e.position : 1,
      disabled: e.enabled === false,
      depth: e.depth != null ? e.depth : 4,
      group: String(e.group || ""),
      extensions: { position: e.position != null ? e.position : 1, depth: e.depth != null ? e.depth : 4, order: e.order != null ? e.order : 100, probability: e.probability != null ? e.probability : 100, group: String(e.group || "") },
    }));
    list[idx].worldbook = entries;
    list[idx].book = entries.map(e => ({ keys: e.keys, content: e.content }));
    Game.saveCards(list);
    return true;
  },
  /** 删除条目（按归属） */
  remove(id) {
    const list = Game.worldbookEntries().filter(x => x.id !== id);
    Game.saveWorldbook(list);
    if (list.some(e => e.source === "card")) this.writeBackCard();
    UI.renderMine();
    toast("已删除条目");
  },
  toggle(id) {
    const list = Game.worldbookEntries();
    const e = list.find(x => x.id === id);
    if (e) { e.enabled = e.enabled === false; Game.saveWorldbook(list); if (e.source === "card") this.writeBackCard(); UI.renderMine(); }
  },
  /** 条目编辑表单（酒馆字段：主/次关键词、备注、常驻/选择性、概率、深度、位置、顺序、分组） */
  entryForm(idPrefix, e, isCard) {
    const n = OWGWorldbookST.normalize(e || {});
    const posOpts = OWGWorldbookST.POSITIONS.map(p => `<option value="${p.v}" ${Number(n.position) === p.v ? "selected" : ""}>${p.v} · ${p.name}</option>`).join("");
    return `
      <p class="hint" style="margin-bottom:8px">归属：${isCard ? "角色卡世界书（只对该角色卡生效）" : "全局世界书（对所有角色卡生效）"}</p>
      <label class="field"><span>主关键词（逗号分隔，命中其一即触发）</span><input type="text" id="${idPrefix}-keys" value="${escapeHtml(n.keys.join(", "))}"></label>
      <label class="field"><span>次关键词（逗号分隔，选择性模式下配合主关键词）</span><input type="text" id="${idPrefix}-sec" value="${escapeHtml(n.secondary_keys.join(", "))}"></label>
      <label class="field"><span>备注（comment）</span><input type="text" id="${idPrefix}-comment" value="${escapeHtml(n.comment)}"></label>
      <label class="field"><span>设定内容</span><textarea id="${idPrefix}-content" rows="6">${escapeHtml(n.content)}</textarea></label>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <label class="field" style="flex:1;min-width:140px"><span>插入位置</span><select id="${idPrefix}-pos">${posOpts}</select></label>
        <label class="field" style="flex:1;min-width:110px"><span>深度</span><input type="number" id="${idPrefix}-depth" min="0" max="999" value="${n.depth}"></label>
        <label class="field" style="flex:1;min-width:110px"><span>顺序</span><input type="number" id="${idPrefix}-order" value="${n.order}"></label>
        <label class="field" style="flex:1;min-width:110px"><span>概率 %</span><input type="number" id="${idPrefix}-prob" min="0" max="100" value="${n.probability}"></label>
      </div>
      <label class="field"><span>分组（同组条目一起注入）</span><input type="text" id="${idPrefix}-group" value="${escapeHtml(n.group)}"></label>
      <div class="mine-item" style="padding-left:0;padding-right:0">
        <div class="mi-ico">📌</div><div class="mi-main"><div class="mi-title">常驻生效</div><div class="mi-sub">不等待关键词，始终注入</div></div>
        <label class="switch"><input type="checkbox" id="${idPrefix}-always" ${n.constant ? "checked" : ""}><i></i></label>
      </div>
      <div class="mine-item" style="padding-left:0;padding-right:0">
        <div class="mi-ico">🎯</div><div class="mi-main"><div class="mi-title">选择性</div><div class="mi-sub">主关键词与次关键词按逻辑同时命中才触发</div></div>
        <label class="switch"><input type="checkbox" id="${idPrefix}-sel" ${n.selective ? "checked" : ""}><i></i></label>
      </div>
      <label class="field"><span>选择性逻辑</span>
        <select id="${idPrefix}-logic">
          <option value="0" ${n.selectiveLogic === 0 ? "selected" : ""}>主词与次词都要命中（AND）</option>
          <option value="1" ${n.selectiveLogic === 1 ? "selected" : ""}>任一命中即可（OR）</option>
          <option value="2" ${n.selectiveLogic === 2 ? "selected" : ""}>都不是 NOT AND</option>
          <option value="3" ${n.selectiveLogic === 3 ? "selected" : ""}>都不是 NOT OR</option>
        </select></label>
      <div class="mine-item" style="padding-left:0;padding-right:0">
        <div class="mi-ico">✅</div><div class="mi-main"><div class="mi-title">启用</div><div class="mi-sub">停用后不参与命中</div></div>
        <label class="switch"><input type="checkbox" id="${idPrefix}-enabled" ${n.enabled ? "checked" : ""}><i></i></label>
      </div>`;
  },
  /** 从表单读回条目字段 */
  readEntryForm(idPrefix) {
    const keys = document.querySelector("#" + idPrefix + "-keys").value.split(/[,，、]+/).map(s => s.trim()).filter(Boolean).slice(0, 32);
    const sec = document.querySelector("#" + idPrefix + "-sec").value.split(/[,，、]+/).map(s => s.trim()).filter(Boolean).slice(0, 32);
    const always = document.querySelector("#" + idPrefix + "-always").checked;
    const selective = document.querySelector("#" + idPrefix + "-sel").checked;
    return {
      keys, secondary_keys: sec,
      comment: document.querySelector("#" + idPrefix + "-comment").value.slice(0, 120),
      content: document.querySelector("#" + idPrefix + "-content").value.trim().slice(0, 4000),
      always, constant: always,
      selective, selectiveLogic: +document.querySelector("#" + idPrefix + "-logic").value,
      position: +document.querySelector("#" + idPrefix + "-pos").value,
      depth: Math.max(0, Math.round(+document.querySelector("#" + idPrefix + "-depth").value || 0)),
      order: Math.round(+document.querySelector("#" + idPrefix + "-order").value || 100),
      probability: Math.max(0, Math.min(100, Math.round(+document.querySelector("#" + idPrefix + "-prob").value || 100))),
      group: document.querySelector("#" + idPrefix + "-group").value.trim().slice(0, 40),
      enabled: document.querySelector("#" + idPrefix + "-enabled").checked,
    };
  },
  edit(id) {
    const e = Game.worldbookEntries().find(x => x.id === id);
    if (!e) return;
    const isCard = e.source === "card";
    openModal(`
      <h3>✏️ 编辑世界书条目</h3>
      ${this.entryForm("wb2", e, isCard)}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="wb2-save">保存</button></div>`);
    document.querySelector("#wb2-save").onclick = () => {
      const f = this.readEntryForm("wb2");
      if (!f.content) { toast("内容不能为空", "err"); return; }
      Object.assign(e, f);
      Game.saveWorldbook(Game.worldbookEntries());
      if (isCard) this.writeBackCard();
      closeModal(); UI.renderMine(); toast("已保存", "ok");
    };
  },
  add(scope) {
    const isCard = scope === "card";
    if (isCard && !Game.activeCard()) { toast("当前没有启用角色卡", "err"); return; }
    openModal(`
      <h3>＋ 添加${isCard ? "角色卡" : "全局"}世界书条目</h3>
      ${this.entryForm("wba", { keys: [], content: "", comment: "", constant: false, selective: false, selectiveLogic: 0, position: 1, depth: 4, order: 100, probability: 100, group: "", enabled: true }, isCard)}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="wba-save">保存</button></div>`);
    document.querySelector("#wba-save").onclick = () => {
      const f = this.readEntryForm("wba");
      if (!f.content) { toast("内容不能为空", "err"); return; }
      const list = Game.worldbookEntries().slice();
      list.push(Object.assign({ id: uid(), source: isCard ? "card" : "user", origin: "ui", book: isCard ? ((Game.activeCard() || {}).name || "角色卡") : "全局", cardId: isCard ? ((Game.activeCard() || {}).id || null) : null }, f));
      Game.saveWorldbook(list);
      if (isCard) this.writeBackCard();
      closeModal(); UI.renderMine(); toast("已添加" + (isCard ? "角色卡" : "全局") + "世界书条目", "ok");
    };
  },
};
